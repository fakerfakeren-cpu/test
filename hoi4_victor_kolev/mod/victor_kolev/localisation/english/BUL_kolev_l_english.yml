l_english:
 BUL_kv_defy_neuilly:0 "Defy the Treaty of Neuilly"
 BUL_kv_defy_neuilly_desc:0 "The victors of the Great War chained our army with a treaty written in Paris. Chairman Kolev has made it clear: Bulgaria will no longer apologise for defending itself."
 BUL_kv_shield_of_the_balkans:0 "Shield of the Balkans"
 BUL_kv_shield_of_the_balkans_desc:0 "A modern rifle in the hands of every Bulgarian soldier."
 BUL_kv_danube_artillery:0 "Danube Artillery Corps"
 BUL_kv_danube_artillery_desc:0 "The guns of the Danube line must be able to answer any challenger across the river."
 BUL_kv_rhodope_mountaineers:0 "Rhodope Mountaineers"
 BUL_kv_rhodope_mountaineers_desc:0 "Our southern mountains breed hardy men. Let them form the core of an elite mountain corps."
 BUL_kv_rearm_the_army:0 "Rearm the Army"
 BUL_kv_rearm_the_army_desc:0 "The depots are half empty. The Chairman has ordered them filled."
 BUL_kv_motorize_the_army:0 "Motorize the Army"
 BUL_kv_motorize_the_army_desc:0 "Horses and ox-carts will not win the next war."
 BUL_kv_lessons_of_the_balkan_wars:0 "Lessons of the Balkan Wars"
 BUL_kv_lessons_of_the_balkan_wars_desc:0 "Twice in a generation we won battles and lost the peace. Our officers will study why."
 BUL_kv_bulgarian_armour:0 "Bulgarian Armour"
 BUL_kv_bulgarian_armour_desc:0 "Even a small nation can field a fist of steel."
 BUL_kv_conscription_reform:0 "Conscription Reform"
 BUL_kv_conscription_reform_desc:0 "A fairer, wider draft that reaches every village from Vidin to Burgas."
 BUL_kv_officer_academy:0 "The Sofia Officer Academy"
 BUL_kv_officer_academy_desc:0 "Kolev wants officers who think, not just officers who obey."
 BUL_kv_tank_school:0 "The Tank School at Kazanlak"
 BUL_kv_tank_school_desc:0 "Our first armoured crews will be trained in the Valley of Roses."
 BUL_kv_special_detachments:0 "Special Detachments"
 BUL_kv_special_detachments_desc:0 "Small, fast, deadly. The Chairman's raiders."
 BUL_kv_border_fortifications:0 "Fortify the Frontiers"
 BUL_kv_border_fortifications_desc:0 "Every pass and every river crossing will cost an invader dearly."
 BUL_kv_mechanized_divisions:0 "Mechanized Divisions"
 BUL_kv_mechanized_divisions_desc:0 "Infantry that keeps pace with the tanks."
 BUL_kv_balkan_war_doctrine:0 "A Balkan Way of War"
 BUL_kv_balkan_war_doctrine_desc:0 "Doctrine written for our mountains, our rivers and our means."
 BUL_kv_concentrated_firepower:0 "Concentrated Firepower"
 BUL_kv_concentrated_firepower_desc:0 "Mass the guns, break the line."
 BUL_kv_army_of_the_chairman:0 "The Army of the Chairman"
 BUL_kv_army_of_the_chairman_desc:0 "A modern army, loyal to the nation and its Chairman. Bulgaria will never again be the battlefield of others."
 BUL_kv_air_corps:0 "The Bulgarian Air Corps"
 BUL_kv_air_corps_desc:0 "Neuilly forbade us an air force. We are building one anyway."
 BUL_kv_fighter_programme:0 "Fighter Programme"
 BUL_kv_fighter_programme_desc:0 "Guard the skies over Sofia."
 BUL_kv_close_air_support:0 "Close Air Support"
 BUL_kv_close_air_support_desc:0 "Aircraft that fight alongside our infantry."
 BUL_kv_bozhurishte_works:0 "The Bozhurishte Aircraft Works"
 BUL_kv_bozhurishte_works_desc:0 "Bulgarian aircraft, built by Bulgarian hands."
 BUL_kv_air_doctrine:0 "Doctrine of the Skies"
 BUL_kv_air_doctrine_desc:0 "How a small air force punches above its weight."
 BUL_kv_radar_network:0 "Early Warning Network"
 BUL_kv_radar_network_desc:0 "No bomber will reach Sofia unannounced."
 BUL_kv_air_defence:0 "Air Defence of the Cities"
 BUL_kv_air_defence_desc:0 "Anti-aircraft batteries for our industrial centres."
 BUL_kv_aces_of_the_balkans:0 "Aces of the Balkans"
 BUL_kv_aces_of_the_balkans_desc:0 "Every nation needs heroes in the sky."
 BUL_kv_wings_over_sofia:0 "Wings over Sofia"
 BUL_kv_wings_over_sofia_desc:0 "Bulgaria has an air force worthy of the name."
 BUL_kv_black_sea_fleet:0 "The Black Sea Fleet"
 BUL_kv_black_sea_fleet_desc:0 "Varna and Burgas are our windows to the world. They must be defended."
 BUL_kv_varna_shipyards:0 "The Varna Shipyards"
 BUL_kv_varna_shipyards_desc:0 "Expand the yards so we no longer buy our ships from foreigners."
 BUL_kv_submarine_flotilla:0 "Submarine Flotilla"
 BUL_kv_submarine_flotilla_desc:0 "The Black Sea is narrow. Submarines make it narrower for our enemies."
 BUL_kv_coastal_defence:0 "Coastal Defence Doctrine"
 BUL_kv_coastal_defence_desc:0 "Mines, torpedo boats and shore guns."
 BUL_kv_torpedo_boats:0 "Fast Torpedo Boats"
 BUL_kv_torpedo_boats_desc:0 "Cheap, quick and dangerous."
 BUL_kv_masters_of_the_black_sea:0 "Masters of the Western Black Sea"
 BUL_kv_masters_of_the_black_sea_desc:0 "From the Danube delta to the Bosporus, no one sails without our leave."
 BUL_kv_economic_council:0 "The Economic Council of Sofia"
 BUL_kv_economic_council_desc:0 "Kolev's first decree: an economic council of engineers and economists, not courtiers."
 BUL_kv_infrastructure_drive:0 "National Infrastructure Drive"
 BUL_kv_infrastructure_drive_desc:0 "Roads and rails before anything else."
 BUL_kv_agrarian_reform:0 "Agrarian Reform"
 BUL_kv_agrarian_reform_desc:0 "Eight in ten Bulgarians work the land. Their lives must improve before anything else can."
 BUL_kv_sofia_industrial_zone:0 "The Sofia Industrial Zone"
 BUL_kv_sofia_industrial_zone_desc:0 "A new industrial belt around the capital."
 BUL_kv_danube_railways:0 "Railways to the Danube"
 BUL_kv_danube_railways_desc:0 "Link Ruse and Vidin to the heart of the country."
 BUL_kv_cooperative_farms:0 "Cooperative Farms"
 BUL_kv_cooperative_farms_desc:0 "Pool land, tools and credit. Let the village feed the factory."
 BUL_kv_kazanlak_arms_works:0 "The Kazanlak Arms Works"
 BUL_kv_kazanlak_arms_works_desc:0 "Expand the state arsenal at Kazanlak."
 BUL_kv_danube_ports:0 "The Danube Ports"
 BUL_kv_danube_ports_desc:0 "River trade is the cheapest trade."
 BUL_kv_mechanized_agriculture:0 "Mechanized Agriculture"
 BUL_kv_mechanized_agriculture_desc:0 "Tractors free hands for the factories."
 BUL_kv_research_institute:0 "The Bulgarian Academy of Technology"
 BUL_kv_research_institute_desc:0 "The Chairman believes Bulgaria's future is decided in laboratories."
 BUL_kv_expand_the_arsenal:0 "Expand the Arsenal"
 BUL_kv_expand_the_arsenal_desc:0 "More rifles, more shells, more guns."
 BUL_kv_survey_the_rhodopes:0 "Survey the Rhodopes"
 BUL_kv_survey_the_rhodopes_desc:0 "Geologists report the mountains are richer than anyone thought."
 BUL_kv_technical_schools:0 "Technical Schools"
 BUL_kv_technical_schools_desc:0 "A generation of Bulgarian engineers."
 BUL_kv_electrification:0 "Electrification of the Countryside"
 BUL_kv_electrification_desc:0 "Light in every village by 1945."
 BUL_kv_rhodope_mines:0 "Rhodope Chromium Mines"
 BUL_kv_rhodope_mines_desc:0 "Chromium for Bulgarian steel."
 BUL_kv_pernik_steel:0 "Pernik Steel"
 BUL_kv_pernik_steel_desc:0 "The coal of Pernik fires the furnaces of a new Bulgaria."
 BUL_kv_first_kolev_plan:0 "The First Kolev Plan"
 BUL_kv_first_kolev_plan_desc:0 "Five years. Concrete targets. No excuses."
 BUL_kv_synthetic_fuel:0 "Synthetic Fuel Programme"
 BUL_kv_synthetic_fuel_desc:0 "We have no oil fields. Then we shall make our own oil."
 BUL_kv_tobacco_exports:0 "Bulgarian Tobacco Exports"
 BUL_kv_tobacco_exports_desc:0 "Bulgarian tobacco is smoked from Berlin to New York. Let it pay for our factories."
 BUL_kv_sofia_university:0 "Expand Sofia University"
 BUL_kv_sofia_university_desc:0 "Double the faculties, double the minds."
 BUL_kv_second_kolev_plan:0 "The Second Kolev Plan"
 BUL_kv_second_kolev_plan_desc:0 "Heavy industry, at last."
 BUL_kv_construction_brigades:0 "Youth Construction Brigades"
 BUL_kv_construction_brigades_desc:0 "Young Bulgarians building their own country."
 BUL_kv_industrial_independence:0 "Industrial Independence"
 BUL_kv_industrial_independence_desc:0 "Bulgaria no longer depends on foreign factories for its survival."
 BUL_kv_radio_industry:0 "The Radio Industry"
 BUL_kv_radio_industry_desc:0 "Valves, transmitters, receivers - all made at home."
 BUL_kv_balkan_tiger:0 "The Balkan Tiger"
 BUL_kv_balkan_tiger_desc:0 "Once the poorest corner of Europe, Bulgaria has become its fastest-growing economy."
 BUL_kv_new_chairman:0 "A New Chairman"
 BUL_kv_new_chairman_desc:0 "Victor Kolev, not yet thirty, has been named Chairman of the Council. The old parties call him a boy. He intends to prove them wrong."
 BUL_kv_national_renewal:0 "Found the National Renewal Movement"
 BUL_kv_national_renewal_desc:0 "A movement above the quarrelling parties, loyal to Bulgaria alone."
 BUL_kv_understanding_with_the_tsar:0 "An Understanding with Tsar Boris"
 BUL_kv_understanding_with_the_tsar_desc:0 "The Tsar reigns, the Chairman governs. Both know the arrangement suits Bulgaria."
 BUL_kv_end_factional_strife:0 "End the Factional Strife"
 BUL_kv_end_factional_strife_desc:0 "Zveno, the Military League, the old parties - their era of coups is over."
 BUL_kv_sofia_charter:0 "The Sofia Charter"
 BUL_kv_sofia_charter_desc:0 "Kolev drafts a charter of rights and promises the first truly free elections in Bulgarian history."
 BUL_kv_free_elections:0 "Free Elections"
 BUL_kv_free_elections_desc:0 "The people will choose. Kolev is confident they will choose him."
 BUL_kv_balkan_entente_revival:0 "Revive the Balkan Entente"
 BUL_kv_balkan_entente_revival_desc:0 "Our neighbours built a pact against us. We will join it on our own terms."
 BUL_kv_civil_liberties:0 "Civil Liberties"
 BUL_kv_civil_liberties_desc:0 "A free press, free unions, free speech."
 BUL_kv_western_investment:0 "Western Investment"
 BUL_kv_western_investment_desc:0 "London and Paris bankers are finally interested in Bulgaria."
 BUL_kv_rule_of_law:0 "The Rule of Law"
 BUL_kv_rule_of_law_desc:0 "No one, not even the Chairman, stands above the law."
 BUL_kv_join_the_allies:0 "Join the Allies"
 BUL_kv_join_the_allies_desc:0 "Stand with the democracies against tyranny."
 BUL_kv_balkan_commonwealth:0 "The Balkan Commonwealth"
 BUL_kv_balkan_commonwealth_desc:0 "A free association of Balkan democracies, beholden to no great power."
 BUL_kv_commonwealth_invitations:0 "Invitations to the Commonwealth"
 BUL_kv_commonwealth_invitations_desc:0 "Belgrade, Athens, Bucharest and Ankara receive the Chairman's letters."
 BUL_kv_arsenal_of_the_balkans:0 "Arsenal of Balkan Democracy"
 BUL_kv_arsenal_of_the_balkans_desc:0 "Free nations must be able to defend their freedom."
 BUL_kv_kolev_doctrine:0 "The Kolev Doctrine"
 BUL_kv_kolev_doctrine_desc:0 "Neither Berlin, nor Moscow, nor London. Bulgaria will be strong enough that no one dares to choose for us."
 BUL_kv_armed_neutrality:0 "Armed Neutrality"
 BUL_kv_armed_neutrality_desc:0 "Peace through strength."
 BUL_kv_chairmans_council:0 "The Chairman's Council"
 BUL_kv_chairmans_council_desc:0 "A cabinet of experts answerable to the Chairman alone."
 BUL_kv_mountain_fortress:0 "Bulgaria the Mountain Fortress"
 BUL_kv_mountain_fortress_desc:0 "The Balkan range is our citadel."
 BUL_kv_plebiscite_of_trust:0 "Plebiscite of Trust"
 BUL_kv_plebiscite_of_trust_desc:0 "Kolev asks the people a single question: do you trust me? Ninety-one percent say yes."
 BUL_kv_balkan_accord:0 "The Balkan Accord"
 BUL_kv_balkan_accord_desc:0 "A league of the small nations of the peninsula, led from Sofia."
 BUL_kv_accord_invitations:0 "Envoys to the Neighbours"
 BUL_kv_accord_invitations_desc:0 "Our envoys carry one message: together, we cannot be divided and ruled."
 BUL_kv_guarantee_the_peninsula:0 "Guarantee the Peninsula"
 BUL_kv_guarantee_the_peninsula_desc:0 "An attack on any Balkan nation is an attack on Bulgaria."
 BUL_kv_doctrine_fulfilled:0 "The Doctrine Fulfilled"
 BUL_kv_doctrine_fulfilled_desc:0 "Bulgaria is armed, united and answerable to no one."
 BUL_kv_lion_of_the_balkans:0 "The Lion of the Balkans"
 BUL_kv_lion_of_the_balkans_desc:0 "Our flag has a lion on it for a reason."
 BUL_kv_iron_chairman:0 "The Iron Chairman"
 BUL_kv_iron_chairman_desc:0 "Democracy failed Bulgaria in 1913 and again in 1918. Kolev will not let it fail a third time."
 BUL_kv_emergency_powers:0 "Seize Emergency Powers"
 BUL_kv_emergency_powers_desc:0 "The assembly votes itself out of existence."
 BUL_kv_chairmans_legion:0 "The Chairman's Legion"
 BUL_kv_chairmans_legion_desc:0 "Uniformed volunteers loyal to Kolev personally."
 BUL_kv_purge_zveno_officers:0 "Purge the Zveno Officers"
 BUL_kv_purge_zveno_officers_desc:0 "Officers who staged coups before could stage them again."
 BUL_kv_militarize_the_youth:0 "Militarize the Youth"
 BUL_kv_militarize_the_youth_desc:0 "Every young Bulgarian a soldier in waiting."
 BUL_kv_san_stefano_rhetoric:0 "The Dream of San Stefano"
 BUL_kv_san_stefano_rhetoric_desc:0 "In 1878 Bulgaria stretched from the Danube to the Aegean. Kolev promises it will again."
 BUL_kv_join_the_axis:0 "March with Berlin"
 BUL_kv_join_the_axis_desc:0 "Germany too was betrayed by the peace. Together we will tear it up."
 BUL_kv_third_empire_alone:0 "The Pact of San Stefano"
 BUL_kv_third_empire_alone_desc:0 "Bulgaria does not need a master in Berlin. Let others join us."
 BUL_kv_war_production:0 "Total Mobilization of Industry"
 BUL_kv_war_production_desc:0 "Every factory serves the front."
 BUL_kv_third_bulgarian_empire:0 "The Third Bulgarian Empire"
 BUL_kv_third_bulgarian_empire_desc:0 "After Simeon and Asen comes Kolev."
 BUL_kv_red_chairman:0 "The Red Chairman"
 BUL_kv_red_chairman_desc:0 "Kolev opens the prisons, legalises the Workers' Party and speaks of a Bulgaria for the toilers."
 BUL_kv_popular_front:0 "The Popular Front"
 BUL_kv_popular_front_desc:0 "A coalition of workers, peasants and the Chairman."
 BUL_kv_land_to_the_peasants:0 "Land to the Peasants"
 BUL_kv_land_to_the_peasants_desc:0 "The great estates are broken up."
 BUL_kv_red_five_year_plan:0 "The Bulgarian Five-Year Plan"
 BUL_kv_red_five_year_plan_desc:0 "Planned industry, planned prosperity."
 BUL_kv_peoples_army:0 "The People's Army"
 BUL_kv_peoples_army_desc:0 "An army of workers and peasants."
 BUL_kv_moscow_embassy:0 "An Embassy in Moscow"
 BUL_kv_moscow_embassy_desc:0 "Slavic brothers, socialist comrades."
 BUL_kv_join_the_comintern:0 "Join the Comintern"
 BUL_kv_join_the_comintern_desc:0 "Stand with the Soviet Union."
 BUL_kv_balkan_soviet_union:0 "The Balkan Socialist Federation"
 BUL_kv_balkan_soviet_union_desc:0 "A federation of Balkan workers' republics - led from Sofia, not Moscow."
 BUL_kv_export_the_revolution:0 "Export the Revolution"
 BUL_kv_export_the_revolution_desc:0 "The workers of Belgrade and Bucharest are listening."
 BUL_kv_red_heavy_industry:0 "Steel for the Revolution"
 BUL_kv_red_heavy_industry_desc:0 "Heavy industry for a socialist Bulgaria."
 BUL_kv_chairmans_legacy:0 "The Chairman's Legacy"
 BUL_kv_chairmans_legacy_desc:0 "Whatever road Bulgaria took, it took it under Victor Kolev. History will remember him."
 BUL_kv_chairmans_diplomacy:0 "The Chairman's Diplomacy"
 BUL_kv_chairmans_diplomacy_desc:0 "Kolev intends to run foreign policy himself."
 BUL_kv_good_neighbour_policy:0 "Good Neighbour Policy"
 BUL_kv_good_neighbour_policy_desc:0 "Bulgaria has fought every one of its neighbours. That ends now."
 BUL_kv_revisionist_agenda:0 "The Revisionist Agenda"
 BUL_kv_revisionist_agenda_desc:0 "Neuilly stole Dobruja, Thrace and Macedonia. Bulgaria wants them back."
 BUL_kv_yugoslav_rail_link:0 "The Belgrade Rail Link"
 BUL_kv_yugoslav_rail_link_desc:0 "Trade, not war, with our western neighbour."
 BUL_kv_turkish_friendship:0 "Friendship with Ankara"
 BUL_kv_turkish_friendship_desc:0 "Old enemies, new partners."
 BUL_kv_non_aggression:0 "A Web of Non-Aggression"
 BUL_kv_non_aggression_desc:0 "Signed in Sofia, ratified in every Balkan capital."
 BUL_kv_balkan_common_market:0 "The Balkan Common Market"
 BUL_kv_balkan_common_market_desc:0 "Tariffs fall, trade rises, everyone wins."
 BUL_kv_press_our_claims:0 "Press Our Claims"
 BUL_kv_press_our_claims_desc:0 "The maps in every Bulgarian classroom show what is ours."
 BUL_kv_demand_dobruja:0 "Demand Southern Dobruja"
 BUL_kv_demand_dobruja_desc:0 "Bucharest will return the Dobruja - by treaty or otherwise."
 BUL_kv_demand_thrace:0 "Demand Western Thrace"
 BUL_kv_demand_thrace_desc:0 "Bulgaria needs its Aegean coast."
 BUL_kv_demand_macedonia:0 "Demand Macedonia"
 BUL_kv_demand_macedonia_desc:0 "Ohrid, Skopje, Bitola - the cradle of Bulgarian letters."
 BUL_kv_integrate_the_lands:0 "Integrate the Recovered Lands"
 BUL_kv_integrate_the_lands_desc:0 "These lands were always Bulgarian. Now the law says so too."
 BUL_kv_factional_strife:0 "Factional Strife"
 BUL_kv_factional_strife_desc:0 "Zveno, the Military League and the old parties all believe they should be running Bulgaria instead of a young upstart Chairman."
 BUL_kv_shadow_of_neuilly:0 "Shadow of Neuilly"
 BUL_kv_shadow_of_neuilly_desc:0 "The Treaty of Neuilly left our army small, our people bitter, and our officers humiliated."
 BUL_kv_agrarian_economy:0 "Agrarian Economy"
 BUL_kv_agrarian_economy_desc:0 "Bulgaria is a land of small farms, ox-carts and very few factories."
 BUL_kv_agrarian_economy_2:0 "Modernizing Agriculture"
 BUL_kv_agrarian_economy_2_desc:0 "Reform has begun, but the countryside is still poor."
 BUL_kv_conscription_reform:0 "Conscription Reform"
 BUL_kv_conscription_reform_desc:0 "A wider, fairer draft."
 BUL_kv_officer_academy:0 "Sofia Officer Academy"
 BUL_kv_officer_academy_desc:0 "Officers who think."
 BUL_kv_border_forts:0 "Fortified Frontiers"
 BUL_kv_border_forts_desc:0 "Every pass is a fortress."
 BUL_kv_tobacco_exports:0 "Tobacco Exports"
 BUL_kv_tobacco_exports_desc:0 "Golden leaf, golden revenue."
 BUL_kv_construction_brigades:0 "Youth Construction Brigades"
 BUL_kv_construction_brigades_desc:0 "Young hands building a young nation."
 BUL_kv_industrial_independence:0 "Industrial Independence"
 BUL_kv_industrial_independence_desc:0 "We make what we need."
 BUL_kv_rule_of_law:0 "The Rule of Law"
 BUL_kv_rule_of_law_desc:0 "No one above the law."
 BUL_kv_armed_neutrality:0 "Armed Neutrality"
 BUL_kv_armed_neutrality_desc:0 "Peace through strength."
 BUL_kv_chairmans_rule:0 "The Chairman's Council"
 BUL_kv_chairmans_rule_desc:0 "Experts, answerable to Kolev."
 BUL_kv_kolev_doctrine_idea:0 "The Kolev Doctrine"
 BUL_kv_kolev_doctrine_idea_desc:0 "Armed, united and answerable to no one."
 BUL_kv_chairmans_legion:0 "The Chairman's Legion"
 BUL_kv_chairmans_legion_desc:0 "Uniformed loyalists."
 BUL_kv_war_production:0 "Total Mobilization of Industry"
 BUL_kv_war_production_desc:0 "Every factory serves the front."
 BUL_kv_third_empire:0 "The Third Bulgarian Empire"
 BUL_kv_third_empire_desc:0 "After Simeon and Asen comes Kolev."
 BUL_kv_peoples_army:0 "The People's Army"
 BUL_kv_peoples_army_desc:0 "An army of workers and peasants."
 BUL_kv_good_neighbour:0 "Balkan Non-Aggression"
 BUL_kv_good_neighbour_desc:0 "Peace with our neighbours."
 BUL_kv_young_chairman:0 "The Young Chairman"
 BUL_kv_man_of_the_people:0 "Man of the People"
 BUL_kv_iron_will:0 "Iron Will"
 BUL_kv_red_reformer:0 "Red Reformer"
 BUL_kv_faction_commonwealth:0 "Balkan Commonwealth"
 BUL_kv_faction_accord:0 "Balkan Accord"
 BUL_kv_faction_san_stefano:0 "Pact of San Stefano"
 BUL_kv_faction_balkan_soviet:0 "Balkan Socialist Federation"
 BUL_victor_kolev:0 "Victor Kolev"
 BUL_victor_kolev_desc:0 "Born in Plovdiv in 1909, Victor Kolev studied economics in Sofia and Vienna before making his name as an organiser of agricultural cooperatives. Sharp, impatient and fiercely patriotic, he rose to the chairmanship of the Council of Ministers in 1936 with the backing of a weary Tsar and a generation of young Bulgarians tired of coups and defeats."
 BUL_kv_party:0 "National Renewal"
 BUL_kv_party_long:0 "National Renewal Movement"
 BUL_kv_balkan_friendship:0 "Balkan Friendship"
 kolev.1.t:0 "Chairman Kolev Takes Office"
 kolev.1.d:0 "Sofia, 1936. After a decade of coups, assassinations and failed governments, Tsar Boris III has handed the chairmanship of the Council of Ministers to Victor Kolev - an economist and organiser from Plovdiv who is not yet thirty. The generals of the Military League dismiss him as a schoolboy, the old party bosses expect him to fall within the year, and foreign embassies are not sure how to spell his name.\n\nKolev's first speech to the assembly lasted eleven minutes. 'Bulgaria has been the battlefield of other nations' ambitions for long enough,' he said. 'From today, we decide our own future.'"
 kolev.1.a:0 "Let them underestimate him."
 kolev.10.t:0 "[FROM.GetName] Demands Our Territory"
 kolev.10.d:0 "The government of [FROM.GetName], led by Chairman Victor Kolev, has formally demanded the return of lands it claims were taken from it under the Treaty of Neuilly. The note is polite but makes clear that a refusal will not be the end of the matter."
 kolev.10.a:0 "We cannot risk war. Cede the lands."
 kolev.10.b:0 "Not one village!"
 kolev.11.t:0 "[FROM.GetName] Yields"
 kolev.11.d:0 "[FROM.GetName] has accepted our demands. Bulgarian troops are crossing the old border to cheering crowds."
 kolev.11.a:0 "Bulgaria is whole again."
 kolev.12.t:0 "[FROM.GetName] Refuses"
 kolev.12.d:0 "[FROM.GetName] has rejected our demands outright. The General Staff reports it is ready to settle the matter by force, if the Chairman gives the order."
 kolev.12.a:0 "Then we will take it."
 kolev.12.b:0 "Not yet. We will wait for a better moment."
 kolev.20.t:0 "An Invitation from Sofia"
 kolev.20.d:0 "Chairman Victor Kolev of [FROM.GetName] has invited us to join the [FROM.GetFactionName], arguing that the small nations of the Balkans can only stay free if they stand together."
 kolev.20.a:0 "We accept."
 kolev.20.b:0 "We prefer to stand alone."
 kolev.21.t:0 "[FROM.GetName] Joins Us"
 kolev.21.d:0 "[FROM.GetName] has accepted the Chairman's invitation and joined our alliance."
 kolev.21.a:0 "Excellent."
