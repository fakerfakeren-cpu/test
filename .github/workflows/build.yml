name: Build & Self-Test

on:
  push:
    branches: [ '**' ]
    paths-ignore: [ '**.md', 'docs/**', 'tools/**' ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build mod jar
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace 2>&1 | tee build.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Dedicated server self-test
        id: selftest
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          cat > run/server.properties <<'PROPS'
          online-mode=false
          max-tick-time=-1
          view-distance=6
          simulation-distance=6
          spawn-protection=0
          level-seed=astralfall
          PROPS
          sed -i 's/^ *//' run/server.properties
          timeout 1500 ./gradlew runServer -Pselftest --stacktrace 2>&1 | tee server.log || true
          grep -q "\[SELFTEST\] RESULT: PASS" server.log

      - name: Upload mod jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astralfall-mod-jar
          path: build/libs/*.jar
          if-no-files-found: ignore

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build.log
            server.log
            run/logs/
            run/crash-reports/
          if-no-files-found: ignore

      - name: Summary (compile errors, self-test results, mod errors)
        if: always()
        run: |
          echo "===== COMPILE ERRORS ====="
          grep -E "error:|\.java:[0-9]+: " build.log | head -300 || true
          grep -E "BUILD (SUCCESSFUL|FAILED)|What went wrong" -A3 build.log | head -40 || true
          echo "===== SERVER PROBLEMS ====="
          if [ -f server.log ]; then
            grep -nE "(ERROR|FATAL)|Exception|Caused by|Failed to|Couldn't|Unknown|astralfall.*WARN|WARN.*astralfall|Missing|Invalid" server.log | grep -vE "Narrator|narrator|Realms|realms|Unknown custom packet" | head -250 || true
          fi
          for f in run/crash-reports/*; do [ -f "$f" ] && head -120 "$f"; done
          echo "===== SELFTEST ====="
          [ -f server.log ] && grep -F "[SELFTEST]" server.log | cut -c1-400 | tail -400 || true
