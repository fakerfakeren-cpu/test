name: Build & Self-Test

on:
  push:
    branches: [ '**' ]
    paths-ignore: [ '**.md', 'docs/**', 'tools/**' ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never
          cache-read-only: false

      - name: Build mod jar
        id: build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace 2>&1 | tee build.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Dedicated server self-test
        id: selftest
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          cat > run/server.properties <<'PROPS'
          online-mode=false
          max-tick-time=-1
          view-distance=6
          simulation-distance=6
          spawn-protection=0
          level-seed=lanternguard
          pause-when-empty-seconds=0
          PROPS
          sed -i 's/^ *//' run/server.properties
          timeout 1500 ./gradlew runServer -Pselftest --stacktrace 2>&1 | tee server.log || true
          grep -q "\[SELFTEST\] RESULT: PASS" server.log

      - name: Client smoke test (real client, screenshots)
        id: clienttest
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq xvfb xdotool libgl1-mesa-dri mesa-utils >/dev/null
          mkdir -p run/saves
          if [ -d run/world ]; then rm -rf run/saves/world && cp -r run/world run/saves/world && rm -f run/saves/world/session.lock; fi
          ls run/saves/world || echo "no world to copy"
          printf 'onboardAccessibility:false\nrenderDistance:10\nsimulationDistance:6\npauseOnLostFocus:false\ntutorialStep:none\nguiScale:2\nsoundCategory_master:0.0\nfov:0.35\n' > run/options.txt
          export LIBGL_ALWAYS_SOFTWARE=1
          # Worlds with data-pack worldgen show vanilla's "Experimental Settings" prompt on load;
          # click "I Know What I'm Doing!" (centre-right button at 1280x720, GUI scale 2) until the world is joined.
          cat > clienttest.sh <<'SH'
          ./gradlew runClient -Pclienttest --stacktrace > client.log 2>&1 &
          GPID=$!
          ( for i in $(seq 1 150); do
              sleep 4
              if grep -q "world joined" client.log; then sleep 2; xdotool mousemove 640 360 key F1 >/dev/null 2>&1; echo "HUD hidden (F1)"; break; fi
              # fallback only: the mod skips the prompt itself (config skipExperimentalWarning)
              [ $i -gt 20 ] && ! grep -q "Skipped the" client.log && grep -q "waiting for world" client.log && xdotool mousemove 800 274 click 1 >/dev/null 2>&1
            done ) &
          wait $GPID
          SH
          sed -i 's/^          //' clienttest.sh
          timeout 1200 xvfb-run -a -s "-screen 0 1280x720x24" bash clienttest.sh || true
          ls -la run/screenshots || true
          grep -q "\[CLIENTTEST\] RESULT: PASS" client.log

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: run/screenshots/
          if-no-files-found: ignore

      - name: Upload mod jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oathbound-mod-jar
          path: build/libs/*.jar
          if-no-files-found: ignore

      - name: Publish tested jar and screenshots to the branch
        if: success() && github.ref == 'refs/heads/claude/nice-fermi-3xossn'
        continue-on-error: true
        run: |
          python3 -m pip install -q pillow >/dev/null 2>&1 || true
          mkdir -p dist docs/oathbound
          rm -f dist/*.jar
          cp build/libs/oathbound-*.jar dist/
          python3 - <<'PY'
          import glob, os
          from PIL import Image
          for f in sorted(glob.glob('run/screenshots/oathbound_*.png')):
              name = os.path.basename(f)[len('oathbound_'):-4]
              Image.open(f).convert('RGB').save(f'docs/oathbound/{name}.jpg', 'JPEG', quality=85)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist docs/oathbound
          git commit -m "CI: publish the tested jar and client screenshots [skip ci]" || exit 0
          git push

      - name: Publish CI report (screenshots and test summaries) to the branch
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.ref == 'refs/heads/claude/nice-fermi-3xossn' }}
        continue-on-error: true
        run: |
          python3 -m pip install -q pillow >/dev/null 2>&1 || true
          rm -rf docs/oathbound/ci && mkdir -p docs/oathbound/ci
          python3 - <<'PY'
          import glob, os, re
          from PIL import Image
          for f in sorted(glob.glob('run/screenshots/oathbound_*.png')):
              name = os.path.basename(f)[len('oathbound_'):-4]
              im = Image.open(f).convert('RGB')
              im.thumbnail((960, 540))
              im.save(f'docs/oathbound/ci/{name}.jpg', 'JPEG', quality=80)
          def grab(path, pattern, limit, exclude=None):
              if not os.path.exists(path):
                  return ['(no ' + path + ')']
              out = []
              for line in open(path, errors='replace'):
                  if re.search(pattern, line) and not (exclude and re.search(exclude, line)):
                      out.append(line.rstrip()[:400])
              return out[-limit:] if limit < 0 else out[:limit]
          with open('docs/oathbound/ci/report.txt', 'w') as r:
              r.write('commit ' + os.environ.get('GITHUB_SHA', '?') + '\n')
              r.write('===== SELFTEST =====\n' + '\n'.join(grab('server.log', r'\[SELFTEST\]', 400)) + '\n')
              r.write('===== CLIENTTEST =====\n' + '\n'.join(grab('client.log', r'\[CLIENTTEST\]|Skipped the|Could not skip', 300)) + '\n')
              r.write('===== SERVER PROBLEMS =====\n' + '\n'.join(grab('server.log', r'(ERROR|FATAL)|Exception|Caused by|Failed to|Couldn.t|Unknown|oathbound.*WARN|WARN.*oathbound|Missing|Invalid', 200, r'Narrator|narrator|Realms|realms|Unknown custom packet')) + '\n')
              r.write('===== CLIENT PROBLEMS =====\n' + '\n'.join(grab('client.log', r'(ERROR|FATAL)|Exception|Caused by|Failed to load|Missing|Unable to|missing', 200, r'Narrator|narrator|Realms|realms|OpenAL|ALSA|audio')) + '\n')
          PY
          for f in run/crash-reports/*; do [ -f "$f" ] && { echo "===== CRASH $f ====="; head -150 "$f"; } >> docs/oathbound/ci/report.txt; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/oathbound/ci
          git commit -m "CI report [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin claude/nice-fermi-3xossn && git push -q && break; sleep 3; done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build.log
            server.log
            client.log
            run/logs/
            run/crash-reports/
          if-no-files-found: ignore

      - name: Summary (compile errors, self-test results, mod errors)
        if: always()
        run: |
          echo "===== COMPILE ERRORS ====="
          python3 - <<'PY' || true
          import re
          seen, out = set(), []
          lines = open('build.log', errors='replace').read().splitlines()
          for i, l in enumerate(lines):
              m = re.match(r'\s*/.*/(src/main/java/\S+?\.java):(\d+): error: (.*)', l)
              if not m:
                  continue
              extra = ''
              for k in lines[i + 1:i + 4]:
                  k = k.strip()
                  if k.startswith(('symbol:', 'location:', 'required:', 'found:', 'reason:', 'method ', 'overridden')) or 'cannot be converted' in k:
                      extra += ' | ' + k
              key = (m.group(1), m.group(2), m.group(3))
              if key in seen:
                  continue
              seen.add(key)
              out.append(f"{m.group(1).split('/')[-1]}:{m.group(2)}: {m.group(3)}{extra}"[:400])
          print(len(out), 'distinct errors')
          print('\n'.join(out[:250]))
          PY
          grep -E "BUILD (SUCCESSFUL|FAILED)|What went wrong" -A3 build.log | head -40 || true
          echo "===== SERVER PROBLEMS ====="
          if [ -f server.log ]; then
            grep -nE "(ERROR|FATAL)|Exception|Caused by|Failed to|Couldn't|Unknown|oathbound.*WARN|WARN.*oathbound|Missing|Invalid" server.log | grep -vE "Narrator|narrator|Realms|realms|Unknown custom packet" | head -250 || true
          fi
          for f in run/crash-reports/*; do [ -f "$f" ] && head -120 "$f"; done
          echo "===== CLIENT PROBLEMS ====="
          if [ -f client.log ]; then
            grep -nE "(ERROR|FATAL)|Exception|Caused by|Failed to load|Missing|Unable to" client.log | grep -vE "Narrator|narrator|Realms|realms|OpenAL|ALSA|audio|Sound|sound" | cut -c1-400 | head -250 || true
          fi
          echo "===== CLIENTTEST ====="
          [ -f client.log ] && grep -E "Skipped the|Could not skip" client.log | cut -c1-300 || true
          [ -f client.log ] && grep -F "[CLIENTTEST]" client.log | cut -c1-300 | tail -300 || true
          [ -f client.log ] && echo "--- client.log tail ---" && grep -vE "^\s+at |Transformer Audit|REASON:|PLUGIN:" client.log | tail -40 | cut -c1-300 || true
          echo "===== SELFTEST ====="
          [ -f server.log ] && grep -F "[SELFTEST]" server.log | cut -c1-400 | tail -400 || true
