name: Mimas data pack (26.3 server + client check)

on:
  push:
    branches: [ 'claude/vigilant-franklin-d9sm38' ]
    paths: [ 'mimas/tools/**', 'mimas/ci/**', '.github/workflows/mimas.yml' ]
  workflow_dispatch:

concurrency:
  group: mimas-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Tools
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq xvfb xdotool imagemagick libgl1-mesa-dri mesa-vulkan-drivers mesa-utils libxkbcommon-x11-0 >/dev/null
          python3 -m pip install -q pillow

      - name: Verify on vanilla 26.3
        run: bash mimas/ci/run.sh

      - name: Summary
        if: always()
        run: cat mimas/ci-results/summary.md || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mimas-ci-results
          path: |
            mimas/ci-results/
            mimas/datapack/
            ci_work/shots/
          if-no-files-found: ignore

      - name: Commit results to the branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f mimas/ci-results mimas/tools/version_info.json || true
          git commit -m "Mimas CI: in-game verification results [skip ci]" || exit 0
          git reset -q --hard HEAD   # drop files the run regenerated (e.g. the data pack zip)
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done
