l_english:
 bfx_tt_arms_fronts:0 "Unlocks the §YŠkoda§! and §YRheinmetall§! purchase decisions in §YShackles of Neuilly§!."
 bfx_tt_hidden_arsenals:0 "Covert Rearmament §Gno longer decays§! each month."
 bfx_tt_hour_of_decision:0 "Unlocks §YThe Tsar Steps Forward§! and §YThe Legions March§! (mutually exclusive)."
 bfx_tt_auction_closes:0 "The §Yhighest bidder§! becomes our patron: §YBerlin§! sends 3,000 rifles and 100 guns, §YLondon§! builds two civilian factories, §YMoscow§! sends instructors (30 army XP) and 150 guns."
 bfx_tt_unrest_focus_15:0 "Unrest in Vardar Macedonia: §R+15§!"
 bfx_tt_unrest_focus_25:0 "Unrest in Vardar Macedonia: §R+25§!"
 bfx_tt_macedonia_rises:0 "If unrest is §Y70+§! and Yugoslavia holds Macedonia: the §YIndependent State of Macedonia§! rises in civil war."
 bfx_tt_sign_bidder:0 "Our §Ypatron§! is asked to admit us to its faction (or, without one, guarantees us)."
 bfx_tt_change_sides:0 "Unlocks §YChange Sides§! (Bulgarian Auction): when our faction leader is losing, make peace with its enemies, leave the faction, join the other side and turn on the old patron."
 bfx_tt_everyones_money:0 "Each power that bid §Y40+§! pays: Berlin 2,000 rifles, Moscow 100 guns, London a civilian factory."
 bfx_tt_momentum_start:0 "Starts §YRevolutionary Momentum§! at §Y30§!: §G+3§! a month at war, §R-3§! a month at peace. High momentum boosts attack, war support and conscription; above §Y90§! the revolution turns on itself, below §Y15§! it falls apart."
 bfx_tt_tribunals:0 "Unlocks the §YRevolutionary Tribunals§! decision."
 bfx_tt_incidents:0 "Unlocks the §YManufacture an Incident§! decision."
 bfx_tt_requisitions:0 "Unlocks the §YLegionary Requisitions§! decision."
