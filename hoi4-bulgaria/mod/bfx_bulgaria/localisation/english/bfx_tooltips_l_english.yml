l_english:
 bfx_tt_arms_fronts:0 "Unlocks the §YŠkoda§! and §YRheinmetall§! purchase decisions in §YShackles of Neuilly§!."
 bfx_tt_hour_of_decision:0 "Unlocks the three political paths: §YThe Tsar Steps Forward§!, §YUnchain the Workers' Party§! and §YThe Union Stirs Again§!. They are mutually exclusive."
 bfx_tt_dobruja_demand:0 "§YRomania§! is asked to return §YDobrudja§!. If refused, we gain a §Rwar goal§! against Romania."
 bfx_tt_seek_pact:0 "If §YGermany§! leads a faction it is asked to admit us; otherwise we found the §YBalkan Axis§!."
 bfx_tt_concord:0 "Unaligned §YGreece§!, §YYugoslavia§!, §YTurkey§! and §YRomania§! are invited to join."
 bfx_tt_allied:0 "§YThe United Kingdom§! guarantees our independence and is asked to admit us to its faction."
 bfx_tt_confed:0 "Every non-major faction member is offered union. Acceptance: they are §Yannexed§! and we gain §Ycores§! on all their core states."
 bfx_tt_comintern:0 "§YThe Soviet Union§! is asked to admit us to its faction (or, without one, guarantees us)."
 bfx_tt_partisans_west:0 "Unlocks §YPartisan Support§! decisions targeting §YYugoslavia§! and §YAlbania§!."
 bfx_tt_partisans_south:0 "Unlocks §YPartisan Support§! decisions targeting §YGreece§! and §YTurkey§!."
 bfx_tt_federation:0 "Unlocks §YIntegrate the Red ...§! decisions: communist neighbours that are our subjects or faction members can join the Federation, giving us §Ycores§! on their lands."
 bfx_tt_green_int:0 "Democratic, unaligned §YYugoslavia, Romania, Greece, Albania, Poland§! and §YCzechoslovakia§! are invited."
 bfx_tt_peasant_union:0 "Non-major democratic faction members are offered union. Acceptance: §Yannexation§! and §Ycores§! on their core states."
 bfx_tt_rose_leaf:0 "Opens the trade choice: §YGerman Clearing§! or §YDiversification§!."
