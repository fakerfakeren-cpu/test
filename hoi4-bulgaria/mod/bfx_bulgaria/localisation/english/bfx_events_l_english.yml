l_english:
 bfx.1.t:0 "The Tsar's Dilemma"
 bfx.1.d:0 "Sofia, spring 1936. The Zveno colonels who seized power in 1934 have been eased out; the parties they banned stay banned. Tsar Boris III now governs through ministers he chooses and dismisses at will. He is cautious, clever, popular and deeply reluctant. His father lost two wars and a throne. Boris would prefer to lose neither."
 bfx.1.a:0 "Rule from the Palace, quietly."
 bfx.1.b:0 "Promise a constitution. Someday."
 bfx.1.c:0 "Ask the army what it thinks."
 bfx.2.t:0 "The Velchev Trial"
 bfx.2.d:0 "Colonel Damyan Velchev, organiser of the 1923 and 1934 coups, was arrested after slipping back into the country in late 1935. The military court has sentenced him to death. His officers are watching the Palace. So are the Agrarians who loved his 1934 government, and so is everyone who feared it."
 bfx.2.a:0 "Commute the sentence. Martyrs make bad neighbours."
 bfx.2.b:0 "Let the sentence stand."
 bfx.3.t:0 "The Partyless Elections"
 bfx.3.d:0 "Candidates must stand as individuals, without party labels. Agrarians, Democrats and even disguised Communists have nonetheless won seats in suspicious numbers. The Interior Ministry asks how honest the final count should be."
 bfx.3.a:0 "An honest count. More or less."
 bfx.3.b:0 "Count it properly. Our way."
 bfx.3.c:0 "Disqualify the Workers' Party candidates."
 bfx.4.t:0 "The Shadow Parties"
 bfx.4.d:0 "Agrarians meet in village taverns, Communists in tobacco warehouses, Zveno officers in their messes and Hristo Lukov's Legionaries in school gymnasiums. The police know all the addresses. The Palace decides whom the police will not visit this year."
 bfx.4.a:0 "Let the Agrarians talk."
 bfx.4.b:0 "Let the Communists organise."
 bfx.4.c:0 "Let the Legionaries march."
 bfx.4.e:0 "Keep them all in the dark."
 bfx.10.t:0 "The Ledger of Trade"
 bfx.10.d:0 "The Finance Ministry has finished its review. Bulgarian trade is either chained to one buyer or spread across many, and either way the ministers want a decision."
 bfx.10.a:0 "Break free of the clearing account."
 bfx.10.b:0 "Bind ourselves tighter to Berlin."
 bfx.10.c:0 "Open the markets to the world."
 bfx.10.e:0 "Balance the books and move on."
 bfx_neuilly.10.t:0 "Notes of Protest"
 bfx_neuilly.10.d:0 "Envoys from Athens, Belgrade, Ankara and Bucharest have delivered identical notes: they have observed irregularities in Bulgaria's compliance with the military clauses of Neuilly. (Balkan Suspicion has reached 25.)"
 bfx_neuilly.10.a:0 "Deny everything, politely."
 bfx_neuilly.10.b:0 "Let them protest."
 bfx_neuilly.11.t:0 "The Entente Closes Ranks"
 bfx_neuilly.11.d:0 "The Balkan Entente has met in emergency session. Its members now guarantee each other against any Bulgarian adventure. (Balkan Suspicion has reached 50.)"
 bfx_neuilly.11.a:0 "They are afraid of us. Good."
 bfx_neuilly.11.b:0 "Send reassurances to every capital."
 bfx_neuilly.12.t:0 "The Balkan Embargo"
 bfx_neuilly.12.d:0 "Our neighbours have closed their markets to Bulgarian tobacco and their ports to anything heavier than a crate of roses. (Balkan Suspicion has reached 75.)"
 bfx_neuilly.12.a:0 "Endure it."
 bfx_neuilly.12.b:0 "Smuggle everything through Romania."
 bfx_neuilly.13.t:0 "Incident at Petrich"
 bfx_neuilly.13.d:0 "A Greek sentry is shot on the border near Petrich, exactly as in 1925, when Greece invaded over a similar shooting. Troops are moving on both sides. Sofia must decide whether to back down or stand firm."
 bfx_neuilly.13.a:0 "Back down. Pull the regiments back."
 bfx_neuilly.13.b:0 "Stand firm."
 bfx_neuilly.20.t:0 "The Salonika Agreement"
 bfx_neuilly.20.d:0 "In Thessaloniki the Balkan Entente has released Bulgaria from the military clauses of Neuilly, in exchange for a promise of non-aggression. Sofia's diplomats left smiling, which some find worrying."
 bfx_neuilly.20.a:0 "A reasonable arrangement."
 bfx_neuilly.21.t:0 "Bulgaria Tears Up Neuilly"
 bfx_neuilly.21.d:0 "Sofia has announced that the Treaty of Neuilly no longer binds it, conscription is restored and an air force is being raised. The Bulgarian minister delivered the note with a smile."
 bfx_neuilly.21.a:0 "Mobilise the border divisions."
 bfx_neuilly.21.b:0 "Protest, then do nothing."
 bfx_tsar.10.t:0 "Bulgaria Demands Southern Dobruja"
 bfx_tsar.10.d:0 "Sofia's minister asks for the return of the Quadrilateral, taken from Bulgaria in 1913. Berlin is said to support the request."
 bfx_tsar.10.a:0 "Return the Quadrilateral."
 bfx_tsar.10.b:0 "Not one furrow."
 bfx_tsar.11.t:0 "Dobruja Returns"
 bfx_tsar.11.d:0 "Bucharest has agreed. Bulgarian troops cross into Silistra and Dobrich to flowers and church bells."
 bfx_tsar.11.a:0 "The Treaty of Craiova, a little early."
 bfx_tsar.12.t:0 "Romania Refuses"
 bfx_tsar.12.d:0 "Bucharest will not give up a single furrow. The General Staff has drawn the obvious conclusion."
 bfx_tsar.12.a:0 "Then we will take it."
 bfx_tsar.20.t:0 "Bulgaria Asks to Join"
 bfx_tsar.20.d:0 "The Bulgarian minister has formally requested admission to our alliance. Bulgaria offers its army, the Black Sea coast and a road to the Straits."
 bfx_tsar.20.a:0 "Welcome them."
 bfx_tsar.20.b:0 "Not yet."
 bfx_tsar.21.t:0 "Berlin Says No"
 bfx_tsar.21.d:0 "Our request has been declined, politely. Filov proposes a Balkan Axis instead, with Sofia at its head."
 bfx_tsar.21.a:0 "Found the Balkan Axis."
 bfx_tsar.30.t:0 "Invitation to the Balkan Concord"
 bfx_tsar.30.d:0 "Sofia proposes a Balkan Concord: a defensive alliance of the peninsula's states, chaired by Bulgaria and directed against nobody in particular."
 bfx_tsar.30.a:0 "Join the Concord."
 bfx_tsar.30.b:0 "Decline with thanks."
 bfx_tsar.40.t:0 "A Crown for Two Nations"
 bfx_tsar.40.d:0 "Sofia proposes full union under the Bulgarian Crown: one army, one market and one king. Our own institutions would survive as a self-governing land within the Confederation."
 bfx_tsar.40.a:0 "Accept union."
 bfx_tsar.40.b:0 "We remain sovereign."
 bfx_tsar.50.t:0 "Bulgaria Leans Towards London"
 bfx_tsar.50.d:0 "Sofia asks to join our alliance. Bulgaria would keep the Straits' western approaches out of German hands."
 bfx_tsar.50.a:0 "Admit them."
 bfx_tsar.50.b:0 "A guarantee will have to do."
 bfx_alt.1.t:0 "The Return of Ferdinand"
 bfx_alt.1.d:0 "A special train from Coburg arrives at Sofia station: Ferdinand I, seventy-six, plumed, decorated and furious with everyone. He reminds his son that he once nearly took Constantinople and that Boris has not even tried. By evening Boris has agreed to step aside for his father. The crowds outside the Palace cheer for both of them."
 bfx_alt.1.a:0 "Long live Tsar Ferdinand!"
 bfx_alt.2.t:0 "Mass in Hagia Sophia"
 bfx_alt.2.d:0 "For the first time since 1453 the Divine Liturgy has been sung under the great dome, by a Bulgarian exarch, in the presence of Ferdinand of Saxe-Coburg, now styling himself Basileus of the Romans and Bulgars. Europe does not quite know whether to laugh."
 bfx_alt.2.a:0 "Ferdinand has outdone himself."
 bfx_alt.2.b:0 "Is this really happening?"
 bfx_alt.3.t:0 "The Coronation at Tarnovo"
 bfx_alt.3.d:0 "Tsarevets hill is lit with torches, the bells of forty churches ring and Ferdinand is crowned Tsar of Bulgarians and Vlachs with a crown that once belonged to nobody in particular."
 bfx_alt.3.a:0 "Feast for three days."
 bfx_alt.3.b:0 "Coronation, then the front."
 bfx_com.1.t:0 "The Ninth of September"
 bfx_com.1.d:0 "At dawn Fatherland Front fighters and sympathetic army units occupy the War Ministry, the radio station and the post office. With enough support (Communists at 40% or more) the Palace yields; otherwise the Tsar's loyalists will fight."
 bfx_com.1.a:0 "The Palace yields!"
 bfx_com.1.b:0 "To the barricades!"
 bfx_com.10.t:0 "Bulgaria Asks to Join"
 bfx_com.10.d:0 "The new People's Republic of Bulgaria, led by our own Comrade Dimitrov, asks to join the alliance of socialist states."
 bfx_com.10.a:0 "Welcome, comrades."
 bfx_com.10.b:0 "A guarantee is sufficient."
 bfx_com.20.t:0 "The Federation Committee"
 bfx_com.20.d:0 "Kolarov convenes Bulgarian, Yugoslav, Greek and Albanian communists in Sofia. The first question is the old one: Macedonia. The second question is who chairs the meeting."
 bfx_com.20.a:0 "Macedonia becomes a federal republic."
 bfx_com.20.b:0 "Thrace and the Aegean come first."
 bfx_agr.1.t:0 "A Second 19th of May"
 bfx_agr.1.d:0 "Agrarian militias and Zveno officers have surrounded the Palace. Tsar Boris can accept a constitutional role, or order the Guard to fight."
 bfx_agr.1.a:0 "The Tsar accepts a constitutional crown."
 bfx_agr.1.b:0 "The Guard resists. Civil war!"
 bfx_agr.2.t:0 "The Referendum on the Crown"
 bfx_agr.2.d:0 "Three questions on the ballot, two of them confusing. The one that matters: kingdom or republic?"
 bfx_agr.2.a:0 "The People's Republic of Peasants. A republic!"
 bfx_agr.2.b:0 "Keep the constitutional crown."
 bfx_agr.10.t:0 "The Green International"
 bfx_agr.10.d:0 "Sofia invites us to join the Green International, an alliance of peasant democracies from the Baltic to the Aegean."
 bfx_agr.10.a:0 "Join our peasant brothers."
 bfx_agr.10.b:0 "Decline."
 bfx_agr.20.t:0 "The Peasant Union"
 bfx_agr.20.d:0 "Sofia proposes full union: one parliament for all the peasant nations of the Balkans, with our people represented in it. Our state would become a self-governing land of the Union."
 bfx_agr.20.a:0 "Join the Union."
 bfx_agr.20.b:0 "We remain sovereign."
 bfx_zveno.1.t:0 "Velchev's Return"
 bfx_zveno.1.d:0 "Damyan Velchev, father of two coups, presents himself at the War Ministry with a briefcase full of reform plans. The Zveno officers want him; the Agrarians fear him."
 bfx_zveno.1.a:0 "Make him War Minister."
 bfx_zveno.1.b:0 "A diplomatic posting abroad, perhaps."
 bfx_flav.1.t:0 "The Rose Harvest at Kazanlak"
 bfx_flav.1.d:0 "Before dawn the women of the Valley pick the damask roses while the dew is still on them; it takes three thousand kilos of petals for one of attar. This year's harvest is superb."
 bfx_flav.1.a:0 "Sell it all to Paris."
 bfx_flav.1.b:0 "Hold the Rose Festival."
 bfx_flav.2.t:0 "Tobacco Strike in Plovdiv"
 bfx_flav.2.d:0 "Twenty thousand tobacco workers have downed tools over pay. The warehouses are full, the buyers are waiting and the strike committee looks suspiciously well organised."
 bfx_flav.2.a:0 "Meet their demands."
 bfx_flav.2.b:0 "Send in the police."
 bfx_flav.3.t:0 "The Tsar Drives the Train"
 bfx_flav.3.d:0 "The Sofia–Varna express arrived nine minutes early today. The driver, in overalls and goggles, was His Majesty Boris III, who also insisted on shovelling the coal."
 bfx_flav.3.a:0 "The people love it."
 bfx_flav.3.b:0 "Insist on the regular driver."
 bfx_flav.4.t:0 "The St Nedelya Anniversary"
 bfx_flav.4.d:0 "On 16 April 1925 a bomb in Sofia's St Nedelya Cathedral killed over a hundred and fifty people at a general's funeral. The anniversary divides the city."
 bfx_flav.4.a:0 "A solemn memorial."
 bfx_flav.4.b:0 "Hunt the last conspirators."
 bfx_flav.5.t:0 "Pilgrims to Rila"
 bfx_flav.5.d:0 "Thousands walk to the Rila Monastery for the feast of St Ivan. The monks offer bread, the abbot offers a sermon and the library offers manuscripts nobody has read in four hundred years."
 bfx_flav.5.a:0 "Join the pilgrimage."
 bfx_flav.5.b:0 "Fund the library."
