l_english:
 bfx.1.t:0 "The Tsar's Dilemma"
 bfx.1.d:0 "Sofia, spring 1936. The Zveno colonels who seized power in 1934 have been eased out; the parties they banned stay banned. Tsar Boris III governs through ministers he chooses and dismisses at will. He is cautious, clever, popular and deeply reluctant. His father lost two wars and a throne. Boris would prefer to lose neither."
 bfx.1.a:0 "Rule from the Palace, quietly."
 bfx.1.b:0 "Court the officers."
 bfx.1.c:0 "Let the young nationalists organise."
 bfx.2.t:0 "The Velchev Trial"
 bfx.2.d:0 "Colonel Damyan Velchev, organiser of the 1923 and 1934 coups, was arrested after slipping back into the country. The military court has sentenced him to death. His officers are watching the Palace."
 bfx.2.a:0 "Commute the sentence. Martyrs make bad neighbours."
 bfx.2.b:0 "Let the sentence stand."
 bfx.3.t:0 "The Partyless Elections"
 bfx.3.d:0 "Candidates must stand as individuals, without party labels. The Interior Ministry asks how honest the final count should be."
 bfx.3.a:0 "An honest count. More or less."
 bfx.3.b:0 "Count it properly. Our way."
 bfx.3.c:0 "Make room for the Legionary candidates."
 bfx.4.t:0 "The Shadow Parties"
 bfx.4.d:0 "Agrarians meet in taverns, Communists in tobacco warehouses and the Legionaries of General Lukov in school gymnasiums, in uniform. The police know all the addresses. The Palace decides whom they will not visit this year."
 bfx.4.a:0 "Let the Legions march."
 bfx.4.b:0 "Hunt the Communists, leave the rest."
 bfx.4.c:0 "Keep them all in the dark."
 bfx.10.t:0 "The Ledger of Trade"
 bfx.10.d:0 "The Finance Ministry has finished its review. Bulgarian trade is either chained to one buyer or spread across many, and the ministers want a decision."
 bfx.10.a:0 "Break free of the clearing account."
 bfx.10.b:0 "Bind ourselves tighter to Berlin."
 bfx.10.c:0 "Open the markets to the world."
 bfx.10.e:0 "Balance the books and move on."
 bfx_neuilly.10.t:0 "Notes of Protest"
 bfx_neuilly.10.d:0 "Envoys from Athens, Belgrade, Ankara and Bucharest have delivered identical notes about irregularities in Bulgaria's compliance with Neuilly. (Balkan Suspicion has passed 25.)"
 bfx_neuilly.10.a:0 "Deny everything, politely."
 bfx_neuilly.10.b:0 "Let them protest."
 bfx_neuilly.11.t:0 "The Entente Closes Ranks"
 bfx_neuilly.11.d:0 "The Balkan Entente has met in emergency session. Its members now guarantee each other against any Bulgarian adventure. (Balkan Suspicion has passed 50.)"
 bfx_neuilly.11.a:0 "They are afraid of us. Good."
 bfx_neuilly.11.b:0 "Send reassurances to every capital."
 bfx_neuilly.12.t:0 "The Balkan Embargo"
 bfx_neuilly.12.d:0 "Our neighbours have closed their markets to Bulgarian tobacco and their ports to anything heavier than a crate of roses. (Balkan Suspicion has passed 75.)"
 bfx_neuilly.12.a:0 "Endure it."
 bfx_neuilly.12.b:0 "Smuggle everything through Romania."
 bfx_neuilly.13.t:0 "Incident at Petrich"
 bfx_neuilly.13.d:0 "A Greek sentry is shot on the border near Petrich, exactly as in 1925, when Greece invaded over a similar shooting. Troops are moving on both sides."
 bfx_neuilly.13.a:0 "Back down. Pull the regiments back."
 bfx_neuilly.13.b:0 "Stand firm."
 bfx_neuilly.20.t:0 "The Salonika Agreement"
 bfx_neuilly.20.d:0 "In Thessaloniki the Balkan Entente has released Bulgaria from the military clauses of Neuilly, in exchange for a promise of non-aggression."
 bfx_neuilly.20.a:0 "A reasonable arrangement."
 bfx_neuilly.21.t:0 "Bulgaria Tears Up Neuilly"
 bfx_neuilly.21.d:0 "Sofia has announced that the Treaty of Neuilly no longer binds it. The Bulgarian minister delivered the note with a smile."
 bfx_neuilly.21.a:0 "Mobilise the border divisions."
 bfx_neuilly.21.b:0 "Protest, then do nothing."
 bfx_court.10.t:0 "The League Stirs"
 bfx_court.10.d:0 "Colonels meet at night in the officers' club. The Military League has decided the Tsar needs advice, and is prepared to give it with machine guns. (Army influence has passed 80.)"
 bfx_court.10.a:0 "Give the generals the War Ministry."
 bfx_court.10.b:0 "Arrest the ringleaders."
 bfx_court.11.t:0 "The Legions March on Sofia"
 bfx_court.11.d:0 "Forty thousand Legionaries in green shirts parade down Tsar Osvoboditel Boulevard with torches. Lukov demands ministries. (Legion influence has passed 80.)"
 bfx_court.11.a:0 "Ban the Legions."
 bfx_court.11.b:0 "Give Lukov his ministries."
 bfx_court.11.c:0 "The Legion is the State!"
 bfx_court.12.t:0 "Murder in Sofia"
 bfx_court.12.d:0 "A deputy is shot dead outside the Sobranie at noon. The gunman shouts 'Long live free Macedonia!' and walks away. (IMRO influence has passed 80.)"
 bfx_court.12.a:0 "Raid the Macedonian cafés."
 bfx_court.12.b:0 "Let it pass."
 bfx_court.13.t:0 "The Crown Totters"
 bfx_court.13.d:0 "Ministers resign, newspapers speculate about abdication and the Tsar has stopped sleeping. (Crown influence has fallen below 20.)"
 bfx_court.13.a:0 "The Tsar appeals to the nation."
 bfx_court.13.b:0 "Rule through the generals."
 bfx_court.14.t:0 "The Army Sulks"
 bfx_court.14.d:0 "Unpaid officers, cancelled manoeuvres and a War Ministry nobody visits. (Army influence has fallen below 15.)"
 bfx_court.14.a:0 "Pay them."
 bfx_court.14.b:0 "They will do as they are told."
 bfx_court.20.t:0 "The Tsar Is Dead"
 bfx_court.20.d:0 "28 August 1943. Tsar Boris III has died, days after a stormy meeting with Hitler. Rumours of poison are everywhere. His son Simeon is six years old. A regency council of Prince Kiril, Professor Filov and General Mihov takes over. In Coburg, an old man reads the telegram twice."
 bfx_court.20.a:0 "A Regency Council."
 bfx_dip.1.t:0 "Bulgaria Proposes a Pact"
 bfx_dip.1.d:0 "Sofia proposes a non-aggression pact: neither country will attack the other."
 bfx_dip.1.a:0 "Sign the pact."
 bfx_dip.1.b:0 "Decline."
 bfx_dip.2.t:0 "Our Proposal Is Accepted"
 bfx_dip.2.d:0 "[From.GetName] has accepted Sofia's proposal."
 bfx_dip.2.a:0 "Excellent."
 bfx_dip.3.t:0 "Our Proposal Is Refused"
 bfx_dip.3.d:0 "[From.GetName] has turned Sofia down. The Foreign Ministry is writing a very polite reply, and the War Ministry a less polite plan."
 bfx_dip.3.a:0 "We will remember this."
 bfx_dip.4.t:0 "Bulgaria Asks for a Guarantee"
 bfx_dip.4.d:0 "Sofia asks us to guarantee Bulgarian independence."
 bfx_dip.4.a:0 "Grant it."
 bfx_dip.4.b:0 "Decline."
 bfx_dip.5.t:0 "Invitation from Sofia"
 bfx_dip.5.d:0 "Bulgaria invites us to join its alliance."
 bfx_dip.5.a:0 "Join."
 bfx_dip.5.b:0 "Decline."
 bfx_dip.6.t:0 "Bulgaria Demands Southern Dobruja"
 bfx_dip.6.d:0 "Sofia's minister asks for the return of the Quadrilateral, taken from Bulgaria in 1913. Berlin is said to support the request."
 bfx_dip.6.a:0 "Return the Quadrilateral."
 bfx_dip.6.b:0 "Not one furrow."
 bfx_dip.7.t:0 "Bulgaria Offers Protection"
 bfx_dip.7.d:0 "Sofia offers to protect Albania: Bulgarian advisers, Bulgarian guarantees and Bulgarian foreign policy. Refusal, it is hinted, would be unwise."
 bfx_dip.7.a:0 "Accept Bulgarian protection."
 bfx_dip.7.b:0 "Refuse."
 bfx_dip.8.t:0 "Bulgaria Asks to Join"
 bfx_dip.8.d:0 "The Bulgarian minister has formally requested admission to our alliance. Bulgaria offers its army, the Black Sea coast and a road to the Straits."
 bfx_dip.8.a:0 "Welcome them."
 bfx_dip.8.b:0 "Not yet."
 bfx_dip.9.t:0 "Berlin Says No"
 bfx_dip.9.d:0 "Our request has been declined, politely. Then Bulgaria will lead an Axis of its own."
 bfx_dip.9.a:0 "Found the Balkan Axis."
 bfx_fas.1.t:0 "The March on Sofia"
 bfx_fas.1.d:0 "Legion columns converge on the capital from Plovdiv, Pleven and Ruse. If the Crown is weak (below 50) or the Legions strong (60 or more) the Tsar will appoint General Lukov; otherwise the Palace Guard fights."
 bfx_fas.1.a:0 "The Tsar appoints General Lukov."
 bfx_fas.1.b:0 "The Palace Guard resists: civil war!"
 bfx_fas.2.t:0 "Shots on Ivan Asen II Street"
 bfx_fas.2.d:0 "February 1943: gunmen wait for General Lukov outside his home. This time he survives, wounded, and the Legion wants blood."
 bfx_fas.2.a:0 "Hunt the assassins."
 bfx_fas.2.b:0 "A martyr's speech from the hospital bed."
 bfx_imro.1.t:0 "Ilinden Again: Macedonia Rises"
 bfx_imro.1.d:0 "Church bells ring from Kumanovo to Ohrid. IMRO fighters seize Skopje's post office, Yugoslav garrisons are surrounded in their barracks, and Ivan Mihaylov proclaims the Independent State of Macedonia."
 bfx_imro.1.a:0 "Sofia is with you!"
 bfx_imro.1.b:0 "The Balkans are burning again."
 bfx_imro.10.t:0 "Belgrade Lets Macedonia Go"
 bfx_imro.10.d:0 "Yugoslavia has given up. Its envoys sign a ceasefire in Kumanovo, and the Independent State of Macedonia stands on its own. In six months, they say, Skopje will decide its future."
 bfx_imro.10.a:0 "Long live free Macedonia!"
 bfx_imro.20.t:0 "The Uprising Is Crushed"
 bfx_imro.20.d:0 "The last bands have retreated into the Shar mountains. Skopje is Yugoslav again, the gallows are busy and the refugees are crossing into Bulgaria."
 bfx_imro.20.a:0 "Mourn the fallen."
 bfx_imro.20.b:0 "Next time."
 bfx_imro.30.t:0 "Skopje Asks for Union"
 bfx_imro.30.d:0 "The government of the Independent State of Macedonia has voted, unanimously and with great emotion, to unite with Bulgaria."
 bfx_imro.30.a:0 "Unite! One Bulgarian people."
 bfx_imro.30.b:0 "Better as a loyal client state."
 bfx_secret.1.t:0 "A Letter from Coburg"
 bfx_secret.1.d:0 "A thick envelope in a familiar hand, sealed with the old royal arms. Ferdinand, from exile, writes to the Palace about butterflies, the weather in Franconia and how a real Tsar would have handled Macedonia."
 bfx_secret.1.a:0 "File it with the others."
 bfx_secret.10.t:0 "The Return of Ferdinand"
 bfx_secret.10.d:0 "A special train from Coburg arrives at Sofia station: Ferdinand I, plumed, decorated and furious with everyone. He reminds the nation that he once nearly took Constantinople. By evening he is Tsar again."
 bfx_secret.10.a:0 "Long live Tsar Ferdinand!"
 bfx_secret.11.t:0 "Mass in Hagia Sophia"
 bfx_secret.11.d:0 "For the first time since 1453 the Divine Liturgy has been sung under the great dome, by a Bulgarian exarch, in the presence of Ferdinand of Saxe-Coburg, now styling himself Basileus of the Romans and Bulgars."
 bfx_secret.11.a:0 "Ferdinand has outdone himself."
 bfx_secret.11.b:0 "Is this really happening?"
 bfx_secret.12.t:0 "The Coronation at Tarnovo"
 bfx_secret.12.d:0 "Tsarevets hill is lit with torches and the bells of forty churches ring as Ferdinand is crowned Tsar of Bulgarians and Vlachs."
 bfx_secret.12.a:0 "Feast for three days."
 bfx_secret.12.b:0 "Coronation, then the front."
 bfx_flav.1.t:0 "The Rose Harvest at Kazanlak"
 bfx_flav.1.d:0 "Before dawn the women of the Valley pick the damask roses while the dew is still on them; it takes three thousand kilos of petals for one of attar."
 bfx_flav.1.a:0 "Sell it all to Paris."
 bfx_flav.1.b:0 "Hold the Rose Festival."
 bfx_flav.2.t:0 "Tobacco Strike in Plovdiv"
 bfx_flav.2.d:0 "Twenty thousand tobacco workers have downed tools over pay. The warehouses are full and the buyers are waiting."
 bfx_flav.2.a:0 "Meet their demands."
 bfx_flav.2.b:0 "Send in the Legionaries."
 bfx_flav.3.t:0 "The Tsar Drives the Train"
 bfx_flav.3.d:0 "The Sofia–Varna express arrived nine minutes early today. The driver, in overalls and goggles, was His Majesty Boris III."
 bfx_flav.3.a:0 "The people love it."
 bfx_flav.3.b:0 "Insist on the regular driver."
 bfx_flav.4.t:0 "The St Nedelya Anniversary"
 bfx_flav.4.d:0 "On 16 April 1925 a bomb in Sofia's St Nedelya Cathedral killed over a hundred and fifty people at a general's funeral. The anniversary divides the city."
 bfx_flav.4.a:0 "A solemn memorial."
 bfx_flav.4.b:0 "Hunt the last conspirators."
 bfx_flav.5.t:0 "Pilgrims to Rila"
 bfx_flav.5.d:0 "Thousands walk to the Rila Monastery for the feast of St Ivan. The monks offer bread, the abbot a sermon and the library manuscripts nobody has read in four hundred years."
 bfx_flav.5.a:0 "Join the pilgrimage."
 bfx_flav.5.b:0 "Fund the library."
