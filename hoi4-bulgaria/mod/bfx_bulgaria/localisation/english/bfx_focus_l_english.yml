l_english:
 bfx_bulgaria_focus:0 "Bulgaria: The Tsar's Balance"
 bfx_tsars_dilemma:0 "The Tsar's Dilemma"
 bfx_tsars_dilemma_desc:0 "May 1936. The Zveno colonels have been sent home, the parties are banned, and Tsar Boris III rules a kingdom that has lost two wars, a coastline and most of its army. He would rather be driving a locomotive. Instead he must decide what Bulgaria is for."
 bfx_velchev_trial:0 "The Velchev Trial"
 bfx_velchev_trial_desc:0 "Colonel Damyan Velchev, father of the 1934 coup, crossed back into Bulgaria to try it again and was promptly arrested. The court wants a death sentence. The Tsar wants an argument he can win."
 bfx_neuilly_ledger:0 "The Neuilly Ledger"
 bfx_neuilly_ledger_desc:0 "Article 65: twenty thousand men. Article 81: no air force. Article 83: no submarines. Someone in the War Ministry has kept a second ledger, listing everything the first one forbids, and where it is hidden."
 bfx_eternal_friendship:0 "Eternal Friendship with Belgrade"
 bfx_eternal_friendship_desc:0 "Nothing says eternal like a treaty signed in January 1937. Still, a pact with Yugoslavia cracks the Balkan Entente's ring around Sofia, and costs nothing but a few banquets."
 bfx_macedonian_question:0 "The Macedonian Question"
 bfx_macedonian_question_desc:0 "Ivan Mihaylov's IMRO runs Petrich like a private principality, taxes it like a state and settles disputes with revolvers. Every government in Sofia has had to decide whether IMRO is a weapon or a wound."
 bfx_kingdom_without_parties:0 "A Kingdom Without Parties"
 bfx_kingdom_without_parties_desc:0 "The parties are banned, the newspapers are polite and the ministers are chosen by the Palace. Boris calls it supra-party government. Everyone else calls it the Tsar's waiting room."
 bfx_war_ministry_cellars:0 "Cellars of the War Ministry"
 bfx_war_ministry_cellars_desc:0 "Rifles declared as agricultural implements, artillery listed as railway equipment, and a basement full of both."
 bfx_hidden_arsenals:0 "Hidden Arsenals"
 bfx_hidden_arsenals_desc:0 "Caves in the Rhodopes, monasteries with very large cellars and a railway siding that appears on no map. Weapons stored here do not rust and are not counted."
 bfx_kyoseivanov_cabinet:0 "The Kyoseivanov Cabinet"
 bfx_kyoseivanov_cabinet_desc:0 "A career diplomat as Prime Minister: Georgi Kyoseivanov smiles at Belgrade, bows to Athens and negotiates with everyone."
 bfx_crush_imro:0 "Crush IMRO"
 bfx_crush_imro_desc:0 "Send the gendarmes into Petrich, close the committees and give Belgrade the heads it keeps asking for. Rules out tolerating IMRO, and with it the Macedonian uprising."
 bfx_tolerate_imro:0 "Tolerate IMRO"
 bfx_tolerate_imro_desc:0 "Look the other way in Petrich. Mihaylov's men know every goat path into Vardar Macedonia. Unlocks the IMRO Uprising decisions; rules out crushing IMRO."
 bfx_elections_of_1938:0 "The Partyless Elections of 1938"
 bfx_elections_of_1938_desc:0 "Candidates may not belong to parties, which has not stopped any of them from belonging to parties."
 bfx_the_tsars_balance:0 "The Tsar's Balance"
 bfx_the_tsars_balance_desc:0 "Boris rules by playing the generals against the Legionaries, the Macedonians against the generals and everybody against the Communists. He might as well do it deliberately."
 bfx_tear_up_neuilly:0 "Tear Up Neuilly"
 bfx_tear_up_neuilly_desc:0 "Why ask permission? With enough rifles in the cellars, Bulgaria can simply announce that the treaty no longer applies and dare the Entente to march. Rules out the negotiated Salonika route."
 bfx_salonika_agreement:0 "The Salonika Agreement"
 bfx_salonika_agreement_desc:0 "July 1938, Thessaloniki: the Balkan Entente formally releases Bulgaria from the military clauses of Neuilly in exchange for a promise to behave. Rules out tearing the treaty up."
 bfx_italian_queen:0 "The Italian Queen"
 bfx_italian_queen_desc:0 "Boris married Giovanna of Savoy in 1930. Her father is King of Italy, which makes Rome the one great power with a reason to listen."
 bfx_shadow_legions:0 "The Shadow Parties"
 bfx_shadow_legions_desc:0 "Banned is not gone. Agrarians meet in taverns, Communists in cellars, Lukov's Legionaries and Tsankov's National Socialists in gymnasiums. The Legions grow fastest of all."
 bfx_royal_tour:0 "The Royal Tour"
 bfx_royal_tour_desc:0 "The Tsar visits every district by train, driving the engine himself for the last stretch into each station. Nothing does more for the Crown."
 bfx_hour_of_decision:0 "The Hour of Decision"
 bfx_hour_of_decision_desc:0 "The elections are counted and the shadow parties have shown their hands. Bulgaria picks a master: the Crown, or the Legions. Taking the Legionary path needs Legion influence of at least 40 in the Tsar's Balance."
 bfx_open_the_chancelleries:0 "Open the Chancelleries"
 bfx_open_the_chancelleries_desc:0 "A small kingdom with no alliances is a corridor. Bulgaria will sign pacts, give and ask guarantees and build alliances like everyone else. Unlocks the Diplomacy decisions and lifts the non-aligned limits on factions, guarantees and volunteers."
 bfx_tsar_steps_forward:0 "The Tsar Steps Forward"
 bfx_tsar_steps_forward_desc:0 "Boris stops pretending to be above politics and becomes politics. Rules out the Legionary path: there is only one throne and it is occupied."
 bfx_tsar_muzzle_the_league:0 "Muzzle the Military League"
 bfx_tsar_muzzle_the_league_desc:0 "Two coups in eleven years is two too many. The League's officers are posted to frontier garrisons and old General Zhekov is brought back to remind the army whom it serves."
 bfx_tsar_propaganda_directorate:0 "The Directorate of Propaganda"
 bfx_tsar_propaganda_directorate_desc:0 "A ministry for newsreels, posters and radio, all of them about the lost provinces."
 bfx_tsar_raindrops:0 "Walking Between the Raindrops"
 bfx_tsar_raindrops_desc:0 "Boris's own phrase: lean towards Berlin without falling over, take every province that is offered and promise nothing. Rules out the independent Balkan Hegemon."
 bfx_tsar_berlin_credits:0 "Arms Credits from Berlin"
 bfx_tsar_berlin_credits_desc:0 "Germany lends, Bulgaria buys German guns with German money, and both pretend this is trade."
 bfx_tsar_turkish_pact:0 "The Turkish Non-Aggression Pact"
 bfx_tsar_turkish_pact_desc:0 "February 1941: Sofia and Ankara promise not to attack each other, which frees the whole army for the west and south. Turkey is asked to sign."
 bfx_tsar_craiova:0 "Towards Craiova"
 bfx_tsar_craiova_desc:0 "In September 1940 Romania returned Southern Dobruja under German pressure. Bulgaria asks early, with Berlin's blessing. If Bucharest refuses, we get a war goal."
 bfx_tsar_sign_the_pact:0 "Sign the Tripartite Pact"
 bfx_tsar_sign_the_pact_desc:0 "March 1941, Vienna. Filov signs; Boris goes hunting so as not to be photographed. Germany is asked to admit Bulgaria; failing that, Sofia founds its own bloc."
 bfx_tsar_romes_blessing:0 "Rome's Blessing"
 bfx_tsar_romes_blessing_desc:0 "King Victor Emmanuel is the Tsar's father-in-law. Italy is asked for a formal guarantee of Bulgarian independence."
 bfx_tsar_dobrujan_settlers:0 "The Dobrujan Settlers"
 bfx_tsar_dobrujan_settlers_desc:0 "Refugees from 1913 go home to Silistra and Dobrich. Dobrudja becomes Bulgarian again, and quickly."
 bfx_tsar_axis_partition:0 "The Axis Partition"
 bfx_tsar_axis_partition_desc:0 "When Yugoslavia and Greece fall, the victors divide the spoils. Bulgaria takes what its allies hold in Macedonia and Thrace without firing a shot, as in April 1941. Whatever is not handed over, we take: a war goal on Macedonia if it is still foreign. Available once the Axis holds Macedonia or Thrace, or from April 1941. Unlocks Integration decisions."
 bfx_tsar_western_outlands:0 "The Western Outlands"
 bfx_tsar_western_outlands_desc:0 "Tsaribrod, Bosilegrad, Pirot, Vranje: Bulgarian towns and Bulgarian-speaking villages just across the Yugoslav border. Claims on every Yugoslav state that borders us."
 bfx_tsar_occupation_corps:0 "The Occupation Corps"
 bfx_tsar_occupation_corps_desc:0 "Gendarmes, schoolteachers and priests follow the army. New provinces need administrators more than they need garrisons."
 bfx_tsar_aegean_littoral:0 "The Aegean Littoral"
 bfx_tsar_aegean_littoral_desc:0 "Kavala, Drama, Xanthi: tobacco country and Bulgaria's window on the Aegean. Claims on Western Thrace and Central Macedonia; a war goal on Thrace if it is still Greek."
 bfx_tsar_bessarabian_bulgars:0 "The Bulgarians of Bessarabia"
 bfx_tsar_bessarabian_bulgars_desc:0 "Bolgrad and the Budjak have been Bulgarian-speaking since the 1820s. Claims on Bessarabia and Northern Dobruja."
 bfx_tsar_no_eastern_front:0 "Not One Soldier for the Steppe"
 bfx_tsar_no_eastern_front_desc:0 "Boris refused Hitler every time: Bulgarians would not fight Russians. Moscow is offered a non-aggression pact. Rules out the eastern crusade."
 bfx_tsar_crusade_east:0 "The Crusade in the East"
 bfx_tsar_crusade_east_desc:0 "The opposite choice: Bulgarian divisions cross the Danube with the Axis. Claims on the Ukrainian Black Sea coast. Rules out staying out of the eastern war."
 bfx_tsar_greater_bulgaria:0 "Greater Bulgaria"
 bfx_tsar_greater_bulgaria_desc:0 "Dobrudja, Macedonia, Thrace: the map in every classroom is now simply a map. Cores on all three where held; the state becomes Greater Bulgaria."
 bfx_tsar_straits_question:0 "The Straits Question"
 bfx_tsar_straits_question_desc:0 "Whoever holds Edirne and the Chataldzha line is a day's march from the Bosporus. Claims on Edirne and Istanbul and a war goal on their owner."
 bfx_tsar_three_seas:0 "Bulgaria on Three Seas"
 bfx_tsar_three_seas_desc:0 "Black Sea, Aegean and, through Ohrid and the Albanian passes, the Adriatic. Claims on Albania; cores on Central Macedonia once it is pacified."
 bfx_tsar_adrianople:0 "Return to Adrianople"
 bfx_tsar_adrianople_desc:0 "In March 1913 Bulgarian troops stormed Edirne. In 1913 they lost it again. Core on Edirne once held."
 bfx_tsar_san_stefano:0 "The Map of San Stefano"
 bfx_tsar_san_stefano_desc:0 "March 1878, restored. The state becomes San Stefano Bulgaria; every held, pacified state of the 1878 borders gains compliance."
 bfx_tsar_of_the_bulgarians:0 "Tsar of All the Bulgarians"
 bfx_tsar_of_the_bulgarians_desc:0 "Boris has done what Ferdinand failed to do twice. Every Bulgarian lives under the Bulgarian crown."
 bfx_tsar_stands_alone:0 "Bulgaria Stands Alone"
 bfx_tsar_stands_alone_desc:0 "No patron in Berlin, no master in London. Bulgaria will be the patron, and the neighbours its clients. Rules out the Axis route."
 bfx_tsar_sofia_pact:0 "The Sofia Pact"
 bfx_tsar_sofia_pact_desc:0 "A Bulgarian-led alliance of the Balkan revisionists. Founds a faction with Sofia at its head."
 bfx_tsar_soviet_pact:0 "The Sobolev Mission"
 bfx_tsar_soviet_pact_desc:0 "November 1940: Moscow offered Sofia a mutual-assistance pact. Boris said no. A hegemon says: a non-aggression pact, thank you, and keep your eyes on Romania."
 bfx_tsar_albanian_protectorate:0 "The Albanian Protectorate"
 bfx_tsar_albanian_protectorate_desc:0 "King Zog needs a protector who is not Mussolini. Albania is told that protection is available, and that refusal is not. A refusal gives us a war goal to make Albania our puppet."
 bfx_tsar_revisionist_brothers:0 "Revisionist Brothers in Budapest"
 bfx_tsar_revisionist_brothers_desc:0 "Hungary lost two-thirds of itself at Trianon; Bulgaria lost its coast at Neuilly. Budapest is invited into the Sofia Pact."
 bfx_tsar_hegemon_army:0 "The Hegemon's Army"
 bfx_tsar_hegemon_army_desc:0 "Twelve divisions, then twenty-four, each trained for a different neighbour."
 bfx_tsar_durres_concession:0 "The Durrës Concession"
 bfx_tsar_durres_concession_desc:0 "An Adriatic port for the Bulgarian navy, leased from a grateful Albanian protectorate."
 bfx_tsar_war_plan_west:0 "War Plan West: Yugoslavia"
 bfx_tsar_war_plan_west_desc:0 "A plan for the Morava valley and Skopje, drawn up in 1919 and revised every year since. War goal to conquer Yugoslavia."
 bfx_tsar_war_plan_south:0 "War Plan South: Greece"
 bfx_tsar_war_plan_south_desc:0 "Down the Struma to the sea. War goal to take Western Thrace and Central Macedonia from Greece. Unlocks Integration decisions."
 bfx_tsar_war_plan_north:0 "War Plan North: Romania"
 bfx_tsar_war_plan_north_desc:0 "Both Dobrujas, and a bridge across the Danube that stays Bulgarian. War goal on their owner."
 bfx_tsar_client_kings:0 "Client Kings"
 bfx_tsar_client_kings_desc:0 "Defeated neighbours keep their crowns and take their orders from Sofia. Cheaper puppets, cheaper annexations."
 bfx_tsar_war_plan_east:0 "War Plan East: Turkey"
 bfx_tsar_war_plan_east_desc:0 "Chataldzha in 1912 was a near thing. Edirne and the Straits, this time all the way. War goal on their owner."
 bfx_tsar_danube_line:0 "The Danube Line"
 bfx_tsar_danube_line_desc:0 "Concrete along the river from Vidin to Silistra: whatever happens in the south, the north holds."
 bfx_tsar_balkan_tsardom:0 "The Balkan Tsardom"
 bfx_tsar_balkan_tsardom_desc:0 "One crown over the peninsula's heart. Cores on Dobrudja, Macedonia, Thrace and Edirne where held; the state becomes the Tsardom of the Balkans."
 bfx_tsar_imperial_council:0 "The Imperial Council"
 bfx_tsar_imperial_council_desc:0 "Kimon Georgiev, the Zveno technocrat, is forgiven and given the provinces to run. Efficiency over ideology."
 bfx_tsar_black_sea_dominion:0 "Dominion of the Black Sea"
 bfx_tsar_black_sea_dominion_desc:0 "Varna, Burgas and Constanța: three ports, one fleet."
 bfx_tsar_master_of_the_peninsula:0 "Master of the Peninsula"
 bfx_tsar_master_of_the_peninsula_desc:0 "From the Danube to the Aegean, from the Adriatic to the Straits: one sovereign, and he drives his own train."
 bfx_fas_legions_march:0 "The Legions March"
 bfx_fas_legions_march_desc:0 "General Hristo Lukov's Union of Bulgarian National Legions fills Sofia with torches and green shirts. Requires Legion influence of 40 or more in the Tsar's Balance. Rules out the Tsar's own path."
 bfx_fas_legionary_state:0 "The Legionary State"
 bfx_fas_legionary_state_desc:0 "The Tsar reigns; the Legion rules. Ministries, schools and police answer to the movement."
 bfx_fas_legionary_militia:0 "The Legionary Militia"
 bfx_fas_legionary_militia_desc:0 "Party battalions guard bridges, hunt partisans and march very loudly."
 bfx_fas_brannik:0 "Found the Brannik"
 bfx_fas_brannik_desc:0 "The youth organisation of 1940, made compulsory. Every boy learns to march, shoot and sing."
 bfx_fas_into_the_axis:0 "Into the Axis"
 bfx_fas_into_the_axis_desc:0 "Lukov does not walk between raindrops; he walks into Berlin. Germany is asked to admit Bulgaria as a full ally; failing that, the Legion founds a Balkan Axis. Rules out Tsankov's independent Imperium."
 bfx_fas_anti_comintern:0 "The Anti-Comintern Bulwark"
 bfx_fas_anti_comintern_desc:0 "The red menace is the second most important thing in Bulgaria, after Macedonia."
 bfx_fas_german_instructors:0 "German Instructors"
 bfx_fas_german_instructors_desc:0 "Wehrmacht officers teach the army to fight the German way."
 bfx_fas_dobruja_ultimatum:0 "The Dobruja Ultimatum"
 bfx_fas_dobruja_ultimatum_desc:0 "Not a request: a deadline. The owner of Southern Dobruja is told to hand it over; refusal means war."
 bfx_fas_balkan_blitz:0 "The Balkan Blitz"
 bfx_fas_balkan_blitz_desc:0 "Panzers through the Struma valley, Legionaries through the Morava. War goals on Macedonia and Thrace."
 bfx_fas_axis_air_bases:0 "Axis Air Bases"
 bfx_fas_axis_air_bases_desc:0 "Luftwaffe squadrons at Plovdiv and Vrazhdebna, and Bulgarian pilots learning from them."
 bfx_fas_new_order:0 "The New Order in the Balkans"
 bfx_fas_new_order_desc:0 "Whatever the Axis holds in Macedonia and Thrace passes to Bulgarian administration. Unlocks Integration decisions."
 bfx_fas_total_mobilisation:0 "Total Mobilisation"
 bfx_fas_total_mobilisation_desc:0 "Every factory for the front, every family with someone in it."
 bfx_fas_crusade_east:0 "Crusade in the East"
 bfx_fas_crusade_east_desc:0 "Lukov sends the Legion where Boris never would: across the Danube against the Soviets."
 bfx_fas_legionary_bulgaria:0 "Legionary Greater Bulgaria"
 bfx_fas_legionary_bulgaria_desc:0 "Cores on Dobrudja, Macedonia and Thrace where held; the state is proclaimed the Legionary State of Greater Bulgaria."
 bfx_fas_budjak:0 "The Budjak Bulgarians"
 bfx_fas_budjak_desc:0 "Bolgrad's Bulgarians have waited a century. Claims on Bessarabia and Northern Dobruja."
 bfx_fas_odessa_corridor:0 "The Odessa Corridor"
 bfx_fas_odessa_corridor_desc:0 "A Bulgarian zone on the Black Sea's northern shore. Claims on the Ukrainian coast."
 bfx_fas_aegean_fleet:0 "The Aegean Fleet"
 bfx_fas_aegean_fleet_desc:0 "Kavala and Alexandroupolis become naval bases."
 bfx_fas_legionary_empire:0 "The Legionary Empire"
 bfx_fas_legionary_empire_desc:0 "From the Danube delta to the Aegean, under one movement."
 bfx_fas_thrace_to_bosporus:0 "Thrace to the Bosporus"
 bfx_fas_thrace_to_bosporus_desc:0 "Claims on Edirne and Istanbul and a war goal on their owner."
 bfx_fas_legion_of_st_george:0 "The Legion of St George"
 bfx_fas_legion_of_st_george_desc:0 "Veterans of every campaign, organised as a shock corps."
 bfx_fas_new_bulgarian_order:0 "The New Bulgarian Order"
 bfx_fas_new_bulgarian_order_desc:0 "The Legion's Bulgaria is complete: big, armed, loud and very tired."
 bfx_fas_national_social_state:0 "The National Social State"
 bfx_fas_national_social_state_desc:0 "Aleksandar Tsankov's movement merges with the Legion: corporations, discipline and no orders from abroad. Rules out joining the Axis."
 bfx_fas_corporatist_economy:0 "The Corporations"
 bfx_fas_corporatist_economy_desc:0 "One corporation per trade, one chairman per corporation."
 bfx_fas_pact_of_iron:0 "The Pact of Iron"
 bfx_fas_pact_of_iron_desc:0 "Revisionists of Europe, unite. A faction under Sofia; Hungary is invited."
 bfx_fas_imperium_army:0 "The Army of the Imperium"
 bfx_fas_imperium_army_desc:0 "Songs about Samuil, and a modern interest in artillery."
 bfx_fas_budapest_axis:0 "The Budapest-Sofia Axis"
 bfx_fas_budapest_axis_desc:0 "Two revisionists, one plan: Yugoslavia and Romania between them."
 bfx_fas_rival_to_rome:0 "A Rival to Rome"
 bfx_fas_rival_to_rome_desc:0 "Mussolini wants Albania; Tsankov wants it more. Claims on Albania and a war goal on it if independent."
 bfx_fas_war_for_macedonia:0 "The War for Macedonia"
 bfx_fas_war_for_macedonia_desc:0 "War goal to conquer Yugoslavia."
 bfx_fas_war_for_the_aegean:0 "The War for the Aegean"
 bfx_fas_war_for_the_aegean_desc:0 "War goal to conquer Greece. Unlocks Integration decisions."
 bfx_fas_adriatic_ambitions:0 "Adriatic Ambitions"
 bfx_fas_adriatic_ambitions_desc:0 "Claims on the Montenegrin coast and a port for the Imperium."
 bfx_fas_war_for_the_danube:0 "The War for the Danube"
 bfx_fas_war_for_the_danube_desc:0 "Both Dobrujas. War goal on their owner."
 bfx_fas_war_for_the_straits:0 "The War for the Straits"
 bfx_fas_war_for_the_straits_desc:0 "Edirne and Istanbul. War goal on their owner."
 bfx_fas_bulgarian_imperium:0 "The Bulgarian Imperium"
 bfx_fas_bulgarian_imperium_desc:0 "Cores on Dobrudja, Macedonia, Thrace and Edirne where held; the state becomes the Bulgarian Imperium."
 bfx_fas_settle_new_provinces:0 "Settle the New Provinces"
 bfx_fas_settle_new_provinces_desc:0 "Veterans' land grants, Bulgarian schools and very firm prefects."
 bfx_fas_imperial_navy:0 "The Imperial Navy"
 bfx_fas_imperial_navy_desc:0 "Two seas need two squadrons."
 bfx_fas_legions_of_the_imperium:0 "Legions of the Imperium"
 bfx_fas_legions_of_the_imperium_desc:0 "Divisions recruited from every province of the new state."
 bfx_fas_mediterranean_window:0 "A Window on the Mediterranean"
 bfx_fas_mediterranean_window_desc:0 "Claims on the Aegean islands; from Kavala to Rhodes is only a short sail."
 bfx_fas_tsardom_of_three_seas:0 "The Imperium on Three Seas"
 bfx_fas_tsardom_of_three_seas_desc:0 "Black Sea, Aegean, Adriatic. Tsankov's dream, Lukov's army."
 bfx_alt_old_fox_stirs:0 "The Old Fox Returns"
 bfx_alt_old_fox_stirs_desc:0 "SECRET PATH. Ferdinand I, deposed 1918, botanist, entomologist and collector of grudges, comes back from Coburg. Revealed when Tsar Boris dies, or when all three Coburg letters have arrived."
 bfx_alt_burn_the_treaty:0 "Burn the Treaty on the Steps of Neuilly"
 bfx_alt_burn_the_treaty_desc:0 "Ferdinand signed the defeat of 1913 and abdicated after 1918. He has waited twenty years to set fire to the paperwork."
 bfx_alt_entomologist_tsar:0 "The Entomologist Tsar"
 bfx_alt_entomologist_tsar_desc:0 "Ferdinand has a butterfly named after him. His Royal Natural History Institute will now also study artillery."
 bfx_alt_imperial_life_guard:0 "The Imperial Life Guard"
 bfx_alt_imperial_life_guard_desc:0 "White tunics, astrakhan caps, egret plumes and live ammunition."
 bfx_alt_coburg_capital:0 "Coburg Capital"
 bfx_alt_coburg_capital_desc:0 "The Saxe-Coburg cousins own half the thrones of Europe and a fair share of its factories."
 bfx_alt_third_empire:0 "Proclaim the Third Bulgarian Empire"
 bfx_alt_third_empire_desc:0 "After Asparuh's khanate and the Asens' empire, the third one. Rules out the Roman pretension."
 bfx_alt_simeons_borders:0 "The Borders of Simeon the Great"
 bfx_alt_simeons_borders_desc:0 "In 917 Simeon's empire touched three seas. Claims on Yugoslavia and Albania."
 bfx_alt_tsar_of_the_vlachs:0 "Tsar of Bulgarians and Vlachs"
 bfx_alt_tsar_of_the_vlachs_desc:0 "Kaloyan used the title in 1204. War goal on Romania; claims on its core lands."
 bfx_alt_restore_preslav:0 "Restore Preslav"
 bfx_alt_restore_preslav_desc:0 "The golden capital of Simeon rises from its ruins, at least as a cathedral and a parade ground."
 bfx_alt_coronation_at_tarnovo:0 "Coronation at Tarnovo"
 bfx_alt_coronation_at_tarnovo_desc:0 "Tsarevets hill, forty church bells, and a short lecture on butterflies."
 bfx_alt_kaloyans_revenge:0 "Kaloyan's Revenge"
 bfx_alt_kaloyans_revenge_desc:0 "Kaloyan died besieging Thessaloniki in 1207. His heir finishes the siege. War goal on Central Macedonia's owner."
 bfx_alt_empire_of_the_bulgars:0 "Empire of the Bulgars"
 bfx_alt_empire_of_the_bulgars_desc:0 "The third empire stands: proclaimed, crowned and, most remarkably, still solvent."
 bfx_alt_tsargrad:0 "Tsargrad!"
 bfx_alt_tsargrad_desc:0 "Simeon besieged it, Krum nearly took it, and in 1912 Bulgarian guns could be heard in Pera. Rules out the purely Bulgarian empire."
 bfx_alt_basileus:0 "Basileus of the Romans and Bulgars"
 bfx_alt_basileus_desc:0 "Simeon demanded the title in 913. Ferdinand has it printed on the stationery. Claims on all Greek core lands."
 bfx_alt_hagia_sophia:0 "Mass in Hagia Sophia"
 bfx_alt_hagia_sophia_desc:0 "The first Orthodox liturgy under the great dome since 1453. Cores on Istanbul and Edirne; the realm becomes the Empire of the Romans and Bulgars."
 bfx_alt_restore_the_themes:0 "Restore the Themes"
 bfx_alt_restore_the_themes_desc:0 "Thrakesion, Opsikion, Anatolikon: the old military provinces return with Bulgarian governors. Claims on Anatolia."
 bfx_alt_varangian_guard:0 "The New Varangian Guard"
 bfx_alt_varangian_guard_desc:0 "Every Basileus needs foreign bodyguards with axes. Ferdinand recruits Germans with machine guns."
 bfx_alt_orthodox_crusade:0 "The Orthodox Crusade"
 bfx_alt_orthodox_crusade_desc:0 "Claims on the Aegean islands and Crete, and a war goal on Greece."
 bfx_alt_new_rome:0 "New Rome"
 bfx_alt_new_rome_desc:0 "The capital moves to the City. Sofia keeps the ministries; Constantinople keeps the Emperor."
 bfx_eco_rose_and_leaf:0 "The Rose and the Leaf"
 bfx_eco_rose_and_leaf_desc:0 "Oriental tobacco from Plovdiv and rose oil from Kazanlak pay for almost everything Bulgaria imports. Two crops, one economy."
 bfx_eco_german_clearing:0 "The German Clearing Account"
 bfx_eco_german_clearing_desc:0 "Germany buys the whole crop, paid into a Berlin account that can only be spent in Germany. Strong, fast gains that tie the economy to Berlin. Rules out diversification."
 bfx_eco_diversify:0 "Diversify the Buyers"
 bfx_eco_diversify_desc:0 "Sell to Britain, France, Czechoslovakia and anyone with hard currency. Slower, but nobody holds the purse strings. Rules out the German clearing."
 bfx_eco_pernik_coal:0 "Pernik Coal"
 bfx_eco_pernik_coal_desc:0 "The mines of Pernik heat Sofia, fuel the railways and feed the state steelworks."
 bfx_eco_bdz:0 "Modernise the BDŽ"
 bfx_eco_bdz_desc:0 "The State Railways run on single track and the Tsar's enthusiasm. Every state gets better roads and rails."
 bfx_eco_sofia_university:0 "Sofia University Institutes"
 bfx_eco_sofia_university_desc:0 "Laboratories, scholarships and a new physics building."
 bfx_eco_tobacco_boom:0 "The Plovdiv Tobacco Boom"
 bfx_eco_tobacco_boom_desc:0 "Warehouses the size of cathedrals and a tobacco workers' union with opinions."
 bfx_eco_balkan_iron:0 "Iron from the Balkan Range"
 bfx_eco_balkan_iron_desc:0 "Poor ore near Kremikovtsi, but ours."
 bfx_eco_electrification:0 "Electrify the Plain"
 bfx_eco_electrification_desc:0 "Power lines across Thrace. Factories that ran on daylight run on shifts."
 bfx_eco_main_line:0 "The Sofia–Varna Main Line"
 bfx_eco_main_line_desc:0 "Double track from the capital to the sea."
 bfx_eco_nadjakov_laboratory:0 "Nadjakov's Laboratory"
 bfx_eco_nadjakov_laboratory_desc:0 "In 1937 Georgi Nadjakov discovered the photoelectret effect in Sofia. Give him a proper laboratory."
 bfx_eco_valley_of_roses:0 "The Valley of Roses"
 bfx_eco_valley_of_roses_desc:0 "Kazanlak supplies most of the world's attar of roses. Paris pays in gold."
 bfx_eco_kremikovtsi_steel:0 "The Kremikovtsi Steelworks"
 bfx_eco_kremikovtsi_steel_desc:0 "Twenty years before the real one, and twice as smoky."
 bfx_eco_iskar_dams:0 "Dams on the Iskar"
 bfx_eco_iskar_dams_desc:0 "Hydroelectric power from the gorge through the Balkan range."
 bfx_eco_danube_ports:0 "The Danube Ports"
 bfx_eco_danube_ports_desc:0 "Ruse, Svishtov and Lom: river ports for the barges of Central Europe."
 bfx_eco_black_sea_ports:0 "Ports of Varna and Burgas"
 bfx_eco_black_sea_ports_desc:0 "Deepen the harbours and add the slipways a navy will want."
 bfx_eco_bukhovo_uranium:0 "The Bukhovo Deposits"
 bfx_eco_bukhovo_uranium_desc:0 "Geologists have found uranium ore at Bukhovo, near Sofia. After 1945 the Soviets mined it for their own bomb. It could be ours first."
 bfx_eco_hard_currency:0 "Hard Currency for Machines"
 bfx_eco_hard_currency_desc:0 "Rose gold and tobacco marks buy lathes from Pilsen and turbines from Zurich."
 bfx_eco_kazanlak_arsenal:0 "The Kazanlak Arsenal"
 bfx_eco_kazanlak_arsenal_desc:0 "The State Military Factory has made shells and pretended to make tractors since 1924. It can stop pretending."
 bfx_eco_sopot_works:0 "The Sopot Rifle Works"
 bfx_eco_sopot_works_desc:0 "A rifle works in the Valley of Roses, out of reach of any bomber's map."
 bfx_eco_hydro_grid:0 "The National Grid"
 bfx_eco_hydro_grid_desc:0 "One grid from Vidin to Burgas, fed by the Iskar and the Arda."
 bfx_eco_labour_brigades:0 "The Labour Service Brigades"
 bfx_eco_labour_brigades_desc:0 "Stamboliyski's compulsory labour service: young men with shovels build roads, dams and, quietly, earthworks."
 bfx_eco_atomic_commission:0 "The Atomic Commission"
 bfx_eco_atomic_commission_desc:0 "A committee, a budget, a guard at the door and a very short list of visitors."
 bfx_eco_ledger_of_trade:0 "The Ledger of Trade"
 bfx_eco_ledger_of_trade_desc:0 "Settle accounts: break free of Berlin, bind tighter, or open the books to the world."
 bfx_eco_state_arsenals:0 "The State Arsenals"
 bfx_eco_state_arsenals_desc:0 "Kazanlak, Sopot and Bozhurishte under one directorate."
 bfx_eco_chemical_combine:0 "The Chemical Combine"
 bfx_eco_chemical_combine_desc:0 "Fertiliser in peacetime, explosives in war, and a smell over Stara Zagora that never quite leaves."
 bfx_eco_road_network:0 "The Trans-Balkan Roads"
 bfx_eco_road_network_desc:0 "Paved passes through Shipka, Petrohan and the Rhodopes."
 bfx_eco_reactor_project:0 "The Reactor Project"
 bfx_eco_reactor_project_desc:0 "Graphite, uranium and a great deal of optimism in a valley outside Sofia."
 bfx_eco_plovdiv_fair:0 "The Plovdiv International Fair"
 bfx_eco_plovdiv_fair_desc:0 "Every September the world's salesmen come to Plovdiv. This year they bring patents."
 bfx_eco_export_drive:0 "The Export Drive"
 bfx_eco_export_drive_desc:0 "Tobacco, roses, grain, wine and more tobacco: everything that sells, sold."
 bfx_eco_war_economy:0 "The War Economy"
 bfx_eco_war_economy_desc:0 "Quotas, ration cards and a War Production Board run by men who used to sell tobacco."
 bfx_eco_tyulenovo_oil:0 "Petroleum at Tyulenovo"
 bfx_eco_tyulenovo_oil_desc:0 "There is oil on the Dobrujan coast, found for real in 1951. If we hold Dobrudja we find it now; if not, coal becomes fuel the hard way."
 bfx_eco_synthetic_fuel:0 "Synthetic Fuel from Lignite"
 bfx_eco_synthetic_fuel_desc:0 "Bulgarian lignite is poor coal but good enough to cook into petrol."
 bfx_eco_kozloduy_reactor:0 "The Kozloduy Pile"
 bfx_eco_kozloduy_reactor_desc:0 "A reactor on the Danube, thirty years before the real Kozloduy."
 bfx_eco_national_bank:0 "Reform the National Bank"
 bfx_eco_national_bank_desc:0 "Stabilise the lev, consolidate the debts and print enough money to pay for all this, but not too much."
 bfx_eco_industrial_ring:0 "The Sofia Industrial Ring"
 bfx_eco_industrial_ring_desc:0 "Tram works, textile mills and assembly halls around the capital."
 bfx_eco_dispersed_industry:0 "Dispersed Industry"
 bfx_eco_dispersed_industry_desc:0 "Workshops in the valleys, depots in the caves."
 bfx_eco_fuel_reserves:0 "Strategic Fuel Reserves"
 bfx_eco_fuel_reserves_desc:0 "Tanks under the hills of Burgas for a war that will not wait for tankers."
 bfx_eco_rila_device:0 "The Rila Device"
 bfx_eco_rila_device_desc:0 "A bomb assembled in a monastery workshop under the Rila peaks. Nobody believes Bulgaria could build one. That is the point."
 bfx_eco_academy_of_sciences:0 "The Academy of Sciences"
 bfx_eco_academy_of_sciences_desc:0 "The Academy's institutes stop arguing about Old Church Slavonic long enough to study ballistics."
 bfx_eco_total_war_production:0 "Total War Production"
 bfx_eco_total_war_production_desc:0 "Every lathe in the kingdom turned to the war."
 bfx_mil_neuilly_army:0 "The Army Neuilly Built"
 bfx_mil_neuilly_army_desc:0 "Twenty thousand volunteers, no conscripts, no tanks, no planes and one very bored General Staff."
 bfx_mil_rhodope_rangers:0 "Rhodope Rangers"
 bfx_mil_rhodope_rangers_desc:0 "Mountain troops trained on Musala, Vihren and smugglers' paths."
 bfx_mil_chataldzha_lessons:0 "Lessons of Chataldzha"
 bfx_mil_chataldzha_lessons_desc:0 "1912: the army charged entrenched Turks and lost a generation in an afternoon."
 bfx_mil_mountain_doctrine:0 "Balkan Mountain Doctrine"
 bfx_mil_mountain_doctrine_desc:0 "Hold the passes, move along the ridges."
 bfx_mil_staff_academy:0 "The General Staff Academy"
 bfx_mil_staff_academy_desc:0 "Officers who can tell a staff map from a tobacco ledger. General Lukash takes the Chief of Staff's chair."
 bfx_mil_mountain_brigades:0 "The Mountain Brigades"
 bfx_mil_mountain_brigades_desc:0 "Mule companies, pack artillery and radio sets that weigh less than a goat."
 bfx_mil_bayonet_tradition:0 "The Bayonet Tradition"
 bfx_mil_bayonet_tradition_desc:0 "Lozengrad, Bulair, Doiran: the infantry's reputation was made at bayonet point."
 bfx_mil_balkan_war_plan:0 "The Balkan War Plan"
 bfx_mil_balkan_war_plan_desc:0 "Five fronts, one army. The staff has planned for every neighbour, one at a time."
 bfx_mil_officer_corps:0 "Expand the Officer Corps"
 bfx_mil_officer_corps_desc:0 "Reserve officers' schools in every garrison town."
 bfx_mil_combined_arms:0 "Combined Arms"
 bfx_mil_combined_arms_desc:0 "Infantry, guns and the first tanks, trained to fight together."
 bfx_mil_royal_guard:0 "The Royal Guard Division"
 bfx_mil_royal_guard_desc:0 "The Tsar's Guard, expanded into a full division and given the best of everything."
 bfx_mil_armoured_brigade:0 "The Armoured Brigade"
 bfx_mil_armoured_brigade_desc:0 "Czech tanks in 1940, German ones in 1943: Bulgaria's first armoured brigade."
 bfx_mil_mountain_blitz:0 "Blitzkrieg in the Mountains"
 bfx_mil_mountain_blitz_desc:0 "Tanks on the valley roads, rangers on the ridges."
 bfx_mil_small_arms:0 "Small Arms Standardisation"
 bfx_mil_small_arms_desc:0 "Mannlichers, Mausers, Berthiers and Mosins: four calibres is three too many."
 bfx_mil_mountain_guns:0 "Mountain Guns"
 bfx_mil_mountain_guns_desc:0 "Skoda pack howitzers that break down onto four mules."
 bfx_mil_machine_guns:0 "The Machine-Gun Companies"
 bfx_mil_machine_guns_desc:0 "A machine-gun company per battalion."
 bfx_mil_rifle_contracts:0 "The Mauser Contracts"
 bfx_mil_rifle_contracts_desc:0 "Rifles from Oberndorf, paid in tobacco."
 bfx_mil_anti_tank:0 "Anti-Tank Companies"
 bfx_mil_anti_tank_desc:0 "Every neighbour will have tanks. The infantry must be able to stop them."
 bfx_mil_field_artillery:0 "The Field Artillery Regiments"
 bfx_mil_field_artillery_desc:0 "One regiment per division, horse-drawn but punctual."
 bfx_mil_support_companies:0 "Support Companies"
 bfx_mil_support_companies_desc:0 "Engineers, signals and recon for every division."
 bfx_mil_supply_columns:0 "The Supply Columns"
 bfx_mil_supply_columns_desc:0 "Trucks, carts and mules, all numbered and all accounted for."
 bfx_mil_reservists:0 "The Reservist Associations"
 bfx_mil_reservists_desc:0 "Veterans' clubs keep rifles oiled and records current."
 bfx_mil_macedonian_emigration:0 "Volunteers of the Emigration"
 bfx_mil_macedonian_emigration_desc:0 "Half a million Macedonian refugees live in Bulgaria. Their sons volunteer."
 bfx_mil_pomak_battalions:0 "The Rhodope Battalions"
 bfx_mil_pomak_battalions_desc:0 "Mountain villagers who know every path in the Rhodopes."
 bfx_mil_veterans_1912:0 "Veterans of the Balkan Wars"
 bfx_mil_veterans_1912_desc:0 "The sergeants of Lozengrad train their grandsons."
 bfx_mil_womens_auxiliary:0 "The Women's Auxiliary"
 bfx_mil_womens_auxiliary_desc:0 "Nurses, signallers and munitions workers."
 bfx_mil_universal_service:0 "Universal Service, Openly"
 bfx_mil_universal_service_desc:0 "Conscription returns, legally and on the front page. Only possible once the military clauses of Neuilly are gone."
 bfx_mil_mobilisation_law:0 "The Mobilisation Law"
 bfx_mil_mobilisation_law_desc:0 "Every man knows his depot, his unit and his train."
 bfx_mil_training_camps:0 "Training Camps in the Rhodopes"
 bfx_mil_training_camps_desc:0 "Six weeks of mountain marches, then the front."
 bfx_mil_national_army:0 "The National Army"
 bfx_mil_national_army_desc:0 "Universal service, regional depots, standing reserves: the army Neuilly forbade, built in full."
 bfx_nav_black_sea_flotilla:0 "The Black Sea Flotilla"
 bfx_nav_black_sea_flotilla_desc:0 "Four torpedo boats and some police launches. The commander has been told to think big."
 bfx_nav_varna_naval_school:0 "The Varna Naval School"
 bfx_nav_varna_naval_school_desc:0 "Officers for a navy that does not yet exist."
 bfx_nav_danube_flotilla:0 "The Danube Flotilla"
 bfx_nav_danube_flotilla_desc:0 "River monitors and patrol boats from Vidin to Silistra."
 bfx_nav_torpedo_squadrons:0 "Torpedo Boat Squadrons"
 bfx_nav_torpedo_squadrons_desc:0 "Small, fast and cheap: the only naval doctrine a poor Black Sea power can afford."
 bfx_nav_minelayers:0 "The Varna Minefields"
 bfx_nav_minelayers_desc:0 "If Bulgaria cannot sink a battleship with guns, a mine will do."
 bfx_nav_coastal_batteries:0 "Coastal Batteries at Galata"
 bfx_nav_coastal_batteries_desc:0 "Guns on the cliffs above Varna and Burgas."
 bfx_nav_naval_aviation:0 "Naval Aviation"
 bfx_nav_naval_aviation_desc:0 "Seaplanes from Varna to watch the approaches."
 bfx_nav_black_sea_raiders:0 "Black Sea Raiders"
 bfx_nav_black_sea_raiders_desc:0 "Small boats, long nights and big torpedoes."
 bfx_nav_submarine_flotilla:0 "The Submarine Flotilla"
 bfx_nav_submarine_flotilla_desc:0 "Article 83 forbade submarines. Article 83 is no longer read."
 bfx_nav_destroyer_squadron:0 "The Destroyer Squadron"
 bfx_nav_destroyer_squadron_desc:0 "Four modern destroyers ordered abroad: the Black Sea's smallest real navy."
 bfx_air_aero_clubs:0 "Aero Clubs and Gliders"
 bfx_air_aero_clubs_desc:0 "Neuilly banned military aviation; nobody banned enthusiastic young men with gliders."
 bfx_air_dar_works:0 "The DAR Works at Bozhurishte"
 bfx_air_dar_works_desc:0 "The State Aircraft Workshops build trainers and things that are definitely not reconnaissance aircraft."
 bfx_air_polish_fighters:0 "PZL Fighters from Warsaw"
 bfx_air_polish_fighters_desc:0 "In 1937 Bulgaria bought Polish PZL P.24 fighters. A real air force needs real fighters."
 bfx_air_avia_biplanes:0 "Avia Biplanes from Prague"
 bfx_air_avia_biplanes_desc:0 "Czech Avia B-534s, the best biplanes in Europe, bought cheaply in 1939."
 bfx_air_foreign_instructors:0 "Foreign Instructors"
 bfx_air_foreign_instructors_desc:0 "Germans, Italians and Poles teach formation flying."
 bfx_air_vazdushni_voyski:0 "Proclaim the Vazdushni Voyski"
 bfx_air_vazdushni_voyski_desc:0 "His Majesty's Air Force exists, officially. Only possible once the military clauses of Neuilly are gone."
 bfx_air_fighter_regiment:0 "The Fighter Regiment"
 bfx_air_fighter_regiment_desc:0 "Defend Sofia's skies."
 bfx_air_dornier_bombers:0 "Dornier Bombers"
 bfx_air_dornier_bombers_desc:0 "Do 17s from Germany, the first Bulgarian bombers since 1918."
 bfx_air_sofia_flak:0 "Flak over Sofia"
 bfx_air_sofia_flak_desc:0 "Guns on the hills around the capital."
 bfx_air_wings_over_mountains:0 "Wings over the Mountains"
 bfx_air_wings_over_mountains_desc:0 "Close air support where artillery cannot follow."
 bfx_air_paratroopers:0 "The Parachute Battalion"
 bfx_air_paratroopers_desc:0 "Bulgaria's paratroopers, formed in 1943, jump into the mountains behind the enemy."
