l_english:
 bfx_bulgaria_focus:0 "Bulgaria: Shackles of Neuilly"
 bfx_tsars_dilemma:0 "The Tsar's Dilemma"
 bfx_tsars_dilemma_desc:0 "May 1936. The colonels of Zveno have been sent home, the parties are banned, and Tsar Boris III rules a kingdom that has lost two wars, a coastline and most of its army. He would rather be driving a locomotive. Instead he must decide what Bulgaria is for."
 bfx_velchev_trial:0 "The Velchev Trial"
 bfx_velchev_trial_desc:0 "Colonel Damyan Velchev, father of the 1934 coup, crossed back into Bulgaria to try it again and was promptly arrested. The court wants a death sentence. The Tsar wants an argument he can win."
 bfx_neuilly_ledger:0 "The Neuilly Ledger"
 bfx_neuilly_ledger_desc:0 "Article 65: twenty thousand men. Article 81: no air force. Article 83: no submarines. Someone in the War Ministry has kept a second ledger, listing everything the first one forbids, and where it is hidden."
 bfx_eternal_friendship:0 "Eternal Friendship with Belgrade"
 bfx_eternal_friendship_desc:0 "Nothing says eternal like a treaty signed in January 1937. Still, a pact with Yugoslavia cracks the Balkan Entente's ring around Sofia, and costs nothing but a few banquets."
 bfx_macedonian_question:0 "The Macedonian Question"
 bfx_macedonian_question_desc:0 "Ivan Mihaylov's IMRO runs Petrich like a private principality, taxes it like a state and settles disputes with revolvers. Every government in Sofia has had to decide whether IMRO is a weapon or a wound."
 bfx_kingdom_without_parties:0 "A Kingdom Without Parties"
 bfx_kingdom_without_parties_desc:0 "The parties are banned, the newspapers are polite and the ministers are chosen by the Palace. Boris calls it supra-party government. Everyone else calls it the Tsar's waiting room."
 bfx_war_ministry_cellars:0 "Cellars of the War Ministry"
 bfx_war_ministry_cellars_desc:0 "Rifles declared as agricultural implements, artillery listed as railway equipment, and a basement full of both. The Inter-Allied inspectors went home in 1927; the cellars stayed."
 bfx_kyoseivanov_cabinet:0 "The Kyoseivanov Cabinet"
 bfx_kyoseivanov_cabinet_desc:0 "A career diplomat as Prime Minister: Georgi Kyoseivanov smiles at Belgrade, bows to Athens and negotiates with everyone. He is exactly the man to talk a treaty to death."
 bfx_crush_imro:0 "Crush IMRO"
 bfx_crush_imro_desc:0 "Send the gendarmes into Petrich, close the Macedonian committees and give Belgrade the heads it keeps asking for. Choosing this ends the Tsardom's ability to use IMRO as a weapon: you cannot also tolerate it."
 bfx_tolerate_imro:0 "Tolerate IMRO"
 bfx_tolerate_imro_desc:0 "Look the other way in Petrich. Mihaylov's men know every goat path into Vardar Macedonia, and one day the Tsardom may want to walk them. Choosing this rules out crushing IMRO, and the neighbours will notice."
 bfx_elections_of_1938:0 "The Partyless Elections of 1938"
 bfx_elections_of_1938_desc:0 "Candidates may not belong to parties, which has not stopped any of them from belonging to parties. The Tsar must decide how honest the count should be."
 bfx_salonika_agreement:0 "The Salonika Agreement"
 bfx_salonika_agreement_desc:0 "July 1938, Thessaloniki: the Balkan Entente formally releases Bulgaria from the military clauses of Neuilly in exchange for a promise to behave. It is the negotiated way out of the Shackles, and it rules out tearing the treaty up."
 bfx_tear_up_neuilly:0 "Tear Up Neuilly"
 bfx_tear_up_neuilly_desc:0 "Why ask permission? With enough rifles in the cellars, Bulgaria can simply announce that the treaty no longer applies and dare the Entente to march. Suspicion jumps to the maximum and the border crisis follows. Rules out the negotiated Salonika route."
 bfx_shadow_parties:0 "The Shadow Parties"
 bfx_shadow_parties_desc:0 "Banned is not gone. The Agrarians meet in taverns, the Communists in cellars, Zveno in officers' messes and the Legionaries in gymnasiums. Each has a plan for Bulgaria and a list of who will hang first."
 bfx_hour_of_decision:0 "The Hour of Decision"
 bfx_hour_of_decision_desc:0 "The elections are counted and the shadow parties have shown their hands. From here Bulgaria picks a master: the Crown, the Workers' Party or the alliance of Agrarians and officers."
 bfx_tsar_steps_forward:0 "The Tsar Steps Forward"
 bfx_tsar_steps_forward_desc:0 "Boris stops pretending to be above politics and becomes politics. Mutually exclusive with the Communist and Agrarian/Zveno paths: there is only one throne and it is occupied."
 bfx_tsar_muzzle_the_league:0 "Muzzle the Military League"
 bfx_tsar_muzzle_the_league_desc:0 "Two coups in eleven years is two too many. The League's officers are posted to frontier garrisons, its newspapers closed, and old General Zhekov is brought back to remind the army whom it serves."
 bfx_tsar_san_stefano_dream:0 "The San Stefano Dream"
 bfx_tsar_san_stefano_dream_desc:0 "For four months in 1878 Bulgaria stretched from the Danube to the Aegean and from the Black Sea to Ohrid. Every schoolchild has the map. Choosing revanchism rules out armed neutrality and the Coburg restoration."
 bfx_tsar_filov_cabinet:0 "The Filov Cabinet"
 bfx_tsar_filov_cabinet_desc:0 "An archaeologist who has spent his life digging up Thracian gold now digs up the case for a German alliance. Professor Filov is polite, learned and absolutely certain Berlin will win."
 bfx_tsar_southern_dobruja:0 "Southern Dobruja"
 bfx_tsar_southern_dobruja_desc:0 "Romania took the Quadrilateral in 1913 and has never been sure what to do with it. Bucharest may be persuaded to return it, especially if Berlin asks nicely."
 bfx_tsar_seek_the_pact:0 "Seek the Tripartite Pact"
 bfx_tsar_seek_the_pact_desc:0 "Boris called it walking between raindrops. Filov calls it inevitable. Bulgaria asks to join the Axis, or, failing that, builds its own small one."
 bfx_tsar_vardar_macedonia:0 "Liberate Vardar Macedonia"
 bfx_tsar_vardar_macedonia_desc:0 "Ohrid, Bitola, Skopje: the heartland of the Exarchate and of IMRO's dreams. With the Axis at our back it is time to collect."
 bfx_tsar_aegean_outlet:0 "An Outlet to the Aegean"
 bfx_tsar_aegean_outlet_desc:0 "Neuilly took Western Thrace and with it the sea. A Bulgaria that can only reach the Mediterranean through the Bosporus is a Bulgaria held by the throat."
 bfx_tsar_san_stefano_restored:0 "San Stefano Restored"
 bfx_tsar_san_stefano_restored_desc:0 "The map in every classroom is now simply a map. Cores on Dobrudja, Macedonia and Thrace wherever the Tsar's flag flies."
 bfx_tsar_three_seas:0 "Bulgaria on Three Seas"
 bfx_tsar_three_seas_desc:0 "Black Sea, Aegean, Adriatic. Tsar Samuil managed it in 997 and so can Boris. Claims on Albania, Montenegro and Central Macedonia; cores on any of them already held; the state is renamed Greater Bulgaria."
 bfx_tsar_balkan_switzerland:0 "The Balkan Switzerland"
 bfx_tsar_balkan_switzerland_desc:0 "Mountains, banks, a king who likes trains: the resemblance is obvious if one squints. Armed neutrality keeps Bulgaria out of everyone's war. Rules out revanchism and the Coburg restoration."
 bfx_tsar_armed_neutrality:0 "The Armed Neutrality Doctrine"
 bfx_tsar_armed_neutrality_desc:0 "A neutral nobody fears is merely a corridor. Concrete goes into every border pass from the Iron Gates to the Rhodopes."
 bfx_tsar_court_the_entente:0 "Court the Balkan Entente"
 bfx_tsar_court_the_entente_desc:0 "If Athens, Belgrade, Ankara and Bucharest are going to watch Bulgaria anyway, they may as well watch it from across a dinner table."
 bfx_tsar_city_loans:0 "Loans from the City"
 bfx_tsar_city_loans_desc:0 "London bankers lend to neutrals who pay their coupons. Bulgaria has always paid its coupons, mostly in tobacco."
 bfx_tsar_balkan_concord:0 "The Balkan Concord"
 bfx_tsar_balkan_concord_desc:0 "Replace the Entente that was built to contain Bulgaria with a Concord that Bulgaria chairs. Members are invited; nobody is coerced, at least not yet."
 bfx_tsar_guardian_of_straits:0 "Guardian of the Straits"
 bfx_tsar_guardian_of_straits_desc:0 "Whoever holds the Bosporus holds the Black Sea's door. Bulgaria cannot hold it, but it can make itself the doorman everyone must tip."
 bfx_tsar_allied_alignment:0 "Lean towards London"
 bfx_tsar_allied_alignment_desc:0 "Neutral, but neutral in a particular direction. Ask the British for a guarantee and their protection. Rules out the Third Way, and cannot be taken while the German clearing trade binds the economy."
 bfx_tsar_third_way:0 "The Third Way"
 bfx_tsar_third_way_desc:0 "Neither Berlin's client nor London's. Bulgaria's neutrality is its own and so are its scientists. Rules out leaning towards London."
 bfx_tsar_danubian_confederation:0 "The Danubian-Balkan Confederation"
 bfx_tsar_danubian_confederation_desc:0 "Switzerland has cantons; Bulgaria will have nations. Every member of our faction is offered full union under the Bulgarian Crown, with cores for all who accept. Smaller and friendlier states say yes more often."
 bfx_alt_old_fox_stirs:0 "The Old Fox Stirs in Coburg"
 bfx_alt_old_fox_stirs_desc:0 "Ferdinand I, deposed 1918, botanist, entomologist, collector of titles and grudges, reads the Sofia papers in Coburg and decides his son is too timid. Requires the cellars to be bursting (Covert Rearmament 80+, or the treaty torn up) and a hungry public (war support 50%+). Rules out Boris's own two paths."
 bfx_alt_burn_the_treaty:0 "Burn the Treaty on the Steps of Neuilly"
 bfx_alt_burn_the_treaty_desc:0 "Ferdinand signed the defeat of 1913 and abdicated after the defeat of 1918. He has waited twenty years to set fire to the paperwork."
 bfx_alt_entomologist_tsar:0 "The Entomologist Tsar"
 bfx_alt_entomologist_tsar_desc:0 "Ferdinand has a butterfly named after him and a museum full of beetles. His Royal Natural History Institute will now also study artillery."
 bfx_alt_imperial_life_guard:0 "The Imperial Life Guard"
 bfx_alt_imperial_life_guard_desc:0 "White tunics, astrakhan caps, egret plumes and live ammunition. Ferdinand has designed the uniforms himself."
 bfx_alt_coburg_capital:0 "Coburg Capital"
 bfx_alt_coburg_capital_desc:0 "The Saxe-Coburg cousins own half the thrones of Europe and a fair share of its factories. Family money is the best money."
 bfx_alt_third_empire:0 "Proclaim the Third Bulgarian Empire"
 bfx_alt_third_empire_desc:0 "After Asparuh's khanate and the Asens' empire, the third one. The coronation robes have been in a trunk since 1908. Choosing the Empire of the Bulgars rules out the Roman pretension."
 bfx_alt_simeons_borders:0 "The Borders of Simeon the Great"
 bfx_alt_simeons_borders_desc:0 "In 917 Simeon's empire touched three seas and the gates of Constantinople. Claims on every state of Yugoslavia, Albania and the Romanian Old Kingdom."
 bfx_alt_tsar_of_the_vlachs:0 "Tsar of Bulgarians and Vlachs"
 bfx_alt_tsar_of_the_vlachs_desc:0 "Kaloyan used the title in 1204; Ferdinand would like it back. War goal on Romania and claims on all its core lands."
 bfx_alt_coronation_at_tarnovo:0 "Coronation at Tarnovo"
 bfx_alt_coronation_at_tarnovo_desc:0 "Crowned in the old capital, under the walls of Tsarevets, with a choir, a cannonade and a short lecture on butterflies."
 bfx_alt_old_great_bulgaria:0 "Old Great Bulgaria"
 bfx_alt_old_great_bulgaria_desc:0 "Before the Danube there was the steppe: Khan Kubrat's Onoglundur between the Dnieper and the Kuban. Claims on every Ukrainian core state, Crimea included, because why not."
 bfx_alt_asparuhs_homecoming:0 "Asparuh's Homecoming"
 bfx_alt_asparuhs_homecoming_desc:0 "Asparuh led the Bulgars west in 680. His heirs are heading back east with artillery. Cores on all held Ukrainian lands; the state is renamed Old Great Bulgaria."
 bfx_alt_tsargrad:0 "Tsargrad!"
 bfx_alt_tsargrad_desc:0 "Simeon besieged it, Krum nearly took it, and in 1912 Bulgarian guns could be heard in Pera. The city of the Caesars is the only capital worthy of Ferdinand. Rules out the purely Bulgarian empire."
 bfx_alt_basileus:0 "Basileus of the Romans and Bulgars"
 bfx_alt_basileus_desc:0 "Simeon demanded the title in 913 and the Byzantines nearly fainted. Ferdinand simply has it printed on the stationery. Claims on all Greek core lands."
 bfx_alt_hagia_sophia:0 "Mass in Hagia Sophia"
 bfx_alt_hagia_sophia_desc:0 "The first Orthodox liturgy under the great dome since 1453, sung in Church Slavonic by a Bulgarian exarch. Cores on Istanbul and Edirne; the realm becomes the Empire of the Romans and Bulgars."
 bfx_alt_restore_the_themes:0 "Restore the Themes"
 bfx_alt_restore_the_themes_desc:0 "Thrakesion, Opsikion, Anatolikon: the old military provinces are revived with Bulgarian governors. Claims on all of Anatolia; cores on every held Greek and Turkish core state."
 bfx_alt_exarchate_of_ravenna:0 "The Exarchate of Ravenna"
 bfx_alt_exarchate_of_ravenna_desc:0 "Justinian held Italy, so Ferdinand will too. The Italian embassy has been asked whether Rome would prefer to surrender before or after lunch. Claims on every Italian core state and a war goal on Italy."
 bfx_com_workers_party:0 "Unchain the Workers' Party"
 bfx_com_workers_party_desc:0 "The Bulgarian Communist Party has been illegal since 1924 and has survived as the Workers' Party, as trade unions, as reading clubs and as a very large number of cellars. Mutually exclusive with the Tsardom and the Agrarian/Zveno paths."
 bfx_com_fatherland_front:0 "The Fatherland Front"
 bfx_com_fatherland_front_desc:0 "Communists, left Agrarians, Zveno officers and anyone else who dislikes the Palace, under one red-and-green umbrella. Unlocks Partisan Support decisions."
 bfx_com_ninth_of_september:0 "The Ninth of September"
 bfx_com_ninth_of_september_desc:0 "Bring it forward a few years. With 40% support the Front takes Sofia almost bloodlessly; with less, the Tsardom fights back and Bulgaria burns. Either way, the Workers' Party ends up holding the keys."
 bfx_com_dimitrov_comes_home:0 "Dimitrov Comes Home"
 bfx_com_dimitrov_comes_home_desc:0 "The man who outargued Göring at the Leipzig trial, now head of the Comintern, returns to Sofia to build a people's republic on the Moscow model. Rules out Kolarov's independent federation."
 bfx_com_soviet_advisers:0 "Soviet Military Advisers"
 bfx_com_soviet_advisers_desc:0 "Red Army instructors arrive with field manuals, interpreters and an alarming interest in who served the Tsar. General Zaimov, a Soviet agent for years, can finally wear his loyalties openly."
 bfx_com_tkzs:0 "Collectivise the Villages"
 bfx_com_tkzs_desc:0 "The TKZS cooperative farms will feed the factories and free the sons of peasants for the lathes. The peasants have been told this is what they want."
 bfx_com_join_comintern:0 "Join the Comintern"
 bfx_com_join_comintern_desc:0 "Dimitrov ran the Comintern; joining it is practically coming home again. Moscow is asked to admit Bulgaria to its alliance."
 bfx_com_heavy_industry:0 "Steel for the Five-Year Plan"
 bfx_com_heavy_industry_desc:0 "Kremikovtsi will be built twenty years early, by people who have never seen a blast furnace, under the supervision of people who have only read about one."
 bfx_com_straits_for_moscow:0 "The Straits for Moscow"
 bfx_com_straits_for_moscow_desc:0 "Moscow has wanted the Bosporus since Catherine the Great. A loyal Bulgaria can hand it over, keeping Edirne for its trouble. Claims on Istanbul and Edirne and a war goal on their owner."
 bfx_com_red_black_sea:0 "A Red Black Sea"
 bfx_com_red_black_sea_desc:0 "From Constanța to Varna to Sevastopol, a sea with only red ports. Cores on both Dobrujas once held, plus a navy that can say so."
 bfx_com_kolarovs_federation:0 "Kolarov's Federation"
 bfx_com_kolarovs_federation_desc:0 "Vasil Kolarov has spent twenty years drafting a Balkan Communist Federation in Comintern committees. Now he has a country to start it with, and no intention of asking Moscow's permission. Rules out the Moscow-model republic."
 bfx_com_yugoslav_partisans:0 "Arms for the Yugoslav Partisans"
 bfx_com_yugoslav_partisans_desc:0 "Rifles go west in hay carts. Unlocks partisan uprisings in Yugoslavia and Albania."
 bfx_com_greek_comrades:0 "Contact the Greek Comrades"
 bfx_com_greek_comrades_desc:0 "The KKE has been outlawed by Metaxas and is looking for friends with a border. Unlocks partisan uprisings in Greece and Turkey."
 bfx_com_independent_line:0 "An Independent Line"
 bfx_com_independent_line_desc:0 "Tito will make this famous in 1948. Sofia gets there first: socialism, yes; orders from Moscow, no thank you."
 bfx_com_balkan_federation:0 "Proclaim the Balkan Federation"
 bfx_com_balkan_federation_desc:0 "One federation from the Adriatic to the Black Sea, with Sofia as its first capital because Sofia thought of it first. Claims on every Yugoslav, Greek and Albanian core state; red neighbours may now be integrated."
 bfx_com_danube_to_aegean:0 "From the Danube to the Aegean"
 bfx_com_danube_to_aegean_desc:0 "Federal citizenship for every comrade under the red flag. Cores on all held Yugoslav, Greek and Albanian lands."
 bfx_com_carpathian_soviets:0 "Carpathian Soviets"
 bfx_com_carpathian_soviets_desc:0 "The Federation does not stop at the Danube. Claims on all Romanian and Hungarian core lands and a war goal on Romania."
 bfx_com_red_danubia:0 "The Red Danubian Federation"
 bfx_com_red_danubia_desc:0 "From Bratislava to the Bosporus: the Danube becomes a socialist river. Cores on every held Romanian, Hungarian, Czechoslovak and Austrian core state; integration decisions extend to Budapest and Prague."
 bfx_agr_union_stirs:0 "The Union Stirs Again"
 bfx_agr_union_stirs_desc:0 "The Bulgarian Agrarian National Union ruled the country until 1923 and has been plotting to rule it again ever since; the Zveno officers who overthrew the parties in 1934 now find the Agrarians their only friends. Mutually exclusive with the Tsardom and the Communists."
 bfx_agr_second_19_may:0 "A Second 19th of May"
 bfx_agr_second_19_may_desc:0 "In 1934 the officers seized Sofia in a single night. Agrarians and Zveno try again, this time with the peasants behind them. The Tsar may bend, or fight."
 bfx_agr_stamboliyskis_heirs:0 "Stamboliyski's Heirs"
 bfx_agr_stamboliyskis_heirs_desc:0 "Aleksandar Stamboliyski was murdered in 1923 for being too popular with peasants and too unpopular with everyone else. His heirs restore parliament and his programme. Rules out the Zveno technocracy."
 bfx_agr_land_to_the_tiller:0 "Land to the Tiller"
 bfx_agr_land_to_the_tiller_desc:0 "No estate above thirty hectares, no peasant without land. Unlocks Peasant Cooperative decisions."
 bfx_agr_orange_guard:0 "Revive the Orange Guard"
 bfx_agr_orange_guard_desc:0 "In 1922 the Orange Guard was peasants with clubs. In 1938 it is peasants with rifles, which is a considerable improvement."
 bfx_agr_cooperative_banks:0 "Cooperative Banks"
 bfx_agr_cooperative_banks_desc:0 "Credit for ploughs, not palaces. The Agricultural and Cooperative Bank lends to villages that never saw a loan officer sober."
 bfx_agr_referendum:0 "Referendum on the Crown"
 bfx_agr_referendum_desc:0 "Bulgaria voted out its monarchy in 1946. The Agrarians ask a little early."
 bfx_agr_green_international:0 "The Green International"
 bfx_agr_green_international_desc:0 "Stamboliyski founded it in 1921: an alliance of peasant parties from the Baltic to the Aegean. Revived, it becomes an alliance of peasant states. Founds a faction and invites agrarian-minded neighbours."
 bfx_agr_balkan_peasant_union:0 "The Balkan Peasant Union"
 bfx_agr_balkan_peasant_union_desc:0 "Customs union, then currency union, then simply union. Democratic faction members are offered full federation; we gain cores on all their lands if they accept."
 bfx_agr_baltic_to_aegean:0 "From the Baltic to the Aegean"
 bfx_agr_baltic_to_aegean_desc:0 "The peasant commonwealth reaches for the whole Intermarium. Claims on the core lands of every non-democratic state between the Baltic and the Aegean, as liberation targets; the union offer extends to Poland and Czechoslovakia."
 bfx_zveno_takes_the_helm:0 "Zveno Takes the Helm"
 bfx_zveno_takes_the_helm_desc:0 "Kimon Georgiev and the Link circle believe parties, priests and kings are all inefficiencies. Government by competent colonels, with slide rules. Rules out Agrarian democracy."
 bfx_zveno_abolish_parties:0 "Abolish the Parties, Again"
 bfx_zveno_abolish_parties_desc:0 "Zveno dissolved them in 1934, the Tsar kept them dissolved, and now Zveno dissolves the remains."
 bfx_zveno_officers_take_ministries:0 "The Officers' State"
 bfx_zveno_officers_take_ministries_desc:0 "Every ministry gets a colonel, every colonel gets a typist. The Military League, so long a threat to governments, becomes the government."
 bfx_zveno_five_year_plan:0 "The Technocrats' Plan"
 bfx_zveno_five_year_plan_desc:0 "Five years, three ministries, one very long spreadsheet. Fast modernisation, at the cost of anyone who preferred the old Bulgaria."
 bfx_zveno_state_monopolies:0 "State Monopolies"
 bfx_zveno_state_monopolies_desc:0 "Tobacco, salt, matches and rose oil: if Bulgarians buy it, the state sells it. The revenue builds rifles."
 bfx_zveno_prussia_of_the_balkans:0 "The Prussia of the Balkans"
 bfx_zveno_prussia_of_the_balkans_desc:0 "A small state with a large army and a very precise timetable. The officers are building the model they admired in their academy textbooks."
 bfx_zveno_officers_balkans:0 "An Officers' Balkans"
 bfx_zveno_officers_balkans_desc:0 "Neighbouring governments are run by politicians; Zveno has a low opinion of politicians. Claims on Macedonia, Thrace and Dobrudja and a war goal on whoever holds Macedonia."
 bfx_zveno_anatolian_gambit:0 "The Anatolian Gambit"
 bfx_zveno_anatolian_gambit_desc:0 "If the Turks can be beaten at Chataldzha they can be beaten at Ankara. Claims on every Turkish core state and a war goal on Turkey; cores on all held Balkan lands. The regime renames itself the Balkan Military Union."
 bfx_eco_rose_and_leaf:0 "The Rose and the Leaf"
 bfx_eco_rose_and_leaf_desc:0 "Oriental tobacco from Plovdiv and rose oil from Kazanlak pay for almost everything Bulgaria imports. Two crops, one economy, and a trade deficit that depends on Germans smoking."
 bfx_eco_german_clearing:0 "The German Clearing Account"
 bfx_eco_german_clearing_desc:0 "Germany buys the whole tobacco crop at generous prices, paid into a Berlin account that can only be spent in Germany. Strong, fast industrial gains that tie the economy to Berlin and bar the pro-British neutral route. Rules out diversification."
 bfx_eco_diversify:0 "Diversify the Buyers"
 bfx_eco_diversify_desc:0 "Sell to Britain, France, Czechoslovakia and anyone with hard currency. Slower, smaller gains, but nobody holds the purse strings. Rules out the German clearing account."
 bfx_eco_tobacco_boom:0 "The Plovdiv Tobacco Boom"
 bfx_eco_tobacco_boom_desc:0 "Warehouses the size of cathedrals, girls sorting leaves by the thousand and a tobacco workers' union with opinions."
 bfx_eco_valley_of_roses:0 "The Valley of Roses"
 bfx_eco_valley_of_roses_desc:0 "Kazanlak supplies most of the world's attar of roses. Paris perfumers pay in gold; the valley pays in stability."
 bfx_eco_hard_currency:0 "Hard Currency for Machines"
 bfx_eco_hard_currency_desc:0 "Rose gold and tobacco marks buy lathes from Pilsen and turbines from Zurich."
 bfx_eco_ledger_of_trade:0 "The Ledger of Trade"
 bfx_eco_ledger_of_trade_desc:0 "Time to settle accounts. If Berlin holds the purse, decide whether to break free or bind tighter; if the buyers are many, open the books to the world."
 bfx_eco_plovdiv_fair:0 "The Plovdiv International Fair"
 bfx_eco_plovdiv_fair_desc:0 "Every September, the world's salesmen come to Plovdiv. This year they bring patents."
 bfx_eco_pernik_coal:0 "Pernik Coal"
 bfx_eco_pernik_coal_desc:0 "The mines of Pernik heat Sofia, fuel the railways and feed the state steelworks. Mechanise the galleries."
 bfx_eco_balkan_iron:0 "Iron from the Balkan Range"
 bfx_eco_balkan_iron_desc:0 "Geologists have found iron near Kremikovtsi. It is poor ore, but it is ours."
 bfx_eco_kazanlak_arsenal:0 "The Kazanlak State Arsenal"
 bfx_eco_kazanlak_arsenal_desc:0 "The State Military Factory at Kazanlak has been making shells and pretending to make tractors since 1924. It can stop pretending."
 bfx_eco_sofia_ring:0 "The Sofia Industrial Ring"
 bfx_eco_sofia_ring_desc:0 "Electric trams, textile mills and the first assembly halls in Bozhurishte. Sofia becomes a city that makes things."
 bfx_eco_academy_of_sciences:0 "The Academy of Sciences"
 bfx_eco_academy_of_sciences_desc:0 "The Bulgarian Academy's institutes stop arguing about Old Church Slavonic long enough to study ballistics."
 bfx_eco_bdz:0 "Modernise the BDŽ"
 bfx_eco_bdz_desc:0 "The Bulgarian State Railways run on single track, Austrian locomotives and the Tsar's personal enthusiasm. Boris III drives the royal train himself. Every state gets better roads and rails."
 bfx_eco_main_line:0 "The Sofia–Varna Main Line"
 bfx_eco_main_line_desc:0 "Double track from the capital to the sea, and a timetable the Tsar has checked personally."
 bfx_eco_iskar_dams:0 "Dams on the Iskar"
 bfx_eco_iskar_dams_desc:0 "Hydroelectric power from the gorge that cuts the Balkan range in two. Factories learn faster when the lights stay on."
 bfx_eco_black_sea_ports:0 "Ports of Varna and Burgas"
 bfx_eco_black_sea_ports_desc:0 "Deepen the harbours, lengthen the quays and add the slipways a navy will want."
 bfx_eco_petroleum:0 "Petroleum Prospects"
 bfx_eco_petroleum_desc:0 "Bulgaria has no oil, say the geologists. Dobrudja has oil, says one stubborn geologist. If we own Dobrudja, he is right two decades early; if not, coal becomes fuel the hard way."
 bfx_eco_labour_brigades:0 "The Labour Service Brigades"
 bfx_eco_labour_brigades_desc:0 "Stamboliyski invented compulsory labour service in 1920 and the Entente let it stand. Young men with shovels build roads, dams and, quietly, earthworks."
 bfx_eco_national_bank:0 "Reform the National Bank"
 bfx_eco_national_bank_desc:0 "Stabilise the lev, consolidate the debts and print enough money to pay for all this, but not too much."
 bfx_mil_neuilly_army:0 "The Army Neuilly Built"
 bfx_mil_neuilly_army_desc:0 "Twenty thousand volunteers, no conscripts, no tanks, no planes and one very bored General Staff. Starting from here can only go up."
 bfx_mil_rhodope_rangers:0 "Rhodope Rangers"
 bfx_mil_rhodope_rangers_desc:0 "Bulgarian mountain troops trained on Musala, Vihren and smugglers' paths. Every war in the Balkans is a mountain war eventually."
 bfx_mil_balkan_war_lessons:0 "Lessons of Chataldzha"
 bfx_mil_balkan_war_lessons_desc:0 "1912: the army charged entrenched Turks and lost a generation in an afternoon. The staff college has studied that afternoon for twenty-five years."
 bfx_mil_mountain_doctrine:0 "Balkan Mountain Doctrine"
 bfx_mil_mountain_doctrine_desc:0 "Infiltrate along the ridges, hold the passes, let the enemy fight the terrain before he fights you."
 bfx_mil_artillery_parks:0 "The Artillery Parks"
 bfx_mil_artillery_parks_desc:0 "Neuilly let Bulgaria keep a few mountain guns. A few is a starting number."
 bfx_mil_staff_academy:0 "The General Staff Academy"
 bfx_mil_staff_academy_desc:0 "Officers who have read Clausewitz, Moltke and Svechin, and who can tell a staff map from a tobacco ledger. General Lukov takes a field command."
 bfx_mil_universal_service:0 "Universal Service, Openly"
 bfx_mil_universal_service_desc:0 "Conscription returns, legally, in uniform and on the front page. Only possible once the military clauses of Neuilly are gone."
 bfx_mil_fortify_the_passes:0 "Fortify the Passes"
 bfx_mil_fortify_the_passes_desc:0 "Shipka, Kresna, the Iron Gates: concrete where the old wars were decided."
 bfx_mil_motorised_brigade:0 "The Motorised Brigade"
 bfx_mil_motorised_brigade_desc:0 "A handful of Czech trucks and Italian tankettes, organised as if they were a panzer division."
 bfx_nav_black_sea_flotilla:0 "The Black Sea Flotilla"
 bfx_nav_black_sea_flotilla_desc:0 "Neuilly left Bulgaria four torpedo boats and some police launches. The flotilla commander has been told to think big."
 bfx_nav_varna_naval_school:0 "The Varna Naval School"
 bfx_nav_varna_naval_school_desc:0 "His Majesty's Naval School in Varna trains officers for a navy that does not yet exist. Give them something to command."
 bfx_nav_torpedo_squadrons:0 "Torpedo Boat Squadrons"
 bfx_nav_torpedo_squadrons_desc:0 "Small, fast and cheap: the only naval doctrine a poor Black Sea power can afford, and a good one."
 bfx_nav_coastal_batteries:0 "Coastal Batteries at Galata"
 bfx_nav_coastal_batteries_desc:0 "Guns on the cliffs above Varna and Burgas make the coast expensive to visit."
 bfx_nav_black_sea_raiders:0 "Black Sea Raiders"
 bfx_nav_black_sea_raiders_desc:0 "If Bulgaria cannot win a fleet battle it can make sure nobody's convoys sleep well."
 bfx_air_aero_clubs:0 "Aero Clubs and Gliders"
 bfx_air_aero_clubs_desc:0 "Neuilly banned military aviation; nobody banned enthusiastic young men with gliders. The clubs are, quite by coincidence, staffed by former air force officers."
 bfx_air_dar_works:0 "The DAR Works at Bozhurishte"
 bfx_air_dar_works_desc:0 "The State Aircraft Workshops have built trainers, mail planes and things that are definitely not reconnaissance aircraft."
 bfx_air_foreign_instructors:0 "Foreign Instructors"
 bfx_air_foreign_instructors_desc:0 "Germans, Italians and Poles, depending on who is cheapest this year, teach the pilots to fly in formation."
 bfx_air_vazdushni_voyski:0 "Proclaim the Vazdushni Voyski"
 bfx_air_vazdushni_voyski_desc:0 "His Majesty's Air Force exists, officially, with roundels and everything. Only possible once the military clauses of Neuilly are gone."
 bfx_air_fighter_regiment:0 "The Fighter Regiment"
 bfx_air_fighter_regiment_desc:0 "Defend Sofia's skies, so that nobody bombs the cathedral twice."
 bfx_air_mountain_support:0 "Wings over the Mountains"
 bfx_air_mountain_support_desc:0 "Close air support for troops fighting in valleys where artillery cannot follow."
 bfx_tsar_tsar_of_the_balkans:0 "Tsar of All the Balkans"
 bfx_tsar_tsar_of_the_balkans_desc:0 "Samuil, Simeon and Ivan Asen II each ruled most of the peninsula for a generation. Boris intends to rule all of it for longer. Cores on every held state of the peninsula; claims on Hungary and the whole of Romania."
 bfx_tsar_imperial_federation:0 "The Imperial Federation"
 bfx_tsar_imperial_federation_desc:0 "The Confederation's members elect Boris Emperor by acclamation, mostly. Cores on every held state of Yugoslavia, Albania, Greece, Romania, Turkey and Hungary."
 bfx_alt_volga_bulgaria:0 "Return to the Volga"
 bfx_alt_volga_bulgaria_desc:0 "Not all the Bulgars went west: Volga Bulgaria flourished around Bilyar until the Mongols came. Ferdinand would like the other half of the family back. Claims on every Soviet core state; the Imperial Integration decisions can core them."
 bfx_alt_justinians_empire:0 "The Empire of Justinian"
 bfx_alt_justinians_empire_desc:0 "Ravenna, Carthage, Alexandria, Antioch: Justinian held them all, and Ferdinand has a very large map. Claims on Egypt and the Levant."
 bfx_com_black_sea_union:0 "The Black Sea Socialist Union"
 bfx_com_black_sea_union_desc:0 "Every shore of the Black Sea, red. Claims on Anatolia and the Caucasus republics, cores on any held Turkish or Romanian lands."
 bfx_com_trieste_to_odessa:0 "From Trieste to Odessa"
 bfx_com_trieste_to_odessa_desc:0 "The Federation outgrows the Danube. Claims on Austria, Poland, Ukraine and Italy's north-east; cores on any of them already held."
 bfx_agr_peasant_commonwealth:0 "The Peasant Commonwealth"
 bfx_agr_peasant_commonwealth_desc:0 "One parliament from the Aegean to the Baltic, and the speaker is a Bulgarian farmer. Cores on every held state of Central and Eastern Europe."
 bfx_zveno_levant_command:0 "The Levant Command"
 bfx_zveno_levant_command_desc:0 "From Anatolia the General Staff looks south. Claims on Syria, Iraq, Lebanon and Cyprus, cores on every held Turkish state."
