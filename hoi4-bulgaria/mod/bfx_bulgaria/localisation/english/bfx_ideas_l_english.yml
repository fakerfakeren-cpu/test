l_english:
 bfx_neuilly_shackles:0 "Shackles of Neuilly"
 bfx_neuilly_shackles_desc:0 "The 1919 Treaty of Neuilly limits Bulgaria to 20,000 volunteers, bans conscription, military aviation and a real navy. Covert Rearmament offsets these penalties, but it rusts away every month and makes the neighbours more suspicious the higher it climbs."
 bfx_balkan_embargo:0 "Balkan Embargo"
 bfx_balkan_embargo_desc:0 "The Balkan Entente has closed its markets to Bulgarian tobacco and its ports to anything that might be a rifle."
 bfx_border_crisis:0 "The Petrich Crisis"
 bfx_border_crisis_desc:0 "Troops face each other across the border, the newspapers count bayonets and nobody sleeps in Sofia."
 bfx_salonika_freedom:0 "Free of Neuilly"
 bfx_salonika_freedom_desc:0 "The military clauses are gone. The army can recruit, train and parade openly, and is enjoying all three."
 bfx_imro_state_within_state:0 "IMRO: A State Within the State"
 bfx_imro_state_within_state_desc:0 "In the Petrich district the Internal Macedonian Revolutionary Organisation collects taxes, holds courts and assassinates rivals in broad daylight in Sofia."
 bfx_imro_crushed:0 "IMRO Broken"
 bfx_imro_crushed_desc:0 "The committees are closed and the gunmen are in exile or in prison. Petrich pays its taxes to Sofia for the first time in fifteen years."
 bfx_imro_tolerated:0 "IMRO Tolerated"
 bfx_imro_tolerated_desc:0 "The government does not see the men drilling in the Pirin forests, and the men return the courtesy."
 bfx_imro_liberation_army:0 "The Macedonian Volunteer Corps"
 bfx_imro_liberation_army_desc:0 "IMRO's chetas have become volunteer battalions with Bulgarian rifles, Bulgarian officers and a very clear idea of where they are going."
 bfx_imro_fervour:0 "Ilinden Fervour"
 bfx_imro_fervour_desc:0 "Every village in the mountains is a depot, every shepherd a scout. The uprising fights for its life and knows it."
 bfx_imro_bulgarian_officers:0 "Officers on Leave"
 bfx_imro_bulgarian_officers_desc:0 "Bulgarian staff officers with false names and very real maps run the uprising's war."
 bfx_military_league_intrigue:0 "The Military League"
 bfx_military_league_intrigue_desc:0 "The officers who made the coups of 1923 and 1934 still meet, still talk and still keep the keys to the barracks."
 bfx_army_loyal_to_crown:0 "An Army Loyal to the Crown"
 bfx_army_loyal_to_crown_desc:0 "The League is muzzled and the officers swear their oaths to the Tsar, not to their own committees."
 bfx_partyless_regime:0 "A Kingdom Without Parties"
 bfx_partyless_regime_desc:0 "Supra-party government: no parties, many factions, and ministers who answer only to the Palace."
 bfx_tsars_personal_regime:0 "The Tsar's Personal Regime"
 bfx_tsars_personal_regime_desc:0 "Boris III governs through loyal technicians and a calendar full of audiences. Nobody doubts who decides."
 bfx_royal_propaganda:0 "The Directorate of National Propaganda"
 bfx_royal_propaganda_desc:0 "Newsreels of the Tsar inspecting regiments, posters of the lost provinces, and a radio that never stops talking about either."
 bfx_open_chancelleries:0 "Open Chancelleries"
 bfx_open_chancelleries_desc:0 "Sofia's diplomats are busy again: pacts, guarantees and alliances are back on the menu."
 bfx_tsar_unifier:0 "Tsar Unifier"
 bfx_tsar_unifier_desc:0 "The lost provinces are home. Boris is cheered in Skopje and Kavala as he was never cheered in Sofia."
 bfx_san_stefano_irredentism:0 "The San Stefano Dream"
 bfx_san_stefano_irredentism_desc:0 "Every classroom map shows the Bulgaria of March 1878, and every classroom wants it back."
 bfx_raindrops_diplomacy:0 "Walking Between the Raindrops"
 bfx_raindrops_diplomacy_desc:0 "Boris's own phrase: lean towards Berlin without falling over, take what is offered, promise nothing that cannot be broken."
 bfx_axis_junior_partner:0 "Junior Axis Partner"
 bfx_axis_junior_partner_desc:0 "German credits, German instructors and German expectations. So far the first two outweigh the third."
 bfx_occupation_corps:0 "The Occupation Corps"
 bfx_occupation_corps_desc:0 "Gendarmes, schoolteachers and priests follow the army into the new provinces. Some of them are welcome."
 bfx_no_eastern_front:0 "Not One Soldier for the Steppe"
 bfx_no_eastern_front_desc:0 "Bulgarians and Russians have not fought each other in living memory, and the Tsar intends to keep it that way."
 bfx_eastern_crusade:0 "Crusade in the East"
 bfx_eastern_crusade_desc:0 "Bulgarian divisions march north of the Danube for the first time since Simeon. Nobody at home is quite sure why."
 bfx_balkan_hegemon:0 "The Balkan Hegemon"
 bfx_balkan_hegemon_desc:0 "Bulgaria needs no patron in Berlin or London. It will be the patron."
 bfx_hegemon_army:0 "The Hegemon's Army"
 bfx_hegemon_army_desc:0 "A small country organised around a large army and a staff that has planned every war it might fight."
 bfx_client_kings:0 "Client Kings"
 bfx_client_kings_desc:0 "Defeated neighbours keep their crowns, their flags and their ministers, and take their orders from Sofia."
 bfx_imperial_mandate:0 "The Imperial Mandate"
 bfx_imperial_mandate_desc:0 "From the Danube to the Aegean, Sofia's writ runs. Governors are appointed, schools opened and taxes collected, mostly without shooting."
 bfx_legionary_state:0 "The Legionary State"
 bfx_legionary_state_desc:0 "General Lukov's Legions run the ministries, the schools and the streets. The Tsar still signs the decrees, when he is shown them."
 bfx_brannik:0 "The Brannik"
 bfx_brannik_desc:0 "Every boy in Bulgaria wears the green shirt on Sundays and learns to shoot on Saturdays."
 bfx_legionary_militia:0 "The Legionary Militia"
 bfx_legionary_militia_desc:0 "Party battalions trained to guard bridges, hunt partisans and march very loudly."
 bfx_anti_comintern:0 "Anti-Comintern Bulwark"
 bfx_anti_comintern_desc:0 "The red menace is officially the second most important thing in Bulgaria, after Macedonia."
 bfx_german_instructors:0 "German Instructors"
 bfx_german_instructors_desc:0 "Wehrmacht officers teach the Bulgarian army how to fight, and occasionally how to march in step with them."
 bfx_total_mobilisation:0 "Total Mobilisation"
 bfx_total_mobilisation_desc:0 "Every factory works for the front and every family has someone in it."
 bfx_national_social_economy:0 "The National Social Economy"
 bfx_national_social_economy_desc:0 "Tsankov's corporations: one per trade, one chairman per corporation, one ministry over all of them."
 bfx_imperium_army:0 "The Army of the Imperium"
 bfx_imperium_army_desc:0 "Marching songs about Simeon, Samuil and Ivan Asen, and a very modern interest in artillery."
 bfx_pact_of_iron:0 "The Pact of Iron"
 bfx_pact_of_iron_desc:0 "Revisionists of Europe, unite: Sofia and Budapest have lost the most and want the most back."
 bfx_ferdinand_restoration:0 "The Coburg Restoration"
 bfx_ferdinand_restoration_desc:0 "Ferdinand is back from exile, older, richer in grudges and absolutely certain that this time he will not lose."
 bfx_third_empire_zeal:0 "The Third Empire"
 bfx_third_empire_zeal_desc:0 "Asparuh, Simeon, the Asens, Ferdinand: the fourth name is in a smaller font, but it is on the list."
 bfx_byzantine_pretension:0 "Basileus of the Romans and Bulgars"
 bfx_byzantine_pretension_desc:0 "The double-headed eagle has a new perch. Ferdinand signs his letters as Emperor of the Romans, and has the stationery to prove it."
 bfx_royal_natural_history_institute:0 "Royal Natural History Institute"
 bfx_royal_natural_history_institute_desc:0 "Butterflies, beetles, botany and, on the second floor, ballistics. The Tsar visits both floors."
 bfx_tobacco_monoculture:0 "Tobacco Monoculture"
 bfx_tobacco_monoculture_desc:0 "Oriental tobacco earns most of Bulgaria's foreign currency. When the harvest is good the country is rich; when it is not, the country is restless."
 bfx_tobacco_and_rose_exports:0 "Tobacco and Rose Exports"
 bfx_tobacco_and_rose_exports_desc:0 "Two luxury crops, sold to the world. The warehouses of Plovdiv and the stills of Kazanlak work around the clock."
 bfx_valley_of_roses:0 "The Valley of Roses"
 bfx_valley_of_roses_desc:0 "Attar of roses for Paris, tobacco for Dresden and Bristol: the export economy is diversified, profitable and fragrant."
 bfx_german_clearing:0 "The German Clearing Account"
 bfx_german_clearing_desc:0 "Germany buys everything and pays into an account that can only be spent in Germany. Machines arrive quickly; so does dependence."
 bfx_german_clearing_deep:0 "Bound to Berlin"
 bfx_german_clearing_deep_desc:0 "Bulgaria's economy now runs on German credit, German machines and German patience."
 bfx_diversified_trade:0 "Many Buyers"
 bfx_diversified_trade_desc:0 "Tobacco to Britain, roses to France, grain to Czechoslovakia. Smaller orders, but nobody owns the till."
 bfx_open_markets:0 "Open Markets"
 bfx_open_markets_desc:0 "The lev is convertible, the Plovdiv Fair is full and Bulgarian goods sail from Varna to everyone who pays."
 bfx_pernik_coal_works:0 "Pernik Coal Works"
 bfx_pernik_coal_works_desc:0 "Mechanised galleries and a railway spur: the mines of Pernik power the capital."
 bfx_pernik_coal_works_2:0 "Coal and Iron of the Balkan Range"
 bfx_pernik_coal_works_2_desc:0 "Pernik coal meets Kremikovtsi ore. A Bulgarian steel industry, small but real."
 bfx_electrification:0 "Electrification"
 bfx_electrification_desc:0 "Power lines march across the Thracian plain. Factories that ran on daylight now run on shifts."
 bfx_iskar_hydro:0 "Iskar Hydroelectric Grid"
 bfx_iskar_hydro_desc:0 "Turbines in the gorge, lights in the factories and the first electric railway over the Balkan range."
 bfx_railway_age:0 "The Railway Age"
 bfx_railway_age_desc:0 "New sleepers, new signals and a Tsar who drives the express himself."
 bfx_railway_age_2:0 "The Main Lines"
 bfx_railway_age_2_desc:0 "Double track from Sofia to Varna. Troops, tobacco and timetables all move faster."
 bfx_state_arsenals:0 "The State Arsenals"
 bfx_state_arsenals_desc:0 "Kazanlak makes shells, Sopot makes rifles, and both make them faster than the treaty ever allowed."
 bfx_war_economy:0 "The War Economy"
 bfx_war_economy_desc:0 "Production quotas, ration cards and a War Production Board run by men who used to sell tobacco."
 bfx_dispersed_industry:0 "Dispersed Industry"
 bfx_dispersed_industry_desc:0 "Workshops in the valleys, depots in the caves: a bomber would need a map Bulgaria does not publish."
 bfx_chemical_industry:0 "The Chemical Combine"
 bfx_chemical_industry_desc:0 "Fertiliser in peacetime, explosives in war, and a smell over Stara Zagora that never quite leaves."
 bfx_trudovaks:0 "The Labour Service"
 bfx_trudovaks_desc:0 "Trudova povinnost: every young man owes the state a year with a shovel, and the shovel is only sometimes a shovel."
 bfx_atomic_commission:0 "The Atomic Commission"
 bfx_atomic_commission_desc:0 "Professor Nadjakov's laboratory has a budget, a guard at the door and a very short list of visitors."
 bfx_mountain_army:0 "Rhodope Rangers"
 bfx_mountain_army_desc:0 "Mountain companies trained on the smugglers' paths of the Rhodopes and the Pirin."
 bfx_balkan_mountain_doctrine:0 "Balkan Mountain Doctrine"
 bfx_balkan_mountain_doctrine_desc:0 "Hold the passes, move along the ridges, let the enemy fight the mountains first."
 bfx_bayonet_tradition:0 "The Bayonet Tradition"
 bfx_bayonet_tradition_desc:0 "Lozengrad, Bulair, Doiran: the Bulgarian infantry's reputation was made at bayonet point, and it knows it."
 bfx_general_staff_academy:0 "The General Staff Academy"
 bfx_general_staff_academy_desc:0 "Staff officers who can plan a campaign, not just a parade."
 bfx_reservist_associations:0 "The Reservist Associations"
 bfx_reservist_associations_desc:0 "Veterans' clubs in every town keep rifles oiled, records current and young men interested."
 bfx_veterans_of_1912:0 "Veterans of the Balkan Wars"
 bfx_veterans_of_1912_desc:0 "The sergeants of Lozengrad train their grandsons."
 bfx_womens_auxiliary:0 "The Women's Auxiliary"
 bfx_womens_auxiliary_desc:0 "Nurses, signallers, munitions workers: the army counts on women it officially does not recruit."
 bfx_national_army:0 "The National Army"
 bfx_national_army_desc:0 "Universal service, regional depots, standing reserves: the army Neuilly forbade, built in full."
 bfx_open_conscription:0 "Universal Service"
 bfx_open_conscription_desc:0 "Every Bulgarian man serves, and nobody has to pretend otherwise."
 bfx_black_sea_flotilla:0 "The Black Sea Flotilla"
 bfx_black_sea_flotilla_desc:0 "A handful of torpedo boats and an officer corps with ambitions far larger than its ships."
 bfx_black_sea_fleet:0 "The Black Sea Squadrons"
 bfx_black_sea_fleet_desc:0 "Fast torpedo craft, trained crews and enough slipways to keep building them."
 bfx_black_sea_raiders:0 "Black Sea Raiders"
 bfx_black_sea_raiders_desc:0 "Small boats, long nights and big torpedoes."
 bfx_minefields:0 "The Varna Minefields"
 bfx_minefields_desc:0 "If Bulgaria cannot sink a battleship with guns, it can certainly do it with a mine."
 bfx_clandestine_aviation:0 "Clandestine Aviation"
 bfx_clandestine_aviation_desc:0 "Flying clubs, glider schools and a postal service whose pilots fly in suspiciously tight formation."
 bfx_vazdushni_voyski:0 "His Majesty's Air Force"
 bfx_vazdushni_voyski_desc:0 "The Vazdushni Voyski fly openly at last, with roundels, ranks and a budget."
 bfx_foreign_air_instructors:0 "Foreign Flight Instructors"
 bfx_foreign_air_instructors_desc:0 "Every nationality has its own way of flying; Bulgarian pilots have learned most of them."
 bfx_sofia_air_defence:0 "Sofia Fighter Command"
 bfx_sofia_air_defence_desc:0 "Fighters on alert from Bozhurishte and Vrazhdebna, protecting the capital's skies."
 bfx_wings_over_the_mountains:0 "Wings over the Mountains"
 bfx_wings_over_the_mountains_desc:0 "Pilots trained to find a battalion in a valley and drop exactly enough on it."
 bfx_fortress_bulgaria:0 "Fortress Bulgaria"
 bfx_fortress_bulgaria_desc:0 "Concrete in every pass, a depot behind every ridge and a reservist who knows his trench. Whoever comes pays at the border."
 bfx_shock_divisions:0 "Legionary Shock Divisions"
 bfx_shock_divisions_desc:0 "Picked volunteers with the best rifles and the newest guns, used where the line must break."
 bfx_storm_offensive:0 "Storm Offensive"
 bfx_storm_offensive_desc:0 "The Legion has spent its momentum on one great push. For two months every company attacks at dawn."
 bfx_legionary_prefects:0 "Legionary Prefects"
 bfx_legionary_prefects_desc:0 "A prefect from the movement, a gendarmerie company and a quota of Bulgarian schools in every conquered district."
