l_english:
 bfx_neuilly_category:0 "Shackles of Neuilly"
 bfx_neuilly_category_desc:0 "§YCovert Rearmament§!: [?bfx_rearm|0] / 100  (each point cancels 1% of every Neuilly penalty)\n  rusts by §R[?bfx_rearm_decay|0]§! per month (0 with Hidden Arsenals)\n§YBalkan Suspicion§!: [?bfx_suspicion|0] / 100\n  grows by §R[?bfx_susp_growth|1]§! per month (1 + Rearmament / 25)\n\nEvery time Suspicion climbs past a threshold:\n §Y25§! notes of protest\n §Y50§! the Entente guarantees each other against us\n §Y75§! a Balkan trade embargo\n §Y100§! the Petrich border crisis\nA threshold can fire again once Suspicion has dropped 15 points below it.\n\nEnds with the §YSalonika Agreement§! or by §YTearing Up Neuilly§!."
 bfx_officer_schools:0 "Hidden Officer Schools"
 bfx_officer_schools_desc:0 "The Military Academy is officially a school of gymnastics and surveying. It has a curious amount of artillery."
 bfx_flying_clubs:0 "'Civilian' Flying Clubs"
 bfx_flying_clubs_desc:0 "Gliding is a healthy sport for young men. So is formation flying, apparently."
 bfx_skoda_fronts:0 "Škoda Rifles via Swiss Fronts"
 bfx_skoda_fronts_desc:0 "A Zurich trading house buys Czech rifles for an Ecuadorian police force that does not exist. The crates are unloaded in Burgas."
 bfx_rheinmetall_shells:0 "Rheinmetall Guns via a Dutch Shell Company"
 bfx_rheinmetall_shells_desc:0 "Rheinmetall builds them at its Swiss works in Solothurn, a Rotterdam firm invoices them as mining equipment, and the War Ministry pays in tobacco."
 bfx_labour_service:0 "Expand the Labour Service"
 bfx_labour_service_desc:0 "The Trudova Povinnost is permitted by treaty. It is not the treaty's fault that labour battalions march in step."
 bfx_reassure_capitals:0 "Reassure the Balkan Capitals"
 bfx_reassure_capitals_desc:0 "Kind words in Athens, a decoration for a Yugoslav minister and a very public inspection of a disarmed regiment."
 bfx_league_observers:0 "Wine and Dine the League Observers"
 bfx_league_observers_desc:0 "Geneva sends observers. Sofia sends them to the Black Sea resorts, and they write very positive reports."
 bfx_court_category:0 "The Tsar's Balance"
 bfx_court_category_desc:0 "Boris rules by balancing four blocs. Each one's influence (0-100) shapes the country through the §YTsar's Balance§! modifier:\n\n§YCrown§! [?bfx_inf_palace|0]: stability (above 50 helps, below hurts) and political power. Falls by 1 a month unless stability is above 60%.\n§YArmy§! [?bfx_inf_army|0]: organisation and army experience. Grows at war or when rearmament is above 50.\n§YLegions§! [?bfx_inf_legion|0]: war support and conscription. Grows with war support and fascist popularity; the Tsar's rule wears it down. §Y40§! is needed for the Legionary path.\n§YIMRO§! [?bfx_inf_imro|0]: faster war goals, but it costs stability. Grows while IMRO is tolerated.\n\n§RDanger§!: Army, Legions or IMRO above §Y80§!, the Crown below §Y20§! or the Army below §Y15§! each trigger a crisis."
 bfx_court_royal_audience:0 "Royal Audience"
 bfx_court_royal_audience_desc:0 "The Tsar receives ministers, mayors and metropolitans, one at a time, and remembers every name."
 bfx_court_promote_generals:0 "Promote the General Staff"
 bfx_court_promote_generals_desc:0 "New stars for the generals, new budgets for their divisions."
 bfx_court_purge_league:0 "Retire the Plotters"
 bfx_court_purge_league_desc:0 "The Military League's ringleaders are given early pensions and very distant postings."
 bfx_court_patronise_legions:0 "Patronise the Legions"
 bfx_court_patronise_legions_desc:0 "Ministers attend Legion rallies; Legion men are given police commissions."
 bfx_court_ban_rallies:0 "Ban the Torchlight Rallies"
 bfx_court_ban_rallies_desc:0 "No uniforms, no torches, no marching after dark."
 bfx_court_subsidise_committees:0 "Subsidise the Macedonian Committees"
 bfx_court_subsidise_committees_desc:0 "Money for schools, newspapers and, discreetly, rifles."
 bfx_court_arrest_gunmen:0 "Arrest the IMRO Gunmen"
 bfx_court_arrest_gunmen_desc:0 "The Sofia police raid the Macedonian cafés."
 bfx_court_metropolitan_blessing:0 "The Metropolitan's Blessing"
 bfx_court_metropolitan_blessing_desc:0 "Metropolitan Stefan of Sofia blesses the Crown, the army and, after some negotiation, the budget."
 bfx_court_answer_coburg:0 "Answer the Letter from Coburg"
 bfx_court_answer_coburg_desc:0 "Ferdinand writes again. A reply will bring the next letter sooner."
 bfx_tt_coburg_letter:0 "Letters from Coburg: §Y+1§! (at 3 a secret path is revealed)"
 bfx_diplomacy_category:0 "The Sofia Chancellery"
 bfx_diplomacy_category_desc:0 "Non-aggression pacts, guarantees, alliances and demands. Each proposal is sent as an event; the other side may refuse."
 bfx_dip_nap_tur:0 "Propose a Pact to Turkey"
 bfx_dip_nap_tur_desc:0 "A non-aggression pact with Turkey: one frontier fewer to watch."
 bfx_dip_nap_rom:0 "Propose a Pact to Romania"
 bfx_dip_nap_rom_desc:0 "A non-aggression pact with Romania: one frontier fewer to watch."
 bfx_dip_nap_gre:0 "Propose a Pact to Greece"
 bfx_dip_nap_gre_desc:0 "A non-aggression pact with Greece: one frontier fewer to watch."
 bfx_dip_nap_yug:0 "Propose a Pact to Yugoslavia"
 bfx_dip_nap_yug_desc:0 "A non-aggression pact with Yugoslavia: one frontier fewer to watch."
 bfx_dip_nap_sov:0 "Propose a Pact to the Soviet Union"
 bfx_dip_nap_sov_desc:0 "A non-aggression pact with the Soviet Union: one frontier fewer to watch."
 bfx_dip_nap_hun:0 "Propose a Pact to Hungary"
 bfx_dip_nap_hun_desc:0 "A non-aggression pact with Hungary: one frontier fewer to watch."
 bfx_dip_nap_ita:0 "Propose a Pact to Italy"
 bfx_dip_nap_ita_desc:0 "A non-aggression pact with Italy: one frontier fewer to watch."
 bfx_dip_guarantee_ger:0 "Ask Germany for a Guarantee"
 bfx_dip_guarantee_ger_desc:0 "A great-power guarantee makes a small kingdom expensive to invade."
 bfx_dip_guarantee_ita:0 "Ask Italy for a Guarantee"
 bfx_dip_guarantee_ita_desc:0 "A great-power guarantee makes a small kingdom expensive to invade."
 bfx_dip_guarantee_eng:0 "Ask Britain for a Guarantee"
 bfx_dip_guarantee_eng_desc:0 "A great-power guarantee makes a small kingdom expensive to invade."
 bfx_dip_guarantee_fra:0 "Ask France for a Guarantee"
 bfx_dip_guarantee_fra_desc:0 "A great-power guarantee makes a small kingdom expensive to invade."
 bfx_dip_invite_hun:0 "Invite Hungary to Our Alliance"
 bfx_dip_invite_hun_desc:0 "Hungary is invited to join our faction."
 bfx_dip_invite_rom:0 "Invite Romania to Our Alliance"
 bfx_dip_invite_rom_desc:0 "Romania is invited to join our faction."
 bfx_dip_invite_gre:0 "Invite Greece to Our Alliance"
 bfx_dip_invite_gre_desc:0 "Greece is invited to join our faction."
 bfx_dip_invite_yug:0 "Invite Yugoslavia to Our Alliance"
 bfx_dip_invite_yug_desc:0 "Yugoslavia is invited to join our faction."
 bfx_dip_invite_tur:0 "Invite Turkey to Our Alliance"
 bfx_dip_invite_tur_desc:0 "Turkey is invited to join our faction."
 bfx_dip_invite_alb:0 "Invite Albania to Our Alliance"
 bfx_dip_invite_alb_desc:0 "Albania is invited to join our faction."
 bfx_dip_give_guarantee_alb:0 "Guarantee Albania"
 bfx_dip_give_guarantee_alb_desc:0 "Bulgaria promises to defend Albania, and expects gratitude."
 bfx_dip_give_guarantee_hun:0 "Guarantee Hungary"
 bfx_dip_give_guarantee_hun_desc:0 "Bulgaria promises to defend Hungary, and expects gratitude."
 bfx_dip_give_guarantee_gre:0 "Guarantee Greece"
 bfx_dip_give_guarantee_gre_desc:0 "Bulgaria promises to defend Greece, and expects gratitude."
 bfx_dip_give_guarantee_rom:0 "Guarantee Romania"
 bfx_dip_give_guarantee_rom_desc:0 "Bulgaria promises to defend Romania, and expects gratitude."
 bfx_dip_give_guarantee_yug:0 "Guarantee Yugoslavia"
 bfx_dip_give_guarantee_yug_desc:0 "Bulgaria promises to defend Yugoslavia, and expects gratitude."
 bfx_dip_demand_dobruja:0 "Demand Southern Dobruja"
 bfx_dip_demand_dobruja_desc:0 "Ask, firmly, for the Quadrilateral. A refusal gives us a war goal."
 bfx_imro_category:0 "The Macedonian Uprising"
 bfx_imro_category_desc:0 "§YUnrest in Vardar Macedonia§!: [?bfx_macedonia_unrest|0] / 100. At §Y70§! IMRO can raise the §YIlinden banner§!: the province rises as the §YIndependent State of Macedonia§!, splitting off part of the Yugoslav army in a civil war.\nFeed the rising with volunteers, rifles and officers. If it survives §Y8 months§!, or Yugoslavia starts to collapse, Belgrade lets it go. Half a year after independence Skopje asks to join Bulgaria.\n\nUprising months: [?bfx_uprising_months|0]"
 bfx_tt_unrest_15:0 "Unrest in Vardar Macedonia: §R+15§!"
 bfx_imro_cheta_raids:0 "Cheta Raids into Vardar"
 bfx_imro_cheta_raids_desc:0 "Small bands cross at night, burn a gendarmerie post and leave leaflets."
 bfx_tt_unrest_8:0 "Unrest in Vardar Macedonia: §R+8§!"
 bfx_imro_newspapers:0 "Print the Macedonian Newspapers"
 bfx_imro_newspapers_desc:0 "Pamphlets, calendars and songbooks for every village from Kumanovo to Ohrid."
 bfx_tt_unrest_10:0 "Unrest in Vardar Macedonia: §R+10§!"
 bfx_imro_arms_caches:0 "Hide Arms Caches"
 bfx_imro_arms_caches_desc:0 "Rifles buried under church floors and in beehives."
 bfx_imro_ilinden:0 "Raise the Ilinden Banner"
 bfx_imro_ilinden_desc:0 "St Elijah's Day, 1903: IMRO rose and was crushed. This time Bulgaria is waiting across the border. Vardar Macedonia rises as the Independent State of Macedonia."
 bfx_uprising_volunteers:0 "Send Komitadji Volunteers"
 bfx_uprising_volunteers_desc:0 "Young men from the emigration cross the Osogovo passes."
 bfx_uprising_rifles:0 "Rifles over the Osogovo"
 bfx_uprising_rifles_desc:0 "Pack mules, moonless nights and very understanding border guards."
 bfx_uprising_guns:0 "Mountain Guns for Skopje"
 bfx_uprising_guns_desc:0 "Pack howitzers, broken down onto mules and reassembled in the hills."
 bfx_uprising_officers:0 "Officers on Leave"
 bfx_uprising_officers_desc:0 "Bulgarian officers take unpaid leave, grow beards and turn up in Skopje."
 bfx_uprising_recognise:0 "Recognise the Independent State"
 bfx_uprising_recognise_desc:0 "Sofia recognises Skopje and guarantees it. Belgrade will not forgive this."
 bfx_uprising_intervene:0 "Intervene Openly"
 bfx_uprising_intervene_desc:0 "The army crosses the border to help our brothers. This means war with Yugoslavia."
 bfx_integration_category:0 "Integration"
 bfx_integration_category_desc:0 "Conquered lands become core lands only once they accept Bulgarian rule. Each decision cores every §Yheld§! state of its region whose §Ycompliance§! is high enough; historically Bulgarian lands need less. Repeat as compliance rises."
 bfx_integrate_bulgarian_lands:0 "Integrate the Bulgarian Lands"
 bfx_integrate_bulgarian_lands_desc:0 "Governors, schoolteachers, a census and a new flag over the town hall. Cores on every held state of the Bulgarian Lands with compliance above 35%."
 bfx_integrate_serbia:0 "Integrate Serbia and Montenegro"
 bfx_integrate_serbia_desc:0 "Governors, schoolteachers, a census and a new flag over the town hall. Cores on every held state of Serbia and Montenegro with compliance above 65%."
 bfx_integrate_greece:0 "Integrate Greece"
 bfx_integrate_greece_desc:0 "Governors, schoolteachers, a census and a new flag over the town hall. Cores on every held state of Greece with compliance above 60%."
 bfx_integrate_albania:0 "Integrate Albania"
 bfx_integrate_albania_desc:0 "Governors, schoolteachers, a census and a new flag over the town hall. Cores on every held state of Albania with compliance above 60%."
 bfx_integrate_romania:0 "Integrate Romania and Bessarabia"
 bfx_integrate_romania_desc:0 "Governors, schoolteachers, a census and a new flag over the town hall. Cores on every held state of Romania and Bessarabia with compliance above 65%."
 bfx_integrate_anatolia:0 "Integrate Thrace and Anatolia"
 bfx_integrate_anatolia_desc:0 "Governors, schoolteachers, a census and a new flag over the town hall. Cores on every held state of Thrace and Anatolia with compliance above 70%."
 bfx_integrate_pontic_coast:0 "Integrate the Pontic Coast"
 bfx_integrate_pontic_coast_desc:0 "Governors, schoolteachers, a census and a new flag over the town hall. Cores on every held state of the Pontic Coast with compliance above 75%."
 bfx_proclaim_bulgarian_empire:0 "Proclaim the Bulgarian Empire"
 bfx_proclaim_bulgarian_empire_desc:0 "Macedonia, Thrace, Dobrudja and Edirne are ours. Whatever the regime calls itself, it now rules an empire. Every held non-core state gains compliance."
 bfx_tsargrad_category:0 "Tsargrad Propaganda"
 bfx_tsargrad_category_desc:0 "Imperial fervour: §Y[?bfx_tsargrad_fervour|0]§! / 100. Fervour speeds the empire's integration: at §Y50§! the §YTheme§! decisions core held lands at far lower compliance than normal."
 bfx_tt_fervour_10:0 "Imperial fervour: §G+10§!"
 bfx_tsargrad_radio_hour:0 "The Tsargrad Radio Hour"
 bfx_tsargrad_radio_hour_desc:0 "Byzantine chant, Simeon's letters and the dinner menu of the Imperial household, every evening."
 bfx_tt_fervour_15:0 "Imperial fervour: §G+15§!"
 bfx_tsargrad_regalia:0 "Commission the Imperial Regalia"
 bfx_tsargrad_regalia_desc:0 "A crown modelled on Simeon's, a sceptre modelled on Justinian's."
 bfx_tsargrad_orthodox_missions:0 "Orthodox Missions"
 bfx_tsargrad_orthodox_missions_desc:0 "Bulgarian priests visit every Orthodox village from Odessa to Antioch with icons, bread and maps."
 bfx_tt_fervour_m30:0 "Imperial fervour: §R-30§!"
 bfx_theme_thrace:0 "Restore the Theme of Thrace"
 bfx_theme_thrace_desc:0 "A strategos is appointed and the land written into the Imperial register. Cores on every held state of the theme with compliance above 40%."
 bfx_theme_illyricum:0 "Restore the Theme of Illyricum"
 bfx_theme_illyricum_desc:0 "A strategos is appointed and the land written into the Imperial register. Cores on every held state of the theme with compliance above 40%."
 bfx_theme_paristrion:0 "Restore the Theme of Paristrion"
 bfx_theme_paristrion_desc:0 "A strategos is appointed and the land written into the Imperial register. Cores on every held state of the theme with compliance above 40%."
