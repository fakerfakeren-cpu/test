l_english:
 bfx_neuilly_category:0 "Shackles of Neuilly"
 bfx_neuilly_category_desc:0 "§YCovert Rearmament§!: [?bfx_rearm|0] / 100   (each point cancels 1% of every Neuilly penalty)\n§YBalkan Suspicion§!: [?bfx_suspicion|0] / 100   (falls by 2 every month)\n\nSuspicion thresholds:\n §Y25§! Notes of protest from the Balkan Entente\n §Y50§! The Entente guarantees each other against us\n §Y75§! A Balkan trade embargo\n §Y100§! A border crisis at Petrich\n\nEnds with the §YSalonika Agreement§!, §YTear Up Neuilly§!, or a political path's own break with the treaty."
 bfx_officer_schools:0 "Hidden Officer Schools"
 bfx_officer_schools_desc:0 "The Military Academy is officially a school of gymnastics and surveying. It has a curious amount of artillery."
 bfx_flying_clubs:0 "'Civilian' Flying Clubs"
 bfx_flying_clubs_desc:0 "Gliding is a healthy sport for young men. So is formation flying, apparently."
 bfx_skoda_fronts:0 "Škoda Rifles via Swiss Fronts"
 bfx_skoda_fronts_desc:0 "A Zurich trading house buys Czech rifles for an Ecuadorian police force that does not exist. The crates are unloaded in Burgas."
 bfx_rheinmetall_shells:0 "Rheinmetall Guns via a Dutch Shell Company"
 bfx_rheinmetall_shells_desc:0 "Rheinmetall builds them at its Swiss works in Solothurn, a Rotterdam firm invoices them as mining equipment, and the War Ministry pays in tobacco."
 bfx_labour_service:0 "Expand the Labour Service"
 bfx_labour_service_desc:0 "The Trudova Povinnost is permitted by treaty. It is not the treaty's fault that labour battalions march in step."
 bfx_reassure_capitals:0 "Reassure the Balkan Capitals"
 bfx_reassure_capitals_desc:0 "Kind words in Athens, a decoration for a Yugoslav minister and a very public inspection of a disarmed regiment."
 bfx_league_observers:0 "Wine and Dine the League Observers"
 bfx_league_observers_desc:0 "Geneva sends observers. Sofia sends them to the Black Sea resorts, and they write very positive reports."
 bfx_imro_category:0 "IMRO Operations in Macedonia"
 bfx_imro_category_desc:0 "Macedonian unrest: §Y[?bfx_macedonia_unrest|0]§! / 3. At 3, IMRO can raise a general uprising that hands us a war goal for §YMacedonia§!."
 bfx_imro_cheta_raids:0 "Cheta Raids into Vardar"
 bfx_imro_cheta_raids_desc:0 "Small bands cross the border at night, burn a gendarmerie post and leave leaflets. The Yugoslavs are not amused."
 bfx_tt_unrest_plus_1:0 "Macedonian unrest: §R+1§!"
 bfx_imro_scientific_institute:0 "Fund the Macedonian Scientific Institute"
 bfx_imro_scientific_institute_desc:0 "Learned volumes proving, at length, that Macedonia is Bulgarian."
 bfx_imro_volunteers:0 "Recruit Komitadji Volunteers"
 bfx_imro_volunteers_desc:0 "Men who have fought in the mountains since they were boys, and who would like to do it with better rifles."
 bfx_imro_uprising:0 "The Ilinden Uprising, Again"
 bfx_imro_uprising_desc:0 "In 1903 IMRO rose on St Elijah's Day and was crushed. This time Bulgaria's army is waiting across the border."
 bfx_partisan_category:0 "Partisan Support"
 bfx_partisan_category_desc:0 "Rifles, printing presses and instructors for the comrades across the border. When a neighbour's Communists pass §Y45%§! support, they can be told to rise; once the §YBalkan Federation§! is proclaimed, red neighbours who are our subjects or allies can be §Yintegrated§!, giving us cores on their lands."
 bfx_partisans_yug:0 "Arm the Yugoslav Partisans"
 bfx_partisans_yug_desc:0 "Hay carts, false bottoms and a very understanding customs post. The Yugoslav comrades get rifles."
 bfx_revolution_yug:0 "Order the Yugoslav Rising"
 bfx_revolution_yug_desc:0 "The Yugoslav Party has the numbers. Tell it to take the streets."
 bfx_partisans_alb:0 "Arm the Albanian Partisans"
 bfx_partisans_alb_desc:0 "Hay carts, false bottoms and a very understanding customs post. The Albanian comrades get rifles."
 bfx_revolution_alb:0 "Order the Albanian Rising"
 bfx_revolution_alb_desc:0 "The Albanian Party has the numbers. Tell it to take the streets."
 bfx_partisans_gre:0 "Arm the Greek Partisans"
 bfx_partisans_gre_desc:0 "Hay carts, false bottoms and a very understanding customs post. The Greek comrades get rifles."
 bfx_revolution_gre:0 "Order the Greek Rising"
 bfx_revolution_gre_desc:0 "The Greek Party has the numbers. Tell it to take the streets."
 bfx_partisans_tur:0 "Arm the Turkish Partisans"
 bfx_partisans_tur_desc:0 "Hay carts, false bottoms and a very understanding customs post. The Turkish comrades get rifles."
 bfx_revolution_tur:0 "Order the Turkish Rising"
 bfx_revolution_tur_desc:0 "The Turkish Party has the numbers. Tell it to take the streets."
 bfx_integrate_yug:0 "Integrate Red Yugoslavia"
 bfx_integrate_yug_desc:0 "The comrades of Yugoslavia vote, unanimously and with great enthusiasm, to join the Federation. We gain cores on all their lands."
 bfx_integrate_alb:0 "Integrate Red Albania"
 bfx_integrate_alb_desc:0 "The comrades of Albania vote, unanimously and with great enthusiasm, to join the Federation. We gain cores on all their lands."
 bfx_integrate_gre:0 "Integrate Red Greece"
 bfx_integrate_gre_desc:0 "The comrades of Greece vote, unanimously and with great enthusiasm, to join the Federation. We gain cores on all their lands."
 bfx_integrate_tur:0 "Integrate Red Turkey"
 bfx_integrate_tur_desc:0 "The comrades of Turkey vote, unanimously and with great enthusiasm, to join the Federation. We gain cores on all their lands."
 bfx_integrate_rom:0 "Integrate Red Romania"
 bfx_integrate_rom_desc:0 "The comrades of Romania vote, unanimously and with great enthusiasm, to join the Federation. We gain cores on all their lands."
 bfx_integrate_hun:0 "Integrate Red Hungary"
 bfx_integrate_hun_desc:0 "The comrades of Hungary vote, unanimously and with great enthusiasm, to join the Federation. We gain cores on all their lands."
 bfx_integrate_cze:0 "Integrate Red Czechoslovakia"
 bfx_integrate_cze_desc:0 "The comrades of Czechoslovakia vote, unanimously and with great enthusiasm, to join the Federation. We gain cores on all their lands."
 bfx_cooperative_category:0 "Peasant Cooperatives and Directives"
 bfx_cooperative_category_desc:0 "The Agrarians organise villages; Zveno issues directives. Which tools are available depends on who won the 19th of May."
 bfx_coop_village:0 "Found a Village Cooperative"
 bfx_coop_village_desc:0 "A shared mill, a shared tractor and a shared argument about who uses it first."
 bfx_coop_green_congress:0 "Congress of the Green International"
 bfx_coop_green_congress_desc:0 "Peasant leaders from six countries meet in Sofia, eat lamb and agree on almost everything."
 bfx_coop_peasant_militia:0 "Muster the Peasant Militia"
 bfx_coop_peasant_militia_desc:0 "Every village sends its sons, its rifles and its opinions."
 bfx_zveno_industry_directive:0 "Directive No. 1: Industry"
 bfx_zveno_industry_directive_desc:0 "A two-page decree, a budget and a colonel to make sure it happens."
 bfx_zveno_purge_reactionaries:0 "Purge the Reactionaries"
 bfx_zveno_purge_reactionaries_desc:0 "Monarchists, IMRO men, Legionaries: the regime's enemies list is long and its patience is short."
 bfx_tsargrad_category:0 "Tsargrad Propaganda"
 bfx_tsargrad_category_desc:0 "Imperial fervour: §Y[?bfx_tsargrad_fervour|0]§! / 100. At §Y50§! or more, the §YRestore the Theme§! decisions give cores on any held lands of the old empires, however far away."
 bfx_tsargrad_radio_hour:0 "The Tsargrad Radio Hour"
 bfx_tsargrad_radio_hour_desc:0 "Every evening Radio Sofia plays Byzantine chant, reads Simeon's letters and announces the dinner menu of the Imperial household."
 bfx_tsargrad_regalia:0 "Commission the Imperial Regalia"
 bfx_tsargrad_regalia_desc:0 "A crown modelled on Simeon's, a sceptre modelled on Justinian's and an invoice modelled on Ferdinand's sense of proportion."
 bfx_tsargrad_orthodox_missions:0 "Orthodox Missions"
 bfx_tsargrad_orthodox_missions_desc:0 "Bulgarian priests visit every Orthodox village from Odessa to Antioch with icons, bread and maps."
 bfx_tt_fervour_10:0 "Imperial fervour: §G+10§!"
 bfx_tt_fervour_15:0 "Imperial fervour: §G+15§!"
 bfx_tt_fervour_m30:0 "Imperial fervour: §R-30§!"
 bfx_theme_thrace:0 "Restore the Theme of Thrace and Hellas"
 bfx_theme_thrace_desc:0 "A strategos is appointed, a cathedral rededicated and the land written into the Imperial register. Cores on every held state that is a core of GRE, TUR."
 bfx_theme_cherson:0 "Restore the Theme of Cherson"
 bfx_theme_cherson_desc:0 "A strategos is appointed, a cathedral rededicated and the land written into the Imperial register. Cores on every held state that is a core of UKR, CRI."
 bfx_theme_ravenna:0 "Restore the Theme of the Exarchate of Ravenna"
 bfx_theme_ravenna_desc:0 "A strategos is appointed, a cathedral rededicated and the land written into the Imperial register. Cores on every held state that is a core of ITA."
 bfx_theme_dacia:0 "Restore the Theme of Dacia"
 bfx_theme_dacia_desc:0 "A strategos is appointed, a cathedral rededicated and the land written into the Imperial register. Cores on every held state that is a core of ROM, HUN."
 bfx_theme_illyricum:0 "Restore the Theme of Illyricum"
 bfx_theme_illyricum_desc:0 "A strategos is appointed, a cathedral rededicated and the land written into the Imperial register. Cores on every held state that is a core of YUG, SER, CRO, SLV, BOS, MNT, MAC, ALB."
