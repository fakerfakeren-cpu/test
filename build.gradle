plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = project.mod_version
group = 'com.rimeheart'

base {
    archivesName = "rimeheart-${project.minecraft_version}"
}

// Minecraft 26.x ships Java 25 to players, so the mod targets Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            if (project.hasProperty('selftest')) {
                systemProperty 'rimeheart.selftest', 'true'
            }
        }

        register('client') {
            if (project.hasProperty('clienttest')) {
                systemProperty 'rimeheart.clienttest', 'true'
                args '--quickPlaySingleplayer', 'world', '--width', '1280', '--height', '720'
            }
        }

        register('server') {
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '1000']
}

tasks.named('processResources', ProcessResources) {
    // Leftovers from an unrelated earlier project in this repository; never ship them.
    exclude 'assets/astralfall/**', 'data/astralfall/**', 'astralfall_logo.png'
    var props = [mod_version: project.mod_version]
    inputs.properties(props)
    filesMatching('META-INF/mods.toml') {
        expand(props)
    }
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
            'Implementation-Title'  : 'Rimeheart',
            'Implementation-Version': project.version
        ])
    }
}

// Used by CI to locate the Minecraft/Forge jars for API inspection.
tasks.register('printCompileClasspath') {
    var cp = sourceSets.main.compileClasspath
    doLast {
        println 'CP=' + cp.asPath
    }
}
