l_english:
 SRD_henrys_mom_was_right:0 "Henry's Mom Was Right"
 SRD_henrys_mom_was_right_desc:0 "For years Daniel-Henry Capel's mother has told anyone who would listen that the people of the centre are communists, every last one of them. Tonight Victor Kolev climbs onto the steps of the Party House, looks out over a Largo full of red flags, and decides that she was right.\n\nCommunism grows in Sredets day by day. Once more than 30% of the district is red, the focus Proclaim the Sredets Commune makes it the Sredets Commune, and somewhere up the slopes of Vitosha, Henry will be furious."
 SRD_proclaim_the_commune:0 "Proclaim the Sredets Commune"
 SRD_proclaim_the_commune_desc:0 "A third of the centre marches under red flags, and the rest no longer dares to argue. The Party House flies the red flag, Victor becomes Chairman, and the Sredets Commune is proclaimed from the steps above the Largo.\n\nNeeds more than 30% support for communism. Sredets becomes the Sredets Commune."
 SRD_order_in_the_centre:0 "Order in the Centre"
 SRD_order_in_the_centre_desc:0 "The council is gone and the city is a mess of checkpoints and rival flags. Sredets will not join the shouting. No parties, no slogans, no committees: Victor Kolev governs the centre himself, and the trams will run on time.\n\nOpens the roads of the centre: a free Sredets, a united centre, or, if Victor waits too long, Konstantin Ilchev."
 SRD_comrades_in_oborishte:0 "Comrades in Oborishte"
 SRD_comrades_in_oborishte_desc:0 "Oborishte begins three streets east of the Party House, under the domes of Alexander Nevsky. Its cafés are full of students, its students are full of ideas, and Anton Zafirov has not yet decided which side he is on. Our people will help him decide.\n\nUnlocks the decisions of the Oborishte Question."
 SRD_red_newspapers_oborishte:0 "Red Newspapers in Oborishte"
 SRD_red_newspapers_oborishte_desc:0 "By morning every kiosk from Oborishte Street to the Doctors' Garden is selling the same paper, and it is printed in Sredets. Anton's police tear the posters down; by evening there are twice as many.\n\nUnlocks the decision Red Coup in Oborishte."
 SRD_ally_anton:0 "Ally Anton Zafirov"
 SRD_ally_anton_desc:0 "Anton is not our enemy. He is a man standing on the wrong side of a very short street. Victor will walk across it himself and offer him what nobody else in Sofia can: half of everything.\n\nNeeds Oborishte at least 20% communist. Anton is more likely to accept the more communist Oborishte is and the better he thinks of Sredets."
 SRD_anton_must_go:0 "Anton Must Go"
 SRD_anton_must_go_desc:0 "There is no room for two masters in the centre of Sofia. Anton Zafirov has had his chance to stand with the revolution, and he has spent it drinking coffee under the cathedral. The Red Guards are ready."
 SRD_north_south_pact:0 "The North-South Pact"
 SRD_north_south_pact_desc:0 "A map of Sofia is spread across a table in the Party House. Victor takes a red pencil and draws a line from Lyulin to Kremikovtsi: the north for Oborishte, the centre and the south for Sredets. Anton signs first. Neither of them mentions what happens after the last district falls."
 SRD_destroy_anton:0 "Destroy Anton Zafirov"
 SRD_destroy_anton_desc:0 "The bells of Alexander Nevsky are silent and the red flag hangs from the Holy Synod. Every street of Oborishte is in our hands; Anton Zafirov's career is over, and his district is ours to keep.\n\nNeeds every state of Oborishte under our control."
 SRD_pact_centre:0 "The Red Centre"
 SRD_pact_centre_desc:0 "The pact begins where the city began: Vazrazhdane, the old market streets around the Women's Market and Lion's Bridge. Whoever holds them holds the roads in and out of the centre.\n\nClaims and war goals on Vazrazhdane. Its cores come with the next stage, once it is held."
 SRD_pact_old_quarters:0 "The Old Quarters"
 SRD_pact_old_quarters_desc:0 "The boulevards and villas built between the wars, where Sofia's middle class still lives behind lace curtains. Krasno Selo, Slatina, Izgrev, Lozenets and Triaditsa for us; Serdika, Poduyane, Krasna Polyana and Ilinden for Anton.\n\nCores on the centre. Claims and war goals on the old quarters. Needs every state of the centre held."
 SRD_pact_housing_estates:0 "The Housing Estates"
 SRD_pact_housing_estates_desc:0 "Endless rows of panel blocks, ten floors high and a kilometre long. The estates were built for the workers; the workers will take them back. Iskar, Mladost and Studentski for us; Nadezhda and Lyulin for Oborishte.\n\nCores on the old quarters. Claims and war goals on the housing estates. Needs every state of the old quarters held."
 SRD_pact_kremikovtsi:0 "The Steelworks of Kremikovtsi"
 SRD_pact_kremikovtsi_desc:0 "Out past the airport, the chimneys of Kremikovtsi stand over the plain. The district goes to Oborishte; the steel goes to both of us, and nobody will ask what it is for.\n\nCores on the housing estates. War goals on Kremikovtsi. Needs every state of the housing estates held."
 SRD_pact_outskirts:0 "The Outskirts"
 SRD_pact_outskirts_desc:0 "Villages, orchards and the slopes of the mountains: the last of Sofia that is not red. Vitosha, Ovcha Kupel and Pancharevo for us; Vrabnitsa, Novi Iskar and Bankya for Anton.\n\nCores on Kremikovtsi. Claims and war goals on the outskirts. Needs every state of Kremikovtsi held."
 SRD_sofia_union:0 "The Union of North and South Sofia"
 SRD_sofia_union_desc:0 "From Boyana to Kremikovtsi the city is red. Victor and Anton meet on the Eagles' Bridge, exactly on the line they drew, and shake hands for the cameras. Sredets becomes South Sofia, Oborishte becomes North Sofia, and the alliance takes the only name big enough for it: Sofia.\n\nCores on everything each of us holds. Needs every state of the outskirts held."
 SRD_one_centre:0 "One Centre"
 SRD_one_centre_desc:0 "With Oborishte gone, only Vazrazhdane stands between Sredets and a centre that answers to one man. Its market halls and tram depots will make a fine headquarters.\n\nClaims and war goals on Vazrazhdane."
 SRD_united_old_quarters:0 "Take the Old Quarters"
 SRD_united_old_quarters_desc:0 "Nine districts of boulevards, parks and pre-war villas, from Krasno Selo to Ilinden. Without allies this will be slow, street by street, but nothing we take will have to be shared.\n\nCores on the centre and Oborishte. Claims and war goals on the old quarters. Needs every state of the centre held."
 SRD_united_housing_estates:0 "Take the Housing Estates"
 SRD_united_housing_estates_desc:0 "Nadezhda, Iskar, Mladost, Studentski and Lyulin: half of Sofia lives in these blocks, and half of our army will come from them.\n\nCores on the old quarters. Claims and war goals on the housing estates. Needs every state of the old quarters held."
 SRD_united_kremikovtsi:0 "Take Kremikovtsi"
 SRD_united_kremikovtsi_desc:0 "The steelworks of Kremikovtsi are the only real industry this city has. Whoever holds them can arm every district they conquer.\n\nCores on the housing estates. War goals on Kremikovtsi. Needs every state of the housing estates held."
 SRD_united_outskirts:0 "Take the Outskirts"
 SRD_united_outskirts_desc:0 "Vitosha, Ovcha Kupel, Vrabnitsa, Novi Iskar, Pancharevo and Bankya. The villages on the edge of the city have always thought themselves safe from Sofia's politics. They were wrong.\n\nCores on Kremikovtsi. Claims and war goals on the outskirts. Needs every state of Kremikovtsi held."
 SRD_sofia_commune:0 "The Sofia Commune"
 SRD_sofia_commune_desc:0 "Twenty-four districts, one flag. The Party House is no longer the seat of Sredets but of the whole city, and Victor Kolev speaks from its balcony to a Largo packed from wall to wall. Sredets is gone; there is only Sofia.\n\nCores on everything we hold. Needs every state of the outskirts held."
 SRD_peoples_militia:0 "The People's Militia"
 SRD_peoples_militia_desc:0 "Every block we take sends ten men to the district committee, and the committee gives them a red armband and a rifle. They will learn to shoot on the way to the front."
 SRD_komsomol_of_the_estates:0 "Komsomol of the Housing Estates"
 SRD_komsomol_of_the_estates_desc:0 "The teenagers of the panel blocks have spent years hanging around bus stops with nothing to do. Now they have badges, marching songs, a youth hall in every estate, and a waiting list for the front."
 SRD_party_takes_the_largo:0 "The Party Takes the Largo"
 SRD_party_takes_the_largo_desc:0 "The Largo was built to impress: three grand buildings around one square, with the Party House at its head. The ministries are emptied, the archives are sealed, and a red flag the size of a tram goes up over the government quarter."
 SRD_red_guards_of_the_stadium:0 "Red Guards of Vasil Levski Stadium"
 SRD_red_guards_of_the_stadium_desc:0 "The national stadium holds forty thousand people. On match days they come to shout; now they come to drill. Four divisions of Red Guards march out of the gates past Borisova Gradina."
 SRD_arm_the_workers:0 "Arm the Workers"
 SRD_arm_the_workers_desc:0 "Waiters from the cafés on Rakovski Street, shop assistants from TZUM, conductors from the tram depots. Every worker of the centre gets a rifle, a cartridge belt and an address to report to."
 SRD_barricades_on_vitosha:0 "Barricades on Vitosha Boulevard"
 SRD_barricades_on_vitosha_desc:0 "Café tables, tram rails, paving stones and the shop windows of the most expensive street in the country. Vitosha Boulevard is turned into a fortress from the Palace of Justice to the National Palace of Culture."
 SRD_red_officer_school:0 "The Red Officer School"
 SRD_red_officer_school_desc:0 "The old Military Academy on Evlogi Georgiev Boulevard is given a new curriculum: street fighting, political education and the history of the Party. Its first graduates will lead our divisions."
 SRD_tram_depot_tank_works:0 "The Tram Depot Tank Works"
 SRD_tram_depot_tank_works_desc:0 "A tram is already a steel box on wheels. Add armour plate, swap the wheels for tracks and put a gun on top: the depot workers swear it will be the finest tank in the Balkans."
 SRD_universal_service:0 "Every Comrade Serves"
 SRD_universal_service_desc:0 "From the Largo to the Lions' Bridge, every comrade between eighteen and sixty is given a rifle number and a unit to report to. Nobody in the centre will be able to say the revolution did not need them."
 SRD_commissars_in_every_unit:0 "Commissars in Every Unit"
 SRD_commissars_in_every_unit_desc:0 "A Party man in every platoon: he reads the newspaper aloud, he writes the reports, and he makes sure that the Red Guards never forget what they are fighting for, or who they answer to."
 SRD_red_air_over_the_centre:0 "Red Wings over the Centre"
 SRD_red_air_over_the_centre_desc:0 "Tsar Osvoboditel Boulevard is straight, wide and paved in yellow brick. With the lamp posts taken down it makes a perfectly good runway, and the Party's first squadron takes off over the Russian Church."
 SRD_metro_goes_to_war:0 "The Shelters Beneath the Centre"
 SRD_metro_goes_to_war_desc:0 "Under the Largo lie the ruins of Roman Serdica, and under the ruins there is room for thousands. The cellars are linked into shelters and supply tunnels, and anti-aircraft guns go up on every rooftop around them."
 SRD_red_leaflets:0 "Red Leaflets over Vitosha"
 SRD_red_leaflets_desc:0 "Henry's district is villas, pine forest and people who think the revolution is something that happens to other neighbourhoods. A few thousand leaflets in the letterboxes of Vitosha should change that."
 SRD_road_to_boyana:0 "The Road to Boyana"
 SRD_road_to_boyana_desc:0 "Sredets does not touch Vitosha: Lozenets lies between us, and Lozenets belongs to Georgi Yanchovichin. Georgi and Victor go back further than any party or flag. They are day ones. Victor picks up the phone and asks him to stand with Sredets against Henry.\n\nGeorgi is more likely to say yes the better he thinks of Sredets. If Lozenets is already our ally or no longer exists, nobody needs to be asked."
 SRD_capel_question:0 "The Capel Question"
 SRD_capel_question_desc:0 "Daniel-Henry Capel hates communism, hates Sredets and, above all, hates being proven wrong by his own mother. As long as he sits in Boyana, every red flag in Sofia has a rifle pointed at it from the mountain. It is time to answer the Capel Question."
 SRD_red_flag_over_boyana:0 "Red Flag over Boyana"
 SRD_red_flag_over_boyana_desc:0 "The red flag flies over Boyana Church and the forest roads up to Dragalevtsi. Henry's villa has become a rest home for tired Red Guards. Somewhere, his mother is telling anyone who will listen that she said this would happen.\n\nNeeds every state of Vitosha under our control."
 SRD_collectivise_vitosha_boulevard:0 "Collectivise Vitosha Boulevard"
 SRD_collectivise_vitosha_boulevard_desc:0 "Gucci, Hugo Boss and a hundred smaller boutiques: the most expensive street in Bulgaria now belongs to the people. The tailors stay, the sewing machines stay, and the workshops behind the shop windows start working for the Party."
 SRD_mimas_for_the_workers:0 "Mimas Döner for the Workers"
 SRD_mimas_for_the_workers_desc:0 "Mimas on Graf Ignatiev has never closed, not for holidays, not for elections and not for revolutions. It is now the official canteen of the Sredets Commune, and the queue at four in the morning is the most united front in the city."
 SRD_party_arsenal:0 "The Party Arsenal"
 SRD_party_arsenal_desc:0 "Bakeries, print shops and car repair garages all over the centre are given new orders and new tools. The back rooms that used to smell of bread now smell of gun oil."
 SRD_red_tourism:0 "Red Tourism"
 SRD_red_tourism_desc:0 "The tourists still come to photograph the cathedral and the yellow bricks. Now they buy their postcards from the Party, sleep in Party hotels and leave Party tips. Every lev goes into a new factory."
 SRD_red_university:0 "The Red University"
 SRD_red_university_desc:0 "Sofia University stands on Tsar Osvoboditel, two hundred metres from the Party House. Its physicists are moved into the laboratories of the Faculty of Physics and asked one question: how to build a better radio."
 SRD_socialist_emulation:0 "Socialist Emulation"
 SRD_socialist_emulation_desc:0 "Every factory in the commune now competes with every other. The winning shift gets its photograph in the newspaper, a red pennant on the wall and a free döner each. The losing shift gets the night shift."
 SRD_five_year_plan:0 "Five-Year Plan for the Centre"
 SRD_five_year_plan_desc:0 "Planners from the Party House count every factory, every tram and every pothole in the centre, then write a plan to double the first and fill the last. It will be completed in five years, or in four, if the workers love the Party enough."
 SRD_star_on_the_party_house:0 "The Star on the Party House"
 SRD_star_on_the_party_house_desc:0 "A ruby star once crowned the spire of the Party House. The engineers who put it back up are rewarded with their own institute, and the Party's best minds go back to work beneath it."
 SRD_electrify_the_districts:0 "Electrify the Districts"
 SRD_electrify_the_districts_desc:0 "Communism is the Party plus the electrification of the whole city. New lines run from the power station to every district we hold, and the street lamps of the commune burn all night."
 SRD_curfew_on_the_largo:0 "Curfew on the Largo"
 SRD_curfew_on_the_largo_desc:0 "From ten in the evening the Largo belongs to the patrols. The cafés close early, the trams stop at the bridges and anyone out after dark had better have a very good reason and the right stamp on their papers."
 SRD_centres_own_guard:0 "The Centre's Own Guard"
 SRD_centres_own_guard_desc:0 "The district guard of Sredets is given new uniforms, new rifles and a single order: keep the centre quiet. Recruits are taken from the police, the fire brigade and the doormen of the ministries."
 SRD_who_stands_with_sredets:0 "Who Stands with Sredets?"
 SRD_who_stands_with_sredets_desc:0 "Order has returned to the centre. Now Victor must decide what it is for: a free Sredets that owes nobody, or the dream of a united centre. If he cannot make up his mind, his old physics teacher will make it for him."
 SRD_a_free_sredets:0 "A Free Sredets"
 SRD_a_free_sredets_desc:0 "The patrols are called off the Largo at dawn. The checkpoints on the bridges are taken down, the papers with the right stamps go into the stove, and by noon the cafés on Vitosha Boulevard have their chairs out again. Victor Kolev's centre will be free, and it will be free on its own: no gangs, no pacts, no favours owed to anyone.\n\nSredets can no longer create or join factions. Democracy grows day by day; once more than 30% of the district supports it, the focus Proclaim the Free Sredets makes Sredets a democracy under Victor, with a blue flag."
 SRD_proclaim_the_free_sredets:0 "Proclaim the Free Sredets"
 SRD_proclaim_the_free_sredets_desc:0 "A third of the centre stands behind the free district, and nobody wants the curfew back. A blue flag goes up over the district hall and Victor Kolev proclaims the Free Sredets: governed by its own people, with no curfew ever again.\n\nNeeds more than 30% support for democracy. Sredets becomes a democracy under Victor, with a blue flag."
 SRD_speakers_corner:0 "Speakers' Corner at the Crystal"
 SRD_speakers_corner_desc:0 "The little park of the Crystal on Rakovski Street has seen every protest Sofia ever had. Now anyone may climb on a bench there and say what they like about anyone, including Victor. Many do. Victor listens, and some days he even takes notes."
 SRD_volunteers_of_the_centre:0 "Volunteers of the Centre"
 SRD_volunteers_of_the_centre_desc:0 "Nobody is drafted in a free Sredets, and nobody needs to be. Students from the university, waiters from the Largo and pensioners from the Women's Market sign up at the recruiting tables in front of the Ivan Vazov Theatre."
 SRD_free_press_on_rakovski:0 "Free Press on Rakovski Street"
 SRD_free_press_on_rakovski_desc:0 "The printing houses behind the theatres are unsealed. Within a week the centre has eleven newspapers, three of them against the government, one of them about football and all of them sold out by eight in the morning. Copies are smuggled into every district around us.\n\nDemocracy slowly grows in every neighbour."
 SRD_open_market_on_vitosha:0 "Open Market on Vitosha Boulevard"
 SRD_open_market_on_vitosha_desc:0 "No permits, no party stamps, no tax on the stalls. Traders from every district of Sofia come to sell on Vitosha Boulevard, and the workshops of the centre run day and night to keep up."
 SRD_liberty_guard:0 "The Liberty Guard"
 SRD_liberty_guard_desc:0 "When the bells of Sveta Nedelya ring the alarm, every volunteer knows his post: a doorway, a bridge, a roof over the boulevard. A free district has to be ready to defend itself, because nobody else will."
 SRD_prove_henrys_mom_wrong:0 "Prove Henry's Mom Wrong"
 SRD_prove_henrys_mom_wrong_desc:0 "For years Daniel-Henry Capel's mother has told anyone who would listen that the people of the centre are communists, every last one of them. Free newspapers, a free market on Vitosha Boulevard and not a single red flag on the Largo say otherwise. Victor sends her an invitation: come and see for yourself.\n\nHenry's mother visits the free centre, and the whole city hears what she says about it. Henry thinks better of us, and democracy slowly grows in Vitosha."
 SRD_friends_of_freedom:0 "Friends of Freedom"
 SRD_friends_of_freedom_desc:0 "Victor still has friends in the districts around the centre, and the free centre has admirers there too. Our clubs, newspapers and student societies open branches in Oborishte, Lozenets and Triaditsa.\n\nDemocracy grows in Oborishte, Lozenets and Triaditsa for eight months, and they think better of us."
 SRD_workshops_of_the_free_centre:0 "Workshops of the Free Centre"
 SRD_workshops_of_the_free_centre_desc:0 "Freedom has to be defended, and rifles do not grow on the trees of the City Garden. The cellar workshops of the centre take orders from the Liberty Guard."
 SRD_drills_in_borisova_garden:0 "Drills in Borisova Garden"
 SRD_drills_in_borisova_garden_desc:0 "Every Sunday the volunteers march out to Borisova Garden and drill between the lakes and the old trees, watched by families with picnics. The officers are ex-guardsmen; the tactics are new."
 SRD_offer_to_anton:0 "An Offer to Anton"
 SRD_offer_to_anton_desc:0 "Anton Zafirov lives three streets from the district hall. Victor walks over himself, without guards, and asks him a simple question: will Oborishte join the free centre?\n\nOborishte is asked to join Sredets, all of it, peacefully. Anton will most likely say no; the more he likes us and the more democratic Oborishte is, the better our chances."
 SRD_offer_to_georgi:0 "An Offer to Georgi"
 SRD_offer_to_georgi_desc:0 "Georgi Yanchovichin is Victor's day one, but Lozenets is his, and day ones do not give away their districts lightly. Victor asks anyway, over coffee, the way they always talked.\n\nGeorgi is asked to hand North Lozenets and Lozenets, the quarters by the centre, to Sredets peacefully; the rest of Lozenets stays his. Georgi will most likely say no; the more he likes us and the more democratic Lozenets is, the better our chances."
 SRD_liberate_the_old_centre:0 "Liberate the Old Centre"
 SRD_liberate_the_old_centre_desc:0 "The Women's Market of Vazrazhdane and the cathedral square of Oborishte are a ten-minute walk from the Largo, and behind their checkpoints people still need a stamp to cross the street. A free centre cannot end at a barricade.\n\nCores on Vazrazhdane and Oborishte, and war goals on them if they have not joined us."
 SRD_offer_to_alexander:0 "An Offer to Alexander"
 SRD_offer_to_alexander_desc:0 "Alexander Dimitrov will listen politely, agree with everything and then do what he likes. Victor puts the offer in writing, so at least Alexander has to read it twice.\n\nAlexander is asked to hand the Triaditsa state, by the centre, to Sredets peacefully; the rest of Triaditsa stays his. Alexander will most likely say no; the more he likes us and the more democratic Triaditsa is, the better our chances."
 SRD_the_wider_centre:0 "The Wider Centre"
 SRD_the_wider_centre_desc:0 "The old centre is free. Its edges are not: the streets around the Ivan Vazov quarter, the old villas of Lozenets, Kriva Reka and Lagera, and the railway quarter north of the Lions' Bridge still answer to someone else.\n\nCores and war goals on the central states of Triaditsa, Lozenets, Krasno Selo and Serdika (Triaditsa, North Lozenets, Lozenets, Kriva Reka, Lagera, North City Centre, Serdika). Needs every state of Vazrazhdane and Oborishte held, and the offers to Anton, Georgi and Alexander made first."
 SRD_a_free_centre:0 "A Free Centre"
 SRD_a_free_centre_desc:0 "From Lagera to the Eagles' Bridge, from the Lions' Bridge to the villas of Lozenets, the whole centre of Sofia answers to one council and has no checkpoints at all.\n\nNeeds every central state of Triaditsa, Lozenets, Krasno Selo and Serdika held."
 SRD_free_centre_of_sofia:0 "The Free Centre of Sofia"
 SRD_free_centre_of_sofia_desc:0 "Sredets is too small a name for what it has become. Alone, and without a single curfew, Victor Kolev's district has made the whole centre of Sofia one free city.\n\nSredets becomes the Free Centre of Sofia."
 SRD_a_temporary_emergency:0 "A Temporary Emergency"
 SRD_a_temporary_emergency_desc:0 "The whole centre is free, and the whole centre is surrounded by districts that want it back. Just for a little while, Victor explains, the curfew returns. Just until it is safe. The blue flag comes down for cleaning and somehow never goes back up.\n\nThe free centre ends: Sredets drops democracy, Victor rules alone again, and the guard runs the ministries (the spirit Rule by the Guard). Opens the road to the Directorate of Sofia."
 SRD_united_centre:0 "The Dream of a United Centre"
 SRD_united_centre_desc:0 "Ever since the city fell apart, Victor Kolev has had one dream: the centre of Sofia whole again, from the Women's Market to the villas of Lozenets, under one hand and one guard. Not a commune, not a free city, just the centre as it should be.\n\nSredets sets out to unite the centre."
 SRD_order_on_the_boulevards:0 "Order on the Boulevards"
 SRD_order_on_the_boulevards_desc:0 "Patrols on Vitosha Boulevard and Tsar Osvoboditel, lamps fixed, trams on time. Before the centre can be united it has to be run properly, and everyone has to see that it is."
 SRD_rule_by_the_guard:0 "Rule by the Guard"
 SRD_rule_by_the_guard_desc:0 "The district guard is the only thing in the centre that works. Victor gives it the ministries too: an officer in every office, a sentry at every door and a curfew whenever it is needed."
 SRD_bread_and_circuses:0 "Bread and Circuses"
 SRD_bread_and_circuses_desc:0 "A full stomach does not riot, and a full stadium does not plot. Cheap bread, free football and a band on the Largo every Sunday: the centre will love Victor, or at least be too busy to mind him."
 SRD_officers_in_the_ministries:0 "Officers in the Ministries"
 SRD_officers_in_the_ministries_desc:0 "Colonels run the post office, majors run the trams and a general runs the bakeries. Everything is late, but everything is in uniform."
 SRD_derby_at_the_national_stadium:0 "Derby at the National Stadium"
 SRD_derby_at_the_national_stadium_desc:0 "Levski against CSKA, the whole centre in the stands and Victor in the box of honour. Between the halves the recruiting sergeants work the crowd."
 SRD_the_guard_is_the_state:0 "The Guard Is the State"
 SRD_the_guard_is_the_state_desc:0 "There is no longer any difference between the guard and the government of the centre. Nobody remembers when the change happened, and nobody asks."
 SRD_only_good_news:0 "Only Good News"
 SRD_only_good_news_desc:0 "Every newspaper in the centre now has the same editor, and he only prints good news. The newsreels before the films are even better."
 SRD_the_directors_office:0 "The Director's Office"
 SRD_the_directors_office_desc:0 "A new office on the top floor of the Party House, a new title on the door and a new chair behind the desk. Victor does not use the title yet. He is waiting for the centre to be whole.\n\nNeeded for the Directorate of Sofia."
 SRD_the_centres_army:0 "The Centre's Army"
 SRD_the_centres_army_desc:0 "The district guard becomes an army: proper ranks, proper drill and barracks in the old ministries.\n\nUnlocks the decision Parade on Tsar Osvoboditel."
 SRD_march_on_the_old_centre:0 "March on the Old Centre"
 SRD_march_on_the_old_centre_desc:0 "The Women's Market of Vazrazhdane is a ten-minute walk from the Largo, and it still answers to somebody else. The first step to a united centre is the shortest.\n\nCores and war goals on Vazrazhdane."
 SRD_the_centre_takes_shape:0 "The Centre Takes Shape"
 SRD_the_centre_takes_shape_desc:0 "Vazrazhdane is ours. Now the edges of the centre: the streets around the Ivan Vazov quarter, the old villas of Lozenets, Kriva Reka and Lagera, and the railway quarter north of the Lions' Bridge.\n\nCores and war goals on the central states of Triaditsa, Lozenets, Krasno Selo and Serdika (Triaditsa, North Lozenets, Lozenets, Kriva Reka, Lagera, North City Centre, Serdika). Needs every state of Vazrazhdane held."
 SRD_the_khan_must_fall:0 "The Khan Must Fall"
 SRD_the_khan_must_fall_desc:0 "Twelve centuries ago Khan Krum took Serdica from the Byzantines. Now he sits in the Central Railway Station in chain mail, drinking from a cup nobody wants to look at, and calls the centre his tribute. The centre disagrees.\n\nOnly while Khan Krum rules Serdika. Cores and war goals on all of Serdika."
 SRD_krums_cup:0 "Krum's Cup"
 SRD_krums_cup_desc:0 "The Khan is gone, and his famous cup stands on Victor's desk in the Party House. Nobody drinks from it. Everybody who visits looks at it, though, and remembers who keeps it now.\n\nNeeds Serdika gone."
 SRD_the_centre_is_one:0 "The Centre Is One"
 SRD_the_centre_is_one_desc:0 "From Lagera to the Eagles' Bridge, the centre answers to one district hall. Only one question is left: Oborishte.\n\nNeeds every central state of Triaditsa, Lozenets, Krasno Selo and Serdika held."
 SRD_bring_anton_in:0 "Bring Anton In"
 SRD_bring_anton_in_desc:0 "The centre is not whole while the cathedral square answers to Anton Zafirov. He was a friend once. He can still be one, inside the centre.\n\nCores and war goals on Oborishte."
 SRD_anton_at_our_side:0 "Anton at Our Side"
 SRD_anton_at_our_side_desc:0 "Oborishte stays Anton's. The centre and Oborishte stand together instead: a guarantee, an open border on Shipka Street and a standing invitation to the district hall.\n\nAnton thinks better of us; we guarantee Oborishte, or bring it into our faction if we have one."
 SRD_the_united_centre:0 "The United Centre"
 SRD_the_united_centre_desc:0 "The cathedral square, the Women's Market, the villas of Lozenets and the Largo: one centre, under one hand, Oborishte included. Victor's dream has come true.\n\nNeeds every state of Oborishte held."
 SRD_the_centre_and_oborishte:0 "The Centre and Oborishte"
 SRD_the_centre_and_oborishte_desc:0 "The centre is united, and Oborishte stands next to it as a friend, not a province. Victor's dream has come true, with Anton at his side."
 SRD_proclaim_the_directorate:0 "Proclaim the Directorate of Sofia"
 SRD_proclaim_the_directorate_desc:0 "A district is too small a thing for what the centre has become. From the balcony of the Party House, Victor Kolev proclaims the Directorate of Sofia: one city, one guard, one Director. The other districts are not asked. They will be told.\n\nNeeds the whole centre held (Vazrazhdane and the central states of Triaditsa, Lozenets, Krasno Selo and Serdika). Sredets becomes the Directorate of Sofia with a new flag, and Victor becomes the Director."
 SRD_one_directorate:0 "One Directorate"
 SRD_one_directorate_desc:0 "Every street the Directorate holds is the Directorate, whoever ruled it before. The old district borders are painted over on every map in the Party House.\n\nCores on every state we own; any subject is annexed."
 SRD_sofia_answers_to_the_director:0 "Sofia Answers to the Director"
 SRD_sofia_answers_to_the_director_desc:0 "The centre was only the beginning. Every district that borders the Directorate gets the same letter, and this time there is no deadline.\n\nWar goals on every neighbour outside our faction."
 SRD_unleash_the_c_class:0 "Unleash the C Class Hools"
 SRD_unleash_the_c_class_desc:0 "Every school has a class like the C Class: loud, loyal, impossible to teach and absolutely fearless. Now they have grown up, two of them rule districts of their own, and they have been waiting for a reason. Victor gives them one.\n\nCreates the faction The C Class Hools. Not possible with the Evil Gang: it is one or the other."
 SRD_call_alexander:0 "Call Alexander"
 SRD_call_alexander_desc:0 "Alexander Dimitrov sat in the back row of the C Class and never once got caught. Triaditsa is his now, and the class wants him back.\n\nTriaditsa is asked to join the C Class Hools. He was one of us: he will almost certainly say yes."
 SRD_call_poryazov:0 "Call Georgi Poryazov"
 SRD_call_poryazov_desc:0 "Georgi Poryazov was always the last to arrive and the last to leave, and the C Class never had a fight he missed. Mladost has more men than anyone.\n\nMladost is asked to join the C Class Hools. He was one of us: he will almost certainly say yes."
 SRD_away_days:0 "Away Days"
 SRD_away_days_desc:0 "Every firm knows the rule: on away days you go to their ground. The C Class marches together, flares lit, into whichever district is foolish enough to be next.\n\nEvery member of the C Class Hools attacks harder for six months."
 SRD_champions_of_sofia:0 "Champions of Sofia"
 SRD_champions_of_sofia_desc:0 "Every firm in Sofia now knows who the champions are. The C Class marches through the centre with scarves held high, and nobody dares to look them in the eye.\n\nEvery member of the C Class Hools gets the Champions of Sofia spirit."
 SRD_ilchevs_lesson:0 "The Physics Teacher Steps In"
 SRD_ilchevs_lesson_desc:0 "Konstantin Ilchev has watched his former student run Sredets for long enough. One morning he walks into the Party House with a red pen and a stack of marked exam papers, and the guards, who all sat in his classes too, let him straight through.\n\nOnly from 1937, if Victor has still not chosen a road by then. Victor Kolev is sent to detention. Ilchev leads Sredets now."
 SRD_newtons_laws:0 "Newton's Laws of Government"
 SRD_newtons_laws_desc:0 "First law: a district at rest stays at rest unless acted upon by Ilchev. Second law: the force of a decree equals the mass of paperwork times its acceleration. Third law: for every complaint there is an equal and opposite detention."
 SRD_laboratory_of_the_nation:0 "Laboratory of the Nation"
 SRD_laboratory_of_the_nation_desc:0 "The ministries are turned into laboratories, and the laboratories into ministries. Every civil servant in Sredets now wears a white coat and keeps a lab notebook."
 SRD_homework_for_everyone:0 "Homework for Everyone"
 SRD_homework_for_everyone_desc:0 "Every household of the centre receives a worksheet each Monday, due by Friday. Late submissions are not accepted. The factories have never been so well organised."
 SRD_pop_quiz_for_the_army:0 "Pop Quiz for the Army"
 SRD_pop_quiz_for_the_army_desc:0 "Officers who cannot calculate a shell's trajectory on paper are sent back to the barracks to study. The officers who can are promoted. Ilchev marks every paper himself."
 SRD_e_equals_mc2:0 "E = mc²"
 SRD_e_equals_mc2_desc:0 "Energy equals mass times the speed of light squared. Ilchev writes it on the blackboard of the Council Chamber and explains, very slowly, what it could mean for a small district with enemies on every side."
 SRD_the_final_exam:0 "The Final Exam"
 SRD_the_final_exam_desc:0 "Vazrazhdane and Oborishte have failed every test of good neighbourliness. Ilchev sets them one final exam, and he has already decided the grade.\n\nClaims and war goals on Vazrazhdane and Oborishte."
 SRD_grades_are_final:0 "Grades Are Final"
 SRD_grades_are_final_desc:0 "There will be no resits. The centre has been marked, graded and filed under Sredets.\n\nCores on the states held. Needs every state of Vazrazhdane and Oborishte held."
 SRD_call_the_evil_gang:0 "Propose the Evil Gang"
 SRD_call_the_evil_gang_desc:0 "Long before the city fell apart, there was a group chat. It had a ridiculous name, a profile picture taken on the steps of a theatre and every one of the people who now rule half the districts of Sofia.\n\nVictor opens it again and proposes the Evil Gang. The letters go out one by one: to Georgi Poryazov now, to Daniel-Henry Capel in a month, to Stefan Kartunov in two. Each is more likely to say yes the better he thinks of Sredets.\n\nNeeds Who Stands with Sredets?. Not possible for a free Sredets or with the C Class Hools."
 SRD_destroy_henry:0 "Destroy Henry"
 SRD_destroy_henry_desc:0 "Henry tore up the letter. His mother says she always knew the gang was a bad influence. Fine: if Daniel-Henry Capel will not stand with the gang, he will not stand at all.\n\nOnly if Henry refused the Evil Gang. Claims and war goals on Vitosha."
 SRD_invite_georgi:0 "Invite Georgi Yanchovichin"
 SRD_invite_georgi_desc:0 "Georgi does not need an invitation. He is a day one; he was in the chat before the chat had a name. Victor sends him one anyway, because that is how it is done.\n\nLozenets is invited to the Evil Gang. As Victor's day one, Georgi is the most likely of all to say yes."
 SRD_destroy_stefan:0 "Destroy Stefan"
 SRD_destroy_stefan_desc:0 "Stefan rules the courtyards of Krasna Polyana and trusts nobody from the centre, and now he has said it out loud. The gang does not forget.\n\nOnly if Stefan refused the Evil Gang. Claims and war goals on Krasna Polyana."
 SRD_vitosha_award:0 "The Vitosha Award"
 SRD_vitosha_award_desc:0 "Vitosha is ours, and the gang is waiting for its share. Victor spreads the map on the table and draws the lines himself, like an arbiter in an old treaty. Sredets wants nothing from Henry: every street of Vitosha goes to the friends who stood by Victor.\n\nSredets takes nothing. Georgi Poryazov: Simeonovo; Stefan Kartunov: Marchaevo, Knyazhevo; Georgi Yanchovichin: Dragalevtsi, Zlatni Mostove; Alexander Dimitrov: Vitosha, Karpuzitsa. If a friend is not in the gang, his share goes to the nearest friend who is."
 SRD_invite_dimitrov:0 "Invite Alexander Dimitrov"
 SRD_invite_dimitrov_desc:0 "Alexander will listen politely, agree with everything and then do what he likes. In the gang, that was exactly why everyone liked him.\n\nTriaditsa is invited to the Evil Gang."
 SRD_invite_anton:0 "Invite Anton Zafirov"
 SRD_invite_anton_desc:0 "Anton is three streets away and has never once missed a gang meeting. Whether he still remembers that depends on how he feels about Sredets these days.\n\nOborishte is invited to the Evil Gang. Anton is more likely to accept the better he thinks of Sredets."
 SRD_the_evil_gang_rules_sofia:0 "The Evil Gang Rules Sofia"
 SRD_the_evil_gang_rules_sofia_desc:0 "Whoever came, came. The Evil Gang is no longer a group chat, it is the strongest alliance in Sofia, and everyone outside it is about to find out what that means.\n\nEvery member of the Evil Gang gets the Evil Gang spirit. War goals on every neighbour outside the gang."
 SRD_workshops_of_sofia:0 "The Workshops of Sofia"
 SRD_workshops_of_sofia_desc:0 "Before the war, the centre made shoes, radios, cigarettes and trams. The machines are still there, under dust sheets in the courtyards. It is time to take the sheets off."
 SRD_courtyard_workshops:0 "Courtyard Workshops"
 SRD_courtyard_workshops_desc:0 "Every courtyard behind the boulevards gets a workshop, every workshop gets a lathe, and every lathe works two shifts."
 SRD_cellar_arsenals:0 "Cellar Arsenals"
 SRD_cellar_arsenals_desc:0 "The cellars under the old ministries are dry, deep and safe from shelling: the perfect place to make rifles."
 SRD_tram_lines:0 "Rebuild the Tram Lines"
 SRD_tram_lines_desc:0 "The yellow trams carry workers in the morning and shells in the afternoon. Every line that runs again is a factory that can open."
 SRD_construction_brigades:0 "Construction Brigades"
 SRD_construction_brigades_desc:0 "Bricklayers, carpenters and anyone who can carry a bucket are organised into brigades. Buildings go up faster when someone is counting."
 SRD_night_shifts:0 "Night Shifts"
 SRD_night_shifts_desc:0 "The lights in the workshops no longer go out. Nobody is happy about it, but the output figures are."
 SRD_rail_yard_arms:0 "Arms from the Rail Yards"
 SRD_rail_yard_arms_desc:0 "The repair sheds of the railway can rivet a boiler, so they can rivet a gun carriage."
 SRD_basement_laboratories:0 "Basement Laboratories"
 SRD_basement_laboratories_desc:0 "Chemistry teachers, radio amateurs and one very strange engineer are given a basement each and told to invent something useful."
 SRD_market_halls_reopen:0 "The Market Halls Reopen"
 SRD_market_halls_reopen_desc:0 "The Central Market Hall on Maria Luiza Boulevard opens its doors again, and with the traders come money, goods and the workshops that supply them."
 SRD_the_war_factories:0 "The War Factories"
 SRD_the_war_factories_desc:0 "The workshops and the rail yards are joined into proper war factories, with a manager, a quota and a guard on the gate."
 SRD_ammunition_works:0 "Ammunition in the Cellars"
 SRD_ammunition_works_desc:0 "A war is won by whoever runs out of bullets last. The cellars fill up with crates."
 SRD_the_polytechnic:0 "The Polytechnic"
 SRD_the_polytechnic_desc:0 "The engineering school reopens its lecture halls. Half its students are already working in the basements."
 SRD_tsarigradsko_factories:0 "Factories on Tsarigradsko Shose"
 SRD_tsarigradsko_factories_desc:0 "The road east out of the centre was always lined with factories. It will be again."
 SRD_arsenal_of_sofia:0 "The Arsenal of Sofia"
 SRD_arsenal_of_sofia_desc:0 "No district in Sofia makes more weapons than ours. Every other district knows it, and that is the point."
 SRD_industrial_heart_of_sofia:0 "The Industrial Heart of Sofia"
 SRD_industrial_heart_of_sofia_desc:0 "Smoke over the rooftops, sirens at shift change and trams full of workers at dawn: the centre is the industrial heart of Sofia again."
 SRD_district_guard_reformed:0 "The District Guard Reformed"
 SRD_district_guard_reformed_desc:0 "The district guard was a mob with rifles. It needs ranks, drill and somebody who has read a manual."
 SRD_rifle_clubs:0 "Rifle Clubs"
 SRD_rifle_clubs_desc:0 "Every school and every football club gets a rifle range. The young men of the centre learn to shoot straight before they learn to shave."
 SRD_sergeants_of_the_old_army:0 "Sergeants of the Old Army"
 SRD_sergeants_of_the_old_army_desc:0 "The old sergeants of the Bulgarian army are found in the cafés and the pensioners' clubs and given their stripes back."
 SRD_pilots_from_vrazhdebna:0 "Pilots from Vrazhdebna"
 SRD_pilots_from_vrazhdebna_desc:0 "The airfield at Vrazhdebna still has a few aeroplanes and the men who know how to fly them. They are offered a salary and a runway in the centre."
 SRD_artillery_in_the_parks:0 "Artillery in the Parks"
 SRD_artillery_in_the_parks_desc:0 "The City Garden and Borisova Garden become gun parks. The pigeons are not happy."
 SRD_field_kitchens:0 "Field Kitchens on the Boulevards"
 SRD_field_kitchens_desc:0 "An army marches on its stomach, and the centre has the best bakeries in Sofia."
 SRD_street_fighting_school:0 "Street Fighting School"
 SRD_street_fighting_school_desc:0 "Every war in Sofia is fought from doorway to doorway. The guard learns to take a staircase, hold a courtyard and never stand in front of a window."
 SRD_fighters_over_the_centre:0 "Fighters over the Centre"
 SRD_fighters_over_the_centre_desc:0 "Nothing flies over the Party House without permission, and permission is never given."
 SRD_armoured_trams:0 "Armoured Trams"
 SRD_armoured_trams_desc:0 "Steel plates bolted to a tram, a machine gun in the driver's window: the first tanks of Sofia run on rails."
 SRD_officer_corps:0 "The Officer Corps"
 SRD_officer_corps_desc:0 "The military academy on Evlogi Georgiev Boulevard trains officers again, and every one of them swears loyalty to the centre."
 SRD_anti_air_belt:0 "The Anti-Air Belt"
 SRD_anti_air_belt_desc:0 "Guns on the roofs, a radar on the tallest building and searchlights in every square."
 SRD_requisition_the_taxis:0 "Requisition the Taxis"
 SRD_requisition_the_taxis_desc:0 "Every taxi in the centre gets a new passenger: four soldiers and a machine gun."
 SRD_locomotive_works_armour:0 "Armour from the Locomotive Works"
 SRD_locomotive_works_armour_desc:0 "The locomotive works can build a boiler that holds twenty atmospheres. A turret is easier."
 SRD_general_staff:0 "The General Staff"
 SRD_general_staff_desc:0 "Maps on every wall of the old Ministry of War, and officers who know what every pin on them means."
 SRD_bombers_from_bozhurishte:0 "Bombers from Bozhurishte"
 SRD_bombers_from_bozhurishte_desc:0 "The old airfield at Bozhurishte, west of the city, can launch bombers over any district in Sofia."
 SRD_the_army_of_the_centre:0 "The Army of the Centre"
 SRD_the_army_of_the_centre_desc:0 "Rifles, guns, armour, aeroplanes and officers who know what to do with all of them: the army of the centre is the best in Sofia."
 SRD_comrades_in_oborishte_unlocks:0 "Unlocks the decisions §YThe Oborishte Question§!."
 SRD_united_centre_unlocks:0 "The C Class Hools and the Evil Gang cannot both be made: whichever comes first locks the other."
 evil_sofia_srd.1.a:0 "She was right. We will never forgive them."
 evil_sofia_srd.1.b:0 "No more waiting. Prepare for war!"
 evil_sofia_srd.1.t:0 "Henry's Mom Was Right"
 evil_sofia_srd.1.d:0 "The news reaches Vitosha before dinner. Sredets has declared for communism; there are red flags on the Largo and Victor Kolev is calling himself Chairman.\n\nDaniel-Henry Capel's mother puts down the telephone, turns to her son and says, very calmly, that she has been telling him this for years. The people of the centre were always communists. She just did not expect them to be so open about it.\n\nHenry has never hated anything as much as he hates Sredets tonight."
 evil_sofia_srd.2.a:0 "Comrade Victor! The centre will be red together."
 evil_sofia_srd.2.b:0 "Oborishte bows to no one. Show him out."
 evil_sofia_srd.2.t:0 "Victor at the Door"
 evil_sofia_srd.2.d:0 "Victor Kolev has walked the three streets from the Party House to Oborishte himself, with no guards and no flags, and he is waiting in the hall downstairs.\n\nHis offer is simple. Sredets and Oborishte go red together and take Sofia together: the north for Anton, the centre and the south for Victor. If Anton refuses, Victor will not walk here again. The Red Guards will."
 evil_sofia_srd.3.a:0 "To Comrade Anton!"
 evil_sofia_srd.3.t:0 "Anton Says Yes"
 evil_sofia_srd.3.d:0 "Anton Zafirov came down the stairs himself and shook Victor's hand in front of the doorman. By midnight Oborishte's district hall was flying a red flag. The centre of Sofia is red from the Lions' Bridge to Eagles' Bridge, and the North-South Pact can be drawn up."
 evil_sofia_srd.4.a:0 "He will regret it."
 evil_sofia_srd.4.t:0 "Anton Says No"
 evil_sofia_srd.4.d:0 "Victor waited in the hall for an hour. Then a secretary came down and told him that Mr Zafirov was busy. Victor walked home the long way, past the cathedral, counting the barricades Oborishte would need. It will need more than it has."
 evil_sofia_srd.5.a:0 "Let him hate. Let him wait."
 evil_sofia_srd.5.t:0 "Henry Hates Us"
 evil_sofia_srd.5.d:0 "Word comes from Vitosha: Daniel-Henry Capel has torn up every letter Sredets ever sent him, and his mother is telling the whole street she was right about us all along. He is not marching yet. He is waiting."
 evil_sofia_srd.6.a:0 "Let him come down the mountain."
 evil_sofia_srd.6.t:0 "Henry Prepares for War"
 evil_sofia_srd.6.d:0 "Daniel-Henry Capel will not wait for the red flag to come up the mountain. Vitosha's guards are being called up and trucks are moving down the Boyana road. Henry has declared that he will save Sofia from communism himself."
 evil_sofia_srd.7.a:0 "Day ones. Lozenets marches with Sredets."
 evil_sofia_srd.7.b:0 "I'm sorry, Victor. Lozenets stays out of this."
 evil_sofia_srd.7.t:0 "A Call from Victor"
 evil_sofia_srd.7.d:0 "The telephone rings late at night. It is Victor Kolev, and he is not calling as the Chairman of the Sredets Commune. He is calling as Victor, who has known Georgi since before either of them had a district to rule.\n\nHe is going after Daniel-Henry Capel, and Lozenets is the only road from Sredets to Boyana. He does not want passage. He wants Georgi beside him. Day ones, he says. Like always."
 evil_sofia_srd.8.a:0 "Long live the revolution."
 evil_sofia_srd.8.t:0 "A Red Coup in Oborishte"
 evil_sofia_srd.8.d:0 "At three in the morning the barracks on Shipka Street opened their gates, and by five the district hall had changed hands without a shot. Anton Zafirov woke up as the leader of a red Oborishte. He has decided to be grateful."
 evil_sofia_srd.9.a:0 "Day ones. Always."
 evil_sofia_srd.9.t:0 "Georgi Is In"
 evil_sofia_srd.9.d:0 "Georgi did not even let Victor finish the sentence. Lozenets has joined us, its streets are open to the Red Guards, and its own guards are already moving towards the slopes below Boyana. Henry will not fight one district. He will fight two."
 evil_sofia_srd.10.a:0 "Then the road goes through Lozenets."
 evil_sofia_srd.10.b:0 "Friends are friends. We will find another way to Henry."
 evil_sofia_srd.10.t:0 "Georgi Says No"
 evil_sofia_srd.10.d:0 "Georgi said it quietly, the way you say things to a friend: Lozenets will not go to war for the revolution, not even for Victor. Without Lozenets there is no road from Sredets to Boyana."
 evil_sofia_srd.11.a:0 "Of course. The gang is the gang."
 evil_sofia_srd.11.b:0 "Those days are over, Victor."
 evil_sofia_srd.11.t:0 "An Invitation from the Evil Gang"
 evil_sofia_srd.11.d:0 "The old group chat has come back to life. After months of silence there is a new message from Victor Kolev, and it is addressed to [Root.GetLeader] by name.\n\nThe Evil Gang rides again, it says. The city is falling apart, the districts are at each other's throats, and the only people Victor has ever trusted were in this chat. He wants [Root.GetName] in the gang, as an ally, the way it always was."
 evil_sofia_srd.12.a:0 "Welcome back."
 evil_sofia_srd.12.t:0 "[From.GetLeader] Is In"
 evil_sofia_srd.12.d:0 "The reply came in less than an hour: [From.GetLeader] is in. [From.GetName] has joined the Evil Gang, and its guards will fight beside ours."
 evil_sofia_srd.13.a:0 "Their loss."
 evil_sofia_srd.13.t:0 "[From.GetLeader] Says No"
 evil_sofia_srd.13.d:0 "[From.GetLeader] has read the message and declined. [From.GetName] will not join the Evil Gang. The chat is a little quieter tonight."
 evil_sofia_srd.17.a:0 "We join the free centre."
 evil_sofia_srd.17.b:0 "Thank you, Victor, but no."
 evil_sofia_srd.17.t:0 "An Offer from the Free Centre"
 evil_sofia_srd.17.d:0 "Victor Kolev has come to [Root.GetName] in person, with no guards and no ultimatum. Sredets has lifted its curfew, opened its press and its markets, and now it asks [Root.GetLeader] a simple question: will [Root.GetName] join the free centre? Same rights for everyone, no checkpoints between us, one city again.\n\nSaying yes means [Root.GetName] becomes part of Sredets. Saying no costs nothing, for now."
 evil_sofia_srd.18.a:0 "One city, freely."
 evil_sofia_srd.18.t:0 "[From.GetName] Joins the Free Centre"
 evil_sofia_srd.18.d:0 "The answer is yes. [From.GetName] has voted to join the free centre, and its people are taking down the barriers between our districts themselves. Not a shot was fired."
 evil_sofia_srd.20.a:0 "Take them, and look after them."
 evil_sofia_srd.20.b:0 "Not one street, Victor."
 evil_sofia_srd.20.t:0 "The Free Centre Asks for Our Quarters"
 evil_sofia_srd.20.d:0 "Victor Kolev has come to [Root.GetName] in person, with no guards and no ultimatum. He does not want all of [Root.GetName]. He wants the quarters next to the centre, the streets that have always been more the centre's than ours, to join the free centre. Everything else stays [Root.GetLeader]'s.\n\nSaying yes hands those quarters to Sredets. Saying no costs nothing, for now."
 evil_sofia_srd.21.a:0 "Welcome to the free centre."
 evil_sofia_srd.21.t:0 "[From.GetName] Hands Over Its Quarters"
 evil_sofia_srd.21.d:0 "The answer is yes. [From.GetName] has handed the quarters next to the centre to the free centre. The barriers came down this morning, and not a shot was fired."
 evil_sofia_srd.19.a:0 "The door stays open."
 evil_sofia_srd.19.t:0 "[From.GetName] Says No"
 evil_sofia_srd.19.d:0 "[From.GetName] has thanked us for the offer and declined it. Its people will stay behind their own barriers, for now."
 evil_sofia_srd.25.a:0 "Once C Class, always C Class."
 evil_sofia_srd.25.b:0 "I've grown up, Victor."
 evil_sofia_srd.25.t:0 "The C Class Calls"
 evil_sofia_srd.25.d:0 "The old class group chat lights up for the first time in months. Victor Kolev of Sredets has unleashed the C Class Hools, and he wants [Root.GetLeader] back in the stands with them, flares and all."
 evil_sofia_srd.26.a:0 "The class is back together."
 evil_sofia_srd.26.t:0 "[From.GetLeader] Is Back"
 evil_sofia_srd.26.d:0 "[From.GetLeader] answered with a single photo: a lit flare. [From.GetName] has joined the C Class Hools."
 evil_sofia_srd.27.a:0 "Boring."
 evil_sofia_srd.27.t:0 "[From.GetLeader] Has Grown Up"
 evil_sofia_srd.27.d:0 "[From.GetLeader] says those days are over. [From.GetName] will not join the C Class Hools."
 evil_sofia_news.1.a:0 "The revolution has begun."
 evil_sofia_news.1.b:0 "Henry's mother was right."
 evil_sofia_news.1.c:0 "The centre has gone mad."
 evil_sofia_news.1.t:0 "Red Flag over the Largo"
 evil_sofia_news.1.d:0 "Sredets has gone communist. Late last night Victor Kolev appeared on the steps of the Party House before a crowd of several thousand and declared the Sredets Commune. Red flags have replaced the district colours on every public building around the Largo, and the ministries have been sealed by armed workers.\n\nIn Vitosha, Daniel-Henry Capel's mother received reporters at her door with a cup of coffee and a satisfied smile. She has been saying it for years, she told them: the people of the centre were always communists. Tonight they simply stopped pretending. Asked whether she had a message for Victor Kolev, she said only that she hoped he was proud of himself."
 evil_sofia_news.2.a:0 "Order, at last."
 evil_sofia_news.2.b:0 "One more strongman. Sofia has plenty."
 evil_sofia_news.2.t:0 "Order in the Centre"
 evil_sofia_news.2.d:0 "Sredets will have no parties and no slogans. Victor Kolev has announced that he will govern the district in person, by decree, until order returns to Sofia. Checkpoints have gone up on every bridge into the centre and the trams, for the first time this year, are running on time."
 evil_sofia_news.3.a:0 "The city will be red, from north to south."
 evil_sofia_news.3.b:0 "They have divided us before they have beaten us."
 evil_sofia_news.3.t:0 "The North-South Pact"
 evil_sofia_news.3.d:0 "Sredets and Oborishte have signed an agreement dividing Sofia between them. Witnesses describe a map of the city on a table in the Party House and a single red line drawn from Lyulin to Kremikovtsi. Everything north of it is promised to Anton Zafirov, everything south to Victor Kolev.\n\nNo other district was consulted."
 evil_sofia_news.4.a:0 "The centre is ours."
 evil_sofia_news.4.b:0 "Who is next?"
 evil_sofia_news.4.t:0 "Oborishte Falls"
 evil_sofia_news.4.d:0 "The red flag flies over the Holy Synod. After a short and bitter fight around the cathedral, Oborishte has fallen to the Red Guards of Sredets, and Anton Zafirov has disappeared from public life. The centre of Sofia now answers to a single man."
 evil_sofia_news.5.a:0 "The mountain is red."
 evil_sofia_news.5.b:0 "Even the mountain could not stop them."
 evil_sofia_news.5.t:0 "Boyana Falls"
 evil_sofia_news.5.d:0 "Vitosha has fallen. Red Guards have taken the villas of Boyana and the forest roads up to Dragalevtsi, and Daniel-Henry Capel's government no longer controls a single street. His mother, interviewed in the garden of her requisitioned villa, says she has nothing to add."
 evil_sofia_news.6.a:0 "One city, one flag."
 evil_sofia_news.6.b:0 "Sofia is red."
 evil_sofia_news.6.t:0 "The Sofia Commune"
 evil_sofia_news.6.d:0 "There is one Sofia again. From Bankya to Pancharevo, from Novi Iskar to the top of Vitosha, every district now answers to the Party House. Victor Kolev has proclaimed the Sofia Commune from the balcony over the Largo, to a crowd that filled the square and the boulevards around it."
 evil_sofia_news.7.a:0 "Two halves, one Sofia."
 evil_sofia_news.7.b:0 "Sofia is red, twice over."
 evil_sofia_news.7.t:0 "North and South Sofia"
 evil_sofia_news.7.d:0 "The last free district has fallen, and the city has been divided exactly along the line drawn in the North-South Pact. Sredets is now South Sofia, Oborishte North Sofia, and their alliance has taken the name of the city itself. Victor Kolev and Anton Zafirov shook hands for the cameras on Eagles' Bridge."
 evil_sofia_news.8.a:0 "Sofia shrinks."
 evil_sofia_news.8.t:0 "A District Falls"
 evil_sofia_news.8.d:0 "[From.GetName] has capitulated. Its guards have laid down their arms, its leader has fled or been taken, and its streets are filling with foreign patrols. One district fewer stands between someone and the rule of the whole city."
 evil_sofia_news.9.a:0 "Sredets is free."
 evil_sofia_news.9.b:0 "Mom isn't buying it."
 evil_sofia_news.9.c:0 "Let them talk. We will see how long it lasts."
 evil_sofia_news.9.t:0 "The Free Sredets Is Proclaimed"
 evil_sofia_news.9.d:0 "Victor Kolev has called the patrols off the Largo and proclaimed the Free Sredets: free papers, free speech, free trade and no curfew, ever again. In the same speech he announced that the centre will join no alliance and ask no district for help. Diplomats report that the cafés on Vitosha Boulevard are full again and that a blue flag flies over the district hall.\n\nIn Vitosha, Daniel-Henry Capel's mother is not impressed. A communist in a blue coat, she told reporters, is still a communist. She has seen the people of the centre before, and she will believe they have changed when she sees it with her own eyes."
 evil_sofia_news.10.a:0 "The gang is back."
 evil_sofia_news.10.b:0 "Check the letterbox."
 evil_sofia_news.10.c:0 "Are we on the list?"
 evil_sofia_news.10.t:0 "The Evil Gang Rides Again"
 evil_sofia_news.10.d:0 "An old group chat has become the most talked-about alliance in Sofia. Victor Kolev of Sredets has proposed the return of the Evil Gang, and letters are said to be on their way, one a month, to Georgi Poryazov of Mladost, Daniel-Henry Capel of Vitosha and Stefan Kartunov of Krasna Polyana. Before the city fell apart, they were his closest friends. Whether they still are is another question."
 evil_sofia_news.11.a:0 "Nobody stops the C Class."
 evil_sofia_news.11.b:0 "Lock the doors."
 evil_sofia_news.11.t:0 "The C Class Hools Take to the Streets"
 evil_sofia_news.11.d:0 "Hundreds of young men in scarves and hoods marched through the centre of Sofia last night, lighting flares and singing. They call themselves the C Class Hools, they answer to Sredets, and their leaders say they will be visiting every neighbouring district soon."
 evil_sofia_news.12.a:0 "Class is in session."
 evil_sofia_news.12.b:0 "Sofia has gone completely mad."
 evil_sofia_news.12.t:0 "A Physics Teacher Seizes Sredets"
 evil_sofia_news.12.d:0 "The people of Sredets have waited long enough. A year of curfews and promises, and Victor Kolev has still not told them what the centre is for. This morning his former physics teacher, Konstantin Ilchev, walked into the Party House with a red pen and a stack of marked exam papers and declared that the lesson was over. The guards, who all sat in his classes too, let him straight through. Victor has been sent to detention, and Ilchev governs Sredets."
 evil_sofia_news.13.a:0 "One free city."
 evil_sofia_news.13.b:0 "Free, and much too close."
 evil_sofia_news.13.t:0 "The Free Centre of Sofia"
 evil_sofia_news.13.d:0 "From Lagera to the Eagles' Bridge, the centre of Sofia now answers to one council in Sredets, and it has taken a new name: the Free Centre of Sofia. Victor Kolev has abolished every checkpoint in it and promised its people the same rights as his own. In the outer districts, people have started asking why theirs are different."
 evil_sofia_news.14.a:0 "Told you so, Mrs Capel."
 evil_sofia_news.14.b:0 "Mom... was wrong?"
 evil_sofia_news.14.c:0 "If even she admits it..."
 evil_sofia_news.14.t:0 "Henry's Mom Was Wrong"
 evil_sofia_news.14.d:0 "Daniel-Henry Capel's mother went to the free centre this week expecting red flags, commissars and queues for bread. She found cafés full until midnight, eleven newspapers arguing with each other on Rakovski Street, a market on Vitosha Boulevard where nobody asked for a party card, and Victor Kolev himself, who carried her shopping to the tram stop.\n\nLast night she told reporters, very quietly, that she was wrong. The people of the centre are not communists. Henry is said to have dropped his fork."
 evil_sofia_news.15.a:0 "Everyone gets their share."
 evil_sofia_news.15.b:0 "A fair share for a loyal friend."
 evil_sofia_news.15.c:0 "Today Vitosha. Tomorrow?"
 evil_sofia_news.15.t:0 "The Vitosha Award"
 evil_sofia_news.15.d:0 "Vitosha has been carved up at a table in the Party House. With the map of Henry's district spread in front of him, Victor Kolev drew the new lines himself. Sredets took nothing: the villas of Boyana, the slopes and the villages all go to the members of the Evil Gang who stood by him. Nobody from Vitosha was invited."
 evil_sofia_news.16.a:0 "One centre."
 evil_sofia_news.16.b:0 "And where does it stop?"
 evil_sofia_news.16.t:0 "The Centre Is United"
 evil_sofia_news.16.d:0 "From the Women's Market to the villas of Lozenets, the centre of Sofia answers to one district hall again. Victor Kolev has called it the end of a long dream. In the districts beyond the boulevards, people are asking whether the dream ends at the edge of the centre."
 evil_sofia_news.17.a:0 "One city, one Director."
 evil_sofia_news.17.b:0 "A district that calls itself a city."
 evil_sofia_news.17.t:0 "The Directorate of Sofia"
 evil_sofia_news.17.d:0 "From the balcony of the Party House, Victor Kolev has proclaimed the Directorate of Sofia and named himself its Director. The centre of the city answers to him alone, its districts have been told they are provinces, and a new flag, gold on black, hangs over the Largo. Every district hall in Sofia received a copy of the proclamation. None of them was asked for an opinion."
 evil_sofia_news.18.a:0 "To the victor, the cup."
 evil_sofia_news.18.b:0 "Even the Khan could not hold out."
 evil_sofia_news.18.t:0 "Krum's Cup"
 evil_sofia_news.18.d:0 "Serdika has fallen, and with it the strangest ruler Sofia has seen in this war. Khan Krum is gone, and his famous cup now stands on Victor Kolev's desk in the Party House. Visitors report that nobody drinks from it, and that everybody looks at it."
 evil_sofia_news.19.a:0 "Just until it is safe."
 evil_sofia_news.19.b:0 "Mom was right after all."
 evil_sofia_news.19.c:0 "So much for the free centre."
 evil_sofia_news.19.t:0 "A Temporary Emergency"
 evil_sofia_news.19.d:0 "The free centre is free no longer. Victor Kolev has declared a temporary emergency: the curfew is back, the newspapers on Rakovski Street are closed until further notice, and the blue flag has been taken down for cleaning. Nobody has said when it will go back up.\n\nIn Vitosha, Daniel-Henry Capel's mother has told reporters that she always knew. A tyrant in a blue coat, she says, is still a tyrant."
 evil_sofia_flavour.1.a:0 "Pay them. We need the trams."
 evil_sofia_flavour.1.b:0 "Soldiers can drive trams."
 evil_sofia_flavour.1.t:0 "The Trams Stop"
 evil_sofia_flavour.1.d:0 "The tram drivers of [Root.GetName] have walked off the job. Their demands are simple: paid wages, a working heater in every carriage and an end to being shot at on the lines that run near the front. Without the trams, nobody gets to work."
 evil_sofia_flavour.2.a:0 "Let them play. People need something to cheer."
 evil_sofia_flavour.2.b:0 "Call it off. Send the fans to the recruiting office."
 evil_sofia_flavour.2.t:0 "Derby Day"
 evil_sofia_flavour.2.d:0 "Levski and CSKA are playing tonight, war or no war. Half of [Root.GetName] supports one side, half the other, and the guards are asking whether the match should be stopped before the stands turn into a front line of their own."
 evil_sofia_flavour.3.a:0 "Everyone out with a shovel."
 evil_sofia_flavour.3.b:0 "The front first, the streets later."
 evil_sofia_flavour.3.t:0 "The Big Snow"
 evil_sofia_flavour.3.d:0 "Snow has been falling on [Root.GetName] for three days. The streets are impassable, the trucks are stuck and the guards spend more time digging than drilling. Everyone with a shovel is needed."
 evil_sofia_flavour.4.a:0 "Fill them in. All of them."
 evil_sofia_flavour.4.b:0 "Potholes slow down enemy tanks too."
 evil_sofia_flavour.4.t:0 "The Pothole Committee"
 evil_sofia_flavour.4.d:0 "A delegation of furious residents has arrived at the district hall of [Root.GetName] with photographs of the worst potholes in the district. One of them has swallowed an army truck. They will not leave until something is done."
 evil_sofia_flavour.5.a:0 "Fix the price. The soldiers must eat."
 evil_sofia_flavour.5.b:0 "Bread and lyutenitsa never hurt anybody."
 evil_sofia_flavour.5.t:0 "The Price of a Döner"
 evil_sofia_flavour.5.d:0 "The price of a döner in [Root.GetName] has doubled in a month. The kebab shops blame the war, the war blames the kebab shops, and the soldiers are eating bread and lyutenitsa again. Morale is suffering."
 evil_sofia_flavour.6.a:0 "Adopt them. Every unit gets a dog."
 evil_sofia_flavour.6.b:0 "Round them up and send them to the countryside."
 evil_sofia_flavour.6.t:0 "The Stray Dogs of Sofia"
 evil_sofia_flavour.6.d:0 "Packs of stray dogs have taken over the parks of [Root.GetName]. They follow patrols, steal from the field kitchens and bark at night until nobody can sleep. A guard sergeant has proposed adopting the whole pack as the district's mascot."
 evil_sofia_flavour.7.a:0 "Wish them luck, and give them rifles."
 evil_sofia_flavour.7.b:0 "Grant every groom a month of leave."
 evil_sofia_flavour.7.t:0 "Weddings on Every Block"
 evil_sofia_flavour.7.d:0 "The war has started a wave of weddings in [Root.GetName]. Every weekend the brass bands play in the courtyards of the panel blocks, and the young men go off to the front a few days later with rings on their fingers."
 evil_sofia_flavour.8.a:0 "Close it down."
 evil_sofia_flavour.8.b:0 "Tax it."
 evil_sofia_flavour.8.t:0 "A Black Market on the Women's Market"
 evil_sofia_flavour.8.d:0 "Everything is for sale in [Root.GetName] if you know whom to ask: rifles, petrol, cigarettes, ammunition and, for the right price, a commission in the district guard."
 evil_sofia_flavour.9.a:0 "Print it on the posters."
 evil_sofia_flavour.9.b:0 "Send them to the mountain troops."
 evil_sofia_flavour.9.t:0 "Hikers on Cherni Vrah"
 evil_sofia_flavour.9.d:0 "A group of hikers from [Root.GetName] has climbed Cherni Vrah, the highest peak of Vitosha, and planted the district flag on the summit. The photograph is in every newspaper of the city."
