l_english:
 SRD_henrys_mom_was_right:0 "Henry's Mom Was Right"
 SRD_henrys_mom_was_right_desc:0 "For years Daniel-Henry Capel's mother has told anyone who would listen that the people of the centre are communists, every last one of them. Tonight Victor Kolev climbs onto the steps of the Party House, looks out over a Largo full of red flags, and decides that she was right.\n\nCommunism grows in Sredets day by day. Once more than 30% of the district is red, the focus Proclaim the Sredets Commune makes it the Sredets Commune, and somewhere up the slopes of Vitosha, Henry will be furious."
 SRD_proclaim_the_commune:0 "Proclaim the Sredets Commune"
 SRD_proclaim_the_commune_desc:0 "A third of the centre marches under red flags, and the rest no longer dares to argue. The Party House flies the red flag, Victor becomes Chairman, and the Sredets Commune is proclaimed from the steps above the Largo.\n\nNeeds more than 30% support for communism. Sredets becomes the Sredets Commune."
 SRD_order_in_the_centre:0 "Order in the Centre"
 SRD_order_in_the_centre_desc:0 "The council is gone and the city is a mess of checkpoints and rival flags. Sredets will not join the shouting. No parties, no slogans, no committees: Victor Kolev governs the centre himself, and the trams will run on time.\n\nOpens the roads of the centre: a free Sredets, a united centre, or, if Victor waits too long, Konstantin Ilchev."
 SRD_comrades_in_oborishte:0 "Comrades in Oborishte"
 SRD_comrades_in_oborishte_desc:0 "Oborishte begins three streets east of the Party House, under the domes of Alexander Nevsky. Its cafés are full of students, its students are full of ideas, and Anton Zafirov has not yet decided which side he is on. Our people will help him decide.\n\nUnlocks the decisions of the Oborishte Question."
 SRD_red_newspapers_oborishte:0 "Red Newspapers in Oborishte"
 SRD_red_newspapers_oborishte_desc:0 "By morning every kiosk from Oborishte Street to the Doctors' Garden is selling the same paper, and it is printed in Sredets. Anton's police tear the posters down; by evening there are twice as many.\n\nUnlocks the decision Red Coup in Oborishte."
 SRD_ally_anton:0 "Ally Anton Zafirov"
 SRD_ally_anton_desc:0 "Anton is not our enemy. He is a man standing on the wrong side of a very short street. Victor will walk across it himself and offer him what nobody else in Sofia can: half of everything.\n\nNeeds Oborishte at least 20% communist. Anton is more likely to accept the more communist Oborishte is and the better he thinks of Sredets."
 SRD_anton_must_go:0 "Anton Must Go"
 SRD_anton_must_go_desc:0 "There is no room for two masters in the centre of Sofia. Anton Zafirov has had his chance to stand with the revolution, and he has spent it drinking coffee under the cathedral. The Red Guards are ready."
 SRD_north_south_pact:0 "The North-South Pact"
 SRD_north_south_pact_desc:0 "A map of Sofia is spread across a table in the Party House. Victor takes a red pencil and draws a line from Lyulin to Kremikovtsi: the north for Oborishte, the centre and the south for Sredets. Anton signs first. Neither of them mentions what happens after the last district falls."
 SRD_destroy_anton:0 "Destroy Anton Zafirov"
 SRD_destroy_anton_desc:0 "The bells of Alexander Nevsky are silent and the red flag hangs from the Holy Synod. Every street of Oborishte is in our hands; Anton Zafirov's career is over, and his district is ours to keep.\n\nNeeds every state of Oborishte under our control."
 SRD_pact_centre:0 "The Red Centre"
 SRD_pact_centre_desc:0 "The pact begins where the city began: Vazrazhdane, the old market streets around the Women's Market and Lion's Bridge. Whoever holds them holds the roads in and out of the centre.\n\nClaims and war goals on Vazrazhdane. Its cores come with the next stage, once it is held."
 SRD_pact_old_quarters:0 "The Old Quarters"
 SRD_pact_old_quarters_desc:0 "The boulevards and villas built between the wars, where Sofia's middle class still lives behind lace curtains. Krasno Selo, Slatina, Izgrev, Lozenets and Triaditsa for us; Serdika, Poduyane, Krasna Polyana and Ilinden for Anton.\n\nCores on the centre. Claims and war goals on the old quarters. Needs every state of the centre held."
 SRD_pact_housing_estates:0 "The Housing Estates"
 SRD_pact_housing_estates_desc:0 "Endless rows of panel blocks, ten floors high and a kilometre long. The estates were built for the workers; the workers will take them back. Iskar, Mladost and Studentski for us; Nadezhda and Lyulin for Oborishte.\n\nCores on the old quarters. Claims and war goals on the housing estates. Needs every state of the old quarters held."
 SRD_pact_kremikovtsi:0 "The Steelworks of Kremikovtsi"
 SRD_pact_kremikovtsi_desc:0 "Out past the airport, the chimneys of Kremikovtsi stand over the plain. The district goes to Oborishte; the steel goes to both of us, and nobody will ask what it is for.\n\nCores on the housing estates. War goals on Kremikovtsi. Needs every state of the housing estates held."
 SRD_pact_outskirts:0 "The Outskirts"
 SRD_pact_outskirts_desc:0 "Villages, orchards and the slopes of the mountains: the last of Sofia that is not red. Vitosha, Ovcha Kupel and Pancharevo for us; Vrabnitsa, Novi Iskar and Bankya for Anton.\n\nCores on Kremikovtsi. Claims and war goals on the outskirts. Needs every state of Kremikovtsi held."
 SRD_sofia_union:0 "The Union of North and South Sofia"
 SRD_sofia_union_desc:0 "From Boyana to Kremikovtsi the city is red. Victor and Anton meet on the Eagles' Bridge, exactly on the line they drew, and shake hands for the cameras. Sredets becomes South Sofia, Oborishte becomes North Sofia, and the alliance takes the only name big enough for it: Sofia.\n\nCores on everything each of us holds. Needs every state of the outskirts held."
 SRD_one_centre:0 "One Centre"
 SRD_one_centre_desc:0 "With Oborishte gone, only Vazrazhdane stands between Sredets and a centre that answers to one man. Its market halls and tram depots will make a fine headquarters.\n\nClaims and war goals on Vazrazhdane."
 SRD_united_old_quarters:0 "Take the Old Quarters"
 SRD_united_old_quarters_desc:0 "Nine districts of boulevards, parks and pre-war villas, from Krasno Selo to Ilinden. Without allies this will be slow, street by street, but nothing we take will have to be shared.\n\nCores on the centre and Oborishte. Claims and war goals on the old quarters. Needs every state of the centre held."
 SRD_united_housing_estates:0 "Take the Housing Estates"
 SRD_united_housing_estates_desc:0 "Nadezhda, Iskar, Mladost, Studentski and Lyulin: half of Sofia lives in these blocks, and half of our army will come from them.\n\nCores on the old quarters. Claims and war goals on the housing estates. Needs every state of the old quarters held."
 SRD_united_kremikovtsi:0 "Take Kremikovtsi"
 SRD_united_kremikovtsi_desc:0 "The steelworks of Kremikovtsi are the only real industry this city has. Whoever holds them can arm every district they conquer.\n\nCores on the housing estates. War goals on Kremikovtsi. Needs every state of the housing estates held."
 SRD_united_outskirts:0 "Take the Outskirts"
 SRD_united_outskirts_desc:0 "Vitosha, Ovcha Kupel, Vrabnitsa, Novi Iskar, Pancharevo and Bankya. The villages on the edge of the city have always thought themselves safe from Sofia's politics. They were wrong.\n\nCores on Kremikovtsi. Claims and war goals on the outskirts. Needs every state of Kremikovtsi held."
 SRD_sofia_commune:0 "The Sofia Commune"
 SRD_sofia_commune_desc:0 "Twenty-four districts, one flag. The Party House is no longer the seat of Sredets but of the whole city, and Victor Kolev speaks from its balcony to a Largo packed from wall to wall. Sredets is gone; there is only Sofia.\n\nCores on everything we hold. Needs every state of the outskirts held."
 SRD_peoples_militia:0 "The People's Militia"
 SRD_peoples_militia_desc:0 "Every block we take sends ten men to the district committee, and the committee gives them a red armband and a rifle. They will learn to shoot on the way to the front."
 SRD_komsomol_of_the_estates:0 "Komsomol of the Housing Estates"
 SRD_komsomol_of_the_estates_desc:0 "The teenagers of the panel blocks have spent years hanging around bus stops with nothing to do. Now they have badges, marching songs, a youth hall in every estate, and a waiting list for the front."
 SRD_party_takes_the_largo:0 "The Party Takes the Largo"
 SRD_party_takes_the_largo_desc:0 "The Largo was built to impress: three grand buildings around one square, with the Party House at its head. The ministries are emptied, the archives are sealed, and a red flag the size of a tram goes up over the government quarter."
 SRD_red_guards_of_the_stadium:0 "Red Guards of Vasil Levski Stadium"
 SRD_red_guards_of_the_stadium_desc:0 "The national stadium holds forty thousand people. On match days they come to shout; now they come to drill. Four divisions of Red Guards march out of the gates past Borisova Gradina."
 SRD_arm_the_workers:0 "Arm the Workers"
 SRD_arm_the_workers_desc:0 "Waiters from the cafés on Rakovski Street, shop assistants from TZUM, conductors from the tram depots. Every worker of the centre gets a rifle, a cartridge belt and an address to report to."
 SRD_barricades_on_vitosha:0 "Barricades on Vitosha Boulevard"
 SRD_barricades_on_vitosha_desc:0 "Café tables, tram rails, paving stones and the shop windows of the most expensive street in the country. Vitosha Boulevard is turned into a fortress from the Palace of Justice to the National Palace of Culture."
 SRD_red_officer_school:0 "The Red Officer School"
 SRD_red_officer_school_desc:0 "The old Military Academy on Evlogi Georgiev Boulevard is given a new curriculum: street fighting, political education and the history of the Party. Its first graduates will lead our divisions."
 SRD_tram_depot_tank_works:0 "The Tram Depot Tank Works"
 SRD_tram_depot_tank_works_desc:0 "A tram is already a steel box on wheels. Add armour plate, swap the wheels for tracks and put a gun on top: the depot workers swear it will be the finest tank in the Balkans."
 SRD_universal_service:0 "Every Comrade Serves"
 SRD_universal_service_desc:0 "From the Largo to the Lions' Bridge, every comrade between eighteen and sixty is given a rifle number and a unit to report to. Nobody in the centre will be able to say the revolution did not need them."
 SRD_commissars_in_every_unit:0 "Commissars in Every Unit"
 SRD_commissars_in_every_unit_desc:0 "A Party man in every platoon: he reads the newspaper aloud, he writes the reports, and he makes sure that the Red Guards never forget what they are fighting for, or who they answer to."
 SRD_red_air_over_the_centre:0 "Red Wings over the Centre"
 SRD_red_air_over_the_centre_desc:0 "Tsar Osvoboditel Boulevard is straight, wide and paved in yellow brick. With the lamp posts taken down it makes a perfectly good runway, and the Party's first squadron takes off over the Russian Church."
 SRD_metro_goes_to_war:0 "The Shelters Beneath the Centre"
 SRD_metro_goes_to_war_desc:0 "Under the Largo lie the ruins of Roman Serdica, and under the ruins there is room for thousands. The cellars are linked into shelters and supply tunnels, and anti-aircraft guns go up on every rooftop around them."
 SRD_red_leaflets:0 "Red Leaflets over Vitosha"
 SRD_red_leaflets_desc:0 "Henry's district is villas, pine forest and people who think the revolution is something that happens to other neighbourhoods. A few thousand leaflets in the letterboxes of Vitosha should change that."
 SRD_road_to_boyana:0 "The Road to Boyana"
 SRD_road_to_boyana_desc:0 "Sredets does not touch Vitosha: Lozenets lies between us, and Lozenets belongs to Georgi Yanchovichin. Georgi and Victor go back further than any party or flag. They are day ones. Victor picks up the phone and asks him to stand with Sredets against Henry.\n\nGeorgi is more likely to say yes the better he thinks of Sredets. If Lozenets is already our ally or no longer exists, nobody needs to be asked."
 SRD_capel_question:0 "The Capel Question"
 SRD_capel_question_desc:0 "Daniel-Henry Capel hates communism, hates Sredets and, above all, hates being proven wrong by his own mother. As long as he sits in Boyana, every red flag in Sofia has a rifle pointed at it from the mountain. It is time to answer the Capel Question."
 SRD_red_flag_over_boyana:0 "Red Flag over Boyana"
 SRD_red_flag_over_boyana_desc:0 "The red flag flies over Boyana Church and the forest roads up to Dragalevtsi. Henry's villa has become a rest home for tired Red Guards. Somewhere, his mother is telling anyone who will listen that she said this would happen.\n\nNeeds every state of Vitosha under our control."
 SRD_collectivise_vitosha_boulevard:0 "Collectivise Vitosha Boulevard"
 SRD_collectivise_vitosha_boulevard_desc:0 "Gucci, Hugo Boss and a hundred smaller boutiques: the most expensive street in Bulgaria now belongs to the people. The tailors stay, the sewing machines stay, and the workshops behind the shop windows start working for the Party."
 SRD_mimas_for_the_workers:0 "Mimas Döner for the Workers"
 SRD_mimas_for_the_workers_desc:0 "Mimas on Graf Ignatiev has never closed, not for holidays, not for elections and not for revolutions. It is now the official canteen of the Sredets Commune, and the queue at four in the morning is the most united front in the city."
 SRD_party_arsenal:0 "The Party Arsenal"
 SRD_party_arsenal_desc:0 "Bakeries, print shops and car repair garages all over the centre are given new orders and new tools. The back rooms that used to smell of bread now smell of gun oil."
 SRD_red_tourism:0 "Red Tourism"
 SRD_red_tourism_desc:0 "The tourists still come to photograph the cathedral and the yellow bricks. Now they buy their postcards from the Party, sleep in Party hotels and leave Party tips. Every lev goes into a new factory."
 SRD_red_university:0 "The Red University"
 SRD_red_university_desc:0 "Sofia University stands on Tsar Osvoboditel, two hundred metres from the Party House. Its physicists are moved into the laboratories of the Faculty of Physics and asked one question: how to build a better radio."
 SRD_socialist_emulation:0 "Socialist Emulation"
 SRD_socialist_emulation_desc:0 "Every factory in the commune now competes with every other. The winning shift gets its photograph in the newspaper, a red pennant on the wall and a free döner each. The losing shift gets the night shift."
 SRD_five_year_plan:0 "Five-Year Plan for the Centre"
 SRD_five_year_plan_desc:0 "Planners from the Party House count every factory, every tram and every pothole in the centre, then write a plan to double the first and fill the last. It will be completed in five years, or in four, if the workers love the Party enough."
 SRD_star_on_the_party_house:0 "The Star on the Party House"
 SRD_star_on_the_party_house_desc:0 "A ruby star once crowned the spire of the Party House. The engineers who put it back up are rewarded with their own institute, and the Party's best minds go back to work beneath it."
 SRD_electrify_the_districts:0 "Electrify the Districts"
 SRD_electrify_the_districts_desc:0 "Communism is the Party plus the electrification of the whole city. New lines run from the power station to every district we hold, and the street lamps of the commune burn all night."
 SRD_curfew_on_the_largo:0 "Curfew on the Largo"
 SRD_curfew_on_the_largo_desc:0 "From ten in the evening the Largo belongs to the patrols. The cafés close early, the trams stop at the bridges and anyone out after dark had better have a very good reason and the right stamp on their papers."
 SRD_centres_own_guard:0 "The Centre's Own Guard"
 SRD_centres_own_guard_desc:0 "The district guard of Sredets is given new uniforms, new rifles and a single order: keep the centre quiet. Recruits are taken from the police, the fire brigade and the doormen of the ministries."
 SRD_who_stands_with_sredets:0 "Who Stands with Sredets?"
 SRD_who_stands_with_sredets_desc:0 "Order has returned to the centre. Now Victor must decide what it is for: a free Sredets that owes nobody, or the dream of a united centre. If he cannot make up his mind, his old physics teacher will make it for him."
 SRD_a_free_sredets:0 "A Free Sredets"
 SRD_a_free_sredets_desc:0 "The patrols are called off the Largo at dawn. The checkpoints on the bridges are taken down, the papers with the right stamps go into the stove, and by noon the cafés on Vitosha Boulevard have their chairs out again. Victor Kolev's centre will be free, and it will be free on its own: no gangs, no pacts, no favours owed to anyone.\n\nSredets can no longer create or join factions. Democracy grows day by day; once more than 30% of the district supports it, the focus Proclaim the Free Sredets makes Sredets a democracy under Victor, with a blue flag."
 SRD_proclaim_the_free_sredets:0 "Proclaim the Free Sredets"
 SRD_proclaim_the_free_sredets_desc:0 "A third of the centre stands behind the free district, and nobody wants the curfew back. A blue flag goes up over the district hall and Victor Kolev proclaims the Free Sredets: governed by its own people, with no curfew ever again.\n\nNeeds more than 30% support for democracy. Sredets becomes a democracy under Victor, with a blue flag."
 SRD_speakers_corner:0 "Speakers' Corner at the Crystal"
 SRD_speakers_corner_desc:0 "The little park of the Crystal on Rakovski Street has seen every protest Sofia ever had. Now anyone may climb on a bench there and say what they like about anyone, including Victor. Many do. Victor listens, and some days he even takes notes."
 SRD_volunteers_of_the_centre:0 "Volunteers of the Centre"
 SRD_volunteers_of_the_centre_desc:0 "Nobody is drafted in a free Sredets, and nobody needs to be. Students from the university, waiters from the Largo and pensioners from the Women's Market sign up at the recruiting tables in front of the Ivan Vazov Theatre."
 SRD_free_press_on_rakovski:0 "Free Press on Rakovski Street"
 SRD_free_press_on_rakovski_desc:0 "The printing houses behind the theatres are unsealed. Within a week the centre has eleven newspapers, three of them against the government, one of them about football and all of them sold out by eight in the morning. Copies are smuggled into every district around us.\n\nDemocracy slowly grows in every neighbour."
 SRD_open_market_on_vitosha:0 "Open Market on Vitosha Boulevard"
 SRD_open_market_on_vitosha_desc:0 "No permits, no party stamps, no tax on the stalls. Traders from every district of Sofia come to sell on Vitosha Boulevard, and the workshops of the centre run day and night to keep up."
 SRD_liberty_guard:0 "The Liberty Guard"
 SRD_liberty_guard_desc:0 "When the bells of Sveta Nedelya ring the alarm, every volunteer knows his post: a doorway, a bridge, a roof over the boulevard. A free district has to be ready to defend itself, because nobody else will."
 SRD_prove_henrys_mom_wrong:0 "Prove Henry's Mom Wrong"
 SRD_prove_henrys_mom_wrong_desc:0 "For years Daniel-Henry Capel's mother has told anyone who would listen that the people of the centre are communists, every last one of them. Free newspapers, a free market on Vitosha Boulevard and not a single red flag on the Largo say otherwise. Victor sends her an invitation: come and see for yourself.\n\nHenry's mother visits the free centre, and the whole city hears what she says about it. Henry thinks better of us, and democracy slowly grows in Vitosha."
 SRD_friends_of_freedom:0 "Friends of Freedom"
 SRD_friends_of_freedom_desc:0 "Victor still has friends in the districts around the centre, and the free centre has admirers there too. Our clubs, newspapers and student societies open branches in Oborishte, Lozenets and Triaditsa.\n\nDemocracy grows in Oborishte, Lozenets and Triaditsa for eight months, and they think better of us."
 SRD_workshops_of_the_free_centre:0 "Workshops of the Free Centre"
 SRD_workshops_of_the_free_centre_desc:0 "Freedom has to be defended, and rifles do not grow on the trees of the City Garden. The cellar workshops of the centre take orders from the Liberty Guard."
 SRD_drills_in_borisova_garden:0 "Drills in Borisova Garden"
 SRD_drills_in_borisova_garden_desc:0 "Every Sunday the volunteers march out to Borisova Garden and drill between the lakes and the old trees, watched by families with picnics. The officers are ex-guardsmen; the tactics are new."
 SRD_offer_to_anton:0 "An Offer to Anton"
 SRD_offer_to_anton_desc:0 "Anton Zafirov lives three streets from the district hall. Victor walks over himself, without guards, and asks him a simple question: will Oborishte join the free centre?\n\nOborishte is asked to join Sredets, all of it, peacefully. Anton will most likely say no; the more he likes us and the more democratic Oborishte is, the better our chances."
 SRD_offer_to_georgi:0 "An Offer to Georgi"
 SRD_offer_to_georgi_desc:0 "Georgi Yanchovichin is Victor's day one, but Lozenets is his, and day ones do not give away their districts lightly. Victor asks anyway, over coffee, the way they always talked.\n\nGeorgi is asked to hand North Lozenets and Lozenets, the quarters by the centre, to Sredets peacefully; the rest of Lozenets stays his. Georgi will most likely say no; the more he likes us and the more democratic Lozenets is, the better our chances."
 SRD_liberate_the_old_centre:0 "Liberate the Old Centre"
 SRD_liberate_the_old_centre_desc:0 "The Women's Market of Vazrazhdane and the cathedral square of Oborishte are a ten-minute walk from the Largo, and behind their checkpoints people still need a stamp to cross the street. A free centre cannot end at a barricade.\n\nCores on Vazrazhdane and Oborishte, and war goals on them if they have not joined us."
 SRD_offer_to_alexander:0 "An Offer to Alexander"
 SRD_offer_to_alexander_desc:0 "Alexander Dimitrov will listen politely, agree with everything and then do what he likes. Victor puts the offer in writing, so at least Alexander has to read it twice.\n\nAlexander is asked to hand the Triaditsa state, by the centre, to Sredets peacefully; the rest of Triaditsa stays his. Alexander will most likely say no; the more he likes us and the more democratic Triaditsa is, the better our chances."
 SRD_the_wider_centre:0 "The Wider Centre"
 SRD_the_wider_centre_desc:0 "The old centre is free. Its edges are not: the streets around the Ivan Vazov quarter, the old villas of Lozenets, Kriva Reka and Lagera, and the railway quarter north of the Lions' Bridge still answer to someone else.\n\nCores and war goals on the central states of Triaditsa, Lozenets, Krasno Selo and Serdika (Triaditsa, North Lozenets, Lozenets, Kriva Reka, Lagera, North City Centre, Serdika). Needs every state of Vazrazhdane and Oborishte held, and the offers to Anton, Georgi and Alexander made first."
 SRD_a_free_centre:0 "A Free Centre"
 SRD_a_free_centre_desc:0 "From Lagera to the Eagles' Bridge, from the Lions' Bridge to the villas of Lozenets, the whole centre of Sofia answers to one council and has no checkpoints at all.\n\nNeeds every central state of Triaditsa, Lozenets, Krasno Selo and Serdika held."
 SRD_free_centre_of_sofia:0 "The Free Centre of Sofia"
 SRD_free_centre_of_sofia_desc:0 "Sredets is too small a name for what it has become. Alone, and without a single curfew, Victor Kolev's district has made the whole centre of Sofia one free city.\n\nSredets becomes the Free Centre of Sofia."
 SRD_a_temporary_emergency:0 "A Temporary Emergency"
 SRD_a_temporary_emergency_desc:0 "The whole centre is free, and the whole centre is surrounded by districts that want it back. Just for a little while, Victor explains, the curfew returns. Just until it is safe. The blue flag comes down for cleaning and somehow never goes back up.\n\nThe free centre ends: Sredets drops democracy, Victor rules alone again, and the guard runs the ministries (the spirit Rule by the Guard). Opens the road to the Directorate of Sofia."
 SRD_united_centre:0 "The Dream of a United Centre"
 SRD_united_centre_desc:0 "Ever since the city fell apart, Victor Kolev has had one dream: the centre of Sofia whole again, from the Women's Market to the villas of Lozenets, under one hand and one guard. Not a commune, not a free city, just the centre as it should be.\n\nSredets sets out to unite the centre."
 SRD_order_on_the_boulevards:0 "Order on the Boulevards"
 SRD_order_on_the_boulevards_desc:0 "Patrols on Vitosha Boulevard and Tsar Osvoboditel, lamps fixed, trams on time. Before the centre can be united it has to be run properly, and everyone has to see that it is."
 SRD_rule_by_the_guard:0 "Rule by the Guard"
 SRD_rule_by_the_guard_desc:0 "The district guard is the only thing in the centre that works. Victor gives it the ministries too: an officer in every office, a sentry at every door and a curfew whenever it is needed."
 SRD_bread_and_circuses:0 "Bread and Circuses"
 SRD_bread_and_circuses_desc:0 "A full stomach does not riot, and a full stadium does not plot. Cheap bread, free football and a band on the Largo every Sunday: the centre will love Victor, or at least be too busy to mind him."
 SRD_officers_in_the_ministries:0 "Officers in the Ministries"
 SRD_officers_in_the_ministries_desc:0 "Colonels run the post office, majors run the trams and a general runs the bakeries. Everything is late, but everything is in uniform."
 SRD_derby_at_the_national_stadium:0 "Derby at the National Stadium"
 SRD_derby_at_the_national_stadium_desc:0 "Levski against CSKA, the whole centre in the stands and Victor in the box of honour. Between the halves the recruiting sergeants work the crowd."
 SRD_the_guard_is_the_state:0 "The Guard Is the State"
 SRD_the_guard_is_the_state_desc:0 "There is no longer any difference between the guard and the government of the centre. Nobody remembers when the change happened, and nobody asks."
 SRD_only_good_news:0 "Only Good News"
 SRD_only_good_news_desc:0 "Every newspaper in the centre now has the same editor, and he only prints good news. The newsreels before the films are even better."
 SRD_the_directors_office:0 "The Director's Office"
 SRD_the_directors_office_desc:0 "A new office on the top floor of the Party House, a new title on the door and a new chair behind the desk. Victor does not use the title yet. He is waiting for the centre to be whole.\n\nNeeded for the Directorate of Sofia."
 SRD_the_centres_army:0 "The Centre's Army"
 SRD_the_centres_army_desc:0 "The district guard becomes an army: proper ranks, proper drill and barracks in the old ministries.\n\nUnlocks the decision Parade on Tsar Osvoboditel."
 SRD_march_on_the_old_centre:0 "March on the Old Centre"
 SRD_march_on_the_old_centre_desc:0 "The Women's Market of Vazrazhdane is a ten-minute walk from the Largo, and it still answers to somebody else. The first step to a united centre is the shortest.\n\nCores and war goals on Vazrazhdane."
 SRD_the_centre_takes_shape:0 "The Centre Takes Shape"
 SRD_the_centre_takes_shape_desc:0 "Vazrazhdane is ours. Now the edges of the centre: the streets around the Ivan Vazov quarter, the old villas of Lozenets, Kriva Reka and Lagera, and the railway quarter north of the Lions' Bridge.\n\nCores and war goals on the central states of Triaditsa, Lozenets, Krasno Selo and Serdika (Triaditsa, North Lozenets, Lozenets, Kriva Reka, Lagera, North City Centre, Serdika). Needs every state of Vazrazhdane held."
 SRD_the_khan_must_fall:0 "The Khan Must Fall"
 SRD_the_khan_must_fall_desc:0 "Twelve centuries ago Khan Krum took Serdica from the Byzantines. Now he sits in the Central Railway Station in chain mail, drinking from a cup nobody wants to look at, and calls the centre his tribute. The centre disagrees.\n\nOnly while Khan Krum rules Serdika. Cores and war goals on all of Serdika."
 SRD_krums_cup:0 "Krum's Cup"
 SRD_krums_cup_desc:0 "The Khan is gone, and his famous cup stands on Victor's desk in the Party House. Nobody drinks from it. Everybody who visits looks at it, though, and remembers who keeps it now.\n\nNeeds Serdika gone."
 SRD_the_centre_is_one:0 "The Centre Is One"
 SRD_the_centre_is_one_desc:0 "From Lagera to the Eagles' Bridge, the centre answers to one district hall. Only one question is left: Oborishte.\n\nNeeds every central state of Triaditsa, Lozenets, Krasno Selo and Serdika held."
 SRD_bring_anton_in:0 "Bring Anton In"
 SRD_bring_anton_in_desc:0 "The centre is not whole while the cathedral square answers to Anton Zafirov. He was a friend once. He can still be one, inside the centre.\n\nCores and war goals on Oborishte."
 SRD_anton_at_our_side:0 "Anton at Our Side"
 SRD_anton_at_our_side_desc:0 "Oborishte stays Anton's. The centre and Oborishte stand together instead: a guarantee, an open border on Shipka Street and a standing invitation to the district hall.\n\nAnton thinks better of us; we guarantee Oborishte, or bring it into our faction if we have one."
 SRD_the_united_centre:0 "The United Centre"
 SRD_the_united_centre_desc:0 "The cathedral square, the Women's Market, the villas of Lozenets and the Largo: one centre, under one hand, Oborishte included. Victor's dream has come true.\n\nNeeds every state of Oborishte held."
 SRD_the_centre_and_oborishte:0 "The Centre and Oborishte"
 SRD_the_centre_and_oborishte_desc:0 "The centre is united, and Oborishte stands next to it as a friend, not a province. Victor's dream has come true, with Anton at his side."
 SRD_proclaim_the_directorate:0 "Proclaim the Directorate of Sofia"
 SRD_proclaim_the_directorate_desc:0 "A district is too small a thing for what the centre has become. From the balcony of the Party House, Victor Kolev proclaims the Directorate of Sofia: one city, one guard, one Director. The other districts are not asked. They will be told.\n\nNeeds the whole centre held (Vazrazhdane and the central states of Triaditsa, Lozenets, Krasno Selo and Serdika). Sredets becomes the Directorate of Sofia with a new flag, and Victor becomes the Director."
 SRD_one_directorate:0 "One Directorate"
 SRD_one_directorate_desc:0 "Every street the Directorate holds is the Directorate, whoever ruled it before. The old district borders are painted over on every map in the Party House.\n\nCores on every state we own; any subject is annexed."
 SRD_sofia_answers_to_the_director:0 "Sofia Answers to the Director"
 SRD_sofia_answers_to_the_director_desc:0 "The centre was only the beginning. Every district that borders the Directorate gets the same letter, and this time there is no deadline.\n\nWar goals on every neighbour outside our faction."
 SRD_unleash_the_c_class:0 "Unleash the C Class Hools"
 SRD_unleash_the_c_class_desc:0 "Every school has a class like the C Class: loud, loyal, impossible to teach and absolutely fearless. Now they have grown up, two of them rule districts of their own, and they have been waiting for a reason. Victor gives them one.\n\nCreates the faction The C Class Hools. Not possible with the Evil Gang: it is one or the other."
 SRD_call_alexander:0 "Call Alexander"
 SRD_call_alexander_desc:0 "Alexander Dimitrov sat in the back row of the C Class and never once got caught. Triaditsa is his now, and the class wants him back.\n\nTriaditsa is asked to join the C Class Hools. He was one of us: he will almost certainly say yes."
 SRD_call_poryazov:0 "Call Georgi Poryazov"
 SRD_call_poryazov_desc:0 "Georgi Poryazov was always the last to arrive and the last to leave, and the C Class never had a fight he missed. Mladost has more men than anyone.\n\nMladost is asked to join the C Class Hools. He was one of us: he will almost certainly say yes."
 SRD_away_days:0 "Away Days"
 SRD_away_days_desc:0 "Every firm knows the rule: on away days you go to their ground. The C Class marches together, flares lit, into whichever district is foolish enough to be next.\n\nEvery member of the C Class Hools attacks harder for six months."
 SRD_champions_of_sofia:0 "Champions of Sofia"
 SRD_champions_of_sofia_desc:0 "Every firm in Sofia now knows who the champions are. The C Class marches through the centre with scarves held high, and nobody dares to look them in the eye.\n\nEvery member of the C Class Hools gets the Champions of Sofia spirit."
 SRD_ilchevs_lesson:0 "The Physics Teacher Steps In"
 SRD_ilchevs_lesson_desc:0 "Konstantin Ilchev has watched his former student run Sredets for long enough. One morning he walks into the Party House with a red pen and a stack of marked exam papers, and the guards, who all sat in his classes too, let him straight through.\n\nOnly from 1937, if Victor has still not chosen a road by then. Victor Kolev is sent to detention. Ilchev leads Sredets now."
 SRD_newtons_laws:0 "Newton's Laws of Government"
 SRD_newtons_laws_desc:0 "First law: a district at rest stays at rest unless acted upon by Ilchev. Second law: the force of a decree equals the mass of paperwork times its acceleration. Third law: for every complaint there is an equal and opposite detention."
 SRD_laboratory_of_the_nation:0 "Laboratory of the Nation"
 SRD_laboratory_of_the_nation_desc:0 "The ministries are turned into laboratories, and the laboratories into ministries. Every civil servant in Sredets now wears a white coat and keeps a lab notebook."
 SRD_homework_for_everyone:0 "Homework for Everyone"
 SRD_homework_for_everyone_desc:0 "Every household of the centre receives a worksheet each Monday, due by Friday. Late submissions are not accepted. The factories have never been so well organised."
 SRD_pop_quiz_for_the_army:0 "Pop Quiz for the Army"
 SRD_pop_quiz_for_the_army_desc:0 "Officers who cannot calculate a shell's trajectory on paper are sent back to the barracks to study. The officers who can are promoted. Ilchev marks every paper himself."
 SRD_e_equals_mc2:0 "E = mc²"
 SRD_e_equals_mc2_desc:0 "Energy equals mass times the speed of light squared. Ilchev writes it on the blackboard of the Council Chamber and explains, very slowly, what it could mean for a small district with enemies on every side."
 SRD_the_final_exam:0 "The Final Exam"
 SRD_the_final_exam_desc:0 "Vazrazhdane and Oborishte have failed every test of good neighbourliness. Ilchev sets them one final exam, and he has already decided the grade.\n\nClaims and war goals on Vazrazhdane and Oborishte."
 SRD_grades_are_final:0 "Grades Are Final"
 SRD_grades_are_final_desc:0 "There will be no resits. The centre has been marked, graded and filed under Sredets.\n\nCores on the states held. Needs every state of Vazrazhdane and Oborishte held."
 SRD_call_the_evil_gang:0 "Propose the Evil Gang"
 SRD_call_the_evil_gang_desc:0 "Long before the city fell apart, there was a group chat. It had a ridiculous name, a profile picture taken on the steps of a theatre and every one of the people who now rule half the districts of Sofia.\n\nVictor opens it again and proposes the Evil Gang. The letters go out one by one: to Georgi Poryazov now, to Daniel-Henry Capel in a month, to Stefan Kartunov in two. Each is more likely to say yes the better he thinks of Sredets.\n\nNeeds Who Stands with Sredets?. Not possible for a free Sredets or with the C Class Hools."
 SRD_destroy_henry:0 "Destroy Henry"
 SRD_destroy_henry_desc:0 "Henry tore up the letter. His mother says she always knew the gang was a bad influence. Fine: if Daniel-Henry Capel will not stand with the gang, he will not stand at all.\n\nOnly if Henry refused the Evil Gang. Claims and war goals on Vitosha."
 SRD_invite_georgi:0 "Invite Georgi Yanchovichin"
 SRD_invite_georgi_desc:0 "Georgi does not need an invitation. He is a day one; he was in the chat before the chat had a name. Victor sends him one anyway, because that is how it is done.\n\nLozenets is invited to the Evil Gang. As Victor's day one, Georgi is the most likely of all to say yes."
 SRD_destroy_stefan:0 "Destroy Stefan"
 SRD_destroy_stefan_desc:0 "Stefan rules the courtyards of Krasna Polyana and trusts nobody from the centre, and now he has said it out loud. The gang does not forget.\n\nOnly if Stefan refused the Evil Gang. Claims and war goals on Krasna Polyana."
 SRD_vitosha_award:0 "The Vitosha Award"
 SRD_vitosha_award_desc:0 "Vitosha is ours, and the gang is waiting for its share. Victor spreads the map on the table and draws the lines himself, like an arbiter in an old treaty. Sredets wants nothing from Henry: every street of Vitosha goes to the friends who stood by Victor.\n\nSredets takes nothing. Georgi Poryazov: Malinova Dolina Villas, Simeonovo, Orehite; Stefan Kartunov: Knyazhevo, Priplat Villas, Vladaya Villas, Marchaevo, Marchaevo Woods, Marchaevo Hills; Georgi Yanchovichin: Dragalevtsi, Dragalevtsi Lift, Zlatni Mostove; Alexander Dimitrov: Vitosha, Karpuzitsa, Kopitoto, Vladaya. If a friend is not in the gang, his share goes to the nearest friend who is."
 SRD_invite_dimitrov:0 "Invite Alexander Dimitrov"
 SRD_invite_dimitrov_desc:0 "Alexander will listen politely, agree with everything and then do what he likes. In the gang, that was exactly why everyone liked him.\n\nTriaditsa is invited to the Evil Gang."
 SRD_invite_anton:0 "Invite Anton Zafirov"
 SRD_invite_anton_desc:0 "Anton is three streets away and has never once missed a gang meeting. Whether he still remembers that depends on how he feels about Sredets these days.\n\nOborishte is invited to the Evil Gang. Anton is more likely to accept the better he thinks of Sredets."
 SRD_the_evil_gang_rules_sofia:0 "The Evil Gang Rules Sofia"
 SRD_the_evil_gang_rules_sofia_desc:0 "Whoever came, came. The Evil Gang is no longer a group chat, it is the strongest alliance in Sofia, and everyone outside it is about to find out what that means.\n\nEvery member of the Evil Gang gets the Evil Gang spirit. War goals on every neighbour outside the gang."
 SRD_workshops_of_sofia:0 "The Workshops of Sofia"
 SRD_workshops_of_sofia_desc:0 "Before the war, the centre made shoes, radios, cigarettes and trams. The machines are still there, under dust sheets in the courtyards. It is time to take the sheets off."
 SRD_courtyard_workshops:0 "Courtyard Workshops"
 SRD_courtyard_workshops_desc:0 "Every courtyard behind the boulevards gets a workshop, every workshop gets a lathe, and every lathe works two shifts."
 SRD_cellar_arsenals:0 "Cellar Arsenals"
 SRD_cellar_arsenals_desc:0 "The cellars under the old ministries are dry, deep and safe from shelling: the perfect place to make rifles."
 SRD_tram_lines:0 "Rebuild the Tram Lines"
 SRD_tram_lines_desc:0 "The yellow trams carry workers in the morning and shells in the afternoon. Every line that runs again is a factory that can open."
 SRD_construction_brigades:0 "Construction Brigades"
 SRD_construction_brigades_desc:0 "Bricklayers, carpenters and anyone who can carry a bucket are organised into brigades. Buildings go up faster when someone is counting."
 SRD_night_shifts:0 "Night Shifts"
 SRD_night_shifts_desc:0 "The lights in the workshops no longer go out. Nobody is happy about it, but the output figures are."
 SRD_rail_yard_arms:0 "Arms from the Rail Yards"
 SRD_rail_yard_arms_desc:0 "The repair sheds of the railway can rivet a boiler, so they can rivet a gun carriage."
 SRD_basement_laboratories:0 "Basement Laboratories"
 SRD_basement_laboratories_desc:0 "Chemistry teachers, radio amateurs and one very strange engineer are given a basement each and told to invent something useful."
 SRD_market_halls_reopen:0 "The Market Halls Reopen"
 SRD_market_halls_reopen_desc:0 "The Central Market Hall on Maria Luiza Boulevard opens its doors again, and with the traders come money, goods and the workshops that supply them."
 SRD_the_war_factories:0 "The War Factories"
 SRD_the_war_factories_desc:0 "The workshops and the rail yards are joined into proper war factories, with a manager, a quota and a guard on the gate."
 SRD_ammunition_works:0 "Ammunition in the Cellars"
 SRD_ammunition_works_desc:0 "A war is won by whoever runs out of bullets last. The cellars fill up with crates."
 SRD_the_polytechnic:0 "The Polytechnic"
 SRD_the_polytechnic_desc:0 "The engineering school reopens its lecture halls. Half its students are already working in the basements."
 SRD_tsarigradsko_factories:0 "Factories on Tsarigradsko Shose"
 SRD_tsarigradsko_factories_desc:0 "The road east out of the centre was always lined with factories. It will be again."
 SRD_arsenal_of_sofia:0 "The Arsenal of Sofia"
 SRD_arsenal_of_sofia_desc:0 "No district in Sofia makes more weapons than ours. Every other district knows it, and that is the point."
 SRD_industrial_heart_of_sofia:0 "The Industrial Heart of Sofia"
 SRD_industrial_heart_of_sofia_desc:0 "Smoke over the rooftops, sirens at shift change and trams full of workers at dawn: the centre is the industrial heart of Sofia again."
 SRD_district_guard_reformed:0 "The District Guard Reformed"
 SRD_district_guard_reformed_desc:0 "The district guard was a mob with rifles. It needs ranks, drill and somebody who has read a manual."
 SRD_rifle_clubs:0 "Rifle Clubs"
 SRD_rifle_clubs_desc:0 "Every school and every football club gets a rifle range. The young men of the centre learn to shoot straight before they learn to shave."
 SRD_sergeants_of_the_old_army:0 "Sergeants of the Old Army"
 SRD_sergeants_of_the_old_army_desc:0 "The old sergeants of the Bulgarian army are found in the cafés and the pensioners' clubs and given their stripes back."
 SRD_pilots_from_vrazhdebna:0 "Pilots from Vrazhdebna"
 SRD_pilots_from_vrazhdebna_desc:0 "The airfield at Vrazhdebna still has a few aeroplanes and the men who know how to fly them. They are offered a salary and a runway in the centre."
 SRD_artillery_in_the_parks:0 "Artillery in the Parks"
 SRD_artillery_in_the_parks_desc:0 "The City Garden and Borisova Garden become gun parks. The pigeons are not happy."
 SRD_field_kitchens:0 "Field Kitchens on the Boulevards"
 SRD_field_kitchens_desc:0 "An army marches on its stomach, and the centre has the best bakeries in Sofia."
 SRD_street_fighting_school:0 "Street Fighting School"
 SRD_street_fighting_school_desc:0 "Every war in Sofia is fought from doorway to doorway. The guard learns to take a staircase, hold a courtyard and never stand in front of a window."
 SRD_fighters_over_the_centre:0 "Fighters over the Centre"
 SRD_fighters_over_the_centre_desc:0 "Nothing flies over the Party House without permission, and permission is never given."
 SRD_armoured_trams:0 "Armoured Trams"
 SRD_armoured_trams_desc:0 "Steel plates bolted to a tram, a machine gun in the driver's window: the first tanks of Sofia run on rails."
 SRD_officer_corps:0 "The Officer Corps"
 SRD_officer_corps_desc:0 "The military academy on Evlogi Georgiev Boulevard trains officers again, and every one of them swears loyalty to the centre."
 SRD_anti_air_belt:0 "The Anti-Air Belt"
 SRD_anti_air_belt_desc:0 "Guns on the roofs, a radar on the tallest building and searchlights in every square."
 SRD_requisition_the_taxis:0 "Requisition the Taxis"
 SRD_requisition_the_taxis_desc:0 "Every taxi in the centre gets a new passenger: four soldiers and a machine gun."
 SRD_locomotive_works_armour:0 "Armour from the Locomotive Works"
 SRD_locomotive_works_armour_desc:0 "The locomotive works can build a boiler that holds twenty atmospheres. A turret is easier."
 SRD_general_staff:0 "The General Staff"
 SRD_general_staff_desc:0 "Maps on every wall of the old Ministry of War, and officers who know what every pin on them means."
 SRD_bombers_from_bozhurishte:0 "Bombers from Bozhurishte"
 SRD_bombers_from_bozhurishte_desc:0 "The old airfield at Bozhurishte, west of the city, can launch bombers over any district in Sofia."
 SRD_the_army_of_the_centre:0 "The Army of the Centre"
 SRD_the_army_of_the_centre_desc:0 "Rifles, guns, armour, aeroplanes and officers who know what to do with all of them: the army of the centre is the best in Sofia."
 SRD_comrades_in_oborishte_unlocks:0 "Unlocks the decisions §YThe Oborishte Question§!."
 SRD_united_centre_unlocks:0 "The C Class Hools and the Evil Gang cannot both be made: whichever comes first locks the other."
 VIT_stand_with_henry:0 "Stand with Henry"
 VIT_stand_with_henry_desc:0 "Daniel-Henry Capel rules Vitosha from a villa on the hill, with the forest at his back and the whole of Sofia below. Half English, half Bulgarian and entirely sure of himself, he has the strongest guard of any district. A student from Plovdiv called Yanislav Marazov is stirring up the villages against him. We stand with Henry.\n\nThe left half of the tree: Henry prepares, crushes the student movement and fights the civil war as the government."
 VIT_march_with_yani:0 "March with Yani"
 VIT_march_with_yani_desc:0 "Yanislav Marazov came to Sofia from Plovdiv to study and never went home. In the cafés of Simeonovo and Dragalevtsi he talks, and more people listen every week. The future belongs to him, not to the villa on the hill. We march with Yani.\n\nThe right half of the tree: Yani's movement prepares, takes the villa and fights Henry's loyalists. It is the harder war."
 VIT_henry_holds_the_villa:0 "Henry Holds the Villa"
 VIT_henry_holds_the_villa_desc:0 "Sandbags at the gate, guards on the roof and Henry's mother in charge of the kitchen. The villa will not fall."
 VIT_the_boyana_garrison:0 "The Boyana Garrison"
 VIT_the_boyana_garrison_desc:0 "The guard battalions in Boyana get new barracks, new rifles and officers who are loyal to Henry first.\n\nWhen the war comes we get four more divisions in Boyana."
 VIT_mothers_savings:0 "Mother's Savings"
 VIT_mothers_savings_desc:0 "Henry's mother has been putting money aside for years, against exactly this kind of day. She opens the tin.\n\nWhen the war comes we get 2,500 rifles."
 VIT_the_mountain_rangers:0 "The Mountain Rangers"
 VIT_the_mountain_rangers_desc:0 "Hunters, foresters and mountain guides who know every path from Boyana to Cherni Vrah.\n\nWhen the war comes we get the spirit Mountain Rangers (better defence, less attrition)."
 VIT_henrys_officers:0 "Henry's Officers"
 VIT_henrys_officers_desc:0 "Henry quietly replaces every officer he is not sure of with one he is.\n\nWhen the war comes we get 30 army experience and the spirit Henry's Officers (better organisation)."
 VIT_crush_the_student_movement:0 "Crush the Student Movement"
 VIT_crush_the_student_movement_desc:0 "Henry's guard raids the cafés of Simeonovo at dawn. Yani is not there. By noon his followers hold the whole east of the mountain, and by evening it is war.\n\nThe civil war begins. Yani's rebels, communist or fascist, take Simeonovo, Malinova Dolina, Dragalevtsi, Dragalevtsi Lift and Orehite. Support is split evenly between democracy and Henry's authoritarian rule: then choose his road."
 VIT_the_cafes_of_simeonovo:0 "The Cafés of Simeonovo"
 VIT_the_cafes_of_simeonovo_desc:0 "Every evening, a table at the back, a pot of coffee and Yani talking. Every evening a few more chairs."
 VIT_cells_in_simeonovo:0 "Cells in Simeonovo"
 VIT_cells_in_simeonovo_desc:0 "Rifles under the floorboards, a printing press in a garage and a list of names.\n\nWhen the war comes we get four more divisions in Simeonovo."
 VIT_students_from_plovdiv:0 "Students from Plovdiv"
 VIT_students_from_plovdiv_desc:0 "Every train from Plovdiv brings a few more of Yani's old classmates, with a suitcase and an address in Simeonovo.\n\nWhen the war comes we get 20,000 manpower and the spirit Students from Plovdiv (more recruits)."
 VIT_arms_from_plovdiv:0 "Arms from Plovdiv"
 VIT_arms_from_plovdiv_desc:0 "Tobacco crates from Plovdiv are heavier than tobacco.\n\nWhen the war comes we get 2,500 rifles."
 VIT_the_plovdiv_committee:0 "The Plovdiv Committee"
 VIT_the_plovdiv_committee_desc:0 "Seven people in a back room, one map of the mountain and a date circled in red.\n\nWhen the war comes we get more war support and 20 army experience."
 VIT_yani_takes_the_villa:0 "Yani Takes the Villa"
 VIT_yani_takes_the_villa_desc:0 "At midnight Yani's people walk through the villa's gate. Henry walks out of the back door with his guard and his mother, and by morning he holds Boyana and the whole west of the mountain.\n\nYani becomes leader and the civil war begins: Henry's loyalists take Boyana and the west, ten states in all, with the stronger army. Our capital moves to Simeonovo. Support is split evenly between communism and fascism: then choose Yani's road."
 VIT_h_head:0 "The Loyal Guard"
 VIT_h_head_desc:0 "Whichever road Henry takes, the guard that held the villa becomes the army that will hold the mountain."
 VIT_h_command:0 "Restore the Chain of Command"
 VIT_h_command_desc:0 "Half the officers changed sides, the other half are not answering the telephone. A list of who is still loyal and a lot of shouting.\n\nTakes The Mountain in Flames down one step."
 VIT_h_workshops:0 "Requisition the Villas"
 VIT_h_workshops_desc:0 "Every garage in Boyana becomes a workshop. The owners are promised compensation after the war, in writing, on Henry's best paper.\n\nTakes The Mountain in Flames down one step."
 VIT_h_reserves:0 "Call the Reserves"
 VIT_h_reserves_desc:0 "Every man who ever wore the guard's uniform is called back to it."
 VIT_h_line:0 "The Boyana Line"
 VIT_h_line_desc:0 "Trenches across the slopes, concrete at the crossroads and barbed wire through the vineyards."
 VIT_h_telephones:0 "Field Telephones"
 VIT_h_telephones_desc:0 "A wire from the villa to every company on the front. Henry phones them all personally."
 VIT_h_factory:0 "The Villa Workshops"
 VIT_h_factory_desc:0 "The biggest garage in Boyana makes rifles now."
 VIT_h_volunteers:0 "Volunteers from the City"
 VIT_h_volunteers_desc:0 "Young men from all over Sofia take the tram to the end of the line and walk up the mountain to join Henry."
 VIT_h_patrols:0 "The Ski Patrols"
 VIT_h_patrols_desc:0 "In winter the fastest way across the front is on skis. The guard learns."
 VIT_h_martial_law:0 "Martial Law on the Slopes"
 VIT_h_martial_law_desc:0 "Curfews, checkpoints and courts that sit at night. The villages behind the front stop arguing.\n\nTakes The Mountain in Flames down one step."
 VIT_h_guns:0 "Guns on the Ridges"
 VIT_h_guns_desc:0 "Every ridge of Vitosha looks down on the rebels' villages. A gun on each of them settles a lot of arguments."
 VIT_h_counter:0 "The Counteroffensive"
 VIT_h_counter_desc:0 "Henry has waited long enough. The guard goes over to the attack.\n\nOnly during the civil war."
 VIT_h_final_push:0 "Take Simeonovo"
 VIT_h_final_push_desc:0 "The cafés where it all started. Henry wants to have a coffee there when it is over.\n\nOnly during the civil war."
 VIT_h_won:0 "The Mountain Is Ours"
 VIT_h_won_desc:0 "The last shots echo across the forest and the mountain is quiet. Henry has won his war.\n\nNeeds the civil war won. Removes what is left of The Mountain in Flames, sends the hired and volunteer divisions home and leaves the Scars of War, which the repair focuses heal."
 VIT_h_rebuild:0 "Rebuild the Slopes"
 VIT_h_rebuild_desc:0 "New roads, new roofs and a factory where the worst of the fighting was."
 VIT_h_amnesty:0 "An Amnesty for the Students"
 VIT_h_amnesty_desc:0 "Henry forgives most of them. He keeps a list of the rest."
 VIT_h_restored:0 "The Mountain Restored"
 VIT_h_restored_desc:0 "The villa is repainted, the guard is back in its barracks and Henry's mother has taken down the sandbags. Mostly."
 VIT_h_dig_in:0 "Hold Every Ridge"
 VIT_h_dig_in_desc:0 "Not one metre of the mountain is given up without a fight.\n\nOnly during the civil war."
 VIT_h_mortars:0 "Mortars in the Vineyards"
 VIT_h_mortars_desc:0 "A mortar fits between two rows of vines and can reach the next village."
 VIT_h_trench_raids:0 "Trench Raids at Night"
 VIT_h_trench_raids_desc:0 "Small parties with knives and grenades, back before dawn with prisoners and stories.\n\nOnly during the civil war."
 VIT_h_lorries:0 "Lorries on the Mountain Road"
 VIT_h_lorries_desc:0 "Every delivery lorry in Boyana now carries soldiers up and down the mountain."
 VIT_h_repair_factories:0 "Repair the Factories"
 VIT_h_repair_factories_desc:0 "Glass in the windows, roofs on the halls and the machines running again.\n\nTakes the Scars of War down one step."
 VIT_h_reequip:0 "Re-equip the Guard"
 VIT_h_reequip_desc:0 "New rifles, new boots and new helmets for every man who fought.\n\nTakes the Scars of War down one step."
 VIT_h_railways:0 "Restore the Railways"
 VIT_h_railways_desc:0 "The little railway to Vladaya runs again, and so does the arms factory at the end of it."
 VIT_h_retrain:0 "Lessons of the Civil War"
 VIT_h_retrain_desc:0 "Every officer writes down what went wrong. Henry reads all of it."
 VIT_h_veterans:0 "Veterans of the Mountain"
 VIT_h_veterans_desc:0 "The men who fought for the villa march past it every year, and the city below remembers them."
 VIT_y_head:0 "The Plovdiv Brigades"
 VIT_y_head_desc:0 "Red or black, Yani's army is born in a week: students, tobacco workers and anyone else with a rifle."
 VIT_y_command:0 "Officers from the Cafés"
 VIT_y_command_desc:0 "Yani's best talkers become his first officers. Some of them are even good at it.\n\nTakes The Mountain in Flames down one step."
 VIT_y_workshops:0 "Workshops of Simeonovo"
 VIT_y_workshops_desc:0 "Every workshop on our side of the mountain now makes one thing: what the front needs.\n\nTakes The Mountain in Flames down one step."
 VIT_y_reserves:0 "Every Village a Barracks"
 VIT_y_reserves_desc:0 "Every village in the east sends its young men up the hill."
 VIT_y_line:0 "Dig In at Dragalevtsi"
 VIT_y_line_desc:0 "The monastery walls above Dragalevtsi have stopped armies before."
 VIT_y_telephones:0 "Couriers on Bicycles"
 VIT_y_telephones_desc:0 "No telephones, no radios, but every student owns a bicycle."
 VIT_y_factory:0 "The Orehite Arsenal"
 VIT_y_factory_desc:0 "A fruit warehouse in Orehite makes grenades now. It still smells of apples."
 VIT_y_volunteers:0 "Volunteers from the Lowlands"
 VIT_y_volunteers_desc:0 "Workers from Mladost and Pancharevo walk up the mountain road to join Yani."
 VIT_y_patrols:0 "The Night Raids"
 VIT_y_patrols_desc:0 "Henry's guard owns the day. Yani's people own the night."
 VIT_y_martial_law:0 "Revolutionary Discipline"
 VIT_y_martial_law_desc:0 "Committees, curfews and a firing squad that is mostly a threat.\n\nTakes The Mountain in Flames down one step."
 VIT_y_guns:0 "Guns from the Quarries"
 VIT_y_guns_desc:0 "Quarry explosives make very good shells, if you are not too fussy."
 VIT_y_counter:0 "The Storm of Boyana"
 VIT_y_counter_desc:0 "Everything we have, at once, toward the villa.\n\nOnly during the civil war."
 VIT_y_final_push:0 "Take the Villa Back"
 VIT_y_final_push_desc:0 "Henry's last stand is in his own house. Yani wants to sleep in it.\n\nOnly during the civil war."
 VIT_y_won:0 "The Mountain Is Ours"
 VIT_y_won_desc:0 "The last shots echo across the forest and the mountain is quiet. The student from Plovdiv has won his war.\n\nNeeds the civil war won. Removes what is left of The Mountain in Flames, sends the hired and volunteer divisions home and leaves the Scars of War, which the repair focuses heal."
 VIT_y_rebuild:0 "Rebuild the Villages"
 VIT_y_rebuild_desc:0 "The east of the mountain did the fighting. It gets the new roads and the new factory."
 VIT_y_amnesty:0 "Mercy for the Guard"
 VIT_y_amnesty_desc:0 "Henry's guardsmen are sent home, minus their rifles and their pride."
 VIT_y_restored:0 "The Mountain Restored"
 VIT_y_restored_desc:0 "The villa becomes a rest home, the guard becomes a militia and Yani finally gets some sleep."
 VIT_y_dig_in:0 "Not a Step Back"
 VIT_y_dig_in_desc:0 "Every house in Simeonovo is a fortress, and every fortress has a student in the window.\n\nOnly during the civil war."
 VIT_y_mortars:0 "Mortars from the Workshops"
 VIT_y_mortars_desc:0 "Drainpipes, a firing pin and a lot of courage."
 VIT_y_trench_raids:0 "Partisans behind the Lines"
 VIT_y_trench_raids_desc:0 "Yani's people know every path behind Henry's front.\n\nOnly during the civil war."
 VIT_y_lorries:0 "The Fruit Lorries"
 VIT_y_lorries_desc:0 "The orchard lorries of Orehite carry troops now, still smelling of apples."
 VIT_y_repair_factories:0 "Repair the Workshops"
 VIT_y_repair_factories_desc:0 "The workshops that made shells during the war make tractors and radios again.\n\nTakes the Scars of War down one step."
 VIT_y_reequip:0 "Rifles for the New Army"
 VIT_y_reequip_desc:0 "Henry's old arsenal, captured whole, equips the army that beat him.\n\nTakes the Scars of War down one step."
 VIT_y_railways:0 "The Mountain Railway"
 VIT_y_railways_desc:0 "A narrow railway from Simeonovo to Knyazhevo, built by the people who fought over it."
 VIT_y_retrain:0 "The Staff College in the Villa"
 VIT_y_retrain_desc:0 "Henry's dining room is now a lecture hall for Yani's officers."
 VIT_y_veterans:0 "Heroes of Simeonovo"
 VIT_y_veterans_desc:0 "Every street in Simeonovo is named after someone who fought for it."
 VIT_what_the_english_couldnt_do:0 "What the English Couldn't Do"
 VIT_what_the_english_couldnt_do_desc:0 "Henry's father's family has run things the English way for three hundred years: parliaments, tea at five and never raising your voice. Henry has watched them closely, and he is quite sure he can do it better. Westminster had centuries. Vitosha has Henry.\n\nVitosha becomes a democracy under Henry."
 VIT_tea_at_five:0 "Tea at Five"
 VIT_tea_at_five_desc:0 "Whatever happens at the front, the whole district stops for tea at five. Somehow this calms everyone down."
 VIT_parliament_in_boyana:0 "The Parliament in Boyana"
 VIT_parliament_in_boyana_desc:0 "Forty seats in the old church hall in Boyana, a speaker with a wig he made himself and very long debates."
 VIT_the_home_guard:0 "The Home Guard"
 VIT_the_home_guard_desc:0 "Every man too old or too young for the army gets an armband and a rifle and guards his own street."
 VIT_the_boyana_charter:0 "The Boyana Charter"
 VIT_the_boyana_charter_desc:0 "England has Magna Carta. Vitosha has the Boyana Charter, written by Henry on the back of a menu, and it is shorter."
 VIT_radio_vitosha_calling:0 "Radio Vitosha Calling"
 VIT_radio_vitosha_calling_desc:0 "This is Radio Vitosha. Every evening, news from the free mountain for every district of Sofia.\n\nDemocracy grows slowly in every neighbour for six months."
 VIT_the_mountain_conference:0 "The Mountain Conference"
 VIT_the_mountain_conference_desc:0 "Henry invites the free districts of Sofia to a conference at the villa: three days of speeches, two of lunch and one alliance.\n\nCreates the faction The Mountain Entente."
 VIT_fighters_over_vitosha:0 "Fighters over Vitosha"
 VIT_fighters_over_vitosha_desc:0 "A grass strip in the meadows below Aleko and a few aeroplanes. Henry calls it the Royal Air Force of the Mountain."
 VIT_rule_the_reservoirs:0 "Rule the Reservoirs"
 VIT_rule_the_reservoirs_desc:0 "England ruled the waves. Vitosha will rule the lake at Pancharevo, which is a start.\n\nCores and war goals on Pancharevo."
 VIT_a_cabinet_of_all_talents:0 "A Cabinet of All Talents"
 VIT_a_cabinet_of_all_talents_desc:0 "A minister from every village, including two who used to follow Yani. Henry keeps an eye on those two."
 VIT_guarantees_for_the_small:0 "Guarantees for the Small"
 VIT_guarantees_for_the_small_desc:0 "No small district next to Vitosha will be swallowed while Henry has anything to say about it.\n\nWe guarantee every neighbour outside a faction."
 VIT_invite_the_free_districts:0 "Invite the Free Districts"
 VIT_invite_the_free_districts_desc:0 "A letter to every district of Sofia that is not in an alliance: join the Mountain Entente.\n\nEach is likelier to join the more democratic it is and the better it thinks of us."
 VIT_radar_on_cherni_vrah:0 "Radar on Cherni Vrah"
 VIT_radar_on_cherni_vrah_desc:0 "From the top of Cherni Vrah you can see every aeroplane over Sofia. Now you can see them in the dark as well."
 VIT_the_thin_red_line:0 "The Thin Blue Line"
 VIT_the_thin_red_line_desc:0 "The English had a thin red line. Henry's guard wears blue, and its line is a little thicker."
 VIT_the_special_relationship:0 "The Special Relationship"
 VIT_the_special_relationship_desc:0 "Henry writes a personal letter to every democratic leader in Sofia. He signs each of them 'your friend on the hill'.\n\nEvery democracy thinks better of us."
 VIT_lend_lease:0 "Lend to Our Friends"
 VIT_lend_lease_desc:0 "Rifles from the mountain for every friend who needs them. They can pay us back later.\n\nEvery member of our faction gets 500 rifles."
 VIT_spitfires_of_the_mountain:0 "Spitfires of the Mountain"
 VIT_spitfires_of_the_mountain_desc:0 "The best fighters in Sofia, built in a hangar in Knyazhevo and named after Henry's mother's temper."
 VIT_dominion_status:0 "Dominion Status"
 VIT_dominion_status_desc:0 "Ovcha Kupel lies at the foot of the mountain and would make an excellent dominion.\n\nCores and war goals on Ovcha Kupel."
 VIT_fight_on_the_slopes:0 "We Shall Fight on the Slopes"
 VIT_fight_on_the_slopes_desc:0 "We shall fight in the villas, we shall fight in the forests, we shall fight on the ski runs. We shall never surrender."
 VIT_the_mountain_pound:0 "The Mountain Pound"
 VIT_the_mountain_pound_desc:0 "A currency of our own, with Henry on the notes and the mountain on the coins. The banks of Sofia take it, mostly."
 VIT_the_mountain_air_ministry:0 "The Mountain Air Ministry"
 VIT_the_mountain_air_ministry_desc:0 "A ministry for aeroplanes, with its own factory and a minister who is never seen on the ground."
 VIT_commonwealth_of_the_mountain:0 "The Commonwealth of the Mountain"
 VIT_commonwealth_of_the_mountain_desc:0 "From the lake at Pancharevo to the fields of Ovcha Kupel, the mountain and its dominions form one Commonwealth, with Henry at its head. Westminster never managed anything this tidy.\n\nNeeds Vitosha, Ovcha Kupel and Pancharevo held. Vitosha becomes the Commonwealth of the Mountain and cores the land it holds."
 VIT_finest_hour:0 "Our Finest Hour"
 VIT_finest_hour_desc:0 "If the Commonwealth lasts for a thousand years, people will still say: this was its finest hour."
 VIT_the_vitosha_charter:0 "The Vitosha Charter"
 VIT_the_vitosha_charter_desc:0 "Henry and his friends sign a charter on a ship. The ship is a rowing boat on the Pancharevo lake, but the charter is very grand.\n\nEvery democracy outside an alliance is invited to the Mountain Entente."
 VIT_the_sun_never_sets:0 "The Sun Never Sets on the Mountain"
 VIT_the_sun_never_sets_desc:0 "There is always somewhere on the Commonwealth where the sun is shining. Usually it is the top of the mountain. The districts below it do not have to be conquered: they can be dominions.\n\nWar goals to make Lozenets, Studentski and Mladost our dominions (puppets)."
 VIT_an_offer_of_dominion:0 "An Offer of Dominion"
 VIT_an_offer_of_dominion_desc:0 "Henry writes to every free district next to the mountain: join the Commonwealth as a dominion, keep your own parliament, and never worry about defence again.\n\nEvery democratic neighbour outside an alliance is offered dominion status. The weaker it is and the better it thinks of us, the likelier it says yes."
 VIT_better_than_westminster:0 "Better Than Westminster"
 VIT_better_than_westminster_desc:0 "A visiting English lord tours the villa, the parliament in Boyana and the meadow airfield, has his tea at five and admits, quietly, that they do it better on the mountain. Henry has the remark framed."
 VIT_what_zevka_wanted:0 "What Zevka Wanted"
 VIT_what_zevka_wanted_desc:0 "Henry's Bulgarian grandmother Zevka had firm views on everything: the church on Sunday, dinner at midnight, the land in the family and a strong hand at the top. She never lived to see the mountain run properly. Henry will see to it.\n\nHenry keeps his authoritarian rule."
 VIT_bells_of_boyana_church:0 "The Bells of Boyana Church"
 VIT_bells_of_boyana_church_desc:0 "The little medieval church at Boyana rings its bells again on Sunday, and the whole district goes."
 VIT_dinner_at_midnight:0 "Dinner at Midnight"
 VIT_dinner_at_midnight_desc:0 "Zevka's family never ate before midnight, and nobody left the table angry. Henry's ministers now dine with him at midnight. They are very tired, and very loyal."
 VIT_the_mountain_militia:0 "The Mountain Militia"
 VIT_the_mountain_militia_desc:0 "Every village on the slopes raises a company of its own, under its own priest and its own mayor."
 VIT_monks_of_dragalevtsi:0 "The Monks of Dragalevtsi"
 VIT_monks_of_dragalevtsi_desc:0 "The monastery above Dragalevtsi has hidden rebels and saints for five hundred years. Now it blesses Henry's banners."
 VIT_zevkas_catechism:0 "Zevka's Catechism"
 VIT_zevkas_catechism_desc:0 "Every child on the mountain learns the same seven rules Zevka taught Henry. Rule four is about eating your soup."
 VIT_land_for_the_villages:0 "Land for the Villages"
 VIT_land_for_the_villages_desc:0 "The fields the rebels took are given back to the families who worked them, as Zevka would have wanted."
 VIT_the_old_officers:0 "The Old Officers"
 VIT_the_old_officers_desc:0 "Grey moustaches, old medals and a very clear idea of how a war should be fought."
 VIT_bunkers_on_kopitoto:0 "Bunkers on Kopitoto"
 VIT_bunkers_on_kopitoto_desc:0 "Kopitoto looks down on all of Sofia. Concrete on its top makes sure it stays that way."
 VIT_the_family_council:0 "The Family Council"
 VIT_the_family_council_desc:0 "Henry governs with a council of aunts, uncles and cousins. They argue all night, and then do what Henry says."
 VIT_grandmas_larder:0 "Grandma's Larder"
 VIT_grandmas_larder_desc:0 "Pickles, jam and lyutenitsa for every family on the mountain, in jars, for the winter. Nobody goes hungry while Zevka's recipes are in charge."
 VIT_the_mountain_gendarmerie:0 "The Mountain Gendarmerie"
 VIT_the_mountain_gendarmerie_desc:0 "Policemen on horses in every village, and a horse for every policeman."
 VIT_a_crown_in_the_attic:0 "A Crown in the Attic"
 VIT_a_crown_in_the_attic_desc:0 "Clearing out Zevka's attic, Henry finds a box. In the box is an old crown, and a letter in his grandmother's hand: for when the mountain is ready."
 VIT_the_villages_rebuilt:0 "The Villages Rebuilt"
 VIT_the_villages_rebuilt_desc:0 "Stone houses, a well in every square and a road to every village, as Zevka remembered them."
 VIT_the_lowlands_below:0 "The Lowlands Below"
 VIT_the_lowlands_below_desc:0 "Every village at the foot of the mountain once paid its tithe to the monasteries on its slopes. Zevka never forgot it.\n\nCores and war goals on Ovcha Kupel and Pancharevo."
 VIT_regent_of_the_mountain:0 "Regent of the Mountain"
 VIT_regent_of_the_mountain_desc:0 "Henry does not put on the crown. Not yet. He governs as regent, in the crown's name, until the mountain is whole."
 VIT_the_estates_of_knyazhevo:0 "The Estates of Knyazhevo"
 VIT_the_estates_of_knyazhevo_desc:0 "The old estates in Knyazhevo get a foundry, and the foundry gets the best workers on the mountain."
 VIT_march_into_the_valley:0 "March into the Valley"
 VIT_march_into_the_valley_desc:0 "Below the lowlands lies the city itself. Lozenets and Triaditsa are the first streets of Sofia that climb toward the mountain.\n\nCores and war goals on Lozenets and Triaditsa."
 VIT_the_crowns_army:0 "The Crown's Army"
 VIT_the_crowns_army_desc:0 "Every soldier of Vitosha now swears to the crown in the attic, whoever wears it one day."
 VIT_the_league_of_the_mountain:0 "The League of the Mountain"
 VIT_the_league_of_the_mountain_desc:0 "Every district that still has a strong hand at the top is invited to dinner at the villa. At midnight, of course.\n\nCreates the League of the Mountain and invites every district outside an alliance; authoritarian ones are likelier to say yes."
 VIT_tsardom_of_the_mountain:0 "The Tsardom of the Mountain"
 VIT_tsardom_of_the_mountain_desc:0 "In Boyana Church, under frescoes seven hundred years old, the crown from the attic is placed on Henry's head. Zevka's dream has come true: the Tsardom of the Mountain.\n\nNeeds Vitosha, Ovcha Kupel and Pancharevo held. Vitosha becomes the Tsardom of the Mountain, Henry its tsar, and cores the land it holds."
 VIT_zevka_would_be_proud:0 "Zevka Would Be Proud"
 VIT_zevka_would_be_proud_desc:0 "Henry visits her grave in Boyana every Sunday, with flowers and the news. He is sure she approves."
 VIT_the_court_at_boyana:0 "The Court at Boyana"
 VIT_the_court_at_boyana_desc:0 "Painters, scholars and a court poet who rhymes everything with Vitosha. It is harder than it sounds."
 VIT_the_throne_expands:0 "The Mountain Throne Expands"
 VIT_the_throne_expands_desc:0 "West of the mountain lie the old villages: Bankya with its springs, Vrabnitsa, Lyulin and Krasna Polyana. Zevka said they were always the tsar's, whatever the maps say.\n\nCores and war goals on Bankya, Krasna Polyana, Vrabnitsa and Lyulin."
 VIT_bells_over_sofia:0 "Bells over Sofia"
 VIT_bells_over_sofia_desc:0 "On the tsar's name day every church bell in Sofia rings at once, and every district hears it."
 VIT_red_plovdiv:0 "Red Plovdiv"
 VIT_red_plovdiv_desc:0 "Yani grew up among the tobacco workers of Plovdiv and their strikes. He gives the mountain what they wanted: the land to the villages, the villas to the people, the hill to the workers.\n\nYani stays communist."
 VIT_the_tobacco_workers:0 "The Tobacco Workers"
 VIT_the_tobacco_workers_desc:0 "Yani brings the tobacco workers of Plovdiv to the mountain: the best organised, most stubborn workers in Bulgaria."
 VIT_the_red_mountain_guard:0 "The Red Mountain Guard"
 VIT_the_red_mountain_guard_desc:0 "The old guard is gone. The new one learned its trade in the war and its politics in Yani's cafés."
 VIT_lectures_in_kapana:0 "Lectures in Kapana"
 VIT_lectures_in_kapana_desc:0 "Kapana, the Trap, is Plovdiv's maze of craftsmen's streets. Yani builds a new one on the mountain, full of workshops and lecture halls."
 VIT_the_orchards_of_orehite:0 "The Orchards of Orehite"
 VIT_the_orchards_of_orehite_desc:0 "The orchards of Orehite belonged to six families. Now they belong to everyone, and the apples are just as good."
 VIT_the_plovdiv_fair:0 "The Plovdiv Fair"
 VIT_the_plovdiv_fair_desc:0 "Plovdiv has held a great fair every year since the last century. Yani holds one on the mountain: tractors, lathes and very long speeches."
 VIT_commissars_of_the_slopes:0 "Commissars of the Slopes"
 VIT_commissars_of_the_slopes_desc:0 "A commissar with every company, a pamphlet in every pack."
 VIT_partisans_of_vitosha:0 "The Partisans of Vitosha"
 VIT_partisans_of_vitosha_desc:0 "Every path, cave and hut on the mountain has a partisan who knows it. No enemy army will cross Vitosha in peace."
 VIT_comrades_in_the_city:0 "Comrades in the City"
 VIT_comrades_in_the_city_desc:0 "Students go down the mountain with leaflets in their satchels.\n\nCommunism grows slowly in every neighbour for six months."
 VIT_the_villas_to_the_people:0 "The Villas to the People"
 VIT_the_villas_to_the_people_desc:0 "The villas of Boyana become schools, clinics and workers' hostels. Henry's old villa becomes all three."
 VIT_the_red_army_of_the_mountain:0 "The Red Army of the Mountain"
 VIT_the_red_army_of_the_mountain_desc:0 "Commissars, red stars and a doctrine written in a café in Simeonovo."
 VIT_the_red_press:0 "The Red Press"
 VIT_the_red_press_desc:0 "One newspaper, one opinion, printed on the press from the garage in Simeonovo."
 VIT_the_thracian_dream:0 "The Thracian Dream"
 VIT_the_thracian_dream_desc:0 "Plovdiv is the heart of Thrace, and the road to Thrace runs south-east past the lake at Pancharevo.\n\nCores and war goals on Pancharevo."
 VIT_the_five_year_plan:0 "The Mountain Five-Year Plan"
 VIT_the_five_year_plan_desc:0 "Five years, five targets, and a red banner for every factory that meets them."
 VIT_the_red_air_brigade:0 "The Red Air Brigade"
 VIT_the_red_air_brigade_desc:0 "Three aeroplanes, painted red, flown by the bravest students in Simeonovo."
 VIT_the_mountain_committee:0 "The Committee for the Mountain"
 VIT_the_mountain_committee_desc:0 "A committee that watches everyone, including the other committees."
 VIT_the_red_mountain:0 "The Red Mountain"
 VIT_the_red_mountain_desc:0 "Every worker in Sofia has a friend on the mountain now.\n\nCreates the faction The Red Mountain and invites every district outside an alliance; communist ones are likelier to say yes."
 VIT_the_road_to_plovdiv:0 "The Road to Plovdiv"
 VIT_the_road_to_plovdiv_desc:0 "The old road to Plovdiv leaves Sofia through Iskar. Whoever holds it holds the way home.\n\nCores and war goals on Iskar."
 VIT_tractors_for_the_slopes:0 "Tractors for the Slopes"
 VIT_tractors_for_the_slopes_desc:0 "A tractor works in Simeonovo, built from the parts of Henry's motor cars."
 VIT_workers_of_sofia_unite:0 "Workers of Sofia, Unite"
 VIT_workers_of_sofia_unite_desc:0 "From Mladost to Lyulin, every communist in Sofia hears Yani's speech on the radio.\n\nEvery communist district thinks better of us."
 VIT_thracian_commune:0 "The Thracian Commune"
 VIT_thracian_commune_desc:0 "From the top of Vitosha to the road to Plovdiv, one commune: the first step to the red Thrace Yani dreamed of in the tobacco warehouses.\n\nNeeds Vitosha, Pancharevo and Iskar held. Vitosha becomes the Thracian Commune and cores the land it holds."
 VIT_all_roads_lead_to_plovdiv:0 "All Roads Lead to Plovdiv"
 VIT_all_roads_lead_to_plovdiv_desc:0 "Rome had its roads. Plovdiv had them first, and the road home runs east, through the steelworks and the workers' districts of Kremikovtsi, Novi Iskar, Slatina and Izgrev.\n\nCores and war goals on those four."
 VIT_the_red_hill:0 "The Red Hill"
 VIT_the_red_hill_desc:0 "Yani renames the mountain's highest hut after the tobacco strike of his childhood. The workers climb up to see it every May Day."
 VIT_the_soviet_of_sofia:0 "The Soviet of Sofia"
 VIT_the_soviet_of_sofia_desc:0 "Delegates from every red district meet in Henry's old ballroom and vote, unanimously, for everything Yani proposes."
 VIT_may_day_on_cherni_vrah:0 "May Day on Cherni Vrah"
 VIT_may_day_on_cherni_vrah_desc:0 "Ten thousand people climb to the top of the mountain with red flags, and Yani makes a speech that the whole city hears."
 VIT_the_seven_hills:0 "The Seven Hills"
 VIT_the_seven_hills_desc:0 "Plovdiv is older than Rome, older than Athens, and was built on seven hills. Yani's followers put on black shirts, light torches and march down the mountain road singing about Philip of Macedon.\n\nYani's movement turns fascist."
 VIT_the_legacy_of_philip:0 "The Legacy of Philip"
 VIT_the_legacy_of_philip_desc:0 "Philip of Macedon took a Thracian town and named it after himself. His son conquered the world. Yani has read both of their biographies twice."
 VIT_seven_hills_seven_districts:0 "Seven Hills, Seven Districts"
 VIT_seven_hills_seven_districts_desc:0 "Plovdiv was built on seven hills. Yani's new Philippopolis will be built on seven districts, one for every hill.\n\nEach hill focus claims a district; holding all seven opens New Philippopolis."
 VIT_torchlight_on_the_slopes:0 "Torchlight on the Slopes"
 VIT_torchlight_on_the_slopes_desc:0 "Every Saturday night a column of torches climbs from Simeonovo to Aleko. From the city it looks like a river of fire running uphill."
 VIT_the_macedonian_phalanx:0 "The Macedonian Phalanx"
 VIT_the_macedonian_phalanx_desc:0 "Long pikes worked for Philip. Yani settles for long bayonets."
 VIT_philips_generals:0 "Philip's Generals"
 VIT_philips_generals_desc:0 "Every one of Yani's generals is given the name of one of Philip's. Parmenion is very proud of it."
 VIT_the_black_shirt_youth:0 "The Black Shirt Youth"
 VIT_the_black_shirt_youth_desc:0 "Every boy in Simeonovo wants a black shirt. Every mother in Simeonovo is worried about it."
 VIT_the_trimontium_radio:0 "Radio Trimontium"
 VIT_the_trimontium_radio_desc:0 "The Romans called Plovdiv Trimontium. So does Yani's radio station, every evening, on every wavelength.\n\nFascism grows slowly in every neighbour for six months."
 VIT_the_trimontium_guard:0 "The Trimontium Guard"
 VIT_the_trimontium_guard_desc:0 "The Romans called Plovdiv the city of three hills. Yani's guard takes the name and the doctrine."
 VIT_the_seven_hills_pact:0 "The Pact of the Seven Hills"
 VIT_the_seven_hills_pact_desc:0 "Seven hills, seven seats at the table, and Yani at the head of it.\n\nCreates the faction The Pact of the Seven Hills and invites every district outside an alliance; fascist ones are likelier to say yes."
 VIT_nebet_tepe:0 "Nebet Tepe: Lozenets"
 VIT_nebet_tepe_desc:0 "Nebet Tepe is one of the seven hills of Plovdiv. In Yani's new Philippopolis, its name goes to Lozenets.\n\nCores and war goals on Lozenets."
 VIT_dzhambaz_tepe:0 "Dzhambaz Tepe: Triaditsa"
 VIT_dzhambaz_tepe_desc:0 "Dzhambaz Tepe is one of the seven hills of Plovdiv. In Yani's new Philippopolis, its name goes to Triaditsa.\n\nCores and war goals on Triaditsa."
 VIT_taksim_tepe:0 "Taksim Tepe: Ovcha Kupel"
 VIT_taksim_tepe_desc:0 "Taksim Tepe is one of the seven hills of Plovdiv. In Yani's new Philippopolis, its name goes to Ovcha Kupel.\n\nCores and war goals on Ovcha Kupel."
 VIT_sahat_tepe:0 "Sahat Tepe: Pancharevo"
 VIT_sahat_tepe_desc:0 "Sahat Tepe is one of the seven hills of Plovdiv. In Yani's new Philippopolis, its name goes to Pancharevo.\n\nCores and war goals on Pancharevo."
 VIT_bunardzhika:0 "Bunardzhika: Studentski"
 VIT_bunardzhika_desc:0 "Bunardzhika is one of the seven hills of Plovdiv. In Yani's new Philippopolis, its name goes to Studentski.\n\nCores and war goals on Studentski."
 VIT_dzhendem_tepe:0 "Dzhendem Tepe: Krasno Selo"
 VIT_dzhendem_tepe_desc:0 "Dzhendem Tepe is one of the seven hills of Plovdiv. In Yani's new Philippopolis, its name goes to Krasno Selo.\n\nCores and war goals on Krasno Selo."
 VIT_markovo_tepe:0 "Markovo Tepe: Mladost"
 VIT_markovo_tepe_desc:0 "Markovo Tepe is one of the seven hills of Plovdiv. In Yani's new Philippopolis, its name goes to Mladost.\n\nCores and war goals on Mladost."
 VIT_the_eighth_hill:0 "The Eighth Hill"
 VIT_the_eighth_hill_desc:0 "Plovdiv has seven hills. Philippopolis has eight: the eighth is Vitosha, and it is the tallest."
 VIT_the_mountain_arsenal:0 "The Black Arsenal"
 VIT_the_mountain_arsenal_desc:0 "Two new arms factories in the quarries, painted black, naturally."
 VIT_the_torch_bearers:0 "The Torch Bearers"
 VIT_the_torch_bearers_desc:0 "The oldest of the black shirts carry the torches at the front of every march. It is the highest honour on the mountain."
 VIT_the_roman_theatre:0 "The Roman Theatre"
 VIT_the_roman_theatre_desc:0 "Plovdiv has a Roman theatre. Yani builds one on the mountain, for speeches, with very good acoustics."
 VIT_new_philippopolis:0 "New Philippopolis"
 VIT_new_philippopolis_desc:0 "Seven districts, seven hills, one city: New Philippopolis rises at the foot of Vitosha, and the student from Plovdiv rules it.\n\nNeeds Vitosha and all seven hill districts held (Lozenets, Triaditsa, Ovcha Kupel, Pancharevo, Studentski, Krasno Selo, Mladost). Vitosha becomes New Philippopolis and cores the land it holds."
 VIT_philippopolis_rules_sofia:0 "Philippopolis Rules Sofia"
 VIT_philippopolis_rules_sofia_desc:0 "Sofia was a Thracian town, Serdica, long before it was anything else. Its old heart belongs to the Thracians' heirs.\n\nCores and war goals on the old centre: Sredets, Oborishte, Vazrazhdane and Serdika."
 VIT_the_sun_of_vergina:0 "The Sun of Vergina"
 VIT_the_sun_of_vergina_desc:0 "The golden sun of Philip's tomb flies over the mountain, and Yani has it embroidered on every black shirt."
 VIT_the_group_chat_pings:0 "The Group Chat Pings"
 VIT_the_group_chat_pings_desc:0 "The war on the mountain is over, and the phone has not stopped buzzing. The old group chat, the Evil Gang, wants to know if Vitosha is still one of them."
 VIT_join_victors_gang:0 "Join Victor's Gang"
 VIT_join_victors_gang_desc:0 "Victor has already brought the Evil Gang back together. Vitosha asks to join.\n\nOnly if Sredets leads the Evil Gang. Victor decides; the better he thinks of us, the likelier he says yes."
 VIT_found_the_mountain_gang:0 "The Gang on the Mountain"
 VIT_found_the_mountain_gang_desc:0 "Nobody has brought the gang back together yet, so Vitosha will. The first meeting is at the villa, and there is plenty of food.\n\nCreates the faction The Evil Gang with Vitosha at its head. Not possible if Sredets already leads it."
 VIT_vit_invite_SRD:0 "Invite Victor Kolev"
 VIT_vit_invite_SRD_desc:0 "A message in the group chat, addressed to Victor Kolev by name: the gang is meeting on the mountain, and there is a seat for him.\n\nVictor Kolev is invited to the Evil Gang. The better he thinks of us, the likelier he says yes."
 VIT_vit_invite_LOZ:0 "Invite Georgi Yanchovichin"
 VIT_vit_invite_LOZ_desc:0 "A message in the group chat, addressed to Georgi Yanchovichin by name: the gang is meeting on the mountain, and there is a seat for him.\n\nGeorgi Yanchovichin is invited to the Evil Gang. The better he thinks of us, the likelier he says yes."
 VIT_vit_invite_KRP:0 "Invite Stefan Kartunov"
 VIT_vit_invite_KRP_desc:0 "A message in the group chat, addressed to Stefan Kartunov by name: the gang is meeting on the mountain, and there is a seat for him.\n\nStefan Kartunov is invited to the Evil Gang. The better he thinks of us, the likelier he says yes."
 VIT_vit_invite_MLA:0 "Invite Georgi Poryazov"
 VIT_vit_invite_MLA_desc:0 "A message in the group chat, addressed to Georgi Poryazov by name: the gang is meeting on the mountain, and there is a seat for him.\n\nGeorgi Poryazov is invited to the Evil Gang. The better he thinks of us, the likelier he says yes."
 VIT_vit_invite_TRD:0 "Invite Alexander Dimitrov"
 VIT_vit_invite_TRD_desc:0 "A message in the group chat, addressed to Alexander Dimitrov by name: the gang is meeting on the mountain, and there is a seat for him.\n\nAlexander Dimitrov is invited to the Evil Gang. The better he thinks of us, the likelier he says yes."
 VIT_vit_invite_OBR:0 "Invite Anton Zafirov"
 VIT_vit_invite_OBR_desc:0 "A message in the group chat, addressed to Anton Zafirov by name: the gang is meeting on the mountain, and there is a seat for him.\n\nAnton Zafirov is invited to the Evil Gang. The better he thinks of us, the likelier he says yes."
 VIT_the_gang_rules_the_mountain:0 "The Gang Rules the Mountain"
 VIT_the_gang_rules_the_mountain_desc:0 "The gang meets every Friday at the villa, and everyone outside it is a little more nervous on Saturdays.\n\nEvery member of our faction gets the Evil Gang spirit."
 VIT_the_quarries_of_vitosha:0 "The Quarries of Vitosha"
 VIT_the_quarries_of_vitosha_desc:0 "The granite of Vitosha built half the pavements of Sofia. The quarries open again."
 VIT_the_boyana_workshops:0 "The Workshops of Boyana"
 VIT_the_boyana_workshops_desc:0 "Garages behind the villas become workshops, and the workshops get bigger every month."
 VIT_the_arsenal_in_the_rock:0 "The Arsenal in the Rock"
 VIT_the_arsenal_in_the_rock_desc:0 "An old quarry tunnel is safe from any shell in Sofia. It makes rifles now."
 VIT_the_road_to_aleko:0 "The Road to Aleko"
 VIT_the_road_to_aleko_desc:0 "A proper road up the mountain to the Aleko hut, with electric light all the way."
 VIT_knyazhevo_springs:0 "The Springs of Knyazhevo"
 VIT_knyazhevo_springs_desc:0 "The mineral springs of Knyazhevo are bottled and sold all over Sofia. Everyone feels a little healthier, and the treasury feels a lot healthier."
 VIT_arms_from_the_quarries:0 "Arms from the Quarries"
 VIT_arms_from_the_quarries_desc:0 "The quarry railways carry stone in the morning and shells in the afternoon."
 VIT_the_mountain_laboratory:0 "The Mountain Laboratory"
 VIT_the_mountain_laboratory_desc:0 "Clear air, no distractions and a view of the whole city: the perfect place to think."
 VIT_factories_in_the_valley:0 "Factories in the Valley"
 VIT_factories_in_the_valley_desc:0 "Down in the valley, where the road from the mountain meets the city, the big factories go up."
 VIT_war_workshops_of_knyazhevo:0 "The War Workshops of Knyazhevo"
 VIT_war_workshops_of_knyazhevo_desc:0 "Knyazhevo's tram depot builds armoured cars, and its foundry builds what goes on them."
 VIT_the_industrial_mountain:0 "The Industrial Mountain"
 VIT_the_industrial_mountain_desc:0 "Smoke on the slopes and sirens in the valleys: the mountain works."
 VIT_the_mountain_army:0 "The Mountain Army"
 VIT_the_mountain_army_desc:0 "The strongest guard in Sofia needs to become an army."
 VIT_mountaineers_of_cherni_vrah:0 "Mountaineers of Cherni Vrah"
 VIT_mountaineers_of_cherni_vrah_desc:0 "Men who climb Cherni Vrah in winter for fun make very good soldiers."
 VIT_rifles_of_the_slopes:0 "Rifles of the Slopes"
 VIT_rifles_of_the_slopes_desc:0 "Every hunter on the mountain has a rifle. Now every soldier has a better one."
 VIT_planes_over_the_peak:0 "Planes over the Peak"
 VIT_planes_over_the_peak_desc:0 "A grass strip in the meadows below Aleko, and a few aeroplanes that can just about clear the trees."
 VIT_artillery_on_the_ridges:0 "Artillery on the Ridges"
 VIT_artillery_on_the_ridges_desc:0 "A gun on a ridge of Vitosha can reach half of Sofia."
 VIT_ski_troops:0 "Ski Troops"
 VIT_ski_troops_desc:0 "In winter the fastest way down the mountain is on skis. The guard learns."
 VIT_the_mountain_academy:0 "The Mountain Academy"
 VIT_the_mountain_academy_desc:0 "An officers' school in an old monastery, with a parade ground cut into the forest."
 VIT_fighters_over_the_slopes:0 "Fighters over the Slopes"
 VIT_fighters_over_the_slopes_desc:0 "Better aeroplanes for the meadow airfield, and pilots who have stopped crashing into the trees."
 VIT_armoured_cars_on_the_mountain_road:0 "Armoured Cars on the Mountain Road"
 VIT_armoured_cars_on_the_mountain_road_desc:0 "Steel plates on lorries, and lorries on the mountain road. It is not much of a tank, but it is a start."
 VIT_the_mountain_staff:0 "The Mountain Staff"
 VIT_the_mountain_staff_desc:0 "Maps of every path, every ridge and every village, and officers who know them by heart."
 VIT_anti_air_on_kopitoto:0 "Anti-Air on Kopitoto"
 VIT_anti_air_on_kopitoto_desc:0 "Guns and a radar on the top of Kopitoto: nothing flies over Sofia without the mountain seeing it."
 VIT_the_army_of_the_mountain:0 "The Army of the Mountain"
 VIT_the_army_of_the_mountain_desc:0 "Rangers, skiers, guns on the ridges and armour on the roads: the best mountain army in Sofia."
 VIT_old_friends_of_the_villa:0 "Old Friends of the Villa"
 VIT_old_friends_of_the_villa_desc:0 "Henry has known some of the district leaders since school. The war is won, and now old friends can help, as long as they are not communists. Henry is very firm about that."
 VIT_henry_calls_KRP:0 "Call Stefan Kartunov"
 VIT_henry_calls_KRP_desc:0 "Henry telephones Stefan Kartunov: the villa needs friends, and Stefan Kartunov has always been one.\n\nIf we are not in an alliance we found the Villa Pact. Stefan Kartunov is asked to join; he usually says yes. Not possible while Stefan Kartunov is communist."
 VIT_henry_calls_MLA:0 "Call Georgi Poryazov"
 VIT_henry_calls_MLA_desc:0 "Henry telephones Georgi Poryazov: the villa needs friends, and Georgi Poryazov has always been one.\n\nIf we are not in an alliance we found the Villa Pact. Georgi Poryazov is asked to join; he usually says yes. Not possible while Georgi Poryazov is communist."
 VIT_henry_calls_SRD:0 "Call Victor Kolev"
 VIT_henry_calls_SRD_desc:0 "Henry telephones Victor Kolev: the villa needs friends, and Victor Kolev has always been one.\n\nIf we are not in an alliance we found the Villa Pact. Victor Kolev is asked to join; he usually says yes. Not possible while Victor Kolev is communist."
 VIT_the_villa_pact:0 "The Villa Pact"
 VIT_the_villa_pact_desc:0 "Dinner at the villa for every friend who answered the phone. Dinner is at midnight."
 VIT_friends_at_the_gate:0 "Friends at the Gate"
 VIT_friends_at_the_gate_desc:0 "A few of Henry's old friends promise to send volunteers up the mountain the day the shooting starts. They will go home when it stops."
 VIT_fortify_boyana:0 "Fortify Boyana"
 VIT_fortify_boyana_desc:0 "Sandbags, wire and concrete around the villas of Boyana, just in case."
 VIT_ring_road_bunkers:0 "Bunkers on the Ring Road"
 VIT_ring_road_bunkers_desc:0 "Concrete pillboxes along the ring road, where the mountain meets the city."
 VIT_trenches_in_knyazhevo:0 "Trenches in Knyazhevo"
 VIT_trenches_in_knyazhevo_desc:0 "Trenches through the mineral springs park. The bathers are not pleased."
 VIT_the_vitosha_line:0 "The Vitosha Line"
 VIT_the_vitosha_line_desc:0 "A line of bunkers around the whole mountain. Whoever is inside it will be very hard to get out."
 VIT_hired_help:0 "Hired Help"
 VIT_hired_help_desc:0 "Henry's mother does not trust students. She does trust money."
 VIT_guards_for_hire:0 "Guards for Hire"
 VIT_guards_for_hire_desc:0 "Three companies of private guards from Lozenets, paid in advance, with their own rifles."
 VIT_the_british_club:0 "The British Club"
 VIT_the_british_club_desc:0 "The British Club in Sofia has a bar, a billiard room and a surprising number of retired officers."
 VIT_old_classmates:0 "Old Classmates"
 VIT_old_classmates_desc:0 "Yani went to school with half the district leaders of Sofia. Some of them still owe him homework."
 VIT_yani_calls_KRP:0 "Call Stefan Kartunov"
 VIT_yani_calls_KRP_desc:0 "Stefan Kartunov sat next to Yani for four years. Whatever either of them believes now, that still counts.\n\nIf we are not in an alliance we found the Students' Pact. Stefan Kartunov is asked to join, and always says yes."
 VIT_yani_calls_LOZ:0 "Call Georgi Yanchovichin"
 VIT_yani_calls_LOZ_desc:0 "Georgi Yanchovichin sat next to Yani for four years. Whatever either of them believes now, that still counts.\n\nIf we are not in an alliance we found the Students' Pact. Georgi Yanchovichin is asked to join, and always says yes."
 VIT_yani_calls_SRD:0 "Call Victor Kolev"
 VIT_yani_calls_SRD_desc:0 "Victor Kolev sat next to Yani for four years. Whatever either of them believes now, that still counts.\n\nIf we are not in an alliance we found the Students' Pact. Victor Kolev is asked to join, and always says yes."
 VIT_the_students_pact:0 "The Students' Pact"
 VIT_the_students_pact_desc:0 "A pact signed in a classroom, on a desk with all their names carved into it."
 VIT_classmates_at_the_front:0 "Classmates at the Front"
 VIT_classmates_at_the_front_desc:0 "Yani's old classmates will send their own volunteers the day the war starts, and take them home when it ends."
 VIT_hidden_depots:0 "Hidden Depots"
 VIT_hidden_depots_desc:0 "A barn, a cellar, a hole under a woodpile: the movement starts hiding things."
 VIT_caches_in_the_forest:0 "Caches in the Forest"
 VIT_caches_in_the_forest_desc:0 "Rifles wrapped in oilcloth, buried under the beeches above Simeonovo."
 VIT_drills_in_the_woods:0 "Drills in the Woods"
 VIT_drills_in_the_woods_desc:0 "Every Sunday the students go for a long walk in the forest, and come back knowing how to strip a rifle."
 VIT_barricades_in_simeonovo:0 "Barricades in Simeonovo"
 VIT_barricades_in_simeonovo_desc:0 "Every street in Simeonovo knows where its barricade goes. The cobbles are already loose."
 VIT_the_tobacco_column:0 "The Tobacco Column"
 VIT_the_tobacco_column_desc:0 "Tobacco workers from Plovdiv, ready to take the train to Sofia the moment Yani calls."
 VIT_studentski_volunteers:0 "Studentski Volunteers"
 VIT_studentski_volunteers_desc:0 "The dormitories of Studentski Grad empty overnight when Yani needs them."
 VIT_commandos_of_cherni_vrah:0 "Commandos of Cherni Vrah"
 VIT_commandos_of_cherni_vrah_desc:0 "Small teams that climb at night and strike at dawn. Henry insists they wear berets."
 VIT_armoured_regiment_of_boyana:0 "The Armoured Regiment of Boyana"
 VIT_armoured_regiment_of_boyana_desc:0 "A regiment of tanks, painted green and polished every morning."
 VIT_home_rule_for_the_dominions:0 "Home Rule for the Dominions"
 VIT_home_rule_for_the_dominions_desc:0 "Every district the Commonwealth takes gets its own little council, a portrait of Henry and the full rights of a citizen of the mountain.\n\nVitosha cores every state of Lozenets, Studentski, Mladost and Triaditsa it holds."
 VIT_mounted_gendarmes:0 "Mounted Gendarmes"
 VIT_mounted_gendarmes_desc:0 "On a mountain a horse still beats a lorry. The gendarmes ride."
 VIT_the_iron_wall_of_kopitoto:0 "The Iron Wall of Kopitoto"
 VIT_the_iron_wall_of_kopitoto_desc:0 "Concrete and guns from Kopitoto to Cherni Vrah. The Tsardom will not be taken."
 VIT_lands_of_the_crown:0 "Lands of the Crown"
 VIT_lands_of_the_crown_desc:0 "Every village the tsar's army takes is told the same thing: it always belonged to the crown, it just did not know it.\n\nVitosha cores every state of Bankya, Krasna Polyana, Vrabnitsa, Lyulin, Lozenets and Triaditsa it holds."
 VIT_the_red_fortress:0 "The Red Fortress of Vitosha"
 VIT_the_red_fortress_desc:0 "The revolution won the mountain. It will not give it back."
 VIT_tank_brigades_of_simeonovo:0 "Tank Brigades of Simeonovo"
 VIT_tank_brigades_of_simeonovo_desc:0 "The tractor works in Simeonovo also builds something with a gun on it."
 VIT_soviets_in_the_valley:0 "Soviets in the Valley"
 VIT_soviets_in_the_valley_desc:0 "Every district the Red Army of the Mountain reaches elects its own soviet, which joins the Thracian Commune by an overwhelming majority.\n\nVitosha cores every state of Kremikovtsi, Novi Iskar, Slatina, Izgrev, Mladost, Studentski and Ovcha Kupel it holds."
 VIT_the_iron_phalanx:0 "The Iron Phalanx"
 VIT_the_iron_phalanx_desc:0 "Philip's phalanx had pikes. Yani's has armour plate."
 VIT_the_wall_of_philip:0 "The Wall of Philip"
 VIT_the_wall_of_philip_desc:0 "Plovdiv had walls for three thousand years. Philippopolis gets new ones."
 VIT_citizens_of_philippopolis:0 "Citizens of Philippopolis"
 VIT_citizens_of_philippopolis_desc:0 "Every district Philippopolis takes is given a hill's name, a torch and the honour of being Philippopolitan.\n\nVitosha cores every state of Sredets, Oborishte, Vazrazhdane, Serdika and Iskar it holds."
 VIT_the_power_station_at_pancharevo:0 "The Power Station"
 VIT_the_power_station_at_pancharevo_desc:0 "A dam, a turbine and electric light in every village on the mountain."
 VIT_ski_lift_freight:0 "Freight on the Ski Lift"
 VIT_ski_lift_freight_desc:0 "The Dragalevtsi lift carries skiers in winter and crates of shells all year round."
 VIT_the_granite_works:0 "The Granite Works"
 VIT_the_granite_works_desc:0 "Vitosha granite, cut and polished, for every new building in Sofia."
 VIT_the_dispersed_workshops:0 "Dispersed Workshops"
 VIT_the_dispersed_workshops_desc:0 "A workshop in every barn: no bomber can hit them all."
 VIT_the_munitions_tunnels:0 "The Munitions Tunnels"
 VIT_the_munitions_tunnels_desc:0 "The old quarry tunnels go deep into the mountain. Now they are full of shells."
 VIT_the_cable_car_factory:0 "The Cable Car Factory"
 VIT_the_cable_car_factory_desc:0 "Whoever can build a cable car can build an artillery tractor."
 VIT_construction_effort:0 "The Mountain Builds"
 VIT_construction_effort_desc:0 "Cranes on every slope."
 VIT_the_mountain_radio_works:0 "The Radio Works"
 VIT_the_mountain_radio_works_desc:0 "Valves, wires and a factory full of students who build radios faster than they can listen to them."
 VIT_the_shell_works:0 "The Shell Works"
 VIT_the_shell_works_desc:0 "Two new arms factories cut into the rock."
 VIT_production_effort:0 "Every Machine Counts"
 VIT_production_effort_desc:0 "Spare parts, shift bonuses and a foreman who never sleeps."
 VIT_the_mountain_university:0 "The Mountain University"
 VIT_the_mountain_university_desc:0 "Lecture halls in the old hotels at Aleko, with the best view of any university in Europe."
 VIT_the_workshop_of_sofia:0 "The Workshop of Sofia"
 VIT_the_workshop_of_sofia_desc:0 "Half of what Sofia uses was made on the mountain. The other half was carried down it."
 VIT_mountain_divisions:0 "Mountain Divisions"
 VIT_mountain_divisions_desc:0 "Divisions built for the mountain: mules, light guns and very strong legs."
 VIT_the_fortress_mountain:0 "The Fortress Mountain"
 VIT_the_fortress_mountain_desc:0 "Every pass, every path and every road on the mountain has a bunker on it."
 VIT_the_mountain_air_corps:0 "The Mountain Air Corps"
 VIT_the_mountain_air_corps_desc:0 "Pilots who can land in a meadow and take off from a ski slope."
 VIT_support_companies:0 "Support Companies"
 VIT_support_companies_desc:0 "Engineers, signallers and field hospitals for every division."
 VIT_rangers_of_the_peak:0 "Rangers of the Peak"
 VIT_rangers_of_the_peak_desc:0 "The best shots on the mountain, trained to fight in snow and fog."
 VIT_pillboxes_on_every_pass:0 "Pillboxes on Every Pass"
 VIT_pillboxes_on_every_pass_desc:0 "Concrete pillboxes on every mountain pass around the capital."
 VIT_bombers_from_the_meadow:0 "Bombers from the Meadow"
 VIT_bombers_from_the_meadow_desc:0 "A few bombers, a long grass runway and a city spread out below like a map."
 VIT_close_air_support:0 "Close Air Support"
 VIT_close_air_support_desc:0 "Dive bombers that come down the mountain faster than any avalanche."
 VIT_the_artillery_park:0 "The Artillery Park"
 VIT_the_artillery_park_desc:0 "Every gun on the mountain parked in one meadow, oiled and ready."
 VIT_dig_in_doctrine:0 "Dig In Doctrine"
 VIT_dig_in_doctrine_desc:0 "A soldier of the mountain digs before he eats."
 VIT_air_superiority:0 "Air Superiority over Sofia"
 VIT_air_superiority_desc:0 "Nothing flies over the mountain without asking first."
 VIT_the_mountain_reserve:0 "The Mountain Reserve"
 VIT_the_mountain_reserve_desc:0 "Every man who ever served is on a list, and the list is always up to date."
 VIT_the_unbreakable_mountain:0 "The Unbreakable Mountain"
 VIT_the_unbreakable_mountain_desc:0 "No army in Sofia has ever taken the mountain from someone who wanted to keep it. None ever will."
 VIT_friends_across_the_valley:0 "Friends Across the Valley"
 VIT_friends_across_the_valley_desc:0 "Every free district of Sofia has something to spare for the mountain, and Henry is very good at asking.\n\nUnlocks the §YForeign Aid§! decisions: ask districts with the same ideology as ours for rifles, volunteers, aeroplanes, lorries and advisers."
 VIT_friends_of_the_crown:0 "Friends of the Crown"
 VIT_friends_of_the_crown_desc:0 "Every district with a strong hand at the top understands what Henry is doing, and some of them will help.\n\nUnlocks the §YForeign Aid§! decisions: ask districts with the same ideology as ours for rifles, volunteers, aeroplanes, lorries and advisers."
 VIT_help_from_the_comrades:0 "Help from the Comrades"
 VIT_help_from_the_comrades_desc:0 "Every red district in Sofia owes the revolution something. Yani sends them the bill.\n\nUnlocks the §YForeign Aid§! decisions: ask districts with the same ideology as ours for rifles, volunteers, aeroplanes, lorries and advisers."
 VIT_friends_of_the_torch:0 "Friends of the Torch"
 VIT_friends_of_the_torch_desc:0 "The black shirts of other districts send what they can: rifles, money and young men looking for a fight.\n\nUnlocks the §YForeign Aid§! decisions: ask districts with the same ideology as ours for rifles, volunteers, aeroplanes, lorries and advisers."
 VIT_the_colonial_office:0 "The Colonial Office"
 VIT_the_colonial_office_desc:0 "England had an empire for its coal and its metals. The mountain is made of granite, but on the other side of Sofia there is iron at Kremikovtsi, the old mine at Buhovo and coal under Lyulin and Bankya, where the Pernik basin begins. Henry opens a Colonial Office."
 VIT_the_kremikovtsi_company:0 "The Kremikovtsi Company"
 VIT_the_kremikovtsi_company_desc:0 "A chartered company for the iron ore and the steelworks of Kremikovtsi, and the Buhovo mine next to them. Every company needs a flag, and every flag needs a garrison.\n\nA war goal to make Kremikovtsi our colony (puppet)."
 VIT_the_lyulin_coal_concession:0 "The Lyulin Coal Concession"
 VIT_the_lyulin_coal_concession_desc:0 "The coal seams of the Pernik basin run under Lyulin mountain and Bankya. Henry would like a concession, and a garrison to protect it.\n\nWar goals to make Lyulin and Bankya our colonies (puppets)."
 VIT_the_mountain_mining_company:0 "The Mountain Mining Company"
 VIT_the_mountain_mining_company_desc:0 "One company for every mine in the colonies: the ore goes up the mountain road, the money goes into the villa.\n\nEvery state of Kremikovtsi, Lyulin and Bankya that we or our subjects hold gets more steel, and Kremikovtsi's more tungsten."
 VIT_stand_with_henry_unlocks:0 "The decision §YWar on the Mountain§! counts down §Y400 days§! from the start. If no focus has started the war by then, it starts by itself: on Henry's side unless we completed March with Yani. Only completed focuses give their bonuses."
 VIT_march_with_yani_unlocks:0 "The decision §YWar on the Mountain§! counts down §Y400 days§!. If no focus has started the war by then, it starts by itself on Yani's side. Only completed focuses give their bonuses."
 VIT_the_boyana_garrison_unlocks:0 "§YWhen the civil war starts§!, if we are on this side: §G+4 divisions§! in Boyana."
 VIT_mothers_savings_unlocks:0 "§YWhen the civil war starts§!, if we are on this side: §G+2,500 rifles§!."
 VIT_the_mountain_rangers_unlocks:0 "§YWhen the civil war starts§!, if we are on this side: the spirit §YMountain Rangers§!."
 VIT_henrys_officers_unlocks:0 "§YWhen the civil war starts§!, if we are on this side: §G+30 army experience§! and the spirit §YHenry's Officers§!."
 VIT_crush_the_student_movement_unlocks:0 "§YThe civil war begins.§! Everything Henry's chain prepared joins us. We get §RThe Mountain in Flames§! (three steps), which the war branch takes down. Then choose Henry's road. The next day, choose Henry's road at once by event."
 VIT_cells_in_simeonovo_unlocks:0 "§YWhen the civil war starts§!, if we are on this side: §G+4 divisions§! in Simeonovo."
 VIT_students_from_plovdiv_unlocks:0 "§YWhen the civil war starts§!, if we are on this side: §G+20,000 manpower§! and the spirit §YStudents from Plovdiv§!."
 VIT_arms_from_plovdiv_unlocks:0 "§YWhen the civil war starts§!, if we are on this side: §G+2,500 rifles§!."
 VIT_the_plovdiv_committee_unlocks:0 "§YWhen the civil war starts§!, if we are on this side: §G+10% war support§! and §G+20 army experience§!."
 VIT_yani_takes_the_villa_unlocks:0 "§YThe civil war begins.§! Yani becomes our leader; everything his chain prepared joins us. We get §RThe Mountain in Flames§! (three steps), which the war branch takes down. Then choose Yani's road. The next day, choose Yani's road at once by event."
 VIT_the_mountain_conference_unlocks:0 "Unlocks §YInvite the Free Districts§!."
 VIT_the_league_of_the_mountain_unlocks:0 "Invitations go out to every district outside an alliance."
 VIT_friends_at_the_gate_unlocks:0 "§YWhen the civil war starts§!, if we are on this side: §G+2 temporary divisions§! from Henry's friends. They are §Rsent home§! when the war is won."
 VIT_guards_for_hire_unlocks:0 "§YWhen the civil war starts§!, if we are on this side: §G+3 temporary divisions§! of hired guards. They are §Rsent home§! when the war is won."
 VIT_the_british_club_unlocks:0 "§YWhen the civil war starts§!, if we are on this side: §G+2 temporary divisions§! of British Club volunteers. They are §Rsent home§! when the war is won."
 VIT_classmates_at_the_front_unlocks:0 "§YWhen the civil war starts§!, if we are on this side: §G+2 temporary divisions§! from Yani's classmates. They are §Rsent home§! when the war is won."
 VIT_caches_in_the_forest_unlocks:0 "§YWhen the civil war starts§!, if we are on this side: §G+2,000 rifles§!."
 VIT_drills_in_the_woods_unlocks:0 "§YWhen the civil war starts§!, if we are on this side: §G+20 army experience§!."
 VIT_barricades_in_simeonovo_unlocks:0 "§YWhen the civil war starts§!, if we are on this side: §Glevel 3 bunkers§! along Simeonovo's borders."
 VIT_the_tobacco_column_unlocks:0 "§YWhen the civil war starts§!, if we are on this side: §G+3 temporary divisions§! of Plovdiv tobacco workers. They are §Rsent home§! when the war is won."
 VIT_studentski_volunteers_unlocks:0 "§YWhen the civil war starts§!, if we are on this side: §G+2 temporary divisions§! of students. They are §Rsent home§! when the war is won."
 VIT_friends_across_the_valley_unlocks:0 "Unlocks the §YForeign Aid§! decisions (rifles, volunteers, aeroplanes, lorries, advisers)."
 VIT_friends_of_the_crown_unlocks:0 "Unlocks the §YForeign Aid§! decisions (rifles, volunteers, aeroplanes, lorries, advisers)."
 VIT_help_from_the_comrades_unlocks:0 "Unlocks the §YForeign Aid§! decisions (rifles, volunteers, aeroplanes, lorries, advisers)."
 VIT_friends_of_the_torch_unlocks:0 "Unlocks the §YForeign Aid§! decisions (rifles, volunteers, aeroplanes, lorries, advisers)."
 evil_sofia_srd.1.a:0 "She was right. We will never forgive them."
 evil_sofia_srd.1.b:0 "No more waiting. Prepare for war!"
 evil_sofia_srd.1.t:0 "Henry's Mom Was Right"
 evil_sofia_srd.1.d:0 "The news reaches Vitosha before dinner. Sredets has declared for communism; there are red flags on the Largo and Victor Kolev is calling himself Chairman.\n\nDaniel-Henry Capel's mother puts down the telephone, turns to her son and says, very calmly, that she has been telling him this for years. The people of the centre were always communists. She just did not expect them to be so open about it.\n\nHenry has never hated anything as much as he hates Sredets tonight."
 evil_sofia_srd.2.a:0 "Comrade Victor! The centre will be red together."
 evil_sofia_srd.2.b:0 "Oborishte bows to no one. Show him out."
 evil_sofia_srd.2.t:0 "Victor at the Door"
 evil_sofia_srd.2.d:0 "Victor Kolev has walked the three streets from the Party House to Oborishte himself, with no guards and no flags, and he is waiting in the hall downstairs.\n\nHis offer is simple. Sredets and Oborishte go red together and take Sofia together: the north for Anton, the centre and the south for Victor. If Anton refuses, Victor will not walk here again. The Red Guards will."
 evil_sofia_srd.3.a:0 "To Comrade Anton!"
 evil_sofia_srd.3.t:0 "Anton Says Yes"
 evil_sofia_srd.3.d:0 "Anton Zafirov came down the stairs himself and shook Victor's hand in front of the doorman. By midnight Oborishte's district hall was flying a red flag. The centre of Sofia is red from the Lions' Bridge to Eagles' Bridge, and the North-South Pact can be drawn up."
 evil_sofia_srd.4.a:0 "He will regret it."
 evil_sofia_srd.4.t:0 "Anton Says No"
 evil_sofia_srd.4.d:0 "Victor waited in the hall for an hour. Then a secretary came down and told him that Mr Zafirov was busy. Victor walked home the long way, past the cathedral, counting the barricades Oborishte would need. It will need more than it has."
 evil_sofia_srd.5.a:0 "Let him hate. Let him wait."
 evil_sofia_srd.5.t:0 "Henry Hates Us"
 evil_sofia_srd.5.d:0 "Word comes from Vitosha: Daniel-Henry Capel has torn up every letter Sredets ever sent him, and his mother is telling the whole street she was right about us all along. He is not marching yet. He is waiting."
 evil_sofia_srd.6.a:0 "Let him come down the mountain."
 evil_sofia_srd.6.t:0 "Henry Prepares for War"
 evil_sofia_srd.6.d:0 "Daniel-Henry Capel will not wait for the red flag to come up the mountain. Vitosha's guards are being called up and trucks are moving down the Boyana road. Henry has declared that he will save Sofia from communism himself."
 evil_sofia_srd.7.a:0 "Day ones. Lozenets marches with Sredets."
 evil_sofia_srd.7.b:0 "I'm sorry, Victor. Lozenets stays out of this."
 evil_sofia_srd.7.t:0 "A Call from Victor"
 evil_sofia_srd.7.d:0 "The telephone rings late at night. It is Victor Kolev, and he is not calling as the Chairman of the Sredets Commune. He is calling as Victor, who has known Georgi since before either of them had a district to rule.\n\nHe is going after Daniel-Henry Capel, and Lozenets is the only road from Sredets to Boyana. He does not want passage. He wants Georgi beside him. Day ones, he says. Like always."
 evil_sofia_srd.8.a:0 "Long live the revolution."
 evil_sofia_srd.8.t:0 "A Red Coup in Oborishte"
 evil_sofia_srd.8.d:0 "At three in the morning the barracks on Shipka Street opened their gates, and by five the district hall had changed hands without a shot. Anton Zafirov woke up as the leader of a red Oborishte. He has decided to be grateful."
 evil_sofia_srd.9.a:0 "Day ones. Always."
 evil_sofia_srd.9.t:0 "Georgi Is In"
 evil_sofia_srd.9.d:0 "Georgi did not even let Victor finish the sentence. Lozenets has joined us, its streets are open to the Red Guards, and its own guards are already moving towards the slopes below Boyana. Henry will not fight one district. He will fight two."
 evil_sofia_srd.10.a:0 "Then the road goes through Lozenets."
 evil_sofia_srd.10.b:0 "Friends are friends. We will find another way to Henry."
 evil_sofia_srd.10.t:0 "Georgi Says No"
 evil_sofia_srd.10.d:0 "Georgi said it quietly, the way you say things to a friend: Lozenets will not go to war for the revolution, not even for Victor. Without Lozenets there is no road from Sredets to Boyana."
 evil_sofia_srd.11.a:0 "Of course. The gang is the gang."
 evil_sofia_srd.11.b:0 "Those days are over, Victor."
 evil_sofia_srd.11.t:0 "An Invitation from the Evil Gang"
 evil_sofia_srd.11.d:0 "The old group chat has come back to life. After months of silence there is a new message from Victor Kolev, and it is addressed to [Root.GetLeader] by name.\n\nThe Evil Gang rides again, it says. The city is falling apart, the districts are at each other's throats, and the only people Victor has ever trusted were in this chat. He wants [Root.GetName] in the gang, as an ally, the way it always was."
 evil_sofia_srd.12.a:0 "Welcome back."
 evil_sofia_srd.12.t:0 "[From.GetLeader] Is In"
 evil_sofia_srd.12.d:0 "The reply came in less than an hour: [From.GetLeader] is in. [From.GetName] has joined the Evil Gang, and its guards will fight beside ours."
 evil_sofia_srd.13.a:0 "Their loss."
 evil_sofia_srd.13.t:0 "[From.GetLeader] Says No"
 evil_sofia_srd.13.d:0 "[From.GetLeader] has read the message and declined. [From.GetName] will not join the Evil Gang. The chat is a little quieter tonight."
 evil_sofia_srd.17.a:0 "We join the free centre."
 evil_sofia_srd.17.b:0 "Thank you, Victor, but no."
 evil_sofia_srd.17.t:0 "An Offer from the Free Centre"
 evil_sofia_srd.17.d:0 "Victor Kolev has come to [Root.GetName] in person, with no guards and no ultimatum. Sredets has lifted its curfew, opened its press and its markets, and now it asks [Root.GetLeader] a simple question: will [Root.GetName] join the free centre? Same rights for everyone, no checkpoints between us, one city again.\n\nSaying yes means [Root.GetName] becomes part of Sredets. Saying no costs nothing, for now."
 evil_sofia_srd.18.a:0 "One city, freely."
 evil_sofia_srd.18.t:0 "[From.GetName] Joins the Free Centre"
 evil_sofia_srd.18.d:0 "The answer is yes. [From.GetName] has voted to join the free centre, and its people are taking down the barriers between our districts themselves. Not a shot was fired."
 evil_sofia_srd.20.a:0 "Take them, and look after them."
 evil_sofia_srd.20.b:0 "Not one street, Victor."
 evil_sofia_srd.20.t:0 "The Free Centre Asks for Our Quarters"
 evil_sofia_srd.20.d:0 "Victor Kolev has come to [Root.GetName] in person, with no guards and no ultimatum. He does not want all of [Root.GetName]. He wants the quarters next to the centre, the streets that have always been more the centre's than ours, to join the free centre. Everything else stays [Root.GetLeader]'s.\n\nSaying yes hands those quarters to Sredets. Saying no costs nothing, for now."
 evil_sofia_srd.21.a:0 "Welcome to the free centre."
 evil_sofia_srd.21.t:0 "[From.GetName] Hands Over Its Quarters"
 evil_sofia_srd.21.d:0 "The answer is yes. [From.GetName] has handed the quarters next to the centre to the free centre. The barriers came down this morning, and not a shot was fired."
 evil_sofia_srd.19.a:0 "The door stays open."
 evil_sofia_srd.19.t:0 "[From.GetName] Says No"
 evil_sofia_srd.19.d:0 "[From.GetName] has thanked us for the offer and declined it. Its people will stay behind their own barriers, for now."
 evil_sofia_srd.25.a:0 "Once C Class, always C Class."
 evil_sofia_srd.25.b:0 "I've grown up, Victor."
 evil_sofia_srd.25.t:0 "The C Class Calls"
 evil_sofia_srd.25.d:0 "The old class group chat lights up for the first time in months. Victor Kolev of Sredets has unleashed the C Class Hools, and he wants [Root.GetLeader] back in the stands with them, flares and all."
 evil_sofia_srd.26.a:0 "The class is back together."
 evil_sofia_srd.26.t:0 "[From.GetLeader] Is Back"
 evil_sofia_srd.26.d:0 "[From.GetLeader] answered with a single photo: a lit flare. [From.GetName] has joined the C Class Hools."
 evil_sofia_srd.27.a:0 "Boring."
 evil_sofia_srd.27.t:0 "[From.GetLeader] Has Grown Up"
 evil_sofia_srd.27.d:0 "[From.GetLeader] says those days are over. [From.GetName] will not join the C Class Hools."
 evil_sofia_vit.1.a:0 "The gang is the gang."
 evil_sofia_vit.1.b:0 "Not this time."
 evil_sofia_vit.1.t:0 "An Invitation to the Evil Gang"
 evil_sofia_vit.1.d:0 "The old group chat lights up. [From.GetLeader] of [From.GetName] writes that the Evil Gang is meeting again, on the mountain this time, and that there is a seat for [Root.GetLeader]."
 evil_sofia_vit.2.a:0 "Welcome back."
 evil_sofia_vit.2.t:0 "[From.GetLeader] Is In"
 evil_sofia_vit.2.d:0 "[From.GetName] has joined the Evil Gang."
 evil_sofia_vit.3.a:0 "Their loss."
 evil_sofia_vit.3.t:0 "[From.GetLeader] Says No"
 evil_sofia_vit.3.d:0 "[From.GetName] will not join the Evil Gang."
 evil_sofia_vit.4.a:0 "Of course. The gang is the gang."
 evil_sofia_vit.4.b:0 "Not after what happened."
 evil_sofia_vit.4.t:0 "Vitosha Wants In"
 evil_sofia_vit.4.d:0 "[From.GetLeader] of Vitosha has written to the group chat: the war on the mountain is over, and Vitosha wants to join the Evil Gang."
 evil_sofia_vit.5.a:0 "The gang is whole again."
 evil_sofia_vit.5.t:0 "Victor Says Yes"
 evil_sofia_vit.5.d:0 "Victor has welcomed us into the Evil Gang."
 evil_sofia_vit.6.a:0 "Then we will make our own."
 evil_sofia_vit.6.t:0 "Victor Says No"
 evil_sofia_vit.6.d:0 "Victor will not have us in the Evil Gang."
 evil_sofia_vit.7.a:0 "We join the Entente."
 evil_sofia_vit.7.b:0 "No, thank you."
 evil_sofia_vit.7.t:0 "The Mountain Entente"
 evil_sofia_vit.7.d:0 "[From.GetLeader] of Vitosha invites [Root.GetName] to join the Mountain Entente: an alliance of the free districts of Sofia, with tea."
 evil_sofia_vit.8.a:0 "Splendid."
 evil_sofia_vit.8.t:0 "[From.GetName] Joins the Entente"
 evil_sofia_vit.8.d:0 "[From.GetName] has joined the Mountain Entente."
 evil_sofia_vit.9.a:0 "Pity."
 evil_sofia_vit.9.t:0 "[From.GetName] Declines"
 evil_sofia_vit.9.d:0 "[From.GetName] will not join the Mountain Entente."
 evil_sofia_vit.10.a:0 "Workers of Sofia, unite."
 evil_sofia_vit.10.b:0 "Not with them."
 evil_sofia_vit.10.t:0 "The Red Mountain"
 evil_sofia_vit.10.d:0 "[From.GetLeader] of [From.GetName] invites [Root.GetName] to join the Red Mountain: every worker in Sofia, with a friend on the mountain."
 evil_sofia_vit.11.a:0 "Good."
 evil_sofia_vit.11.t:0 "[From.GetName] Joins"
 evil_sofia_vit.11.d:0 "[From.GetName] has joined the Red Mountain."
 evil_sofia_vit.12.a:0 "Their loss."
 evil_sofia_vit.12.t:0 "[From.GetName] Declines"
 evil_sofia_vit.12.d:0 "[From.GetName] will not join the Red Mountain."
 evil_sofia_vit.13.a:0 "We take our seat."
 evil_sofia_vit.13.b:0 "Not under Yani."
 evil_sofia_vit.13.t:0 "The Pact of the Seven Hills"
 evil_sofia_vit.13.d:0 "[From.GetLeader] of [From.GetName] invites [Root.GetName] to join the Pact of the Seven Hills: seven hills, seven seats, and Yani at the head of the table."
 evil_sofia_vit.14.a:0 "Good."
 evil_sofia_vit.14.t:0 "[From.GetName] Joins"
 evil_sofia_vit.14.d:0 "[From.GetName] has joined the Pact of the Seven Hills."
 evil_sofia_vit.15.a:0 "Their loss."
 evil_sofia_vit.15.t:0 "[From.GetName] Declines"
 evil_sofia_vit.15.d:0 "[From.GetName] will not join the Pact of the Seven Hills."
 evil_sofia_vit.16.a:0 "We come to dinner."
 evil_sofia_vit.16.b:0 "We eat at seven."
 evil_sofia_vit.16.t:0 "The League of the Mountain"
 evil_sofia_vit.16.d:0 "[From.GetLeader] of [From.GetName] invites [Root.GetName] to join the League of the Mountain: districts with a strong hand at the top, and dinner at midnight."
 evil_sofia_vit.17.a:0 "Good."
 evil_sofia_vit.17.t:0 "[From.GetName] Joins"
 evil_sofia_vit.17.d:0 "[From.GetName] has joined the League of the Mountain."
 evil_sofia_vit.18.a:0 "Their loss."
 evil_sofia_vit.18.t:0 "[From.GetName] Declines"
 evil_sofia_vit.18.d:0 "[From.GetName] will not join the League of the Mountain."
 evil_sofia_vit.19.a:0 "For old times' sake."
 evil_sofia_vit.19.b:0 "Not this time, Henry."
 evil_sofia_vit.19.t:0 "Henry Calls"
 evil_sofia_vit.19.d:0 "The telephone rings at midnight. It is Daniel-Henry Capel, from the villa on the hill: a war is coming to Vitosha, he says, and he would like his old friend [Root.GetLeader] on his side. There will be dinner."
 evil_sofia_vit.20.a:0 "A true friend."
 evil_sofia_vit.20.t:0 "[From.GetLeader] Answers"
 evil_sofia_vit.20.d:0 "[From.GetName] has joined us."
 evil_sofia_vit.21.a:0 "We will remember."
 evil_sofia_vit.21.t:0 "[From.GetLeader] Hangs Up"
 evil_sofia_vit.21.d:0 "[From.GetName] will not join us."
 evil_sofia_vit.22.a:0 "A classmate is a classmate."
 evil_sofia_vit.22.b:0 "Not even for Yani."
 evil_sofia_vit.22.t:0 "A Letter from Yani"
 evil_sofia_vit.22.d:0 "A letter in handwriting [Root.GetLeader] has not seen since school: Yanislav Marazov, the old classmate from Plovdiv, needs his friends. Whatever they believe now, a classmate is a classmate."
 evil_sofia_vit.23.a:0 "Just like school."
 evil_sofia_vit.23.t:0 "[From.GetLeader] Is with Us"
 evil_sofia_vit.23.d:0 "[From.GetName] has joined us."
 evil_sofia_vit.24.a:0 "Some classmate."
 evil_sofia_vit.24.t:0 "[From.GetLeader] Says No"
 evil_sofia_vit.24.d:0 "[From.GetName] will not join us."
 evil_sofia_vit.25.a:0 "Then we fight."
 evil_sofia_vit.25.t:0 "The Mountain Explodes"
 evil_sofia_vit.25.d:0 "Nobody chose the day. A brawl outside a café in Simeonovo, a shot, a second shot, and by nightfall the whole mountain is at war with itself. Whatever was ready is ready. Whatever was not, is not."
 evil_sofia_vit.26.a:0 "We accept dominion status."
 evil_sofia_vit.26.b:0 "We stay independent."
 evil_sofia_vit.26.t:0 "An Offer of Dominion"
 evil_sofia_vit.26.d:0 "[From.GetLeader] of [From.GetName] offers [Root.GetName] a place in the Commonwealth of the Mountain: our own parliament, our own laws, and the mountain's army to defend us. In return, the mountain decides our foreign policy."
 evil_sofia_vit.27.a:0 "The English way: a parliament and a vote."
 evil_sofia_vit.27.b:0 "Zevka's way: one firm hand."
 evil_sofia_vit.27.t:0 "Henry's Road"
 evil_sofia_vit.27.d:0 "The guns are firing on the slopes, and the villa has to decide what it is fighting for. Henry's father's family would hold elections and win them. His grandmother Zevka would never have bothered."
 evil_sofia_vit.28.a:0 "Red Plovdiv."
 evil_sofia_vit.28.b:0 "The Seven Hills."
 evil_sofia_vit.28.t:0 "Yani's Road"
 evil_sofia_vit.28.d:0 "The student from Plovdiv has his war. Now his movement must decide what it is: the red Plovdiv of the tobacco strikes, or the black shirts and the seven hills."
 evil_sofia_vit_news.1.a:0 "The mountain will decide."
 evil_sofia_vit_news.1.b:0 "Keep the war on the mountain."
 evil_sofia_vit_news.1.t:0 "Civil War on Vitosha"
 evil_sofia_vit_news.1.d:0 "Vitosha has split in two. Daniel-Henry Capel's guard holds the villas and the west of the mountain; the followers of Yanislav Marazov, the student from Plovdiv, hold the east. Gunfire was heard from Dragalevtsi to Boyana last night, and the trams to the end of the line have stopped running."
 evil_sofia_vit_news.2.a:0 "The mountain is ours."
 evil_sofia_vit_news.2.b:0 "Henry stays."
 evil_sofia_vit_news.2.t:0 "Henry Holds the Mountain"
 evil_sofia_vit_news.2.d:0 "The civil war on Vitosha is over, and Daniel-Henry Capel has won it. Yanislav Marazov's last followers have laid down their arms in Simeonovo. Henry's mother has told reporters that she never doubted it."
 evil_sofia_vit_news.3.a:0 "The mountain is ours."
 evil_sofia_vit_news.3.b:0 "A new master on the mountain."
 evil_sofia_vit_news.3.t:0 "Yani Takes the Mountain"
 evil_sofia_vit_news.3.d:0 "The civil war on Vitosha is over, and the student from Plovdiv has won it. Daniel-Henry Capel's villa in Boyana is in the hands of Yanislav Marazov's followers, and the city below is wondering what comes next."
 evil_sofia_vit_news.4.a:0 "God save the mountain."
 evil_sofia_vit_news.4.b:0 "Tea, anyone?"
 evil_sofia_vit_news.4.t:0 "The Commonwealth of the Mountain"
 evil_sofia_vit_news.4.d:0 "Daniel-Henry Capel has proclaimed the Commonwealth of the Mountain: Vitosha and its dominions at the foot of the mountain, under one parliament and one very English leader."
 evil_sofia_vit_news.5.a:0 "Long live the Tsar."
 evil_sofia_vit_news.5.b:0 "A tsar, on Vitosha?"
 evil_sofia_vit_news.5.t:0 "The Tsardom of the Mountain"
 evil_sofia_vit_news.5.d:0 "In Boyana Church, under its seven-hundred-year-old frescoes, Daniel-Henry Capel has been crowned Tsar of the Mountain with a crown his grandmother kept in the attic."
 evil_sofia_vit_news.6.a:0 "Forward, comrades."
 evil_sofia_vit_news.6.b:0 "Red on the mountain."
 evil_sofia_vit_news.6.t:0 "The Thracian Commune"
 evil_sofia_vit_news.6.d:0 "Yanislav Marazov has proclaimed the Thracian Commune, from the top of Vitosha to the old road to Plovdiv."
 evil_sofia_vit_news.7.a:0 "Philippopolis rises."
 evil_sofia_vit_news.7.b:0 "Seven hills of trouble."
 evil_sofia_vit_news.7.t:0 "New Philippopolis"
 evil_sofia_vit_news.7.d:0 "Seven districts, seven hills: Yanislav Marazov has proclaimed New Philippopolis at the foot of Vitosha, and named each district after a hill of his native Plovdiv."
 evil_sofia_news.1.a:0 "The revolution has begun."
 evil_sofia_news.1.b:0 "Henry's mother was right."
 evil_sofia_news.1.c:0 "The centre has gone mad."
 evil_sofia_news.1.t:0 "Red Flag over the Largo"
 evil_sofia_news.1.d:0 "Sredets has gone communist. Late last night Victor Kolev appeared on the steps of the Party House before a crowd of several thousand and declared the Sredets Commune. Red flags have replaced the district colours on every public building around the Largo, and the ministries have been sealed by armed workers.\n\nIn Vitosha, Daniel-Henry Capel's mother received reporters at her door with a cup of coffee and a satisfied smile. She has been saying it for years, she told them: the people of the centre were always communists. Tonight they simply stopped pretending. Asked whether she had a message for Victor Kolev, she said only that she hoped he was proud of himself."
 evil_sofia_news.2.a:0 "Order, at last."
 evil_sofia_news.2.b:0 "One more strongman. Sofia has plenty."
 evil_sofia_news.2.t:0 "Order in the Centre"
 evil_sofia_news.2.d:0 "Sredets will have no parties and no slogans. Victor Kolev has announced that he will govern the district in person, by decree, until order returns to Sofia. Checkpoints have gone up on every bridge into the centre and the trams, for the first time this year, are running on time."
 evil_sofia_news.3.a:0 "The city will be red, from north to south."
 evil_sofia_news.3.b:0 "They have divided us before they have beaten us."
 evil_sofia_news.3.t:0 "The North-South Pact"
 evil_sofia_news.3.d:0 "Sredets and Oborishte have signed an agreement dividing Sofia between them. Witnesses describe a map of the city on a table in the Party House and a single red line drawn from Lyulin to Kremikovtsi. Everything north of it is promised to Anton Zafirov, everything south to Victor Kolev.\n\nNo other district was consulted."
 evil_sofia_news.4.a:0 "The centre is ours."
 evil_sofia_news.4.b:0 "Who is next?"
 evil_sofia_news.4.t:0 "Oborishte Falls"
 evil_sofia_news.4.d:0 "The red flag flies over the Holy Synod. After a short and bitter fight around the cathedral, Oborishte has fallen to the Red Guards of Sredets, and Anton Zafirov has disappeared from public life. The centre of Sofia now answers to a single man."
 evil_sofia_news.5.a:0 "The mountain is red."
 evil_sofia_news.5.b:0 "Even the mountain could not stop them."
 evil_sofia_news.5.t:0 "Boyana Falls"
 evil_sofia_news.5.d:0 "Vitosha has fallen. Red Guards have taken the villas of Boyana and the forest roads up to Dragalevtsi, and Daniel-Henry Capel's government no longer controls a single street. His mother, interviewed in the garden of her requisitioned villa, says she has nothing to add."
 evil_sofia_news.6.a:0 "One city, one flag."
 evil_sofia_news.6.b:0 "Sofia is red."
 evil_sofia_news.6.t:0 "The Sofia Commune"
 evil_sofia_news.6.d:0 "There is one Sofia again. From Bankya to Pancharevo, from Novi Iskar to the top of Vitosha, every district now answers to the Party House. Victor Kolev has proclaimed the Sofia Commune from the balcony over the Largo, to a crowd that filled the square and the boulevards around it."
 evil_sofia_news.7.a:0 "Two halves, one Sofia."
 evil_sofia_news.7.b:0 "Sofia is red, twice over."
 evil_sofia_news.7.t:0 "North and South Sofia"
 evil_sofia_news.7.d:0 "The last free district has fallen, and the city has been divided exactly along the line drawn in the North-South Pact. Sredets is now South Sofia, Oborishte North Sofia, and their alliance has taken the name of the city itself. Victor Kolev and Anton Zafirov shook hands for the cameras on Eagles' Bridge."
 evil_sofia_news.8.a:0 "Sofia shrinks."
 evil_sofia_news.8.t:0 "A District Falls"
 evil_sofia_news.8.d:0 "[From.GetName] has capitulated. Its guards have laid down their arms, its leader has fled or been taken, and its streets are filling with foreign patrols. One district fewer stands between someone and the rule of the whole city."
 evil_sofia_news.9.a:0 "Sredets is free."
 evil_sofia_news.9.b:0 "Mom isn't buying it."
 evil_sofia_news.9.c:0 "Let them talk. We will see how long it lasts."
 evil_sofia_news.9.t:0 "The Free Sredets Is Proclaimed"
 evil_sofia_news.9.d:0 "Victor Kolev has called the patrols off the Largo and proclaimed the Free Sredets: free papers, free speech, free trade and no curfew, ever again. In the same speech he announced that the centre will join no alliance and ask no district for help. Diplomats report that the cafés on Vitosha Boulevard are full again and that a blue flag flies over the district hall.\n\nIn Vitosha, Daniel-Henry Capel's mother is not impressed. A communist in a blue coat, she told reporters, is still a communist. She has seen the people of the centre before, and she will believe they have changed when she sees it with her own eyes."
 evil_sofia_news.10.a:0 "The gang is back."
 evil_sofia_news.10.b:0 "Check the letterbox."
 evil_sofia_news.10.c:0 "Are we on the list?"
 evil_sofia_news.10.t:0 "The Evil Gang Rides Again"
 evil_sofia_news.10.d:0 "An old group chat has become the most talked-about alliance in Sofia. Victor Kolev of Sredets has proposed the return of the Evil Gang, and letters are said to be on their way, one a month, to Georgi Poryazov of Mladost, Daniel-Henry Capel of Vitosha and Stefan Kartunov of Krasna Polyana. Before the city fell apart, they were his closest friends. Whether they still are is another question."
 evil_sofia_news.11.a:0 "Nobody stops the C Class."
 evil_sofia_news.11.b:0 "Lock the doors."
 evil_sofia_news.11.t:0 "The C Class Hools Take to the Streets"
 evil_sofia_news.11.d:0 "Hundreds of young men in scarves and hoods marched through the centre of Sofia last night, lighting flares and singing. They call themselves the C Class Hools, they answer to Sredets, and their leaders say they will be visiting every neighbouring district soon."
 evil_sofia_news.12.a:0 "Class is in session."
 evil_sofia_news.12.b:0 "Sofia has gone completely mad."
 evil_sofia_news.12.t:0 "A Physics Teacher Seizes Sredets"
 evil_sofia_news.12.d:0 "The people of Sredets have waited long enough. A year of curfews and promises, and Victor Kolev has still not told them what the centre is for. This morning his former physics teacher, Konstantin Ilchev, walked into the Party House with a red pen and a stack of marked exam papers and declared that the lesson was over. The guards, who all sat in his classes too, let him straight through. Victor has been sent to detention, and Ilchev governs Sredets."
 evil_sofia_news.13.a:0 "One free city."
 evil_sofia_news.13.b:0 "Free, and much too close."
 evil_sofia_news.13.t:0 "The Free Centre of Sofia"
 evil_sofia_news.13.d:0 "From Lagera to the Eagles' Bridge, the centre of Sofia now answers to one council in Sredets, and it has taken a new name: the Free Centre of Sofia. Victor Kolev has abolished every checkpoint in it and promised its people the same rights as his own. In the outer districts, people have started asking why theirs are different."
 evil_sofia_news.14.a:0 "Told you so, Mrs Capel."
 evil_sofia_news.14.b:0 "Mom... was wrong?"
 evil_sofia_news.14.c:0 "If even she admits it..."
 evil_sofia_news.14.t:0 "Henry's Mom Was Wrong"
 evil_sofia_news.14.d:0 "Daniel-Henry Capel's mother went to the free centre this week expecting red flags, commissars and queues for bread. She found cafés full until midnight, eleven newspapers arguing with each other on Rakovski Street, a market on Vitosha Boulevard where nobody asked for a party card, and Victor Kolev himself, who carried her shopping to the tram stop.\n\nLast night she told reporters, very quietly, that she was wrong. The people of the centre are not communists. Henry is said to have dropped his fork."
 evil_sofia_news.15.a:0 "Everyone gets their share."
 evil_sofia_news.15.b:0 "A fair share for a loyal friend."
 evil_sofia_news.15.c:0 "Today Vitosha. Tomorrow?"
 evil_sofia_news.15.t:0 "The Vitosha Award"
 evil_sofia_news.15.d:0 "Vitosha has been carved up at a table in the Party House. With the map of Henry's district spread in front of him, Victor Kolev drew the new lines himself. Sredets took nothing: the villas of Boyana, the slopes and the villages all go to the members of the Evil Gang who stood by him. Nobody from Vitosha was invited."
 evil_sofia_news.16.a:0 "One centre."
 evil_sofia_news.16.b:0 "And where does it stop?"
 evil_sofia_news.16.t:0 "The Centre Is United"
 evil_sofia_news.16.d:0 "From the Women's Market to the villas of Lozenets, the centre of Sofia answers to one district hall again. Victor Kolev has called it the end of a long dream. In the districts beyond the boulevards, people are asking whether the dream ends at the edge of the centre."
 evil_sofia_news.17.a:0 "One city, one Director."
 evil_sofia_news.17.b:0 "A district that calls itself a city."
 evil_sofia_news.17.t:0 "The Directorate of Sofia"
 evil_sofia_news.17.d:0 "From the balcony of the Party House, Victor Kolev has proclaimed the Directorate of Sofia and named himself its Director. The centre of the city answers to him alone, its districts have been told they are provinces, and a new flag, gold on black, hangs over the Largo. Every district hall in Sofia received a copy of the proclamation. None of them was asked for an opinion."
 evil_sofia_news.18.a:0 "To the victor, the cup."
 evil_sofia_news.18.b:0 "Even the Khan could not hold out."
 evil_sofia_news.18.t:0 "Krum's Cup"
 evil_sofia_news.18.d:0 "Serdika has fallen, and with it the strangest ruler Sofia has seen in this war. Khan Krum is gone, and his famous cup now stands on Victor Kolev's desk in the Party House. Visitors report that nobody drinks from it, and that everybody looks at it."
 evil_sofia_news.19.a:0 "Just until it is safe."
 evil_sofia_news.19.b:0 "Mom was right after all."
 evil_sofia_news.19.c:0 "So much for the free centre."
 evil_sofia_news.19.t:0 "A Temporary Emergency"
 evil_sofia_news.19.d:0 "The free centre is free no longer. Victor Kolev has declared a temporary emergency: the curfew is back, the newspapers on Rakovski Street are closed until further notice, and the blue flag has been taken down for cleaning. Nobody has said when it will go back up.\n\nIn Vitosha, Daniel-Henry Capel's mother has told reporters that she always knew. A tyrant in a blue coat, she says, is still a tyrant."
 evil_sofia_flavour.1.a:0 "Pay them. We need the trams."
 evil_sofia_flavour.1.b:0 "Soldiers can drive trams."
 evil_sofia_flavour.1.t:0 "The Trams Stop"
 evil_sofia_flavour.1.d:0 "The tram drivers of [Root.GetName] have walked off the job. Their demands are simple: paid wages, a working heater in every carriage and an end to being shot at on the lines that run near the front. Without the trams, nobody gets to work."
 evil_sofia_flavour.2.a:0 "Let them play. People need something to cheer."
 evil_sofia_flavour.2.b:0 "Call it off. Send the fans to the recruiting office."
 evil_sofia_flavour.2.t:0 "Derby Day"
 evil_sofia_flavour.2.d:0 "Levski and CSKA are playing tonight, war or no war. Half of [Root.GetName] supports one side, half the other, and the guards are asking whether the match should be stopped before the stands turn into a front line of their own."
 evil_sofia_flavour.3.a:0 "Everyone out with a shovel."
 evil_sofia_flavour.3.b:0 "The front first, the streets later."
 evil_sofia_flavour.3.t:0 "The Big Snow"
 evil_sofia_flavour.3.d:0 "Snow has been falling on [Root.GetName] for three days. The streets are impassable, the trucks are stuck and the guards spend more time digging than drilling. Everyone with a shovel is needed."
 evil_sofia_flavour.4.a:0 "Fill them in. All of them."
 evil_sofia_flavour.4.b:0 "Potholes slow down enemy tanks too."
 evil_sofia_flavour.4.t:0 "The Pothole Committee"
 evil_sofia_flavour.4.d:0 "A delegation of furious residents has arrived at the district hall of [Root.GetName] with photographs of the worst potholes in the district. One of them has swallowed an army truck. They will not leave until something is done."
 evil_sofia_flavour.5.a:0 "Fix the price. The soldiers must eat."
 evil_sofia_flavour.5.b:0 "Bread and lyutenitsa never hurt anybody."
 evil_sofia_flavour.5.t:0 "The Price of a Döner"
 evil_sofia_flavour.5.d:0 "The price of a döner in [Root.GetName] has doubled in a month. The kebab shops blame the war, the war blames the kebab shops, and the soldiers are eating bread and lyutenitsa again. Morale is suffering."
 evil_sofia_flavour.6.a:0 "Adopt them. Every unit gets a dog."
 evil_sofia_flavour.6.b:0 "Round them up and send them to the countryside."
 evil_sofia_flavour.6.t:0 "The Stray Dogs of Sofia"
 evil_sofia_flavour.6.d:0 "Packs of stray dogs have taken over the parks of [Root.GetName]. They follow patrols, steal from the field kitchens and bark at night until nobody can sleep. A guard sergeant has proposed adopting the whole pack as the district's mascot."
 evil_sofia_flavour.7.a:0 "Wish them luck, and give them rifles."
 evil_sofia_flavour.7.b:0 "Grant every groom a month of leave."
 evil_sofia_flavour.7.t:0 "Weddings on Every Block"
 evil_sofia_flavour.7.d:0 "The war has started a wave of weddings in [Root.GetName]. Every weekend the brass bands play in the courtyards of the panel blocks, and the young men go off to the front a few days later with rings on their fingers."
 evil_sofia_flavour.8.a:0 "Close it down."
 evil_sofia_flavour.8.b:0 "Tax it."
 evil_sofia_flavour.8.t:0 "A Black Market on the Women's Market"
 evil_sofia_flavour.8.d:0 "Everything is for sale in [Root.GetName] if you know whom to ask: rifles, petrol, cigarettes, ammunition and, for the right price, a commission in the district guard."
 evil_sofia_flavour.9.a:0 "Print it on the posters."
 evil_sofia_flavour.9.b:0 "Send them to the mountain troops."
 evil_sofia_flavour.9.t:0 "Hikers on Cherni Vrah"
 evil_sofia_flavour.9.d:0 "A group of hikers from [Root.GetName] has climbed Cherni Vrah, the highest peak of Vitosha, and planted the district flag on the summit. The photograph is in every newspaper of the city."
