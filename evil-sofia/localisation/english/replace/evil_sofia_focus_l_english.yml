 evil_sofia_the_director:0 "The Director"
 evil_sofia_the_director_desc:0 "One city, one guard, one Director. Victor Kolev no longer runs a district."
 evil_sofia_hates_communism:0 "Hates Communism"
 evil_sofia_hates_communism_desc:0 "Raised on stories of the communists from the centre. His mother made sure he never forgot them."
 evil_sofia_half_english:0 "Half English"
 evil_sofia_half_english_desc:0 "Tea at five, a stiff upper lip and a mother who is never wrong."
 evil_sofia_regent:0 "Regent of the Mountain"
 evil_sofia_regent_desc:0 "Governs in the name of the crown in the attic."
 evil_sofia_tsar_of_the_mountain:0 "Tsar of the Mountain"
 evil_sofia_tsar_of_the_mountain_desc:0 "Crowned in Boyana Church, as Zevka dreamed."
 evil_sofia_plovdiv_born:0 "Born in Plovdiv"
 evil_sofia_plovdiv_born_desc:0 "Older than Rome, older than Athens, and never lets anyone forget it."
 evil_sofia_market_boss:0 "Market Boss"
 evil_sofia_market_boss_desc:0 "Knows every trader in the district, and what each of them owes."
 evil_sofia_garage_gunsmith:0 "Garage Gunsmith"
 evil_sofia_garage_gunsmith_desc:0 "Every garage can make rifles, if somebody shows it how."
 evil_sofia_block_organiser:0 "Block Organiser"
 evil_sofia_block_organiser_desc:0 "A warden on every staircase, a meeting in every courtyard."
 evil_sofia_loudspeaker:0 "Voice of the District"
 evil_sofia_loudspeaker_desc:0 "Loudspeakers on every lamp post, and his voice on all of them."
 evil_sofia_municipal_engineer:0 "Municipal Engineer"
 evil_sofia_municipal_engineer_desc:0 "Built half the district's roads and knows how to block all of them."
 evil_sofia_tax_collector:0 "Tax Collector"
 evil_sofia_tax_collector_desc:0 "Nobody likes him. Everybody pays him."
 evil_sofia_professor:0 "University Professor"
 evil_sofia_professor_desc:0 "Thirty years of lectures, finally put to some use."
 evil_sofia_recruiter:0 "Neighbourhood Recruiter"
 evil_sofia_recruiter_desc:0 "Knows which sons are home and which are hiding."
 evil_sofia_street_fighter:0 "Street Fighter"
 evil_sofia_street_fighter_desc:0 "Learned war in the courtyards, and never forgot it."
 evil_sofia_block_defender:0 "Defender of the Blocks"
 evil_sofia_block_defender_desc:0 "Every panel block is a fortress if you hold the stairs."
 evil_sofia_drillmaster:0 "Drillmaster"
 evil_sofia_drillmaster_desc:0 "Turns bus drivers into soldiers in half the time."
 evil_sofia_quartermaster:0 "Quartermaster"
 evil_sofia_quartermaster_desc:0 "There is always another crate in the basement."
 evil_sofia_morale_officer:0 "Morale Officer"
 evil_sofia_morale_officer_desc:0 "Songs, speeches and a hot meal before every attack."
 evil_sofia_army_theorist:0 "Army Theorist"
 evil_sofia_army_theorist_desc:0 "Has read every manual since Napoleon and rewritten half of them."
 evil_sofia_air_theorist:0 "Air Theorist"
 evil_sofia_air_theorist_desc:0 "Believes the next war will be won over the rooftops."
 evil_sofia_artillery_expert:0 "Artillery Expert"
 evil_sofia_artillery_expert_desc:0 "Can drop a shell on any courtyard in Sofia."
 evil_sofia_entrenchment_expert:0 "Entrenchment Expert"
 evil_sofia_entrenchment_expert_desc:0 "Every pavement can be a trench by morning."
 evil_sofia_guard_chief:0 "Chief of the District Guard"
 evil_sofia_guard_chief_desc:0 "Knows every unit, every barracks and every excuse."
 evil_sofia_air_chief:0 "Chief of the Air Guard"
 evil_sofia_air_chief_desc:0 "Three aeroplanes, five pilots and a plan for both."
 SRD_mimas_doner:0 "Mimas Döner"
 SRD_mimas_doner_desc:0 "Open day and night, through curfews and street fighting. A Red Guard coming off a night patrol knows exactly where his next meal is, and so does everyone else in the centre."
 SRD_militia_spirit:0 "The People's Militia"
 SRD_militia_spirit_desc:0 "Red armbands on every block we take. Badly drilled, badly armed and absolutely determined to hold the street they grew up on."
 SRD_komsomol:0 "Komsomol of the Housing Estates"
 SRD_komsomol_desc:0 "A youth hall in every estate, a marching song for every block and a waiting list for the front."
 SRD_universal_service_spirit:0 "Every Comrade Serves"
 SRD_universal_service_spirit_desc:0 "Every comrade between eighteen and sixty has a rifle number. The cafés are emptier, the barracks are full."
 SRD_emulation_spirit:0 "Socialist Emulation"
 SRD_emulation_spirit_desc:0 "Shift against shift, factory against factory. The winners get a pennant and a photograph in the paper; everyone gets more work."
 SRD_free_sredets:0 "A Free Sredets"
 SRD_free_sredets_desc:0 "No curfews, no stamps, no gangs, no pacts. The centre governs itself and owes nobody."
 SRD_free_centre:0 "The Free Centre of Sofia"
 SRD_free_centre_desc:0 "The whole centre of Sofia is one free city, and the rest of Sofia is watching."
 SRD_evil_gang:0 "The Evil Gang"
 SRD_evil_gang_desc:0 "It started as a group chat. It ended as the strongest alliance in Sofia."
 SRD_c_class_hools:0 "The C Class Hools"
 SRD_c_class_hools_desc:0 "Loud, loyal, impossible to teach and absolutely fearless."
 SRD_united_dream:0 "The Dream of a United Centre"
 SRD_united_dream_desc:0 "One centre, one hand, one guard. Every district hall in the centre will answer to Sredets."
 SRD_united_centre_done:0 "The United Centre"
 SRD_united_centre_done_desc:0 "The centre of Sofia is whole again, and it answers to Sredets."
 SRD_rule_by_the_guard:0 "Rule by the Guard"
 SRD_rule_by_the_guard_desc:0 "An officer in every office, a sentry at every door."
 SRD_guard_state:0 "The Guard Is the State"
 SRD_guard_state_desc:0 "There is no longer any difference between the guard and the government."
 SRD_bread_and_circuses:0 "Bread and Circuses"
 SRD_bread_and_circuses_desc:0 "Cheap bread, free football and a band on the Largo every Sunday."
 SRD_champions_spirit:0 "Champions of Sofia"
 SRD_champions_spirit_desc:0 "Every firm in the city knows who the champions are."
 SRD_away_day:0 "Away Day"
 SRD_away_day_desc:0 "On away days you go to their ground."
 SRD_krums_cup:0 "Krum's Cup"
 SRD_krums_cup_desc:0 "The Khan's cup stands on Victor's desk. Everybody who visits looks at it."
 SRD_directorate:0 "The Directorate of Sofia"
 SRD_directorate_desc:0 "One city, one guard, one Director."
 SRD_construction_brigades:0 "Construction Brigades"
 SRD_construction_brigades_desc:0 "Buildings go up faster when someone is counting."
 SRD_night_shifts:0 "Night Shifts"
 SRD_night_shifts_desc:0 "The lights in the workshops no longer go out."
 SRD_industrial_heart:0 "The Industrial Heart of Sofia"
 SRD_industrial_heart_desc:0 "Smoke over the rooftops and sirens at shift change."
 SRD_field_kitchens:0 "Field Kitchens"
 SRD_field_kitchens_desc:0 "The best bakeries in Sofia feed the guard."
 SRD_street_fighting:0 "Street Fighting"
 SRD_street_fighting_desc:0 "Doorway to doorway, staircase to staircase."
 SRD_officer_corps:0 "The Officer Corps"
 SRD_officer_corps_desc:0 "Officers who swear loyalty to the centre."
 SRD_army_of_the_centre:0 "The Army of the Centre"
 SRD_army_of_the_centre_desc:0 "The best army in Sofia."
 SRD_laboratory:0 "The Laboratory of Sredets"
 SRD_laboratory_desc:0 "Every ministry a laboratory, every civil servant in a white coat."
 SRD_red_agitation:0 "Red Agitation"
 SRD_red_agitation_desc:0 "Red flags on the Largo, party cells in every block and a speech on every corner. Every day a few more people of the centre believe Henry's mother was right."
 SRD_curfew_lifted:0 "The Curfew Lifted"
 SRD_curfew_lifted_desc:0 "Cafés open all night, newspapers on every corner and nobody asking for papers. Every day a few more people of the centre decide they like it this way."
 SRD_speakers_corner_idea:0 "Speakers' Corner"
 SRD_speakers_corner_idea_desc:0 "Anyone can climb on a bench in the Crystal and say what they like."
 SRD_smuggled_newspapers:0 "Newspapers from Sredets"
 SRD_smuggled_newspapers_desc:0 "Free newspapers from the centre, smuggled in by the bundle and read in secret."
 SRD_friends_of_freedom:0 "Friends of Freedom"
 SRD_friends_of_freedom_desc:0 "Clubs, newspapers and student societies from the free centre have opened branches here."
 SRD_comrades_from_sredets:0 "Comrades from Sredets"
 SRD_comrades_from_sredets_desc:0 "Party organisers from the centre are working the cafés and the student halls."
 SRD_red_newspapers:0 "Red Newspapers"
 SRD_red_newspapers_desc:0 "Red newspapers on every corner, and arguments in every café about what they say."
 SRD_party_money:0 "Money from the Party House"
 SRD_party_money_desc:0 "Envelopes of cash for the party cell: printing presses, halls and friendly policemen."
 SRD_doctors_garden_rally:0 "The Rally at the Doctors' Garden"
 SRD_doctors_garden_rally_desc:0 "Ten thousand people and loudspeakers in the park behind the National Library."
 SRD_red_leaflets:0 "Red Leaflets"
 SRD_red_leaflets_desc:0 "Red leaflets in every letterbox of Vitosha. Most go in the stove, but not all of them."
 SRD_mom_was_wrong:0 "Mom Was Wrong"
 SRD_mom_was_wrong_desc:0 "Even Henry's mother says the centre is free. Vitosha starts to wonder what else she got wrong."
 SRD_red_oborishte:0 "A Red Oborishte"
 SRD_red_oborishte_desc:0 "Oborishte has gone red with the centre, and the party is making sure it stays that way."
 VIT_h_patrols:0 "The Ski Patrols"
 VIT_h_patrols_desc:0 "The fastest way across the front."
 VIT_y_patrols:0 "The Night Raids"
 VIT_y_patrols_desc:0 "Yani's people own the night."
 VIT_h_counter:0 "The Counteroffensive"
 VIT_h_counter_desc:0 "The guard goes over to the attack."
 VIT_y_counter:0 "The Storm of Boyana"
 VIT_y_counter_desc:0 "Everything we have, at once."
 VIT_h_push:0 "Take Simeonovo"
 VIT_h_push_desc:0 "One last push."
 VIT_y_push:0 "Take the Villa Back"
 VIT_y_push_desc:0 "One last push."
 VIT_cabinet_of_talents:0 "A Cabinet of All Talents"
 VIT_cabinet_of_talents_desc:0 "A minister from every village."
 VIT_better_than_westminster:0 "Better Than Westminster"
 VIT_better_than_westminster_desc:0 "Even the English admit it."
 VIT_family_council:0 "The Family Council"
 VIT_family_council_desc:0 "Aunts, uncles, cousins, and then what Henry says."
 VIT_grandmas_larder:0 "Grandma's Larder"
 VIT_grandmas_larder_desc:0 "Pickles and jam for every winter."
 VIT_gendarmerie:0 "The Mountain Gendarmerie"
 VIT_gendarmerie_desc:0 "A horse for every policeman."
 VIT_bells_over_sofia:0 "Bells over Sofia"
 VIT_bells_over_sofia_desc:0 "Every church bell in Sofia at once."
 VIT_commissars:0 "Commissars of the Slopes"
 VIT_commissars_desc:0 "A pamphlet in every pack."
 VIT_mountain_committee:0 "The Committee for the Mountain"
 VIT_mountain_committee_desc:0 "It watches the other committees too."
 VIT_may_day:0 "May Day on Cherni Vrah"
 VIT_may_day_desc:0 "Ten thousand red flags on the summit."
 VIT_trimontium_radio:0 "Radio Trimontium"
 VIT_trimontium_radio_desc:0 "Every evening, every wavelength."
 VIT_trimontium_guard:0 "The Trimontium Guard"
 VIT_trimontium_guard_desc:0 "The city of three hills."
 VIT_sun_of_vergina:0 "The Sun of Vergina"
 VIT_sun_of_vergina_desc:0 "Philip's golden sun on every black shirt."
 VIT_mountain_in_flames_3:0 "The Mountain in Flames"
 VIT_mountain_in_flames_3_desc:0 "Half the district is fighting the other half."
 VIT_mountain_in_flames_2:0 "The Mountain in Flames"
 VIT_mountain_in_flames_2_desc:0 "The front holds; the chaos behind it is easing."
 VIT_mountain_in_flames_1:0 "The Mountain in Flames"
 VIT_mountain_in_flames_1_desc:0 "The last embers of the chaos."
 VIT_mountain_in_flames_rebels:0 "The Mountain in Flames"
 VIT_mountain_in_flames_rebels_desc:0 "Half the district is fighting the other half."
 VIT_mountain_rangers:0 "Mountain Rangers"
 VIT_mountain_rangers_desc:0 "Every path from Boyana to Cherni Vrah."
 VIT_henrys_officers_idea:0 "Henry's Officers"
 VIT_henrys_officers_idea_desc:0 "Officers who are loyal to Henry first."
 VIT_plovdiv_students:0 "Students from Plovdiv"
 VIT_plovdiv_students_desc:0 "Every train brings a few more."
 VIT_half_english:0 "Half English"
 VIT_half_english_desc:0 "Tea at five and a stiff upper lip."
 VIT_home_guard:0 "The Home Guard"
 VIT_home_guard_desc:0 "An armband and a rifle for every street."
 VIT_radio_vitosha:0 "Radio Vitosha"
 VIT_radio_vitosha_desc:0 "News from the free mountain every evening."
 VIT_fight_on_the_slopes:0 "We Shall Fight on the Slopes"
 VIT_fight_on_the_slopes_desc:0 "We shall never surrender."
 VIT_commonwealth:0 "The Commonwealth of the Mountain"
 VIT_commonwealth_desc:0 "The mountain and its dominions."
 VIT_finest_hour:0 "Our Finest Hour"
 VIT_finest_hour_desc:0 "This was their finest hour."
 VIT_grandmas_rules:0 "Grandma's Rules"
 VIT_grandmas_rules_desc:0 "Church on Sunday, dinner at midnight, nobody leaves the table angry."
 VIT_monks_of_dragalevtsi:0 "The Monks of Dragalevtsi"
 VIT_monks_of_dragalevtsi_desc:0 "The monastery blesses the banners."
 VIT_crowns_army:0 "The Crown's Army"
 VIT_crowns_army_desc:0 "Every soldier swears to the crown in the attic."
 VIT_zevka_proud:0 "Zevka Would Be Proud"
 VIT_zevka_proud_desc:0 "The Tsardom of the Mountain, as she dreamed it."
 VIT_vitosha_soviet:0 "The Vitosha Soviet"
 VIT_vitosha_soviet_desc:0 "The villa is a workers' rest home now."
 VIT_partisans:0 "The Partisans of Vitosha"
 VIT_partisans_desc:0 "Every path has a partisan who knows it."
 VIT_comrades_from_vitosha:0 "Comrades from Vitosha"
 VIT_comrades_from_vitosha_desc:0 "Students with leaflets in their satchels."
 VIT_red_army:0 "The Red Army of the Mountain"
 VIT_red_army_desc:0 "Commissars and red stars."
 VIT_thracian_commune:0 "The Thracian Commune"
 VIT_thracian_commune_desc:0 "From the mountain to the road to Plovdiv."
 VIT_red_hill:0 "The Red Hill"
 VIT_red_hill_desc:0 "May Day on the mountain."
 VIT_black_shirts:0 "Black Shirts"
 VIT_black_shirts_desc:0 "Torches and marching songs."
 VIT_legacy_of_philip:0 "The Legacy of Philip"
 VIT_legacy_of_philip_desc:0 "Philip took a town and named it after himself."
 VIT_torchlight:0 "Torchlight on the Slopes"
 VIT_torchlight_desc:0 "A river of fire running uphill."
 VIT_philippopolis:0 "New Philippopolis"
 VIT_philippopolis_desc:0 "Seven districts, seven hills, one city."
 VIT_eighth_hill:0 "The Eighth Hill"
 VIT_eighth_hill_desc:0 "Philippopolis has eight hills, and Vitosha is the tallest."
 VIT_industrial_mountain:0 "The Industrial Mountain"
 VIT_industrial_mountain_desc:0 "Smoke on the slopes."
 VIT_ski_troops:0 "Ski Troops"
 VIT_ski_troops_desc:0 "The fastest way down the mountain."
 VIT_mountain_staff:0 "The Mountain Staff"
 VIT_mountain_staff_desc:0 "Maps of every path."
 VIT_army_of_the_mountain:0 "The Army of the Mountain"
 VIT_army_of_the_mountain_desc:0 "The best mountain army in Sofia."
 VIT_scars_of_war_2:0 "Scars of War"
 VIT_scars_of_war_2_desc:0 "Broken factories, worn-out rifles and a lot of graves."
 VIT_scars_of_war_1:0 "Scars of War"
 VIT_scars_of_war_1_desc:0 "The worst is repaired. Not all of it."
 VIT_h_dig_in:0 "Hold Every Ridge"
 VIT_h_dig_in_desc:0 "Not one metre given up."
 VIT_y_dig_in:0 "Not a Step Back"
 VIT_y_dig_in_desc:0 "Every house a fortress."
 VIT_h_veterans:0 "Veterans of the Mountain"
 VIT_h_veterans_desc:0 "The men who held the villa."
 VIT_y_veterans:0 "Heroes of Simeonovo"
 VIT_y_veterans_desc:0 "Every street named after one."
 VIT_villa_pact:0 "The Villa Pact"
 VIT_villa_pact_desc:0 "Old friends, dinner at midnight."
 VIT_students_pact:0 "The Students' Pact"
 VIT_students_pact_desc:0 "Signed on a school desk."
 VIT_commandos:0 "Commandos of Cherni Vrah"
 VIT_commandos_desc:0 "They climb at night."
 VIT_dispersed_workshops:0 "Dispersed Workshops"
 VIT_dispersed_workshops_desc:0 "A workshop in every barn."
 VIT_every_machine_counts:0 "Every Machine Counts"
 VIT_every_machine_counts_desc:0 "A foreman who never sleeps."
 VIT_workshop_of_sofia:0 "The Workshop of Sofia"
 VIT_workshop_of_sofia_desc:0 "Half of Sofia's goods were made on the mountain."
 VIT_rangers_of_the_peak:0 "Rangers of the Peak"
 VIT_rangers_of_the_peak_desc:0 "Snow, fog and very good aim."
 VIT_dig_in_doctrine:0 "Dig In Doctrine"
 VIT_dig_in_doctrine_desc:0 "He digs before he eats."
 VIT_mountain_reserve:0 "The Mountain Reserve"
 VIT_mountain_reserve_desc:0 "The list is always up to date."
 VIT_unbreakable_mountain:0 "The Unbreakable Mountain"
 VIT_unbreakable_mountain_desc:0 "Nobody ever took it from someone who wanted to keep it."
 ES_war_propaganda:0 "War Propaganda"
 ES_war_propaganda_desc:0 "Posters on every tram, speeches in every square: the district must be ready to fight."
 ES_public_order:0 "Public Order Campaign"
 ES_public_order_desc:0 "Extra patrols, fixed street lamps and bread at fair prices. The district calms down."
 ES_promote_communism:0 "Communist Agitation"
 ES_promote_communism_desc:0 "Party cells in the factories, red newspapers on the corners."
 ES_promote_democracy:0 "Democratic Clubs"
 ES_promote_democracy_desc:0 "Debating clubs, free newspapers and petitions in every café."
 ES_promote_fascism:0 "Nationalist Rallies"
 ES_promote_fascism_desc:0 "Torchlight marches and uniforms on the boulevards."
 ES_promote_neutrality:0 "Loyalty to the District"
 ES_promote_neutrality_desc:0 "No parties, no slogans: the district hall and its guard come first."
 ES_recruitment_drive:0 "Recruitment Drive"
 ES_recruitment_drive_desc:0 "Recruiting tables in the squares and a band playing on Sundays."
 ES_war_bonds:0 "War Bonds"
 ES_war_bonds_desc:0 "Every family buys its share of the war, and grumbles about it."
 ES_reserves:0 "Reserves Called Up"
 ES_reserves_desc:0 "Every man who ever held a rifle is called back to the barracks."
 ES_rationing:0 "Rationing"
 ES_rationing_desc:0 "Bread cards, queues at the bakeries and the factories free to work for the front."
 EVIL_SOFIA_RED_CENTRE:0 "The Red Centre"
 EVIL_SOFIA_FACTION_SOFIA:0 "Sofia"
 EVIL_SOFIA_FACTION_EVIL_GANG:0 "The Evil Gang"
 EVIL_SOFIA_FACTION_C_CLASS:0 "The C Class Hools"
 EVIL_SOFIA_FACTION_MOUNTAIN_ENTENTE:0 "The Mountain Entente"
 EVIL_SOFIA_FACTION_MOUNTAIN_LEAGUE:0 "The League of the Mountain"
 EVIL_SOFIA_FACTION_RED_MOUNTAIN:0 "The Red Mountain"
 EVIL_SOFIA_FACTION_SEVEN_HILLS:0 "The Pact of the Seven Hills"
 EVIL_SOFIA_FACTION_VILLA_PACT:0 "The Villa Pact"
 EVIL_SOFIA_FACTION_STUDENT_PACT:0 "The Students' Pact"
 VIT_yani:0 "Yanislav Marazov"
 VIT_yani_desc:0 "Yanislav Marazov came to Sofia from Plovdiv to study and stayed to change it. Everyone calls him Yani. He talks fast, remembers every name and never lets anyone forget that Plovdiv is older than Rome."
 SRD_oborishte_question:0 "The Oborishte Question"
 SRD_oborishte_question_desc:0 "Anton Zafirov's Oborishte begins three streets from the Party House. A red Oborishte means a red centre; an Oborishte that stays neutral means a front line in front of the cathedral. Money, rallies and, when the moment comes, a coup can push Anton's district to the left."
 SRD_fund_oborishte_communists:0 "Fund the Oborishte Communists"
 SRD_fund_oborishte_communists_desc:0 "Envelopes of cash for the Oborishte party cell: printing presses, rented halls and a few police officers who look the other way."
 SRD_rally_at_the_doctors_garden:0 "Rally at the Doctors' Garden"
 SRD_rally_at_the_doctors_garden_desc:0 "Ten thousand people, red flags and loudspeakers in the park behind the National Library. Anton's police will not dare to clear it, and his ministers will not sleep that night."
 SRD_red_coup_in_oborishte:0 "Red Coup in Oborishte"
 SRD_red_coup_in_oborishte_desc:0 "The party cell is armed, the barracks on Shipka Street are with us and the district hall is guarded by three sleepy policemen. One night is all it takes. Anton stays in charge, but of a red Oborishte.\n\nNeeds Red Newspapers in Oborishte and Oborishte more than 30% communist."
 VIT_foreign_aid:0 "Foreign Aid"
 VIT_foreign_aid_desc:0 "Friends with the same ideology as ours can spare rifles, men and machines for the mountain."
 VIT_aid_rifles:0 "Request Rifles"
 VIT_aid_rifles_desc:0 "Crates of rifles, sent up the mountain road by night.\n\nAsks a district with the same ideology as ours; it gives up what we receive."
 VIT_aid_volunteers:0 "Request Volunteers"
 VIT_aid_volunteers_desc:0 "Young men who want to fight for the mountain.\n\nAsks a district with the same ideology as ours; it gives up what we receive."
 VIT_aid_aeroplanes:0 "Request Aeroplanes"
 VIT_aid_aeroplanes_desc:0 "A few aeroplanes and the pilots to fly them.\n\nAsks a district with the same ideology as ours; it gives up what we receive."
 VIT_aid_lorries:0 "Request Lorries"
 VIT_aid_lorries_desc:0 "Lorries for the mountain road.\n\nAsks a district with the same ideology as ours; it gives up what we receive."
 VIT_aid_advisers:0 "Request Military Advisers"
 VIT_aid_advisers_desc:0 "Officers who have seen a real war, on loan.\n\nAsks a district with the same ideology as ours; it gives up what we receive."
 VIT_the_mountain_boils:0 "The Mountain Boils"
 VIT_the_mountain_boils_desc:0 "Henry's guard and Yani's students cannot share the mountain much longer. If nobody starts the war, it will start by itself."
 VIT_war_on_the_mountain:0 "War on the Mountain"
 VIT_war_on_the_mountain_desc:0 "When the time runs out, the civil war starts by itself: on Yani's side if we completed March with Yani, otherwise on Henry's. Only focuses we completed give their bonuses; the side's war focus counts as done, without its effects, so the roads after it open.\n\nStarting the war with a focus first ends this timer."
 ES_political_actions:0 "Political Actions"
 ES_political_actions_desc:0 "The everyday business of running a district: keeping it calm, keeping it loyal and keeping it ready."
 ES_decision_war_propaganda:0 "War Propaganda"
 ES_decision_war_propaganda_desc:0 "Posters, speeches and parades to get the district ready for war.\n\nWar support grows every week for 120 days."
 ES_decision_public_order:0 "Public Order Campaign"
 ES_decision_public_order_desc:0 "Patrols, repairs and fair bread prices to calm the district down.\n\nStability grows every week for 120 days."
 ES_decision_promote_communism:0 "Communist Agitation"
 ES_decision_promote_communism_desc:0 "Let the party organise in the factories and the housing blocks.\n\nSupport for it grows a little every day for 120 days. Only one such campaign can run at a time."
 ES_decision_promote_democracy:0 "Democratic Clubs"
 ES_decision_promote_democracy_desc:0 "Let the clubs, the free newspapers and the petitions spread.\n\nSupport for it grows a little every day for 120 days. Only one such campaign can run at a time."
 ES_decision_promote_fascism:0 "Nationalist Rallies"
 ES_decision_promote_fascism_desc:0 "Let the nationalists march on the boulevards.\n\nSupport for it grows a little every day for 120 days. Only one such campaign can run at a time."
 ES_decision_promote_neutrality:0 "Loyalty to the District"
 ES_decision_promote_neutrality_desc:0 "Remind everyone that the district hall comes before any party.\n\nSupport for it grows a little every day for 120 days. Only one such campaign can run at a time."
 ES_decision_recruitment_drive:0 "Recruitment Drive"
 ES_decision_recruitment_drive_desc:0 "Recruiting tables in every square.\n\nMore of the population can be recruited for 120 days."
 ES_war_measures:0 "War Measures"
 ES_war_measures_desc:0 "Measures a district at war can take to keep fighting."
 ES_decision_war_bonds:0 "War Bonds"
 ES_decision_war_bonds_desc:0 "Sell the war to the people, one bond at a time.\n\nFor 180 days: war support grows every week, stability falls a little every week, more political power."
 ES_decision_call_up_the_reserves:0 "Call Up the Reserves"
 ES_decision_call_up_the_reserves_desc:0 "Every man who ever held a rifle goes back to the barracks.\n\nFor 180 days: much more manpower, stability falls every week."
 ES_decision_rationing:0 "Rationing"
 ES_decision_rationing_desc:0 "Bread cards and queues, so the factories can work for the front.\n\nFor 180 days: fewer consumer goods, less stability."
