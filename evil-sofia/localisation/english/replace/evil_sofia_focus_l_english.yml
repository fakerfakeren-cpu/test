l_english:
 SRD_henrys_mom_was_right:0 "Henry's Mom Was Right"
 SRD_henrys_mom_was_right_desc:0 "For years Daniel-Henry's mom has called everyone from the centre a dirty communist. Fine. She was right."
 SRD_order_in_the_centre:0 "Order in the Centre"
 SRD_order_in_the_centre_desc:0 "No parties, no slogans. Victor Kolev keeps the centre in order with his own hand."
 SRD_comrades_in_oborishte:0 "Comrades in Oborishte"
 SRD_comrades_in_oborishte_desc:0 "Leaflets and meetings in the back rooms of Oborishte's cafés. Unlocks the decisions of the Oborishte Question."
 SRD_red_newspapers_oborishte:0 "Red Newspapers in Oborishte"
 SRD_red_newspapers_oborishte_desc:0 "Every kiosk in Oborishte sells our newspaper. Unlocks the decision 'Red Coup in Oborishte'."
 SRD_ally_anton:0 "Ally Anton Zafirov"
 SRD_ally_anton_desc:0 "Anton is one of us, or nearly. Offer him the hand of friendship: the centre will be red together. Needs Oborishte at least 40% communist."
 SRD_anton_must_go:0 "Anton Must Go"
 SRD_anton_must_go_desc:0 "Anton Zafirov will never share the centre. Then he will not have any of it."
 SRD_north_south_pact:0 "The North-South Pact"
 SRD_north_south_pact_desc:0 "Victor and Anton draw a line across the map of Sofia. The north for Oborishte, the centre and the south for Sredets. District by district, it will all be ours."
 SRD_destroy_anton:0 "Destroy Anton Zafirov"
 SRD_destroy_anton_desc:0 "Oborishte has fallen. Its streets belong to Sredets now, and Anton Zafirov is history."
 SRD_pact_centre:0 "The Red Centre"
 SRD_pact_centre_desc:0 "First the centre itself: Vazrazhdane. Cores and war goals."
 SRD_pact_old_quarters:0 "The Old Quarters"
 SRD_pact_old_quarters_desc:0 "The districts built before the war: Krasno Selo, Slatina, Izgrev, Lozenets and Triaditsa for us; Serdika, Poduyane, Krasna Polyana and Ilinden for Oborishte. Needs the centre beaten."
 SRD_pact_housing_estates:0 "The Housing Estates"
 SRD_pact_housing_estates_desc:0 "The socialist housing estates: Iskar, Mladost and Studentski for us; Nadezhda and Lyulin for Oborishte. Needs the old quarters beaten."
 SRD_pact_kremikovtsi:0 "The Steelworks of Kremikovtsi"
 SRD_pact_kremikovtsi_desc:0 "The industrial district goes to Oborishte; the steel goes to both. Needs the housing estates beaten."
 SRD_pact_outskirts:0 "The Outskirts"
 SRD_pact_outskirts_desc:0 "The villages and the mountains: Vitosha, Ovcha Kupel and Pancharevo for us; Vrabnitsa, Novi Iskar and Bankya for Oborishte. Needs Kremikovtsi beaten."
 SRD_sofia_union:0 "The Union of North and South Sofia"
 SRD_sofia_union_desc:0 "Sofia is red from Boyana to Kremikovtsi. Sredets becomes South Sofia, Oborishte North Sofia, and the alliance takes the city's name: Sofia."
 SRD_one_centre:0 "One Centre"
 SRD_one_centre_desc:0 "Vazrazhdane completes the centre. Cores and war goals."
 SRD_united_old_quarters:0 "Take the Old Quarters"
 SRD_united_old_quarters_desc:0 "Every district built before the war, from Krasno Selo to Ilinden. Needs the centre beaten."
 SRD_united_housing_estates:0 "Take the Housing Estates"
 SRD_united_housing_estates_desc:0 "Nadezhda, Iskar, Mladost, Studentski and Lyulin. Needs the old quarters beaten."
 SRD_united_kremikovtsi:0 "Take Kremikovtsi"
 SRD_united_kremikovtsi_desc:0 "The steelworks of Kremikovtsi. Needs the housing estates beaten."
 SRD_united_outskirts:0 "Take the Outskirts"
 SRD_united_outskirts_desc:0 "Vitosha, Ovcha Kupel, Vrabnitsa, Novi Iskar, Pancharevo and Bankya. Needs Kremikovtsi beaten."
 SRD_sofia_commune:0 "The Sofia Commune"
 SRD_sofia_commune_desc:0 "One city, one party, one Victor Kolev. Sredets is now simply Sofia."
 SRD_peoples_militia:0 "The People's Militia"
 SRD_peoples_militia_desc:0 "Every block in the conquered districts sends ten men with red armbands. They will learn to shoot on the way."
 SRD_komsomol_of_the_estates:0 "Komsomol of the Housing Estates"
 SRD_komsomol_of_the_estates_desc:0 "The kids of the panel blocks always wanted a reason to fight. Now they get badges as well."
 SRD_party_takes_the_largo:0 "The Party Takes the Largo"
 SRD_party_takes_the_largo_desc:0 "The Party House on the Largo is ours again. The red flag goes up over the government quarter."
 SRD_red_guards_of_the_stadium:0 "Red Guards of Vasil Levski Stadium"
 SRD_red_guards_of_the_stadium_desc:0 "The national stadium becomes a drill ground. Four divisions of Red Guards march out of it."
 SRD_arm_the_workers:0 "Arm the Workers"
 SRD_arm_the_workers_desc:0 "A rifle for every waiter, shop assistant and bus driver of the centre."
 SRD_barricades_on_vitosha:0 "Barricades on Vitosha Boulevard"
 SRD_barricades_on_vitosha_desc:0 "Café tables, tram rails and paving stones: Vitosha Boulevard becomes a fortress."
 SRD_universal_service:0 "Every Comrade Serves"
 SRD_universal_service_desc:0 "From the Largo to the Lions' Bridge, every comrade between eighteen and sixty has a rifle number."
 SRD_commissars_in_every_unit:0 "Commissars in Every Unit"
 SRD_commissars_in_every_unit_desc:0 "A Party man in every platoon, so the Red Guards never forget what they are fighting for."
 SRD_red_air_over_the_centre:0 "Red Wings over the Centre"
 SRD_red_air_over_the_centre_desc:0 "Drones from the roof of TZUM, a runway down Tsar Osvoboditel Boulevard. The centre takes to the air."
 SRD_metro_goes_to_war:0 "The Metro Goes to War"
 SRD_metro_goes_to_war_desc:0 "Serdika station becomes a shelter, the tunnels become supply lines, and anti-air guns go up on the roofs."
 SRD_red_leaflets:0 "Red Leaflets over Vitosha"
 SRD_red_leaflets_desc:0 "Let Henry's mom find red leaflets in her own letterbox."
 SRD_road_to_boyana:0 "The Road to Boyana"
 SRD_road_to_boyana_desc:0 "Sredets does not touch Vitosha, but Lozenets does. Lozenets will let our army through, or it will be the first to fall."
 SRD_capel_question:0 "The Capel Question"
 SRD_capel_question_desc:0 "Daniel-Henry hates us. Daniel-Henry hates communism. Daniel-Henry has to go."
 SRD_red_flag_over_boyana:0 "Red Flag over Boyana"
 SRD_red_flag_over_boyana_desc:0 "The red flag flies over Boyana. Somewhere, Henry's mom is still saying she told everyone so."
 SRD_collectivise_vitosha_boulevard:0 "Collectivise Vitosha Boulevard"
 SRD_collectivise_vitosha_boulevard_desc:0 "Every boutique on Vitosha Boulevard now belongs to the people. The people are very well dressed."
 SRD_mimas_for_the_workers:0 "Mimas Döner for the Workers"
 SRD_mimas_for_the_workers_desc:0 "Mimas never closes. Now it feeds the revolution, day and night."
 SRD_party_arsenal:0 "The Party Arsenal"
 SRD_party_arsenal_desc:0 "The back rooms of the centre's restaurants start making something other than food."
 SRD_red_tourism:0 "Red Tourism"
 SRD_red_tourism_desc:0 "Tourists still come to the centre. Now they pay the Party."
 SRD_red_university:0 "The Red University"
 SRD_red_university_desc:0 "Sofia University stands in Sredets. Its professors now work for the Party, and the Party wants radios."
 SRD_five_year_plan:0 "Five-Year Plan for the Centre"
 SRD_five_year_plan_desc:0 "Five years, two more factories, and no more potholes. Probably."
 SRD_star_on_the_party_house:0 "The Star on the Party House"
 SRD_star_on_the_party_house_desc:0 "The red star goes back on top of the Party House, and the Party's best minds go back to work."
 evil_sofia_srd.1.a:0 "She was right all along. We will never forgive them."
 evil_sofia_srd.1.b:0 "They must be stopped. Prepare for war!"
 evil_sofia_srd.1.t:0 "Henry's Mom Was Right"
 evil_sofia_srd.1.d:0 "Sredets has declared for communism. Daniel-Henry's mom has been saying it for years: the people of the centre are dirty communists. Daniel-Henry has never hated anyone as much as he hates Sredets now."
 evil_sofia_srd.2.a:0 "Comrades! The centre will be red together."
 evil_sofia_srd.2.b:0 "Oborishte bows to no one."
 evil_sofia_srd.2.t:0 "An Offer from Sredets"
 evil_sofia_srd.2.d:0 "Victor Kolev offers Anton Zafirov an alliance: a red centre, shared between Sredets and Oborishte. If Anton accepts, Oborishte turns communist and joins Sredets. If he refuses, Sredets will see it as war."
 evil_sofia_srd.3.a:0 "Comrade Anton!"
 evil_sofia_srd.3.t:0 "Anton Says Yes"
 evil_sofia_srd.3.d:0 "Anton Zafirov has accepted. Oborishte is red, and it stands with Sredets. The North-South Pact can be drawn up."
 evil_sofia_srd.4.a:0 "He will regret it."
 evil_sofia_srd.4.t:0 "Anton Says No"
 evil_sofia_srd.4.d:0 "Anton Zafirov has refused our hand. So be it: Sredets now has a reason to march on Oborishte."
 evil_sofia_srd.5.a:0 "Let him hate."
 evil_sofia_srd.5.t:0 "Henry Hates Us"
 evil_sofia_srd.5.d:0 "Daniel-Henry Capel has heard the news. He hates Sredets, he hates communism, and his mom is telling everyone she was right."
 evil_sofia_srd.6.a:0 "Let him come."
 evil_sofia_srd.6.t:0 "Henry Prepares for War"
 evil_sofia_srd.6.d:0 "Daniel-Henry Capel will not wait for the red flag to reach Boyana. Vitosha is preparing to attack us."
 evil_sofia_srd.7.a:0 "Let them through."
 evil_sofia_srd.7.b:0 "Lozenets is not a road."
 evil_sofia_srd.7.t:0 "Sredets Asks for Passage"
 evil_sofia_srd.7.d:0 "Sredets wants to march its army through Lozenets to reach Vitosha. Refusing will make us its target."
 evil_sofia_srd.8.a:0 "Long live the revolution."
 evil_sofia_srd.8.t:0 "A Red Coup in Oborishte"
 evil_sofia_srd.8.d:0 "Communists backed by Sredets have taken over Oborishte. Anton Zafirov now leads a red Oborishte."
 evil_sofia_srd.9.a:0 "On to Boyana!"
 evil_sofia_srd.9.t:0 "Lozenets Lets Us Through"
 evil_sofia_srd.9.d:0 "Lozenets has opened its streets to our army. The road to Boyana is open."
 evil_sofia_srd.10.a:0 "So be it."
 evil_sofia_srd.10.t:0 "Lozenets Refuses"
 evil_sofia_srd.10.d:0 "Lozenets will not let our army through. Then the road to Boyana goes through Lozenets itself."
 evil_sofia_dirty_communists:0 "Dirty communists!"
 evil_sofia_hates_communism:0 "Hates Communism"
 evil_sofia_hates_communism_desc:0 "Daniel-Henry hates communism more than anything. His mom raised him well."
 SRD_mimas_doner:0 "Mimas Döner"
 SRD_mimas_doner_desc:0 "Mimas never closes. Nobody fights hungry in the centre."
 SRD_peoples_militia:0 "The People's Militia"
 SRD_peoples_militia_desc:0 "Red armbands on every block of the conquered districts."
 SRD_komsomol:0 "Komsomol of the Housing Estates"
 SRD_komsomol_desc:0 "The youth of the panel blocks marches for the Party."
 SRD_universal_service:0 "Every Comrade Serves"
 SRD_universal_service_desc:0 "Every comrade between eighteen and sixty has a rifle number."
 EVIL_SOFIA_RED_CENTRE:0 "The Red Centre"
 EVIL_SOFIA_FACTION_SOFIA:0 "Sofia"
 SRD_oborishte_question:0 "The Oborishte Question"
 SRD_oborishte_question_desc:0 "Anton Zafirov's Oborishte stands between Sredets and a red centre. Push it to the left."
 SRD_fund_oborishte_communists:0 "Fund the Oborishte Communists"
