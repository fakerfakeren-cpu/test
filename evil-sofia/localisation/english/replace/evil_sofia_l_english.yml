 SRD_ilchev:0 "Konstantin Ilchev"
 SRD_ilchev_desc:0 "Konstantin Ilchev taught physics to half the leaders of Sofia, Victor Kolev included, and remembers every one of their exam papers. He has watched his former students carve the city into twenty-four warring districts with growing irritation.\n\nHe believes in three things: the laws of physics, homework handed in on time, and the idea that a city can be run like a well-ordered laboratory. Sredets is about to become his experiment."
 SRD_advisor_1:0 "Rayko Uzunov"
 SRD_advisor_2:0 "Nevena Kamenova"
 SRD_advisor_3:0 "Vladimir Yordanov"
 EVIL_SOFIA_SRD_DESC:0 "The heart of Sofia: Vitosha Boulevard, Borisova Gradina, the Largo and the Party House. Small, rich and surrounded on every side, Sredets has the money, the ministries and every one of its neighbours' attention.\n\nLeader: Victor Kolev."
 SRD:0 "Sredets"
 SRD_DEF:0 "Sredets"
 SRD_ADJ:0 "Sredetsian"
 SRD_leader:0 "Victor Kolev"
 SRD_leader_desc:0 "Victor Kolev holds the most valuable square kilometre in Bulgaria: the Largo, the Party House and the boutiques of Vitosha Boulevard. He has more friends than any warlord in Sofia and more enemies, and he keeps a careful list of both.\n\nGeorgi Yanchovichin of Lozenets has been on the first list since before either of them ruled anything. Daniel-Henry Capel of Vitosha is at the top of the second."
 SRD_general:0 "Asen Petrov"
 VAZ_advisor_1:0 "Kosta Slavov"
 VAZ_advisor_2:0 "Elena Marinova"
 VAZ_advisor_3:0 "Elena Spasova"
 VAZ:0 "Vazrazhdane"
 VAZ_DEF:0 "Vazrazhdane"
 VAZ_ADJ:0 "Vazrazhdanian"
 VAZ_leader:0 "Boris Georgiev"
 VAZ_leader_desc:0 "The leader of Vazrazhdane grew up between the stalls of the Women's Market and the baths of Banya Bashi. The district is old, loud and full of traders, and its leader knows the price of everything, including loyalty."
 VAZ_general:0 "Kaloyan Dimitrov"
 OBR_advisor_1:0 "Nevena Simeonova"
 OBR_advisor_2:0 "Zlatko Kamenov"
 OBR_advisor_3:0 "Vladimir Zhelev"
 EVIL_SOFIA_OBR_DESC:0 "The district of Alexander Nevsky Cathedral, the university quarter and the Doctors' Garden. Oborishte sits right next to the Party House and has not yet decided which way it leans.\n\nLeader: Anton Zafirov."
 OBR:0 "Oborishte"
 OBR_DEF:0 "Oborishte"
 OBR_ADJ:0 "Oborishtian"
 OBR_leader:0 "Anton Zafirov"
 OBR_leader_desc:0 "Anton Zafirov rules Oborishte from a café table in the shadow of Alexander Nevsky. Students, professors and old families all want something from him, and so far he has given each of them just enough to keep them waiting.\n\nHe is three streets from the Party House, and he knows that whoever rules Sredets will come knocking sooner or later."
 OBR_general:0 "Petar Stoyanov"
 KRS_advisor_1:0 "Pavel Yankov"
 KRS_advisor_2:0 "Ivanka Mihaylova"
 KRS_advisor_3:0 "Rumen Popov"
 KRS:0 "Krasno Selo"
 KRS_DEF:0 "Krasno Selo"
 KRS_ADJ:0 "Krasnoselian"
 KRS_leader:0 "Ivan Todorov"
 KRS_leader_desc:0 "Krasno Selo's leader governs the Hippodrome, Borovo and Lagera: tidy blocks, wide streets and residents who expect the trams to run on time whatever is happening to the rest of the city."
 KRS_general:0 "Todor Hristov"
 SRK_advisor_1:0 "Milena Dobreva"
 SRK_advisor_2:0 "Rositsa Dimitrova"
 SRK_advisor_3:0 "Iliya Iliev"
