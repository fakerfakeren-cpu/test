 SRK_ADJ:0 "Serdikan"
 SRK_leader:0 "Khan Krum"
 SRK_leader_desc:0 "Serdika stands on the ruins of old Serdica, the city Khan Krum of the Bulgars took from the Byzantines in the year 809. Twelve centuries later, with Sofia at war with itself, the old Khan has come back to take it again. Nobody knows quite how. Nobody has dared to ask.\n\nHe holds court at the Central Railway Station in chain mail, drinks from a cup nobody wants to look at too closely, and counts the other districts the way he once counted Byzantine armies: as future tribute."
 SRK_general:0 "Hristo Angelov"
 POD_advisor_1:0 "Ivanka Atanasova"
 POD_advisor_2:0 "Stefka Genova"
 POD_advisor_3:0 "Teodora Popova"
 POD:0 "Poduyane"
 POD_DEF:0 "Poduyane"
 POD_ADJ:0 "Poduyanian"
 POD_leader:0 "Vasil Atanasov"
 POD_leader_desc:0 "Poduyane is railway yards, workshops and the long streets of Hadzhi Dimitar. Its leader is a union man who has spent his life arguing with managers and now finds himself in charge of an army."
 POD_general:0 "Lyuben Kirilov"
 SLA_advisor_1:0 "Mihail Petrov"
 SLA_advisor_2:0 "Dimitar Spasov"
 SLA_advisor_3:0 "Kalina Spasova"
 SLA:0 "Slatina"
 SLA_DEF:0 "Slatina"
 SLA_ADJ:0 "Slatinian"
 SLA_leader:0 "Georgi Popov"
 SLA_leader_desc:0 "The leader of Slatina governs Geo Milev, Reduta and the road to the airport. He has the only district in Sofia with planes nearby, and he reminds his neighbours of it at every opportunity."
 SLA_general:0 "Dimitar Kolev"
 IZG_advisor_1:0 "Hristo Lazarov"
 IZG_advisor_2:0 "Ivan Popov"
 IZG_advisor_3:0 "Maria Simeonova"
 IZG:0 "Izgrev"
 IZG_DEF:0 "Izgrev"
 IZG_ADJ:0 "Izgrevian"
 IZG_leader:0 "Nikola Marinov"
 IZG_leader_desc:0 "Izgrev is the quarter of embassies and the villas of the old elite around Iztok. Its leader is a former diplomat who speaks five languages and has not yet found one in which the other warlords will listen."
 IZG_general:0 "Atanas Yordanov"
 LOZ_advisor_1:0 "Zornitsa Popova"
 LOZ_advisor_2:0 "Stefan Antonov"
 LOZ_advisor_3:0 "Kiril Tonchev"
 EVIL_SOFIA_LOZ_DESC:0 "Green slopes and villas between the centre and Vitosha, from South Park to Hladilnika. Lozenets is the only road from the centre to the mountain, and everyone who wants to reach Boyana must deal with it.\n\nLeader: Georgi Yanchovichin."
 LOZ:0 "Lozenets"
 LOZ_DEF:0 "Lozenets"
 LOZ_ADJ:0 "Lozenetsian"
 LOZ_leader:0 "Georgi Yanchovichin"
 LOZ_leader_desc:0 "Georgi Yanchovichin rules the green slopes between the centre and the mountain. Lozenets is quiet, wealthy and exactly in the way of anyone who wants to march from Sredets to Boyana.\n\nGeorgi and Victor Kolev of Sredets are day ones: they were friends before the city fell apart, and Georgi does not forget his friends."
 LOZ_general:0 "Angel Mihaylov"
 TRD_advisor_1:0 "Bozhidar Kamenov"
 TRD_advisor_2:0 "Boris Tasev"
 TRD_advisor_3:0 "Vesela Dimitrova"
 EVIL_SOFIA_TRD_DESC:0 "Named after Triaditsa, the medieval name of Sofia: Ivan Vazov, Strelbishte and the National Palace of Culture. Old money, old names and an army of pensioners who remember everything.\n\nLeader: Alexander Dimitrov."
 TRD:0 "Triaditsa"
 TRD_DEF:0 "Triaditsa"
 TRD_ADJ:0 "Triaditsan"
 TRD_leader:0 "Alexander Dimitrov"
 TRD_leader_desc:0 "Alexander Dimitrov rules the district that carries the old name of the city. Triaditsa has the National Palace of Culture, the best schools in Sofia and residents who will explain at length why things were better before.\n\nDimitrov listens to all of them, agrees with most of them and does what he likes."
 TRD_general:0 "Plamen Pavlov"
 KRP_advisor_1:0 "Bozhidar Uzunov"
 KRP_advisor_2:0 "Kalina Georgieva"
 KRP_advisor_3:0 "Ivan Tasev"
 EVIL_SOFIA_KRP_DESC:0 "The western quarters around West Park and Razsadnika. Crowded, poor and tough, Krasna Polyana has more people willing to fight than rifles to give them.\n\nLeader: Stefan Kartunov."
 KRP:0 "Krasna Polyana"
 KRP_DEF:0 "Krasna Polyana"
 KRP_ADJ:0 "Krasnopolyanian"
 KRP_leader:0 "Stefan Kartunov"
 KRP_leader_desc:0 "Stefan Kartunov came up through the courtyards of Krasna Polyana, and he still knows every one of them by name. His district is poor, crowded and loyal.\n\nKartunov promises his people one thing: that this time the west of the city will not be the part everyone else forgets."
 KRP_general:0 "Bozhidar Lazarov"
 ILN_advisor_1:0 "Ivan Genov"
 ILN_advisor_2:0 "Mihail Grigorov"
 ILN_advisor_3:0 "Ivan Dimitrov"
 ILN:0 "Ilinden"
 ILN_DEF:0 "Ilinden"
 ILN_ADJ:0 "Ilindenian"
 ILN_leader:0 "Radoslav Radev"
 ILN_leader_desc:0 "Ilinden grew up around the old sugar factory, and its leader still runs the district like a factory floor: shifts, quotas and a whistle at six in the morning."
 ILN_general:0 "Zhivko Zhelev"
 NAD_advisor_1:0 "Kiril Slavov"
 NAD_advisor_2:0 "Trayko Uzunov"
 NAD_advisor_3:0 "Nikola Stefanov"
 NAD:0 "Nadezhda"
 NAD_DEF:0 "Nadezhda"
 NAD_ADJ:0 "Nadezhdan"
 NAD_leader:0 "Stefan Bonev"
 NAD_leader_desc:0 "Nadezhda means hope, and its leader has built a career on promising it. The housing estates of the north are full of people who have heard such promises before."
 NAD_general:0 "Yordan Tsvetkov"
 ISK_advisor_1:0 "Todor Ganev"
 ISK_advisor_2:0 "Elena Koleva"
 ISK_advisor_3:0 "Zornitsa Atanasova"
 ISK:0 "Iskar"
 ISK_DEF:0 "Iskar"
 ISK_ADJ:0 "Iskarian"
 ISK_leader:0 "Mihail Kamenov"
 ISK_leader_desc:0 "Iskar's leader rules Druzhba and the banks of the river that gives the district its name. The Iskar has flooded the city before; its leader intends to do the same."
 ISK_general:0 "Lazar Dobrev"
 MLA_advisor_1:0 "Vladimir Mihaylov"
 MLA_advisor_2:0 "Dobri Ivanov"
 MLA_advisor_3:0 "Momchil Antonov"
 EVIL_SOFIA_MLA_DESC:0 "Four housing estates and Business Park: one of the largest districts of Sofia, built in concrete and glass. Mladost has the manpower to dominate the south-east of the city.\n\nLeader: Georgi Poryazov."
 MLA:0 "Mladost"
 MLA_DEF:0 "Mladost"
 MLA_ADJ:0 "Mladostian"
 MLA_leader:0 "Georgi Poryazov"
 MLA_leader_desc:0 "Georgi Poryazov governs four housing estates and a business park with the patience of a man who knows he has more people than anyone around him. Mladost does not need to hurry.\n\nWhen the other districts run out of soldiers, Poryazov will still be counting his."
 MLA_general:0 "Velizar Grigorov"
 STU_advisor_1:0 "Pavel Mihaylov"
 STU_advisor_2:0 "Ivanka Pavlova"
 STU_advisor_3:0 "Nevena Velcheva"
 STU:0 "Studentski"
 STU_DEF:0 "Studentski"
 STU_ADJ:0 "Studentskian"
 STU_leader:0 "Tsvetan Antonov"
 STU_leader_desc:0 "Studentski is the city of the students, the Technical University and a hundred dormitories. Its leader was a lecturer until last month, and is now trying to turn a district of debating clubs into an army."
 STU_general:0 "Emil Valchev"
 LYU_advisor_1:0 "Konstantin Kostov"
 LYU_advisor_2:0 "Vesela Nikolova"
 LYU_advisor_3:0 "Zhivko Dobrev"
 EVIL_SOFIA_LYU_DESC:0 "Ten housing estates beneath the Lyulin mountain, the biggest district of Sofia by population. Lyulin is a city of its own on the western edge, and it is ruled by a man nobody knows by his real name.\n\nLeader: GrimBoss."
 LYU:0 "Lyulin"
 LYU_DEF:0 "Lyulin"
 LYU_ADJ:0 "Lyulinian"
 LYU_leader:0 "GrimBoss"
 LYU_leader_desc:0 "Nobody in Lyulin uses his real name. To the ten housing estates beneath the mountain he is simply GrimBoss, and that is all anyone needs to know.\n\nHe rules the most populous district in Sofia from a flat on the top floor of a panel block, and when he looks east he sees the whole city lined up in front of him."
 LYU_general:0 "Sava Slavov"
 KRE_advisor_1:0 "Vesela Atanasova"
 KRE_advisor_2:0 "Petar Vulkov"
 KRE_advisor_3:0 "Krum Angelov"
 KRE:0 "Kremikovtsi"
 KRE_DEF:0 "Kremikovtsi"
 KRE_ADJ:0 "Kremikovtsian"
 KRE_leader:0 "Pavel Rusev"
 KRE_leader_desc:0 "Kremikovtsi is the steelworks and the villages around them. Its leader is a former foreman who knows that every other warlord in Sofia will want his furnaces, and he means to charge them dearly."
 KRE_general:0 "Trayko Tonchev"
 VIT_advisor_1:0 "Radka Genova"
 VIT_advisor_2:0 "Kiril Yordanov"
 VIT_advisor_3:0 "Petar Draganov"
 EVIL_SOFIA_VIT_DESC:0 "From Boyana up to Cherni Vrah: villas, monasteries, pine forests and the mountain that watches over the city. Vitosha is rich, proud and certain it is too high up for the centre's politics to reach.\n\nLeader: Daniel-Henry Capel."
 VIT:0 "Vitosha"
 VIT_DEF:0 "Vitosha"
 VIT_ADJ:0 "Vitoshan"
 VIT_leader:0 "Daniel-Henry Capel"
 VIT_leader_desc:0 "Daniel-Henry Capel was raised by a mother with very firm opinions about the people of the centre. He inherited every one of them.\n\nHenry rules Vitosha from the top of the city, with the forest at his back and the whole of Sofia spread out below him. He believes that is exactly where he belongs."
 VIT_general:0 "Vladimir Velchev"
 OVK_advisor_1:0 "Stefan Tsvetkov"
 OVK_advisor_2:0 "Bozhidar Simeonov"
 OVK_advisor_3:0 "Zornitsa Ivanova"
 OVK:0 "Ovcha Kupel"
 OVK_DEF:0 "Ovcha Kupel"
 OVK_ADJ:0 "Ovchakupelian"
 OVK_leader:0 "Dobri Ganev"
 OVK_leader_desc:0 "Ovcha Kupel's leader rules the western estates and the mineral springs of Gorna Banya. A quiet district with a long memory, and a leader who would like it to stay quiet."
 OVK_general:0 "Spas Yankov"
 VRB_advisor_1:0 "Mihail Tasev"
 VRB_advisor_2:0 "Ivan Bogdanov"
 VRB_advisor_3:0 "Dimitar Simeonov"
 VRB:0 "Vrabnitsa"
 VRB_DEF:0 "Vrabnitsa"
 VRB_ADJ:0 "Vrabnitsan"
 VRB_leader:0 "Grigor Draganov"
 VRB_leader_desc:0 "Vrabnitsa is Obelya, Moderno Predgradie and the villages on the northern edge of the city. Its leader is a practical man who will join whichever side is winning, as soon as he is sure which one that is."
 VRB_general:0 "Anton Bogdanov"
 NIS_advisor_1:0 "Trayko Yordanov"
 NIS_advisor_2:0 "Stefan Zhelev"
 NIS_advisor_3:0 "Gergana Toncheva"
 NIS:0 "Novi Iskar"
 NIS_DEF:0 "Novi Iskar"
 NIS_ADJ:0 "Noviiskarian"
 NIS_leader:0 "Valentin Ruskov"
 NIS_leader_desc:0 "Novi Iskar is a small town in the mouth of the Iskar gorge, a long way from the centre and happy to stay that way. Its mayor became its leader without anyone quite deciding he should."
 NIS_general:0 "Svetoslav Simeonov"
 PNC_advisor_1:0 "Gergana Yordanova"
 PNC_advisor_2:0 "Bozhidar Vasilev"
 PNC_advisor_3:0 "Atanas Stefanov"
 PNC:0 "Pancharevo"
 PNC_DEF:0 "Pancharevo"
 PNC_ADJ:0 "Pancharevian"
 PNC_leader:0 "Yasen Tasev"
 PNC_leader_desc:0 "Pancharevo is the lake, the rowing canal and a dozen villages climbing into the mountains. Its leader rules more land than half the districts of Sofia put together, and fewer people than any one of them."
 PNC_general:0 "Momchil Uzunov"
 BNK_advisor_1:0 "Krum Zahariev"
 BNK_advisor_2:0 "Teodora Marinova"
 BNK_advisor_3:0 "Maria Tsvetkova"
 BNK:0 "Bankya"
 BNK_DEF:0 "Bankya"
 BNK_ADJ:0 "Bankyan"
 BNK_leader:0 "Zlatko Vulkov"
 BNK_leader_desc:0 "Bankya is a spa town of mineral baths and sanatoriums on the far western edge of the city. Its leader has spent the war so far taking the waters and hoping nobody remembers Bankya exists."
 BNK_general:0 "Iliya Zahariev"
 IAP_advisor_1:0 "Nikola Tasev"
 IAP_advisor_2:0 "Nikola Vulkov"
 IAP_advisor_3:0 "Maria Draganova"
 IAP:0 "Ivan Apostolov"
 IAP_DEF:0 "Ivan Apostolov"
 IAP_ADJ:0 "Apostolovian"
 IAP_leader:0 "Apostol Penev"
 IAP_leader_desc:0 "Ivan Apostolov is the smallest country in Sofia: one school, its yard, its sports hall and a gate between Mladost and Izgrev. Its headmaster governs it like a classroom, with a timetable, a bell and very strict rules about lateness.\n\nIts motto is to invest in the future. Its neighbours suspect the future it has in mind is theirs."
 IAP_general:0 "Lyuben Slavov"
 EVIL_SOFIA_REGION_1:0 "Old Town"
 EVIL_SOFIA_REGION_2:0 "Southern Quarters"
 EVIL_SOFIA_REGION_3:0 "Western Quarters"
 EVIL_SOFIA_REGION_4:0 "Northern Quarters"
 EVIL_SOFIA_REGION_5:0 "Eastern Quarters"
 EVIL_SOFIA_REGION_6:0 "Vitosha"
 EVIL_SOFIA_REGION_7:0 "Bankya Hills"
 EVIL_SOFIA_REGION_8:0 "Vrabnitsa Plain"
 EVIL_SOFIA_REGION_9:0 "Novi Iskar"
 EVIL_SOFIA_REGION_10:0 "Kremikovtsi"
 EVIL_SOFIA_REGION_11:0 "Pancharevo"
 EVIL_SOFIA_REGION_12:0 "Upper Iskar"
 EVIL_SOFIA_REGION_14:0 "Boyana Slopes"
 EVIL_SOFIA_REGION_13:0 "Edge of the World"
 EVIL_SOFIA_SUPPLY_AREA:0 "Sofia"
 ESF_seize_the_district_hall:0 "Seize the District Hall"
 ESF_seize_the_district_hall_desc:0 "The city council has fled and the mayor's office is empty. In every district of Sofia, whoever holds the district hall holds the stamps, the payroll and the keys to the armoury. Tonight it will be us."
 ESF_martial_law:0 "Martial Law"
 ESF_martial_law_desc:0 "A curfew from ten in the evening, checkpoints on every bridge and a guard at every tram stop. The people will complain, but they will complain indoors."
 ESF_neighbourhood_patrols:0 "Neighbourhood Patrols"
 ESF_neighbourhood_patrols_desc:0 "Every block elects a warden, and every warden reports to the district hall: who has moved in, who has moved out and who has been talking to the neighbours across the boulevard."
 ESF_propaganda_on_every_block:0 "Propaganda on Every Block"
 ESF_propaganda_on_every_block_desc:0 "Posters on every panel block, loudspeakers on every lamp post and our newspaper in every kiosk. By the end of the month there will be nobody in the district who does not know whose side they are on."
 ESF_fix_the_streets:0 "Fix the Streets"
 ESF_fix_the_streets_desc:0 "Sofia's potholes have broken more axles than any enemy ever will. If our guards are to reach the front, someone has to fill them in first."
 ESF_district_workshops:0 "District Workshops"
 ESF_district_workshops_desc:0 "Bakeries, print shops and car repair garages are reopened under district management. They will make what the district needs, and the district needs everything."
 ESF_arms_workshops:0 "Arms Workshops"
 ESF_arms_workshops_desc:0 "A lathe in a garage can turn a rifle barrel as well as a car part, given a drawing and some encouragement. Every workshop in the district gets both."
 ESF_industrial_drive:0 "Industrial Drive"
 ESF_industrial_drive_desc:0 "Two shifts, then three. The workshops never close, the lights never go off and the foremen sleep in their offices."
 ESF_district_institute:0 "District Institute"
 ESF_district_institute_desc:0 "Engineers, chemists and radio men from the city's universities are given a building, a budget and a list of problems the district guard needs solved by spring."
 ESF_raise_the_city_guard:0 "Raise the City Guard"
 ESF_raise_the_city_guard_desc:0 "Night watchmen, bus drivers, students and pensioners: every resident who can carry a rifle is enrolled in the district guard and given a unit, an armband and a place to report to."
 ESF_arm_the_blocks:0 "Arm the Blocks"
 ESF_arm_the_blocks_desc:0 "A rifle in every flat and a crate of ammunition in every basement. If the enemy comes, every staircase in the district will be a fighting position."
 ESF_rooftop_air_defence:0 "Rooftop Air Defence"
 ESF_rooftop_air_defence_desc:0 "The tallest panel blocks in the district get anti-aircraft guns on their roofs and lookouts on the top floor. Nothing will fly over us unseen."
 ESF_rooftop_artillery:0 "Rooftop Artillery"
 ESF_rooftop_artillery_desc:0 "From the roof of a fourteen-storey block, every street of the neighbouring district is within range of a field gun. The residents of the top floor have been asked to move downstairs."
