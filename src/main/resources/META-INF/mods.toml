[[mods]]
modId="oathbound"
version="${mod_version}"
displayName="Oathbound: The Hollow Crown"
logoFile="oathbound_logo.png"
authors="Oathbound contributors"
description='''
The Lanternguard is gone. Its oath is not.

Take up the Lantern Chronicle as the last squire of a fallen order of knight-wizards.
Forge Oathsteel, kindle the Wayshrines, and win back the three Oath Seals from the
hollowed keepers of the Drowned Chapel, the Arcanist's Spire and the Barrow of Kings.
Then open the Sundered Gate, cross into the Gloaming, and break the Hollow Crown.

A complete adventure with puzzles, three minibosses, a multi-phase final boss,
a new dimension, and a quest book that tells the story as you live it.
'''

